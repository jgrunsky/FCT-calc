name = "fct-dispatch"
main = "src/index.js"
compatibility_date = "2026-07-27"
workers_dev = true

# Existing DISPATCH KV namespace (already bound on the live worker).
[[kv_namespaces]]
binding = "DISPATCH"
id = "511e045236dc4b41b89538334f54414c"

# Secrets (Cloudflare dashboard only — never commit values):
#   INGEST_KEY           — existing /ingest header X-FCT-Key
#   TWILIO_*             — optional; SMS off if missing
#   SMS_PROVIDER         — optional twilio | sinch | telnyx
