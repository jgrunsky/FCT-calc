     off a 3-hour-per-driver pool compares two different things and lands
     permanently in the red. One afternoon load ties up one driver for the
     afternoon; that is the unit the preload pool is actually measured in. */
  const crew = dispatchRoster().filter(d=>{
    if(!d.active) return false;
    if(!d.shift) return false;
    if(!shiftWorksOn(d.shift, dateISO)) return false;
    return d.shift.cls==='DAY' || d.shift.cls==='AFTERNOON' || d.shift.cls==='EVENING';
  });
  const capacityHrs = crew.length * perDrv;

  /* What today's own afternoon already owes: one driver per load on today's
     block with a midday-or-later appointment. */
  const todayPM = (li.rows||[]).filter(r=>{
    if(r.date!==dateISO) return false;
    const m = apptMinutes(r.time);
    return m!=null && m>=12*60;
  });
  const busyDrivers = Math.min(crew.length, todayPM.length);
  const freeDrivers = crew.length - busyDrivers;
  const committedHrs = busyDrivers * perDrv;
  const spareHrs = freeDrivers * perDrv;

  return { tomorrow:tomorrow, tomorrowLoads:block.length, preloads:locked.length,
           needHrs:needHrs, perLoad:perLoad, perDrv:perDrv,
           crew:crew.length, capacityHrs:capacityHrs, pmLoads:todayPM.length,
           busyDrivers:busyDrivers, freeDrivers:freeDrivers,
           committedHrs:committedHrs, spareHrs:spareHrs, ok: spareHrs >= needHrs };
}

/* ---- Today's driver-hours (v1.7) ----
   The one number the two sections share. Deliveries are priced at each load's
   OWN modelled hours — the lane defaults already know a Ripon turn is not a
   Harris turn, so collapsing them to a flat 5 would throw away information the
   app has. Only a row with no hours at all falls back to the global
   hoursPerLoad. Preloads are flat 2.5 by the Spec.md heuristic, because a
   preload is half a load by definition and there is nothing lane-specific to
   know about dropping a trailer.

   Capacity is the on-shift roster at each driver's own HOS budget, not
   trucks — the constraint being tested here is people-hours, and a truck with
   nobody legal to drive it is not capacity. */
function dayDriverHours(dateISO, sec1Rows, sec2Rows){
  const s = state.settings;
  const stdHrs = Number(s.hoursPerLoad)>0 ? Number(s.hoursPerLoad) : 5;
  const perPre = Number(s.preloadHrsPerLoad)>0 ? Number(s.preloadHrsPerLoad) : 2.5;

  let delHrs = 0, modelled = 0;
  (sec1Rows||[]).forEach(r=>{
    const h = Number(r.hours)||0;
    if(h>0){ delHrs += h; } else { delHrs += stdHrs; modelled++; }
  });
  const delLoads = (sec1Rows||[]).length;
  const preLoads = (sec2Rows||[]).length;
  const preHrs   = preLoads * perPre;
  const totalHrs = delHrs + preHrs;

  /* On shift today. A driver with no shift pattern on file counts as available
     rather than absent — the roster is the source of truth for who exists, and
     DRIVER_SHIFTS only covers the names the 2026 log happened to spell
     consistently. Dropping the rest would understate capacity by a third. */
  const crew = dispatchRoster().filter(d=>d.active && (!d.shift || shiftWorksOn(d.shift, dateISO)));
  const capHrs = crew.reduce((a,d)=>a+(Number(d.hos)||0), 0);
  const hosSet = {};
  crew.forEach(d=>{ hosSet[Number(d.hos)||0] = 1; });
  const uniformHos = Object.keys(hosSet).length===1 ? Number(Object.keys(hosSet)[0]) : null;

  return { delLoads:delLoads, delHrs:delHrs, avgDelHrs: delLoads? delHrs/delLoads : 0,
           modelledRows:modelled, stdHrs:stdHrs,
           preLoads:preLoads, preHrs:preHrs, perPre:perPre,
           totalHrs:totalHrs, drivers:crew.length, capHrs:capHrs, uniformHos:uniformHos,
           utilPct: capHrs>0 ? (totalHrs/capHrs)*100 : 0,
           overHrs: Math.max(0, totalHrs-capHrs) };
}

/* =============================================================
   ACTIONABLE NOW — TODAY'S ALERTS (v1.8)
   -------------------------------------------------------------
   A compact strip above the day picker answering one question:
   is there anything on this day that needs a decision right now?

   EVERY alert re-uses the predicate the sheet already draws its
   chips from — cutoffState(), isUnassigned(), verizonFor(),
   tomorrowPreloadPlan(). Nothing here re-implements a rule. That
   is the whole design: a strip that counted rows its own way would
   eventually disagree with the rows underneath it, and then both
   would stop being trusted.

   Each alert carries the row indices it is about, so the strip is
   a control — tap it and the sheet scrolls to those rows and
   flashes them — rather than a notice you then have to go and act
   on by eye.

   Alerts are deliberately hard to trigger. This app's own load-mix
   logic already makes the argument: a warning that is always on is
   not a warning. So the AR alert can be acknowledged and stays
   quiet until the figure itself moves, and detention only counts
   when a timecard actually measured it.
   ============================================================= */
function arAging91Plus(){
  const ar = (state.qbo && state.qbo.ar) || null;
  if(!ar || !Array.isArray(ar.buckets)) return null;
  const b = ar.buckets.find(x=>String(x.label).indexOf('91') === 0);
  if(!b || !(Number(b.value) > 0)) return null;
  /* The headline 91+ figure is dominated by the Integrated Proteins Chapter 11
     balance, which is already written off and is not a collection action
     anybody can take today. Netting it out is the difference between an alert
     that means "go chase someone" and one that means "a bankruptcy happened". */
  const badDebt = Number((ar.badDebtIP && ar.badDebtIP.value) || 0);
  const real = Math.max(0, Number(b.value) - badDebt);
  return { total:Number(b.value), badDebt:badDebt, real:real,
           flag:String(b.flag||''), asOf:String(state.qbo.pulledAt||'') };
}

function dayAlerts(dateISO){
  const s = state.settings, d = state.dayRollup;
  const rows = d.currentRows || [];
  const out = [];
  const idxWhere = pred => { const a=[]; rows.forEach((r,i)=>{ if(pred(r)) a.push(i); }); return a; };

  /* ---- 1. Needs preload ----
     v1.8.1 reframe: Time is delivery appointment, not pickup. A delivery
     Time past the origin cutoff means the load has to be preloaded the
     afternoon before — prescriptive action, not an error. Only un-handled
     loads (not DISPATCHED/DELIVERED/PRE LOADED) earn this flag; cutoffState
     already filters out the handled ones. Amber, not red. */
  const past = idxWhere(r=>{ const c = dayRowActive(r) && cutoffState(r); return !!(c && c.k === 'past'); });
  if(past.length){
    out.push({ k:'cutoff-past', sev:'a', icon:'📦',
      title: past.length + ' load' + (past.length===1?'':'s') + ' need preload',
      detail: 'Delivery appointment falls after the origin closes — PNG ' + fmtMins(ORIGIN_CUTOFFS.PNG)
            + ' · ARA ' + fmtMins(ORIGIN_CUTOFFS.ARA) + ' · FCG ' + fmtMins(ORIGIN_CUTOFFS.FCG)
            + '. Build these loads onto trailers this afternoon so they roll on time tomorrow.',
      rows: past });
  }

  /* ---- 2. Near the cutoff ---- */
  const near = idxWhere(r=>{ const c = dayRowActive(r) && cutoffState(r); return !!(c && c.k === 'near'); });
  if(near.length){
    out.push({ k:'cutoff-near', sev:'a', icon:'⏰',
      title: near.length + ' load' + (near.length===1?'':'s') + ' near an origin cutoff',
      detail: 'Within ' + CUTOFF_NEAR_MIN + ' minutes either side of the origin closing. Loadable, but with '
            + 'no margin — a late truck misses the door.',
      rows: near });
  }

  /* ---- 3. Nobody on it yet ----
     isUnassigned() is the same test the Queue tab badges on: no driver in the
     sheet, no driver assigned here, and a status that has not already moved
     the load along. */
  const open = idxWhere(isUnassigned);
  if(open.length){
    out.push({ k:'unassigned', sev:'a', icon:'👤',
      title: open.length + ' load' + (open.length===1?'':'s') + ' still unassigned',
      detail: 'No driver in the Driver column and no assignment made here. Tap a Suggested driver cell on the '
            + 'row for the top three and the reasoning behind them.',
      rows: open });
  }

  /* ---- 4. Detention, measured ----
     Only ever from the Verizon timecard. There is no estimate of detention in
     this app and there should not be — the whole point is that it is measured
     dwell inside a Diamond geofence, not a guess. */
  const detMin = Number(s.detentionThresholdMin) > 0 ? Number(s.detentionThresholdMin) : 60;
  const det = idxWhere(r=>{
    if(!dayRowActive(r)) return false;
    const vz = verizonFor(r);
    return !!(vz && Number(vz.detentionMin) > detMin);
  });
  if(det.length){
    const worst = rows.reduce((mx,r)=>{
      const vz = dayRowActive(r) && verizonFor(r);
      return vz && Number(vz.detentionMin) > mx ? Number(vz.detentionMin) : mx;
    }, 0);
    out.push({ k:'detention', sev:'r', icon:'⏱',
      title: det.length + ' load' + (det.length===1?'':'s') + ' held over ' + num(detMin,0) + ' min at Diamond',
      detail: 'Measured from the Verizon timecard — longest dwell inside a Diamond geofence was '
            + num(worst,0) + ' min. Rate cards price a normal wait in; this is past it. '
            + 'Detention bills at ' + money2(Number((state.qbo.services.find(x=>x.code==='104')||{}).rate)||0) + '/hr excess.',
      rows: det });
  }

  /* ---- 5. Backward planning ----
     Reads tomorrowPreloadPlan() directly, so the strip, the banner under it
     and Section 2 of the sheet are three views of one calculation. */
  const plan = tomorrowPreloadPlan(dateISO);
  if(plan && plan.preloads && !plan.ok){
    out.push({ k:'preload-short', sev:'r', icon:'📦',
      title: 'This afternoon is short ' + num(plan.needHrs - plan.spareHrs, 1) + ' hrs of preload capacity',
      detail: shortDateLabel(plan.tomorrow) + ' needs ' + plan.preloads + ' pre-6am preload'
            + (plan.preloads===1?'':'s') + ' (~' + num(plan.needHrs,1) + ' hrs). '
            + plan.freeDrivers + ' of ' + plan.crew + ' on-shift driver' + (plan.crew===1?'':'s')
            + ' are free — about ' + num(plan.spareHrs,1) + ' hrs. Those trailers have to be built before the '
            + 'origins close tonight.',
      jump: '#preSection' });
  }

  /* ---- 6. AR 91+ ----
     Not a dispatch fact, which is why it sits last and can be acknowledged.
     The ack is keyed to the AMOUNT, so it re-fires the moment the figure
     moves and cannot be dismissed permanently by accident. */
  const ar = arAging91Plus();
  if(ar && ar.real > 0){
    const ack = (state.companyInfo && state.companyInfo.arAck) || null;
    if(!(ack && Number(ack.amount) === ar.real)){
      out.push({ k:'ar-91', sev:'b', icon:'💵',
        title: money(ar.real) + ' in AR past 91 days',
        detail: 'QBO AR aging as of ' + (ar.asOf||'the last pull') + ': the 91+ bucket is ' + money(ar.total)
              + ', of which ' + money(ar.badDebt) + ' is the Integrated Proteins Chapter 11 balance already '
              + 'written off. That leaves ' + money(ar.real) + ' genuinely collectable and genuinely late. '
              + 'Contacts are on the Info tab.',
        tab:'info', jump:'#infoContacts', ack:ar.real });
    }
  }

  return out;
}

/* =============================================================
   VERIZON CONNECT — DAILY TIMECARD (v1.5)
   -------------------------------------------------------------
   Source: the Daily Timecard report James already has scheduled
   out of Verizon Connect Reveal. It emails a CSV per day. No API,
   no OAuth, no mailbox puller — he drops the file on the page.

   The file is one row per TRIP LEG, not per load: 782 legs on
   2026-05-29 across 24 drivers. Turning legs into loads is the
   whole job, and it happens in verizonClusters() below.

   31 columns, header verified against the real files:
     Driver, Vehicle, Date, Journey Start, Start Time Zone,
     Start Location, Start Geofence, Travel Time,
     Travel Time Seconds, Distance Traveled, Arrival Time,
     Arrival Time Zone, Stop Location, Stop Geofence,
     Stop Duration, Stop Duration Seconds, Idle Duration,
     Idle Duration Seconds, Departure Time,
     Status Description 1-3, Status Date 1-3,
     Total Hours Worked Sec, Travel Time (Decimal),
     Stop Duration (Decimal), Idle Duration (Decimal),
     Total Hours Worked (Decimal), Employee ID
   ============================================================= */

/* ---- Geofence dictionary ----
   Maps a Verizon geofence name to the origin code the dispatch log
   uses, or to a Diamond delivery point. Names marked seen:true were
   observed in the 2026-05-29 / 05-30 files; the rest come from the
   308 geofences Spec.md records in the Reveal account and are here
   so the first Harris or Fosters day does not silently miss.

   Two names carry a double role on purpose. FRENCH CAMP GRAIN and
   Home Terminal are the Harlan Rd yard complex — the boundary this
   code cuts trips at — AND they are the FCG / FCGE origins the
   dispatch log books freight from. They are the same ground. */
const VERIZON_GEOFENCES = [
  { name:'RIPON DPF',               code:'RIPON',   kind:'diamond', seen:true },
  { name:'LATHROP DPF',             code:'LATHROP', kind:'diamond', seen:true },
  { name:'PENNY NEWMAN GRAIN',      code:'PNG',     kind:'origin',  seen:true },
  { name:'FRENCH CAMP GRAIN',       code:'FCG',     kind:'origin',  seen:true, yard:true },
  { name:'Home Terminal',           code:'FCGE',    kind:'origin',  seen:true, yard:true },
  { name:'AMERICAN RIVER AG',       code:'ARA',     kind:'origin',  seen:true },
  { name:'ARA COURTLAND',           code:'ARA',     kind:'origin' },
  { name:'CARGILL ANIMAL NUTRITION',code:'CARGILL', kind:'origin',  seen:true },
  { name:'FARMERS WAREHOUSE',       code:'FARMERS', kind:'origin',  seen:true },
  { name:'PACIFIC ETHANOL',         code:'PACIFIC ETHANOL', kind:'origin', seen:true },
  { name:'SEED FACTORY',            code:'SEED FACTORY',    kind:'origin', seen:true },
  { name:'HARRIS RANCH',            code:'HARRIS',  kind:'origin' },
  { name:'FOSTERS',                 code:'FOSTERS', kind:'origin' },
  { name:'ARDENT MILLING',          code:'ARDENT',  kind:'origin' },
  { name:'JAQUES',                  code:'JAQUES',  kind:'origin' },
  { name:'AMISTAD',                 code:'AMISTAD', kind:'origin' },
  { name:'MARTINS',                 code:'MARTINS', kind:'origin' },
  { name:'ADAMS',                   code:'ADAMS',   kind:'origin' },
  { name:'PELICAN',                 code:'PELICAN', kind:'origin' },
  { name:'GRIMES',                  code:'GRIMES',  kind:'origin' },
  { name:"Ron's Truck Wash",        code:'WASH',    kind:'service', seen:true },
];
const VERIZON_GEO_BY_NAME = (function(){
  const m = Object.create(null);
  VERIZON_GEOFENCES.forEach(g=>{ m[g.name.toUpperCase()] = g; });
  return m;
})();
/* The geofence cell is not one value. Overlapping fences come through as
   "Home Terminal, FRENCH CAMP GRAIN", and when nothing is fenced Verizon
   drops the street address in instead — "AMERICAN RIVER AG, 217A Westchester
   Cir, Stockton, CA 95203, USA". Split, keep what the dictionary knows,
   discard the address fragments. */
function verizonGeos(cell){
  const out = [];
  String(cell==null?'':cell).split(',').forEach(part=>{
    const g = VERIZON_GEO_BY_NAME[part.trim().toUpperCase()];
    if(g && out.indexOf(g)<0) out.push(g);
  });
  return out;
}

/* ---- Driver bridge: Verizon name -> this app's roster name ----
   Verizon carries the payroll spelling, which is not always the QBO one:
   "Jesus Estrada III" / "Jesus Estrada", "Juan Manuel Jr Castillo" /
   "Juan Castillo", "Jose Saucedo" / "Jose Manuel Saucedo". From
   driver_roster_snapshot.json. Marcos Andrade has no Verizon record at all
   in the snapshot — his loads stay on estimates until he appears.
   The operator can add to this from Settings; overrides win. */
const VERIZON_DRIVER_NAME = {
  'Albert Racoma':'Albert Racoma', 'Carlos Prado':'Carlos Prado', 'Fabian Vega':'Fabian Vega',
  'Felipe Paez Villasenor':'Felipe Paez Villasenor', 'Genaro Felix':'Genaro Felix',
  'Francisco Delgado':'Francisco Delgado', 'Gregorio Martinez':'Gregorio Martinez',
  'Hugo Valencia':'Hugo Valencia', 'Jesus Flores':'Jesus Flores',
  'Jesus Estrada III':'Jesus Estrada', 'Joseph Maimone':'Joseph Maimone',
  'Joel Sosa Ruiz':'Joel Sosa Ruiz', 'Juan Morales':'Juan Morales',
  'Juan Manuel Jr Castillo':'Juan Castillo', 'Jose Saucedo':'Jose Manuel Saucedo',
  'Manuel Munoz':'Manuel Munoz', 'Orlando Villeda':'Orlando Villeda',
  'Prabhkirat Singh':'Prabhkirat Singh', 'Rafael Lopez':'Rafael Lopez',
  'Ramon Carriedo':'Ramon Carriedo', 'Rodolfo Segura':'Rodolfo Segura',
  'Silvino Ochoa':'Silvino Ochoa', 'Victor Solorzano':'Victor Solorzano Navarro',
};
/* Resolve a Verizon driver string to a roster name. Baked map first, then the
   operator's own aliases, then a whole-token surname match so a new hire shows
   up without an edit. "(Unassigned) 8" is a truck nobody logged into — never
   guess a driver for it. */
function resolveVerizonDriver(vName){
  const raw = String(vName||'').trim();
  if(!raw || /^\(unassigned\)/i.test(raw)) return '';
  const ov = state.verizon && state.verizon.aliases && state.verizon.aliases[raw];
  if(ov) return ov;
  if(VERIZON_DRIVER_NAME[raw]) return VERIZON_DRIVER_NAME[raw];
  const norm = s=>String(s||'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  const R = norm(raw), roster = state.settings.drivers;
  let hit = roster.find(d=>norm(d.name)===R);
  if(hit) return hit.name;
  /* Surname match: take the tokens that are not first names or suffixes and
     require a whole-token hit, so JOSE never grabs JOSEPH. */
  const drop = {JR:1, III:1, II:1, SR:1};
  const toks = R.split(' ').filter(t=>t.length>2 && !drop[t]);
  hit = roster.find(d=>{ const dt=norm(d.name).split(' '); return toks.filter(t=>dt.indexOf(t)>=0).length>=2; });
  return hit ? hit.name : '';
}

/* ---- CSV parser ----
   RFC4180 by hand rather than through SheetJS: the CSV path must work with no
   network, and loadSheetJS() pulls the library off a CDN. Handles the UTF-8
   BOM Verizon writes, quoted fields with embedded commas (every address has
   them), doubled quotes, and CRLF. */
function parseCsv(text){
  const s = String(text||'').replace(/^﻿/,'');
  const rows = [];
  let row = [], field = '', inQ = false;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQ){
      if(c === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if(c === '"'){ inQ = true; }
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
    else if(c === '\r'){ /* swallowed — \n closes the row */ }
    else field += c;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
/* Is this a Verizon timecard, or the dispatch log saved as CSV? Sniff the
   header rather than trusting the extension. */
function looksLikeVerizon(text){
  const head = String(text||'').replace(/^﻿/,'').split('\n')[0].toUpperCase();
  return head.indexOf('STOP GEOFENCE')>=0 && head.indexOf('DRIVER')>=0
      && (head.indexOf('TRAVEL TIME')>=0 || head.indexOf('TOTAL HOURS WORKED')>=0);
}
/* "12:01 AM" -> minutes from midnight. */
function verizonTimeMins(v){
  const m = String(v||'').trim().match(/^(\d{1,2}):(\d{2})\s*([AP])M$/i);
  if(!m) return null;
  const hh = (+m[1])%12;
  return (hh + (/P/i.test(m[3])?12:0))*60 + (+m[2]);
}
/* "05/29/2026" -> "2026-05-29". */
function verizonDateISO(v){
  const m = String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  return m[3]+'-'+p2(+m[1])+'-'+p2(+m[2]);
}

/* Parse the whole file into legs. Column positions are read from the header
   row by name, so a reordered or extended export still lands. */
function parseVerizonCsv(text){
  const rows = parseCsv(text);
  if(!rows.length) throw new Error('That CSV is empty.');
  const head = rows[0].map(h=>String(h||'').replace(/^﻿/,'').trim().toUpperCase());
  const col = n=>head.indexOf(n);
  const C = {
    driver: col('DRIVER'), vehicle: col('VEHICLE'), date: col('DATE'),
    start: col('JOURNEY START'), startGeo: col('START GEOFENCE'),
    travelSec: col('TRAVEL TIME SECONDS'), miles: col('DISTANCE TRAVELED'),
    arrive: col('ARRIVAL TIME'), stopGeo: col('STOP GEOFENCE'),
    stopSec: col('STOP DURATION SECONDS'), idleSec: col('IDLE DURATION SECONDS'),
    depart: col('DEPARTURE TIME'), totalSec: col('TOTAL HOURS WORKED SEC'),
  };
  if(C.driver<0 || C.stopGeo<0 || C.date<0)
    throw new Error('That CSV is missing the Driver / Date / Stop Geofence columns — is it the Daily Timecard report?');

  const legs = [];
  const dates = {};
  let skipped = 0;
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length<4) continue;
    const vName = String(r[C.driver]||'').trim();
    const dateISO = verizonDateISO(r[C.date]);
    if(!vName || !dateISO){ skipped++; continue; }
    legs.push({
      vName: vName,
      driver: resolveVerizonDriver(vName),
      vehicle: String(r[C.vehicle]||'').trim(),
      date: dateISO,
      startMin: verizonTimeMins(r[C.start]),
      endMin: verizonTimeMins(r[C.depart]) != null ? verizonTimeMins(r[C.depart]) : verizonTimeMins(r[C.arrive]),
      startGeo: verizonGeos(r[C.startGeo]),
      stopGeo:  verizonGeos(r[C.stopGeo]),
      miles:     Number(r[C.miles])||0,
      travelSec: Number(r[C.travelSec])||0,
      stopSec:   Number(r[C.stopSec])||0,
      idleSec:   Number(r[C.idleSec])||0,
    });
    dates[dateISO] = (dates[dateISO]||0)+1;
  }
  if(!legs.length) throw new Error('No trip legs found in that CSV.');
  return { legs:legs, dates:dates, skipped:skipped };
}

/* ---- Legs -> clusters ----
   A cluster is one trip that ends the way a load ends. Two cut points, and
   both are needed:

     stop inside a DIAMOND fence  — the freight was delivered, that load is done
     stop at the Harlan Rd YARD   — the truck came home, a preload run is done

   Cutting on the yard alone is not enough. A driver who runs Ripon → PNG →
   Ripon → PNG → Ripon without ever coming back to the yard produces ONE
   26-leg, 10.5-hour cluster covering his whole shift, which then gets claimed
   by a single load and priced as if that one load cost the entire day. Cutting
   at the delivery too gives one cluster per delivery, which is one load.

   Both cuts fire on an ARRIVAL, not on any stop inside the fence. A truck
   shunting around the Ripon yard logs a leg per movement, every one of them
   "stopping at RIPON DPF"; cutting on those turns one delivery into eight
   0.1-mile trips. A leg is an arrival only if it came from outside the fence
   it stopped in, or it drove far enough that it plainly went somewhere.

   Sub-threshold leftovers — repositioning between the two adjacent Harlan Rd
   fences, shunting after a drop — are MERGED BACK into that driver's previous
   trip rather than dropped. The clock was still running: throwing them away
   would understate the day's hours by exactly the time the truck spent
   shuffling.

   DETENTION is measured only on a stop the truck actually DROVE to. The first
   leg of a driver's day is usually the truck waking up where it was parked,
   which on this fleet is often inside the Ripon fence: a 61-minute "stop"
   after a 0.04-mile move is a truck sitting overnight, not a plant holding a
   driver. Requiring a real approach drop this fleet's false-positive rate from
   13 of 27 Diamond trips to the handful that are genuinely long dwells. */
const YARD_SHUFFLE_MAX_MI = 3;
const DETENTION_MIN_APPROACH_MI = 1;
/* A stop longer than this is a PARKED TRUCK, not work on a load. Verizon
   closes a driver's last leg of the day with a stop that runs until the truck
   next moves, so an evening driver who finishes at 5am comes back with a
   16-hour "stop" — which, uncapped, prices his last load at sixteen hours of
   driver time. Diamond's own average on-site time is 7m 27s and even a bad
   detention is two or three hours, so four hours is a generous ceiling that
   only ever trims the artifact. The trim is disclosed on the row tooltip. */
const PARKED_STOP_CAP_SEC = 4*3600;
function verizonClusters(legs){
  const byDriver = {};
  legs.forEach(l=>{
    const k = l.vName+'|'+l.date;
    (byDriver[k] = byDriver[k] || []).push(l);
  });
  const clusters = [];
  Object.keys(byDriver).forEach(k=>{
    const seq = byDriver[k].slice().sort((a,b)=>(a.startMin==null?1e9:a.startMin)-(b.startMin==null?1e9:b.startMin));
    let cur = null;
    const open = (l)=>({
      id: 'VC'+clusters.length+'_'+(cur?1:0)+'_'+l.vName.replace(/\W/g,'').slice(0,8)+'_'+(l.startMin||0),
      vName:l.vName, driver:l.driver, vehicle:l.vehicle, date:l.date,
      startMin:l.startMin, endMin:l.endMin, legs:0,
      miles:0, travelSec:0, stopSec:0, idleSec:0, parkedTrimSec:0,
      origins:{}, touchedDiamond:false, endsAtYard:false, endsAtDiamond:false,
      maxDiamondStopSec:0, diamondDp:'',
    });
    const mine = [];                       // this driver's clusters, in order
    const push = ()=>{
      if(!cur) return;
      if(cur.miles < YARD_SHUFFLE_MAX_MI && !cur.endsAtDiamond){
        /* Not a trip. Fold the time back into the previous one so the hours
           stay whole; if there is no previous one it is the truck waking up
           where it parked, and that belongs to nobody. */
        const prev = mine[mine.length-1];
        if(prev){
          prev.legs += cur.legs; prev.miles += cur.miles;
          prev.travelSec += cur.travelSec; prev.stopSec += cur.stopSec; prev.idleSec += cur.idleSec;
          prev.parkedTrimSec += cur.parkedTrimSec;
          if(cur.endMin!=null) prev.endMin = cur.endMin;
          Object.keys(cur.origins).forEach(k=>{ prev.origins[k] = (prev.origins[k]||0)+cur.origins[k]; });
        }
      } else { mine.push(cur); clusters.push(cur); }
      cur = null;
    };
    seq.forEach(l=>{
      if(!cur) cur = open(l);
      const stopSec = Math.min(l.stopSec, PARKED_STOP_CAP_SEC);
      if(stopSec < l.stopSec) cur.parkedTrimSec += (l.stopSec - stopSec);
      cur.legs++;
      cur.miles     += l.miles;
      cur.travelSec += l.travelSec;
      cur.stopSec   += stopSec;
      cur.idleSec   += l.idleSec;
      if(l.endMin!=null) cur.endMin = l.endMin;
      /* Did this leg ARRIVE at the fence it stopped in, or was it already
         inside it? Distance settles the ambiguous cases. */
      const cameFrom = {};
      l.startGeo.forEach(g=>{ cameFrom[g.name] = 1; });
      const arrivedAt = g => !cameFrom[g.name] || l.miles >= DETENTION_MIN_APPROACH_MI;
      let arrYard = false, arrDiamond = false;
      l.startGeo.concat(l.stopGeo).forEach(g=>{
        if(g.kind==='origin') cur.origins[g.code] = (cur.origins[g.code]||0)+1;
      });
      l.stopGeo.forEach(g=>{
        if(g.yard && arrivedAt(g)) arrYard = true;
        if(g.kind==='diamond'){
          cur.touchedDiamond = true;
          cur.diamondDp = g.code;
          if(arrivedAt(g)) arrDiamond = true;
          // Only a stop the truck drove to can be detention — see the note above.
          if(l.miles >= DETENTION_MIN_APPROACH_MI && l.stopSec > cur.maxDiamondStopSec)
            cur.maxDiamondStopSec = l.stopSec;
        }
      });
      if(arrDiamond){ cur.endsAtDiamond = true; push(); }
      else if(arrYard){ cur.endsAtYard = true; push(); }
    });
    push();
  });
  /* Preload vs direct, per Spec.md's GPS pattern:
       ends back at the yard without ever entering a Diamond fence = preload
       ends inside a Diamond fence                                 = delivery */
  clusters.forEach(c=>{
    c.hours    = (c.travelSec + c.stopSec)/3600;
    c.isPreload = !c.touchedDiamond && c.endsAtYard;
    c.detentionMin = c.maxDiamondStopSec/60;
    c.originList = Object.keys(c.origins).filter(x=>x!=='FCG' && x!=='FCGE')
                     .concat(Object.keys(c.origins).filter(x=>x==='FCG' || x==='FCGE'));
  });
  return clusters;
}

/* ---- Load row -> cluster ----
   Candidates are that driver's clusters on that date whose origin set contains
   the load's origin. Ties break on appointment time, and a cluster can only be
   claimed once, so two loads off the same origin take two different trips
   rather than both booking the best one. */
function matchLoadsToClusters(rows, clusters){
  const claimed = {};
  const out = {};
  const withTime = rows.map((r,i)=>({r:r, i:i, m:apptMinutes(r.time)}));
  // Timed rows pick first — a row with no clock time has no business
  // outbidding one that does.
  withTime.sort((a,b)=>(a.m==null?1:0)-(b.m==null?1:0) || (a.m||0)-(b.m||0));
  withTime.forEach(x=>{
    const r = x.r;
    if(!r.driver || !r.date) return;
    const origin = normOrigin(r.origin);
    if(!origin) return;
    const cands = clusters.filter(c=>!claimed[c.id] && c.driver===r.driver && c.date===r.date && c.origins[origin]);
    if(!cands.length) return;
    let best = cands[0];
    if(x.m!=null){
      let bd = Infinity;
      cands.forEach(c=>{
        const d = c.startMin==null ? 1e9 : Math.abs(c.startMin - x.m);
        if(d < bd){ bd = d; best = c; }
      });
    }
    claimed[best.id] = true;
    out[r.id] = best;
  });
  return out;
}

/* The clusters + match for the day in view, memoised per render pass. */
let __vzMatchCache = null;
function verizonDay(dateISO){
  const V = state.verizon;
  if(!V || !dateISO) return null;
  return V.days[dateISO] || null;
}
function verizonMatch(){
  const d = state.dayRollup;
  const day = verizonDay(d.date);
  if(!day) return null;
  /* The key carries the driver on every row, not just the row count: assigning
     a driver from the Queue changes which trips can be claimed, and a stale
     cache would leave that row showing "?" until the next full re-render. */
  const key = d.date+'|'+day.importedAt+'|'
            + d.currentRows.map(r=>r.id+':'+(r.driver||'')+':'+(r.origin||'')).join(',');
  if(__vzMatchCache && __vzMatchCache.key===key) return __vzMatchCache;
  const map = matchLoadsToClusters(d.currentRows, day.clusters);
  const matched = Object.keys(map).length;
  __vzMatchCache = { key:key, map:map, day:day, matched:matched,
                     total:d.currentRows.filter(dayRowActive).length };
  return __vzMatchCache;
}
function invalidateVerizonMatch(){ __vzMatchCache = null; }
/* The cluster behind one row, or null if this day has no CSV / no match. */
function verizonFor(r){
  const m = verizonMatch();
  return (m && r && m.map[r.id]) || null;
}

const ORIGIN_CODES = ['PNG','FCG','FCGE','ARA','JAQUES','HARRIS','CARGILL','FARMERS'];
const HEADER_WORDS = /^(time|po|po ?\/ ?rel|rel ?#|driver|grower|origin|fb ?#|commodity|truck|trailer|status|date|customer|weight|lbs|hours|revenue|notes)/i;

/* ---- Lane defaults ---- */
function laneKeyFor(origin, dp){
  const o = String(origin||'').toUpperCase().trim()==='FCGE' ? 'FCGE' : 'OTHER';
  const s = String(dp||'').toUpperCase();
  const d = /LATHROP/.test(s) ? 'LATHROP' : /RIPON/.test(s) ? 'RIPON' : '';
  return d ? (o+'|'+d) : '';
}
function laneDefaultsFor(origin, dp){
  const L = state.laneDefaults;
  const k = laneKeyFor(origin, dp);
  const lane = k && L.lanes[k] ? L.lanes[k] : null;
  /* v1.3: a delivery point the operator has configured hours for wins over
     the per-combo figure — Lathrop takes ~5 hrs whether the freight came
     from FCGE or from Penny Newman. */
  const s = String(dp||'').toUpperCase();
  const dpKey = /LATHROP/.test(s) ? 'LATHROP' : /RIPON/.test(s) ? 'RIPON' : '';
  const dpH = dpKey && L.dpHours && L.dpHours[dpKey]!=null ? Number(L.dpHours[dpKey]) : null;
  return {
    key: k || (String(origin||'').toUpperCase().trim()==='FCGE'?'FCGE|—':'OTHER|—'),
    miles: lane ? Number(lane.miles) : Number(L.milesDefault),
    hours: (dpH!=null && dpH>0) ? dpH : (lane ? Number(lane.hours) : Number(L.hoursDefault)),
    lbs:   Number(L.lbs),
    est:   !L.calibrated,
  };
}

/* ---- Driver matching: the sheet writes short names, the roster has
        full names. Match on full string, then on any name token. ---- */
function matchDriver(raw){
  if(!raw) return '';
  const roster = state.settings.drivers;
  const norm = s=>String(s||'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  const R = norm(raw);
  if(!R) return '';
  // v2.1.28: short names from the sheet (GREG, FRANCISCO, JESUS E) map
  // through DRIVER_FULL_NAME so they match the roster full legal name.
  if(DRIVER_FULL_NAME[R]){
    const full = DRIVER_FULL_NAME[R];
    if(roster.some(d=>d.name===full)) return full;
  }
  let hit = roster.find(d=>norm(d.name)===R);
  if(hit) return hit.name;
  const toks = R.split(' ').filter(t=>t.length>2);
  // Require a whole-token match so "JOSE" cannot silently grab "JOSEPH".
  hit = roster.find(d=>{ const dt=norm(d.name).split(' '); return toks.some(t=>dt.indexOf(t)>=0); });
  return hit ? hit.name : '';
}

/* BEGIN ADP_ACTUALS */
/* =============================================================
   ADP WORKFORCE NOW — Employee Daily Totals (v2.1.33)
   -------------------------------------------------------------
   OLE .xls / xlsx, one sheet. Header noise, then a two-row header
   (Last Name / First Name / Position ID, then Pay Date / Pay Code /
   Hours / Dollars). Employee blocks: last + first + ZCT id, then
   pay-date rows. Excel serial dates. Long pay-code names wrap onto
   the next row (col Pay Code only, no date) — concatenate onto the
   previous code. Meal / OT dollars are real pay; include them.

   Field-driver dollars replace the modelled driver-wage line on
   that date. Office names stay off load variable. Parser only —
   never bake sample pay into source, never persist pay in
   localStorage. A future ADP API must land rows in this same
   adpPayRows store (see adpFieldActualsForDate) so actuals still
   replace EST 1:1 — not the 1.21 blend.
   ============================================================= */

function adpNormName(s){
  return String(s||'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
}
function adpCellText(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return '';
  if(typeof v==='number' && isFinite(v)) return '';
  return String(v).replace(/\s+/g,' ').trim();
}
function adpNum(v){
  if(v==null || v==='') return 0;
  if(typeof v==='number') return isFinite(v) ? v : 0;
  const s = String(v).replace(/[$,()\s]/g,'').replace(/^[−–—-]/,'-');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

/* Match ADP first+last to the field roster or the office roster.
   Last-name uniqueness + first-token overlap so "Jose Saucedo" lands
   on Jose Manuel Saucedo and "Villeda." lands on Orlando Villeda,
   without Vincent Maimone stealing Joseph's surname. */
function matchAdpPerson(first, last, rosters){
  const drivers = (rosters && rosters.drivers) || (state.settings && state.settings.drivers) || [];
  const office  = (rosters && rosters.office)  || (state.settings && state.settings.office)  || [];
  const firstN = adpNormName(first);
  const lastN  = adpNormName(last);
  const full   = adpNormName((firstN+' '+lastN).trim());
  if(!full) return { name:'', role:'unmatched', raw:(first+' '+last).trim() };

  const exact = (list, role)=>{
    const hit = list.find(p=>adpNormName(p.name)===full);
    return hit ? { name:hit.name, role:role } : null;
  };
  let hit = exact(drivers,'field') || exact(office,'office');
  if(hit) return hit;

  const byLast = (list)=>{
    if(!lastN) return [];
    return list.filter(p=>{
      const toks = adpNormName(p.name).split(' ').filter(Boolean);
      return toks.indexOf(lastN)>=0 || toks[toks.length-1]===lastN;
    });
  };
  const firstFits = (rosterName)=>{
    if(!firstN) return true;
    const toks = adpNormName(rosterName).split(' ');
    if(toks.indexOf(firstN)>=0) return true;
    /* "Jose" vs "Jose Manuel", "Juan" vs "Juan Manuel Jr Castillo" */
    return toks.some(t=> t.indexOf(firstN)===0 || firstN.indexOf(t)===0);
  };

  const dLast = byLast(drivers);
  if(dLast.length===1 && firstFits(dLast[0].name))
    return { name:dLast[0].name, role:'field' };
  if(dLast.length>1 && firstN){
    const f = dLast.filter(p=>firstFits(p.name));
    if(f.length===1) return { name:f[0].name, role:'field' };
  }

  const oLast = byLast(office);
  if(oLast.length===1 && firstFits(oLast[0].name))
    return { name:oLast[0].name, role:'office' };
  if(oLast.length>1 && firstN){
    const f = oLast.filter(p=>firstFits(p.name));
    if(f.length===1) return { name:f[0].name, role:'office' };
  }

  /* Short-name / alias fallback through the dispatch matcher, but only
     if the ADP last name actually appears on the roster hit — otherwise
     "Maimone" would map Vincent onto Joseph. */
  if(typeof matchDriver === 'function'){
    const md = matchDriver(full) || matchDriver(lastN) || matchDriver((firstN+' '+lastN).trim());
    if(md && lastN && adpNormName(md).split(' ').indexOf(lastN)>=0)
      return { name:md, role:'field' };
  }
  return { name:'', role:'unmatched', raw:(String(first||'').trim()+' '+String(last||'').trim()).trim() };
}

function looksLikeAdpAoa(aoa){
  if(!aoa || !aoa.length) return false;
  const n = Math.min(45, aoa.length);
  let blob = '';
  let hasLast=false, hasPay=false, hasHours=false, hasDollars=false;
  for(let i=0;i<n;i++){
    const row = aoa[i]||[];
    for(let c=0;c<row.length;c++){
      const s = String(row[c]==null?'':row[c]).replace(/\s+/g,' ').trim();
      if(!s) continue;
      blob += s + '\n';
      if(/^last\s*name$/i.test(s)) hasLast = true;
      if(/^pay\s*code$/i.test(s)) hasPay = true;
      if(/^hours?$/i.test(s)) hasHours = true;
      if(/^dollars?$/i.test(s)) hasDollars = true;
    }
  }
  if(/employee\s+daily\s+totals/i.test(blob)) return true;
  return hasLast && hasPay && hasHours && hasDollars;
}

function findAdpColumns(aoa){
  const fallback = { last:0, first:5, pos:6, date:0, code:5, hours:14, dollars:17, nameHeader:-1, payHeader:-1 };
  if(!aoa || !aoa.length) return fallback;
  const label = (v)=> String(v==null?'':v).replace(/\s+/g,' ').trim();
  const idx = (row, re)=>{
    for(let c=0;c<(row||[]).length;c++){ if(re.test(label(row[c]))) return c; }
    return -1;
  };
  for(let i=0;i<Math.min(80, aoa.length);i++){
    const row = aoa[i]||[];
    const last = idx(row, /^last\s*name$/i);
    if(last<0) continue;
    const first = idx(row, /^first\s*name$/i);
    const pos   = idx(row, /position\s*id/i);
    for(let j=i;j<Math.min(i+5, aoa.length);j++){
      const p = aoa[j]||[];
      const code = idx(p, /^pay\s*code$/i);
      const hrs  = idx(p, /^hours?$/i);
      const dol  = idx(p, /^dollars?$/i);
      const date = idx(p, /^pay\s*date$/i);
      if(code>=0 && hrs>=0 && dol>=0){
        return {
          last:last, first: first>=0?first:fallback.first, pos: pos>=0?pos:fallback.pos,
          date: date>=0?date:fallback.date, code:code, hours:hrs, dollars:dol,
          nameHeader:i, payHeader:j
        };
      }
    }
  }
  return fallback;
}

/* Day-level rule: replace modelled driver wages with ADP field-driver
   dollars. Fuel / wear / sub-haul stay. otherVariablePerLoad ships at
   $0 (v2.1.36) — if a leftover plug is still on the save, drop it when
   ADP field dollars apply. Do not invent a $/hr from ADP. */
function stripAdpOtherPlug(otherCost, otherPlug, usesAdp){
  const o = Number(otherCost)||0;
  if(!usesAdp) return o;
  return Math.max(0, o - (Number(otherPlug)||0));
}
function applyAdpToModeled(modeledVar, modeledDriver, adpDollars, modeledOtherPlug){
  const v = Number(modeledVar)||0;
  const d = Number(modeledDriver)||0;
  if(adpDollars==null || !isFinite(Number(adpDollars))) return v;
  const other = (modeledOtherPlug!=null && isFinite(Number(modeledOtherPlug))) ? Number(modeledOtherPlug) : 0;
  return v - d - other + Number(adpDollars);
}

function parseAdpDailyTotals(aoa, opts){
  opts = opts || {};
  if(!aoa || !aoa.length) throw new Error('That ADP report is empty.');
  const toDate = opts.parseDate || (typeof parseCellDate === 'function' ? parseCellDate : null);
  if(!toDate) throw new Error('ADP parser is missing a date reader.');
  const matchPerson = opts.matchPerson || matchAdpPerson;
  const cols = opts.cols || findAdpColumns(aoa);
  const start = Math.max(0, (cols.payHeader>=0 ? cols.payHeader+1 : (cols.nameHeader>=0 ? cols.nameHeader+1 : 0)));

  const rows = [];
  let cur = null;          // { last, first, pos, who }
  let prevPay = null;
  let skipped = 0;

  const isHeaderish = (row)=>{
    const a = adpCellText(row[cols.last]), b = adpCellText(row[cols.code]);
    return /^last\s*name$/i.test(a) || /^pay\s*(date|code)$/i.test(a) || /^pay\s*code$/i.test(b)
        || /employee\s+daily\s+totals/i.test(a+' '+b);
  };

  for(let i=start;i<aoa.length;i++){
    const row = aoa[i]||[];
    if(isHeaderish(row)){ prevPay = null; continue; }

    const dateISO = toDate(row[cols.date]);
    const lastTxt = adpCellText(row[cols.last]);
    const firstTxt = adpCellText(row[cols.first]);
    const posTxt = String(row[cols.pos]==null?'':row[cols.pos]).trim();
    const codeTxt = adpCellText(row[cols.code]);
    const hours = adpNum(row[cols.hours]);
    const dollars = adpNum(row[cols.dollars]);

    const filled = row.filter(c=>c!=null && String(c).trim()!=='').length;
    if(!filled){ continue; }

    /* Employee header: last name, not a date, usually a ZCT position id. */
    const looksZct = /^ZCT/i.test(posTxt);
    const lastIsName = lastTxt && !dateISO && !/^total/i.test(lastTxt) && !/^company/i.test(lastTxt);
    if(lastIsName && (looksZct || firstTxt) && !/^pay\s/i.test(lastTxt)){
      const who = matchPerson(firstTxt, lastTxt, opts.rosters);
      cur = { last:lastTxt, first:firstTxt, pos:posTxt, who:who };
      prevPay = null;
      continue;
    }

    /* Wrapped pay-code continuation: no date, code text only, same employee. */
    if(!dateISO && cur && prevPay && codeTxt && !lastTxt){
      prevPay.payCode = (prevPay.payCode+' '+codeTxt).replace(/\s+/g,' ').trim();
      if(hours) prevPay.hours += hours;
      if(dollars) prevPay.dollars += dollars;
      continue;
    }

    if(!dateISO){ skipped++; continue; }
    if(!cur){ skipped++; continue; }

    const rec = {
      date: dateISO,
      last: cur.last, first: cur.first, positionId: cur.pos,
      payCode: codeTxt || '(blank)',
      hours: hours, dollars: dollars,
      rosterName: cur.who.name, role: cur.who.role,
      company: /^ZCT/i.test(cur.pos) ? 'ZCT' : ''
    };
    rows.push(rec);
    prevPay = rec;
  }

  if(!rows.length) throw new Error('No pay rows found — is this the ADP Employee Daily Totals report?');

  const dates = {};
  rows.forEach(r=>{ dates[r.date] = (dates[r.date]||0)+1; });
  const dateList = Object.keys(dates).sort();
  return {
    kind:'adp',
    rows:rows, dates:dateList, dateMin:dateList[0], dateMax:dateList[dateList.length-1],
    skipped:skipped, cols:cols
  };
}

function summarizeAdpRows(rows){
  const fieldNames = {}, officeNames = {}, unmatchedNames = {};
  let fieldDollars=0, fieldHours=0, officeDollars=0, officeHours=0;
  (rows||[]).forEach(r=>{
    if(r.role==='field'){
      fieldDollars += Number(r.dollars)||0; fieldHours += Number(r.hours)||0;
      if(r.rosterName) fieldNames[r.rosterName]=1;
    } else if(r.role==='office'){
      officeDollars += Number(r.dollars)||0; officeHours += Number(r.hours)||0;
      if(r.rosterName) officeNames[r.rosterName]=1;
    } else {
      unmatchedNames[r.raw || ((r.first||'')+' '+(r.last||'')).trim() || '?']=1;
    }
  });
  return {
    fieldDollars:fieldDollars, fieldHours:fieldHours,
    officeDollars:officeDollars, officeHours:officeHours,
    fieldPeople:Object.keys(fieldNames).length,
    officePeople:Object.keys(officeNames).length,
    unmatchedPeople:Object.keys(unmatchedNames).length,
    unmatchedNames:Object.keys(unmatchedNames).sort(),
    payRows:(rows||[]).length
  };
}

/* In-memory pay index. Not on `state` so save()/copyAllData cannot leak it. */
let __adpRows = [];
let __adpByDate = Object.create(null);

function rebuildAdpIndex(rows){
  __adpRows = Array.isArray(rows) ? rows.slice() : [];
  __adpByDate = Object.create(null);
  __adpRows.forEach(r=>{
    if(!r || !r.date) return;
    const d = __adpByDate[r.date] || (__adpByDate[r.date] = {
      fieldDollars:0, fieldHours:0, officeDollars:0, officeHours:0,
      fieldRowCount:0, officeRowCount:0, fieldNames:{}, officeNames:{}
    });
    const dol = Number(r.dollars)||0, hrs = Number(r.hours)||0;
    if(r.role==='field'){
      d.fieldDollars += dol; d.fieldHours += hrs; d.fieldRowCount++;
      if(r.rosterName) d.fieldNames[r.rosterName]=1;
    } else if(r.role==='office'){
      d.officeDollars += dol; d.officeHours += hrs; d.officeRowCount++;
      if(r.rosterName) d.officeNames[r.rosterName]=1;
    }
  });
}

function adpFieldDay(dateISO){
  if(!dateISO) return null;
  const d = __adpByDate[dateISO];
  if(!d || !d.fieldRowCount) return null;
  return {
    date:dateISO,
    dollars:d.fieldDollars, hours:d.fieldHours,
    officeDollars:d.officeDollars, officeHours:d.officeHours,
    driverCount:Object.keys(d.fieldNames).length,
    officeCount:Object.keys(d.officeNames).length
  };
}

/* v2.1.33 (James 2026-08-24): today is still in progress. An ADP Daily
   Totals pull at 2pm is a partial clock, not the day's P&L. Apply ADP to
   closed days (dates before the import's openDate) and to MTD/WTD through
   yesterday. Today stays on modelled driver cost unless this import is
   clearly an end-of-day re-drop (after ADP_TODAY_CLOSE_HOUR local). */
const ADP_TODAY_CLOSE_HOUR = 20; // 8:00pm local

function adpFileIsEndOfDay(importedAt, openDate, now){
  if(!openDate) return false;
  const t = importedAt ? new Date(importedAt) : (now || new Date());
  if(isNaN(t.getTime())) return false;
  const importDay = (typeof isoLocal==='function')
    ? isoLocal(t)
    : (t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()));
  if(importDay > openDate) return true;
  if(importDay === openDate)
    return (t.getHours()*60 + t.getMinutes()) >= ADP_TODAY_CLOSE_HOUR*60;
  return false;
}

/* Pure gate so tests can pass openDate / endOfDay without the live clock.
   A date applies when it was already closed at import (date < openDate),
   or it is the in-progress day and the file is an after-close re-drop. */
function adpAppliesToDate(dateISO, opts){
  opts = opts || {};
  if(!dateISO) return false;
  const meta = opts.meta || (typeof state!=='undefined' && state.adpPay) || {};
  const openDate = opts.openDate || meta.openDate || '';
  const endOfDay = (opts.endOfDay!=null) ? !!opts.endOfDay : !!meta.endOfDay;
  if(!openDate){
    /* No stamp (legacy in-memory): treat local today as open. */
    const today = opts.todayISO || (typeof isoLocal==='function' ? isoLocal(opts.now || new Date()) : '');
    if(!today) return false;
    if(dateISO < today) return true;
    if(dateISO > today) return false;
    return adpFileIsEndOfDay(meta.importedAt, today, opts.now);
  }
  if(dateISO < openDate) return true;
  if(dateISO > openDate) return false;
  return endOfDay;
}

/* BEGIN ADP_ACTUALS_HOOK */
/* James 2026-08-25: when an ADP API exists he wants the real deal, not
   the 1.21 EST blend. File import (now) and a live API (later) MUST
   share this path:

     1. Land field-driver pay rows into __adpRows / IDB adpPayRows
        (same store ingestAdpParse already writes — call rebuildAdpIndex).
     2. Read them through adpFieldActualsForDate.
     3. If this returns a record, P&L uses dollars + hours 1:1.
        NEVER multiply ADP dollars by estDriverWageBlend.

   Do not invent a second wage path. Do not build the API in this PR.
   adpFieldDay is the raw lookup; this gate is "actuals apply today". */
function adpFieldActualsForDate(dateISO, opts){
  const adp = (typeof adpFieldDay==='function') ? adpFieldDay(dateISO) : null;
  if(!adp) return null;
  if(!adpAppliesToDate(dateISO, opts)) return null;
  return adp;
}
/* END ADP_ACTUALS_HOOK */

function adpMetaFromRows(rows, fileName){
  const sum = summarizeAdpRows(rows);
  const dates = {};
  (rows||[]).forEach(r=>{ if(r && r.date) dates[r.date]=1; });
  const dateList = Object.keys(dates).sort();
  const importedAt = new Date().toISOString();
  const openDate = (typeof isoLocal==='function') ? isoLocal(new Date()) : importedAt.slice(0,10);
  return Object.assign(defaultAdpPay(), sum, {
    fileName: fileName || (state.adpPay && state.adpPay.fileName) || '',
    importedAt: importedAt,
    openDate: openDate,
    endOfDay: adpFileIsEndOfDay(importedAt, openDate),
    dateMin: dateList[0]||'', dateMax: dateList[dateList.length-1]||'',
    _rowsInIDB: true
  });
}

function saveAdpPay(){
  const payload = {
    fileName: (state.adpPay && state.adpPay.fileName) || '',
    importedAt: (state.adpPay && state.adpPay.importedAt) || '',
    openDate: (state.adpPay && state.adpPay.openDate) || '',
    endOfDay: !!(state.adpPay && state.adpPay.endOfDay),
    rows: __adpRows
  };
  if(__adpRows.length){
    idbPut(IDB_ADP_KEY, payload).catch(err=>{
      showStorageError('IndexedDB ADP write failed',
        'The ADP pay rows could not persist to IndexedDB: '
        +String(err&&err.message||err)
        +'. They are in memory for this tab only. Re-drop the Employee Daily Totals file after a reload.',
        {severity:'warn'});
    });
  } else {
    idbDel(IDB_ADP_KEY).catch(()=>{});
  }
  save();   // metadata only — compactStateForStorage strips any rows
}

function mergeAdpRowsForRange(existing, incoming, dateMin, dateMax){
  const kept = (existing||[]).filter(r=> !r.date || r.date<dateMin || r.date>dateMax);
  return kept.concat(incoming||[]);
}

function ingestAdpParse(parsed, fileName){
  /* File drop → __adpRows / IDB adpPayRows. A future ADP API feed must
     merge into this same store and stop here — actuals then replace EST
     via adpFieldActualsForDate. Do not add a parallel API wage path. */
  if(!parsed || !parsed.rows || !parsed.rows.length)
    throw new Error('No pay rows found in that ADP report.');
  const incoming = parsed.rows;
  const dateMin = parsed.dateMin, dateMax = parsed.dateMax;
  const merged = mergeAdpRowsForRange(__adpRows, incoming, dateMin, dateMax);
  rebuildAdpIndex(merged);
  state.adpPay = adpMetaFromRows(merged, fileName || parsed.fileName || 'adp.xls');
  saveAdpPay();
  return {
    kind:'adp',
    rows:incoming, mergedCount:merged.length,
    dateMin:dateMin, dateMax:dateMax,
    summary:summarizeAdpRows(incoming),
    fileName: state.adpPay.fileName
  };
}

async function hydrateAdpPay(){
  try{
    const stored = await idbGet(IDB_ADP_KEY);
    const rows = stored && Array.isArray(stored.rows) ? stored.rows
               : Array.isArray(stored) ? stored : [];
    if(!rows.length) return false;
    rebuildAdpIndex(rows);
    const name = (stored && stored.fileName) || (state.adpPay && state.adpPay.fileName) || '';
    state.adpPay = adpMetaFromRows(rows, name);
    if(stored && stored.importedAt) state.adpPay.importedAt = stored.importedAt;
    if(stored && stored.openDate){
      state.adpPay.openDate = stored.openDate;
    } else if(stored && stored.importedAt){
      const t = new Date(stored.importedAt);
      if(!isNaN(t.getTime()) && typeof isoLocal==='function') state.adpPay.openDate = isoLocal(t);
    }
    if(stored && stored.endOfDay!=null) state.adpPay.endOfDay = !!stored.endOfDay;
    else state.adpPay.endOfDay = adpFileIsEndOfDay(state.adpPay.importedAt, state.adpPay.openDate);
    save();
    return true;
  } catch(_){
    return false;
  }
}

/* BEGIN EST_DRIVER_BLEND */
/* v2.1.40: EST-only overtime/meals blend so the P&L month number is
   usable without an ADP drop. Calibrated to Aug 1–23 2026 Employee
   Daily Totals, field drivers: EST $88,195.38 → ADP $107,054.54
   (ratio ≈ 1.214). Default 1.21. Queue scoring and computeDayRow stay
   on unadjusted hours × loaded $/hr.

   EST-ONLY. If adpFieldActualsForDate(date) returns a record — file
   import now, ADP API later, same path — use those field dollars 1:1.
   Never call blendEstDriverWages / applyEstDriverBlendToTotals on ADP
   actuals. James: when the API exists he wants the real deal, not 1.21. */
const EST_DRIVER_WAGE_BLEND_DEFAULT = 1.21;
const EST_DRIVER_WAGE_BLEND_BASIS = {
  from: '2026-08-01',
  through: '2026-08-23',
  source: 'Employee Daily Totals',
  role: 'field',
  estDollars: 88195.38,
  adpDollars: 107054.54
};

function estDriverWageBlendFactor(){
  const n = Number(state && state.settings && state.settings.estDriverWageBlend);
  if(!isFinite(n) || n <= 0) return EST_DRIVER_WAGE_BLEND_DEFAULT;
  return n;
}

function blendEstDriverWages(driverDollars){
  /* Modelled EST dollars only. Never pass ADP field dollars through here. */
  return (Number(driverDollars)||0) * estDriverWageBlendFactor();
}

function applyEstDriverBlendToTotals(T){
  /* Mutates T: lift modelled driver by the EST blend. Fuel / wear /
     sub / other stay. Call ONLY when adpFieldActualsForDate is null. */
  const raw = Number(T.driverCost)||0;
  const blended = blendEstDriverWages(raw);
  if(T.estDriverCostUnblended == null) T.estDriverCostUnblended = raw;
  T.varCost = (Number(T.varCost)||0) - raw + blended;
  T.driverCost = blended;
  T.cm = (Number(T.revenue)||0) - (Number(T.varCost)||0);
  T.driverBlend = estDriverWageBlendFactor();
  return T;
}
/* END EST_DRIVER_BLEND */

function applyAdpDayTotals(dateISO, T){
  /* T: { loads, revenue, varCost, driverCost, hours, cm, otherPlug } — mutates in place.
     Only swap when the day has loads; otherwise ADP would become a
     no-revenue labor charge on an empty picker. Today (openDate) stays
     on the model unless this file was an after-close re-drop.
     Fuel / wear / $150 sub stay. A leftover other plug still drops.
     Actuals (file now, API later — adpFieldActualsForDate) replace EST
     1:1. EST-only days get the v2.1.40 OT/meals blend. Never 1.21 on ADP. */
  const raw = adpFieldDay(dateISO);
  const actuals = adpFieldActualsForDate(dateISO);
  T.adp = raw;
  T.estVarCost = T.varCost;
  T.estDriverCost = T.driverCost;
  T.estHours = T.hours;
  T.adpHeld = !!(raw && !actuals);
  if(!actuals || !(Number(T.loads)>0)){
    T.varSource = 'EST';
    if(Number(T.loads)>0) applyEstDriverBlendToTotals(T);
    return T;
  }
  T.varSource = 'ADP';
  T.varCost = applyAdpToModeled(T.varCost, T.driverCost, actuals.dollars, T.otherPlug);
  T.driverCost = actuals.dollars;
  T.hours = actuals.hours;
  T.cm = T.revenue - T.varCost;
  return T;
}

/* Compact by-driver rollup for the P&L board — name / hours / dollars,
   not the raw pay-code rows. Optional `rows` so tests can pass a fixture. */
function adpFieldDriversForDate(dateISO, rows){
  const map = Object.create(null);
  const src = Array.isArray(rows) ? rows : __adpRows;
  (src||[]).forEach(r=>{
    if(!r || r.date!==dateISO || r.role!=='field') return;
    const n = r.rosterName || [r.first, r.last].filter(Boolean).join(' ') || 'Unknown';
    const rec = map[n] || (map[n] = { name:n, hours:0, dollars:0 });
    rec.hours += Number(r.hours)||0;
    rec.dollars += Number(r.dollars)||0;
  });
  return Object.keys(map).map(k=>map[k]).sort((a,b)=> b.dollars - a.dollars || a.name.localeCompare(b.name));
}

function adpOfficeDollarsForDate(dateISO){
  const d = __adpByDate[dateISO];
  return d ? (Number(d.officeDollars)||0) : 0;
}

function adpOfficeInRange(from, to){
  let dollars = 0;
  const names = Object.create(null);
  Object.keys(__adpByDate||{}).forEach(d=>{
    if((from && d<from) || (to && d>to)) return;
    if(!adpAppliesToDate(d)) return;
    const x = __adpByDate[d];
    dollars += Number(x.officeDollars)||0;
    Object.keys(x.officeNames||{}).forEach(n=>{ names[n]=1; });
  });
  return { dollars:dollars, names:Object.keys(names).sort() };
}

function pnlDriverSource(adpDays, estDays){
  if(adpDays && estDays) return 'ADP+EST';
  if(adpDays) return 'ADP';
  return 'EST';
}
/* END ADP_ACTUALS */

/* "PRELOADER / DELIVERY" — the delivery driver owns the on-clock hours. */
function splitDriverCell(v){
  const s = String(v==null?'':v).trim();
  if(!s) return {raw:'', delivery:'', preloader:''};
  const parts = s.split(/\s*[\/|]\s*/).filter(Boolean);
  if(parts.length>=2) return {raw:s, preloader:parts[0], delivery:parts[parts.length-1]};
  return {raw:s, preloader:'', delivery:s};
}

/* ---- Header sniffing + auto column mapping ---- */
const MAP_FIELDS = [
  {k:'date',        label:'Date',                re:/^date/i,                     hint:'Blank = read from the orange date banner rows'},
  {k:'driver',      label:'Driver',              re:/driver/i},
  {k:'origin',      label:'Grower / Origin',     re:/grower|origin/i},
  {k:'destination', label:'Delivery point',      re:/deliver|destination|d\.?p\.?/i, hint:'Blank = read from the D.P. banner rows'},
  {k:'lbs',         label:'Weight (lbs)',        re:/weight|lbs|pounds/i,         hint:'Blank = lane default'},
  {k:'hours',       label:'Hours',               re:/hours|hrs/i,                 hint:'Blank = lane default'},
  {k:'revenue',     label:'Revenue (if billed)', re:/revenue|amount|charge|rate/i,hint:'Blank = computed from the rate card'},
  {k:'notes',       label:'Notes',               re:/notes|comment/i},
  {k:'time',        label:'Appointment time',    re:/^time/i},
  {k:'po',          label:'PO / Release #',      re:/po|rel/i},
  {k:'fb',          label:'FB / BOL #',          re:/fb|bol/i},
  {k:'commodity',   label:'Commodity',           re:/commodity|product|item/i},
  {k:'truck',       label:'Truck / trailer',     re:/truck|tractor|trailer/i},
  {k:'status',      label:'Status',              re:/status/i},
  {k:'bannerCol',   label:'Banner column',       re:/grower|origin/i,             hint:'Column watched for the date + D.P. banner rows'},
];
function colLetter(i){
  if(i==null || i<0) return '—';
  let s=''; i=Number(i);
  do{ s = String.fromCharCode(65+(i%26)) + s; i = Math.floor(i/26)-1; }while(i>=0);
  return s;
}
function findHeaderRow(aoa){
  for(let i=0;i<Math.min(20,aoa.length);i++){
    const row = aoa[i]||[];
    const hits = row.filter(c=>HEADER_WORDS.test(String(c||'').trim())).length;
    if(hits>=3) return i;
  }
  return null;
}
/* Auto-map from a header row when the workbook has one. Falls back to the
   hard-coded 2026 dispatch layout for anything it cannot find. */
function autoMap(aoa){
  const map = defaultColumnMap();
  const hr = findHeaderRow(aoa);
  if(hr==null) return {map:map, headerRow:null};
  const head = (aoa[hr]||[]).map(c=>String(c||'').trim());
  MAP_FIELDS.forEach(f=>{
    if(!f.re) return;
    const idx = head.findIndex(h=>h && f.re.test(h));
    if(idx>=0) map[f.k] = idx;
  });
  if(map.bannerCol==null) map.bannerCol = map.origin;
  return {map:map, headerRow:hr};
}

/* =============================================================
   DISPATCH PARSER
   -------------------------------------------------------------
   The sheet is one long log of repeating blocks:
     [orange date banner] -> [D.P. banner] -> [10-20 load rows]
     -> blank -> next D.P. banner -> next date -> repeat
   So we walk top-to-bottom carrying current-date and current-D.P.
   as state, and emit one load per non-banner row.
   ============================================================= */
function parseDispatchRows(aoa, map, headerRow){
  const rows = [];
  const dates = {};
  let curDate = '', curDP = '';
  let skipped = 0, noDate = 0;
  const get = (row,idx)=> (idx==null||idx<0||row[idx]==null) ? '' : row[idx];
  const bannerCol = (map.bannerCol!=null ? map.bannerCol : map.origin);

  for(let i=0;i<aoa.length;i++){
    if(headerRow!=null && i===headerRow) continue;
    const row = aoa[i] || [];
    const filled = row.filter(c=>c!=null && String(c).trim()!=='');
    if(!filled.length) continue;                       // blank spacer row

    /* --- banner rows --- */
    const bcell = get(row, bannerCol);
    const bDate = parseCellDate(bcell);
    /* A new date banner ENDS the previous day's D.P. section. Without this
       reset curDP leaks across day boundaries and never clears, so every row
       in the file ends up looking like it sits under a Diamond banner —
       7,607 of 7,693 rows, which would classify the whole log as Diamond.
       With the reset it lands at 80%, matching QBO's 79% Diamond revenue
       concentration. Loads written above the first D.P. banner of a day are
       genuinely non-Diamond, and that is exactly where the Purina / Perf. Pet
       / Hunt Behrens work sits. */
    if(bDate){ curDate = bDate; curDP = ''; continue; }
    // A row with real load data in it is not a banner, even if the origin
    // column happens to read "RIPON" — require the explicit D.P. marker there.
    const bDP = parseDPBanner(bcell, filled.length>2);
    if(bDP){ curDP = bDP; continue; }

    /* Sparse rows: a banner that landed in some other column. */
    if(filled.length<=2){
      let hit = null;
      for(let c=0;c<row.length;c++){ const d=parseCellDate(row[c]); if(d){ hit=d; break; } }
      if(hit){ curDate = hit; continue; }
      for(let c=0;c<row.length;c++){ const p=parseDPBanner(row[c]); if(p){ hit='dp'; curDP=p; break; } }
      if(hit) continue;
    }

    /* --- load row --- */
    const drvCell   = splitDriverCell(get(row, map.driver));
    const origin    = String(get(row, map.origin)||'').trim();
    const fb        = String(get(row, map.fb)||'').trim();
    const commodity = String(get(row, map.commodity)||'').trim();
    const po        = String(get(row, map.po)||'').trim();
    const status    = String(get(row, map.status)||'').trim();

    // A load row needs at least one identifying field.
    if(!drvCell.raw && !fb && !commodity && !origin && !po){ skipped++; continue; }
    // Stray repeated header inside the log.
    if(HEADER_WORDS.test(origin) && HEADER_WORDS.test(drvCell.raw)){ skipped++; continue; }

    const rowDate = map.date!=null ? (parseCellDate(get(row,map.date)) || curDate) : curDate;
    const dp = map.destination!=null ? (String(get(row,map.destination)||'').trim() || curDP) : curDP;
    if(!rowDate) noDate++;

    const ld = laneDefaultsFor(origin, dp);
    const sheetLbs   = map.lbs!=null     ? Number(get(row,map.lbs))     : NaN;
    const sheetHours = map.hours!=null   ? Number(get(row,map.hours))   : NaN;
    const sheetRev   = map.revenue!=null ? Number(get(row,map.revenue)) : NaN;

    const rec = Object.assign(blankDayRow(), {
      id: nextRowId('I'), source:'import', date: rowDate,
      customer: 'Diamond Pet Foods',          // both D.P. LATHROP and D.P. RIPON bill to Diamond
      deliveryPoint: dp, origin: origin,
      driver: matchDriver(drvCell.delivery), driverRaw: drvCell.raw,
      preloader: drvCell.preloader,
      lbs:   (!isNaN(sheetLbs)   && sheetLbs>0)   ? sheetLbs   : ld.lbs,
      miles: ld.miles,
      hours: (!isNaN(sheetHours) && sheetHours>0) ? sheetHours : ld.hours,
      revenueOverride: (!isNaN(sheetRev) && sheetRev>0) ? sheetRev : '',
      estLbs:   !(!isNaN(sheetLbs)   && sheetLbs>0)   && ld.est,
      estHours: !(!isNaN(sheetHours) && sheetHours>0) && ld.est,
      estMiles: ld.est,
      laneKey: ld.key,
      time: fmtSheetTime(get(row, map.time)),
      po: po, fb: fb, commodity: commodity,
      truck: String(get(row, map.truck)||'').trim(),
      status: status,
      notes: map.notes!=null ? String(get(row,map.notes)||'').trim() : '',
      // v1.8.22: snapshot the row cells so trailer-status can find a pair
      // in column H or I when POC loads put a customer name in col G.
      rawCells: (row||[]).slice(0, 12).map(c => c==null ? '' : String(c).trim()),
      sheetRow: i+1,
    });
    /* v1.3: sort the row into one of the four buckets and remember why, so
       the classification can be explained in the table rather than asserted. */
    const cls = classifyLoad(rec);
    rec.bucket = cls.bucket;
    rec.custLabel = cls.label;
    rec.bucketWhy = cls.why;
    rec.destLabel = cls.destLabel || '';
    // Only Diamond rows belong to Diamond Pet; the rest carry their own label.
    if(cls.bucket !== 'diamond') rec.customer = cls.label || '';
    rows.push(rec);
    if(rowDate) dates[rowDate] = (dates[rowDate]||0)+1;
  }

  const dateList = Object.keys(dates).sort().map(d=>({date:d, n:dates[d]}));
  /* Bucket tally + the labels that landed in spot only because nobody has
     assigned them yet. Surfaced in Settings so a customer running 166 loads
     a year cannot sit misfiled as "occasional" without anyone noticing. */
  const buckets = {diamond:0, steady:0, seasonal:0, spot:0};
  const unassigned = {};
  rows.forEach(r=>{
    buckets[r.bucket] = (buckets[r.bucket]||0)+1;
    if(r.bucket==='spot' && r.custLabel && !labelBucket(r.custLabel))
      unassigned[r.custLabel] = (unassigned[r.custLabel]||0)+1;
  });
  const unassignedList = Object.keys(unassigned)
    .map(k=>({label:k, n:unassigned[k]})).sort((a,b)=>b.n-a.n);
  return { rows:rows, dates:dateList, skipped:skipped, noDate:noDate,
           buckets:buckets, unassigned:unassignedList };
}

/* BEGIN PNL_TODAY */
/* Local calendar day for the dispatch board. UTC .toISOString() after
   ~5pm PT is already tomorrow; the Excel file already has tomorrow's
   preload banner, so that pair opened Saturday while Friday was live.
   Prefer a requested date only when it is today or earlier (stay on
   Tue 9/2 after a refresh). A leftover future filterDate from the UTC
   mash snaps back to today. Picking tomorrow in the dropdown still
   works — that is applyImportDate, not this ingest default. */
function pickBoardDate(dates, requested, now){
  const today = (typeof isoLocal==='function')
    ? isoLocal(now || new Date())
    : (function(d){
        const p2 = n => (n<10?'0':'')+n;
        return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
      })(now || new Date());
  const list = Array.isArray(dates) ? dates : [];
  const has = d => list.some(x => x && (x.date || x) === d);
  if(requested && requested <= today && has(requested)) return requested;
  if(has(today)) return today;
  if(requested && has(requested)) return requested;
  if(list.length) return list[0].date || list[0] || today;
  return today;
}

function pnlChipOpsNet(x){
  if(!x) return 0;
  if(x.opsNet!=null && isFinite(Number(x.opsNet))) return Number(x.opsNet);
  return (Number(x.net)||0) + (Number(x.wearOther)||0);
}
/* END PNL_TODAY */

/* Re-parseable in memory so a mapping change does not need a re-upload.
   Not persisted — too big — so after a reload a remap needs the file again. */
let __wb = null;   // { fileName, sheetNames, sheets:{name:aoa} }

function ingestWorkbook(arrayBuf, fileName){
  return loadSheetJS().then(XLSX=>{
    /* cellDates:false — same as fct-dispatch xlsx-rows. Date objects plus
       isoLocal() shifted every banner back one day in Pacific time. */
    const wb = XLSX.read(new Uint8Array(arrayBuf), {type:'array', cellDates:false, raw:true});
    if(!wb.SheetNames.length) throw new Error('That workbook has no sheets.');
    const sheets = {};
    wb.SheetNames.forEach(n=>{
      sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''});
    });
    /* v2.1.33: sniff ADP Employee Daily Totals before treating this as
       a dispatch log. Same SheetJS path, different walker. */
    const firstAoa = sheets[wb.SheetNames[0]] || [];
    if(looksLikeAdpAoa(firstAoa)){
      const parsed = parseAdpDailyTotals(firstAoa);
      return ingestAdpParse(parsed, fileName);
    }
    __wb = { fileName:fileName, sheetNames:wb.SheetNames, sheets:sheets };
    const di = state.dispatchImport;
    if(wb.SheetNames.indexOf(di.sheetName)<0) di.sheetName = wb.SheetNames[0];
    const aoa = sheets[di.sheetName] || [];
    // Only auto-map the first time; a confirmed map is the user's, leave it.
    if(!di.mapConfirmed){
      const a = autoMap(aoa);
      di.columnMap = a.map; di.headerRow = a.headerRow;
    }
    return applyParse();
  });
}
function applyParse(){
  if(!__wb) throw new Error('No workbook in memory — re-import the file.');
  const di = state.dispatchImport;
  /* v1.6: worker rows arrive in a fixed, known field order and carry no header
     row, so they parse under the shipped map rather than whatever the operator
     last confirmed for a workbook. The column-mapping UI is a workbook affair;
     letting it reach the worker feed would only give it a way to be wrong. */
  const worker = !!__wb.worker;
  const sheetName = worker ? WORKER_SHEET : di.sheetName;
  const aoa = __wb.sheets[sheetName] || [];
  const res = parseDispatchRows(aoa, worker ? defaultColumnMap() : di.columnMap,
                                worker ? null : di.headerRow);
  state.dayRollup.lastImport = {
    fileName: __wb.fileName, sheetName: sheetName,
    importedAt: new Date().toISOString(), trimmed:false,
    source: worker ? 'worker' : 'file',
    ingestedAt: worker ? (__wb.ingestedAt||'') : '',
    dates: res.dates, rows: res.rows,
  };
  // Land on the requested date if it is today or earlier, else local today,
  // else the first date in the file. UTC .toISOString() after ~5pm PT is
  // already tomorrow — and the sheet already has tomorrow's preload banner —
  // so the board jumped to Saturday while Friday's books were still open.
  const pick = pickBoardDate(res.dates, di.filterDate);
  di.filterDate = pick;
  applyImportDate(pick, true);
  return res;
}

/* Rebuild the day's rows for one date. Manual what-if rows survive the
   switch; per-row overrides on imported rows write back to lastImport
   so flipping dates does not throw them away. */
function applyImportDate(dateISO, quiet){
  const li = state.dayRollup.lastImport;
  const manual = state.dayRollup.currentRows.filter(r=>r.source==='manual');
  const imported = (li && li.rows ? li.rows : []).filter(r=>r.date===dateISO).map(r=>Object.assign({},r));
  state.dayRollup.currentRows = imported.concat(manual);
  state.dayRollup.date = dateISO || '';
  state.dispatchImport.filterDate = dateISO || '';
  invalidateVerizonMatch();      // a new day means a new set of trips to claim
  saveDayImport();
  if(!quiet) renderDayRollup();
  /* v2.1.19: refetch fleet-day miles for the newly-selected date so the
     Fuel calc-vs-actual compare tracks the day-in-view, not the boot date. */
  try { if(typeof refreshVerizonMilesToday === 'function') refreshVerizonMilesToday(); } catch(_){}
}

/* Push recalibrated lane defaults through every imported load that the user
   has not hand-overridden, so calibrating in Settings takes effect without a
   re-import. Per-row edits are left alone. */
function reapplyLaneDefaults(){
  const li = state.dayRollup.lastImport;
  const touch = r=>{
    if(r.source!=='import') return;
    const ld = laneDefaultsFor(r.origin, r.deliveryPoint);
    if(!r.ovMiles) r.miles = ld.miles;
    if(!r.ovHours) r.hours = ld.hours;
    if(!r.ovLbs)   r.lbs   = ld.lbs;
    r.laneKey = ld.key;
  };
  if(li && li.rows) li.rows.forEach(touch);
  state.dayRollup.currentRows.forEach(touch);
}

/* Re-run bucket classification over everything already imported. Called when
   the operator assigns a customer to a category, so the change takes effect
   without a re-import. A row whose bucket was set by hand (ovBucket) is left
   alone — an explicit human call always outranks the rules. */
function reclassifyImported(){
  const touch = r=>{
    if(r.source!=='import' || r.ovBucket) return;
    const c = classifyLoad(r);
    r.bucket = c.bucket; r.custLabel = c.label; r.bucketWhy = c.why;
    // v1.9: carry the raw destination label on POC rows so revenueForRow()
    // can look up the lane rate. Diamond rows keep the deliveryPoint from
    // the banner; POC rows carry destLabel from column G.
    r.destLabel = c.destLabel || '';
    if(c.bucket !== 'diamond') r.customer = c.label || '';
  };
  const li = state.dayRollup.lastImport;
  if(li && li.rows) li.rows.forEach(touch);
  state.dayRollup.currentRows.forEach(touch);
}

/* v2.0.2 (2026-08-05, James report): the pre-v2.0.2 fallback that trimmed
   li.rows down to the day in view when localStorage refused the write is
   DELETED. Rows live in IDB now — quota is not a factor and there is no
   reason to drop history. The old fallback is what caused WTD/MTD to
   collapse to the day P&L: after a trim, li.rows only held one date's
   worth of loads, so any range sum over li.rows returned that one day's
   number no matter what range the caller asked for.
   Contract now:
     - save()      writes the small state blob (rows stripped) to LS.
     - idbPut(IDB_ROWS_KEY, li.rows)  writes rows to IDB (async, fire-
       and-forget). Errors surface via showStorageError; they do NOT
       trigger a row-drop.
     - Boot hydrates li.rows from IDB before the first render that
       consumes them.
   The IDB write is async but not awaited: LS is authoritative for the
   rest of state and returns synchronously so callers stay synchronous.
   In the rare case where the tab closes mid-write, the row-write may be
   lost — on next open the last successful row-write is what boot sees.
   Acceptable: worst case is one lost sync, which the ⚡/🔄 button re-runs
   in seconds. */
function saveDayImport(){
  const res = save();
  const li = state.dayRollup && state.dayRollup.lastImport;
  if(li && Array.isArray(li.rows)){
    // Clear the trimmed flag whenever we persist a fresh parse — with IDB
    // it's always false; keep the field for downstream code that checks it.
    if(li.trimmed && li.rows.length > 1) li.trimmed = false;
    idbPut(IDB_ROWS_KEY, li.rows).catch(err=>{
      showStorageError('IndexedDB row-write failed',
        'The dispatch parse could not persist to IndexedDB: '
        +String(err&&err.message||err)
        +'. Rows are still in memory for this tab; close the tab and they will be lost. Re-sync from the dispatch worker after a page reload to try again.',
        {severity:'warn'});
    });
  } else {
    // No rows in memory — clear the IDB copy too so a stale parse doesn't
    // resurrect on next boot.
    idbDel(IDB_ROWS_KEY).catch(()=>{});
  }
  return res;
}

/* v2.0.2: hydrate li.rows from IDB, and if LS-held rows are fuller than
   IDB (the one-time migration case on first boot after upgrade), push
   LS→IDB then re-persist to clean up LS. Called once at boot after
   loadState(), before renders that read li.rows. Async — callers should
   re-render after it resolves. */
async function hydrateLastImportRows(){
  try {
    const idbRows = await idbGet(IDB_ROWS_KEY);
    const li = state.dayRollup && state.dayRollup.lastImport;
    const lsRowsCount = (li && Array.isArray(li.rows)) ? li.rows.length : 0;
    const idbRowsCount = Array.isArray(idbRows) ? idbRows.length : 0;

    if(!idbRowsCount && !lsRowsCount) return false;   // nothing to do

    if(idbRowsCount >= lsRowsCount){
      // IDB is authoritative (either equal or has more — the LS side may
      // have been trimmed pre-v2.0.2).
      if(!state.dayRollup.lastImport){
        // First boot after upgrade with no LS lastImport shell — synthesize
        // the minimum shape so downstream readers don't null-check into
        // a corner.
        state.dayRollup.lastImport = {
          fileName:'', sheetName:'', importedAt:'', trimmed:false,
          dates:[], rows: idbRows
        };
      } else {
        state.dayRollup.lastImport.rows = idbRows;
        state.dayRollup.lastImport.trimmed = false;
      }
      // Normalize LS to remove any row copies that pre-v2.0.2 saves left
      // behind (idempotent — save() now always strips rows).
      save();
      return true;
    } else {
      // Migration case: LS has more rows than IDB (LS is pre-v2.0.2 save,
      // IDB is empty or older). Push LS→IDB, then let saveDayImport() rewrite.
      await idbPut(IDB_ROWS_KEY, li.rows).catch(()=>{});
      state.dayRollup.lastImport.trimmed = false;
      save();   // small LS write with rows stripped
      return true;
    }
  } catch(err) {
    // Silent — IDB may be unavailable in private mode or on corrupt profiles.
    // The rest of the app runs on whatever LS gave us, same as pre-v2.0.2.
    return false;
  }
}

/* BEGIN COMPLETED_REVENUE */
function dayRowActive(r){
  if(!r) return false;
  /* v2.0.9: PUSH loads were deferred and did NOT run — must be excluded from
     both the active load count and every revenue/contribution rollup that
     filters on dayRowActive(). Status literal is normally parsed into
     r.status (Column A of the raw sheet — see H4/Q13 in the memory dump),
     but the dispatch parser has historically also carried the raw Column H
     value on r.h for legacy rows, so we check both. Match is substring +
     upper-cased so "PUSH", " PUSH", "PUSH-2", "push" all trip it.
     v2.1.42: dayRowActive is the OPERATIONAL filter (board count, Queue,
     trailers, cutoff, fuel-est miles). Money no longer follows it — see
     dayRowBooksRevenue(). */
  const flags = (String(r.status||'') + ' ' + String(r.h||'')).toUpperCase();
  if(flags.includes('PUSH')) return false;
  return (Number(r.lbs)||0)>0 || (Number(r.miles)||0)>0 || (Number(r.hours)||0)>0;
}

/* v2.1.42: what the Status cell actually means on the FCT log.
   Diamond rows write DISPATCHED / DELIVERED / PRE in column H.
   POC grain (Ardent, Purina, Farmers, …) puts the DESTINATION in column G
   (Truck) and the trailer pair in column H (Status) — they almost never
   type DELIVERED. "dispatched 4 delivery" is still in-progress, not done. */
function dispatchStatusKind(r){
  const st = String((r && r.status) || '').trim().toUpperCase();
  const flags = (st + ' ' + String((r && r.h) || '')).toUpperCase();
  if(flags.includes('PUSH')) return 'push';
  if(/REJECT|RETURN|NO PRODUCT|DIDN'?T DELIVER|DIDNT DELIVER|DIDN'?T LOAD|LOAD MISSED|\bHOLD\b/.test(st))
    return 'cancelled';
  if(/DISPATCH/.test(st) || /DIPATCH|DISAPTCH|DFISPATCH/.test(st)) return 'dispatched';
  if(st==='D' || st==='COMPLETE' || st==='COMPLETED' || st==='DELIVERY'
     || /^DELIVER/.test(st) || /\bDELIVERED\b/.test(st))
    return 'delivered';
  if(/PRE/.test(st)) return 'preload';
  const hasDriver = !!(String((r && r.driverRaw) || '').trim() || String((r && r.driver) || '').trim());
  if(!hasDriver && (st==='' || st==='P')) return 'unassigned';
  if(!hasDriver) return 'unassigned';
  return 'assigned';
}

function cellIsFilled(v){
  const s = String(v==null?'':v).trim();
  if(!s) return false;
  if(s==='-' || s==='—' || s==='–' || s==='.' || s==='N/A' || s==='NA') return false;
  return true;
}
function rowHasDriverName(r){
  return cellIsFilled(r && r.driverRaw) || cellIsFilled(r && r.driver);
}
function rowHasFreightBill(r){
  return cellIsFilled(r && r.fb);
}

/* v2.1.45: a load books when it has a driver name AND a freight bill.
   James 2026-08-26 ~1pm PT on live v2.1.44: "Driver plus bill is the way."
   The extra DELIVERED / after-close assigned gate was too strict — JOEL/FABIAN,
   JOSE/RAMON, MARCOS, etc. already had FBs on the worker board while Today's
   REV stayed at 3 DELIVERED (~$1,155). ~45 today rows had both driver and FB
   and sat in PLAN.
   books = driver+FB (Excel FB # / worker field `fb`) during the open day.
   PLAN / projection (not in Today's REV): missing driver, missing FB, or both.
   Blank FCGE Ardent-style unassigned POs stay plan.
   Never book: PUSH, cancelled/rejected/return, truly unassigned (no driver).
   PRELOADED with driver AND FB DOES book (PREL chip stays as a UI lock only).
   asOfISO is kept for call-site/test compatibility; the calendar-day close
   gate is gone. */
function dayRowBooksRevenue(r, asOfISO){
  if(!dayRowActive(r)) return false;
  if(!rowHasDriverName(r) || !rowHasFreightBill(r)) return false;
  const kind = dispatchStatusKind(r);
  if(kind==='push' || kind==='cancelled' || kind==='unassigned')
    return false;
  return true;
}
