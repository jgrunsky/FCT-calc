/* END COMPLETED_REVENUE */
/* v1.3: a day row is priced off the T12M model, not the rate card.
   Precedence for both sides is the same — per-row override wins, then the
   per-customer figure, then the global default. The rate-card linehaul + FSC
   is still computed and returned so the table can show what the card WOULD
   have billed next to what the lane actually realises; on a 48,000 lb Diamond
   load that gap is ~$100 ($422 card vs $522 realised), which is exactly the
   error v1.2 was baking into every day. */
/* BEGIN SUBHAUL_AS_USED */
/* v2.0.9 / v2.1.38: $150 only when the driver field is Lopez/<name> or
   Prado/<name> (surname + slash + the sub company's driver). In-house
   W-2 Carlos Prado and Rafael Lopez have no slash and are not subs.
   Do not amortize QBO 326 here, in otherVariablePerLoad, or in the
   variableComponents pooled amount (that line stays 0). */
function isSubHaulDriver(drv){
  return /^(Lopez|Prado)\//i.test(String(drv==null?'':drv));
}
function subHaulFeeForDriver(drv){
  return isSubHaulDriver(drv) ? 150 : 0;
}
/* END SUBHAUL_AS_USED */
function computeDayRow(r){
  /* v2.1.40: do NOT apply estDriverWageBlend here. This function prices
     a load for the sheet and for Queue scoring. The OT/meals blend is
     EST-only on the P&L accumulate / applyAdpDayTotals / runningTotals
     path so dispatch ranking stays on unadjusted variable. */
  const s = state.settings;
  const lbs   = Number(r.lbs)||0;
  const miles = Number(r.miles)||0;
  const hours = Number(r.hours)||0;

  const linehaul = lbs * s.ratePerLb;
  const rule = fscRuleFor(r.customer);
  const fsc  = fscAmount(rule.method, rule.value, {linehaul:linehaul, lbs:lbs, loadedMi:miles});
  const cardRevenue = linehaul + fsc;

  /* v1.3: rate resolution is bucket-aware — see revenueForRow(). */
  const rev = revenueForRow(r);
  const billed = Number(r.revenueOverride)||0;
  const revenue = rev.amount;

  /* Variable follows the rate tier too — a 300-mile Harris turn burns far more
     fuel and driver hours than an 80-mile Lathrop run, so costing every Diamond
     load at the fleet average would flatter the long lanes and punish the short. */
  const tierV = (r.bucket==='diamond' || !r.bucket) ? diamondTier(r.origin, r.truck) : null;
  const varOv   = Number(r.varCostOverride)||0;
  /* v2.0.9 / v2.1.38: sub-haul as used only — see isSubHaulDriver().
     Explicit varCostOverride still wins (operator can force a number). */
  const drvStr    = String(r.driver||'');
  const isSubHaul = isSubHaulDriver(drvStr);
  let varCost;
  /* v2.1.21: per-lane calibration multiplier from state.laneCalibration.
     Applied to LANE_MILES before variableComponents so fuel + wear costs
     track what the trucks actually drive on this lane in the last 7 days.
     Sub-hauls and override rows are exempt (they don't cost off miles). */
  const laneCal = laneCalibrationFactor(r.origin, r.deliveryPoint || r.destination);
  let driverCost = 0, fuelCost = 0, wearCost = 0, otherCost = 0, subHaulCost = 0;
  const takeComps = (comps, scale)=>{
    const sc = (scale!=null && isFinite(scale)) ? scale : 1;
    (comps||[]).forEach(c=>{
      const a = (Number(c.amount)||0) * sc;
      if(c.k==='fuel') fuelCost += a;
      else if(c.k==='driver') driverCost += a;
      else if(c.k==='wear') wearCost += a;
      else if(c.k==='other') otherCost += a;
      else if(c.k==='subhauler') subHaulCost += a;
    });
  };
  if(varOv>0){
    varCost = varOv;
    otherCost = varOv; // override is a lump — cannot split
  } else if(isSubHaul){
    subHaulCost = subHaulFeeForDriver(drvStr);
    varCost = subHaulCost;
  } else {
    // v2.1.18: prefer lane-specific miles when we have them (accurate fuel + wear
    // per specific origin→destination). Falls back to tier miles otherwise.
    const rawLaneMi = laneMilesFor(r.origin, r.deliveryPoint || r.destination);
    if(rawLaneMi > 0 && tierV){
      const calibratedMi = rawLaneMi * laneCal.factor;
      takeComps(variableComponents(calibratedMi, tierV.hours), 1);
    } else {
      // No lane match — fleet factor is the best we can do. Apply to the tier
      // model's implicit miles by scaling the variable output. Skip if factor=1.
      const scale = (laneCal.source !== 'none') ? laneCal.factor : 1;
      takeComps(variableComponents(tierV ? tierV.miles : null, tierV ? tierV.hours : null), scale);
    }
    varCost = fuelCost + driverCost + wearCost + otherCost + subHaulCost;
  }
  /* The otherVariablePerLoad plug only — not a varCostOverride lump
     and not the Lopez/Prado $150. Ships at $0 (v2.1.36). ADP days still
     subtract a leftover so clocked pay is not double-counted. */
  const otherPlug = (varOv>0 || isSubHaul) ? 0 : (Number(otherCost)||0);

  const cm = revenue - varCost;

  /* ---- v1.5 Verizon actuals ----
     Present only when a timecard CSV covers this day AND this row's driver
     could be matched to a trip cluster. Everything below is measured: miles
     off the odometer, hours off travel + stop time, driver cost at the rate
     of the person who actually ran it. Revenue does not move — the customer
     bills what the customer bills; only the cost side becomes real. */
  const vz = verizonFor(r);
  let actual = null;
  if(vz){
    const drv  = state.settings.drivers.find(x=>x.name===r.driver);
    const load = Number(state.qbo.driverLoadingFactor && state.qbo.driverLoadingFactor.value) || 1.31;
    const rate = drv ? Number(drv.rate)*load : null;
    const aVar = variableComponents(vz.miles, vz.hours, rate).reduce((a,c)=>a+c.amount, 0);
    actual = {
      miles: vz.miles, hours: vz.hours, varCost: aVar, cm: revenue - aVar,
      cmPerHour: vz.hours>0 ? (revenue-aVar)/vz.hours : 0,
      driverRate: rate, vehicle: vz.vehicle, legs: vz.legs,
      parkedTrimHrs: (Number(vz.parkedTrimSec)||0)/3600,
      isPreload: vz.isPreload, detentionMin: vz.detentionMin, diamondDp: vz.diamondDp,
      varDelta: aVar - varCost, cmDelta: (revenue-aVar) - cm,
      milesDelta: vz.miles - miles, hoursDelta: vz.hours - hours,
    };
  }

  return { active:dayRowActive(r), booked:dayRowBooksRevenue(r), customer:r.customer, driver:r.driver, lbs:lbs, miles:miles, hours:hours,
           actual:actual,
           bucket:r.bucket||'diamond', custLabel:r.custLabel||'', bucketWhy:r.bucketWhy||'',
           tier: tierV? tierV.k : '',
           linehaul:linehaul, fsc:fsc, fscRule:rule, cardRevenue:cardRevenue,
           revenue:revenue, billed:billed>0, rateEst:rev.est, rateBasis:rev.basis,
           varCost:varCost, driverCost:driverCost,
           fuelCost:fuelCost, wearCost:wearCost, otherCost:otherCost, subHaulCost:subHaulCost,
           otherPlug:otherPlug,
           varOverride:varOv>0, subHaul:isSubHaul,
           laneCal:laneCal,   // v2.1.21: {factor, source, laneKey, loadsInWindow?}
           cm:cm, cmPerHour: hours>0? cm/hours : 0, fixedAlloc:0, net:cm };
}
function computeDay(){
  const s = state.settings, d = state.dayRollup;
  const rows = d.currentRows.map(computeDayRow);
  const act  = rows.filter(r=>r.active);
  /* v2.1.45: dollars follow driver+FB (books). Active (assigned /
     dispatched / preload / unassigned-with-data) still drives the board
     count, Queue, trailers, and cutoff. */
  const booked = rows.filter(r=>r.booked);
  const plan = act.filter(r=>!r.booked);
  const T = { loads:booked.length, activeLoads:act.length,
              planLoads:plan.length, planRevenue:0, planVar:0, planCm:0,
              revenue:0, varCost:0, cm:0, hours:0, cardRevenue:0, driverCost:0, otherPlug:0 };
  booked.forEach(r=>{ T.revenue+=r.revenue; T.varCost+=r.varCost; T.cm+=r.cm; T.hours+=r.hours; T.cardRevenue+=r.cardRevenue; T.driverCost+=(Number(r.driverCost)||0); T.otherPlug+=(Number(r.otherPlug)||0); });
  /* v2.1.45: planned/active rows (no driver or no FB) keep a projection
     total so the board still shows the day's plan. That $ is NOT in
     T.revenue / Today's REV / contribution books. */
  plan.forEach(r=>{ T.planRevenue+=r.revenue; T.planVar+=r.varCost; T.planCm+=r.cm; });
  /* v2.1.33: when ADP field-driver actuals cover a CLOSED date, swap the
     modelled driver-wage component for that day's ADP dollars. Fuel,
     wear, and sub-haul stay. A leftover other plug still drops.
     Today stays on the model unless the file was re-dropped after close.
     Hours on a closed day become ADP hours. */
  applyAdpDayTotals(d.date, T);
  T.cmPerHour = T.hours>0 ? T.cm/T.hours : 0;

  /* ---- v1.5 actuals roll-up ----
     Totalled over the MATCHED rows only, and the estimate for those same rows
     is carried alongside, so the variance compares like with like. Mixing 18
     measured loads against a 21-load estimate would read as a saving that is
     really just three loads nobody measured. */
  const matchedRows = booked.filter(r=>r.actual);
  let A = null;
  if(matchedRows.length){
    A = { loads:matchedRows.length, miles:0, hours:0, varCost:0, cm:0, revenue:0,
          estMiles:0, estHours:0, estVar:0, estCm:0, preloads:0, detentions:0 };
    matchedRows.forEach(r=>{
      A.miles += r.actual.miles;   A.hours += r.actual.hours;
      A.varCost += r.actual.varCost; A.cm += r.actual.cm; A.revenue += r.revenue;
      A.estMiles += r.miles;       A.estHours += r.hours;
      A.estVar += r.varCost;       A.estCm += r.cm;
      if(r.actual.isPreload) A.preloads++;
      if(r.actual.detentionMin > (Number(s.detentionThresholdMin)||60)) A.detentions++;
    });
    A.varPct   = A.estVar>0   ? ((A.varCost/A.estVar)-1)*100   : 0;
    A.milesPct = A.estMiles>0 ? ((A.miles/A.estMiles)-1)*100   : 0;
    A.hoursPct = A.estHours>0 ? ((A.hours/A.estHours)-1)*100   : 0;
    A.cmDelta  = A.cm - A.estCm;
    A.unmatched = booked.length - matchedRows.length;
  }

  /* v1.3: the FULL daily fixed nut. v1.2 scaled this by trucks running,
     which quietly forgave a slow day — the lease, the insurance and the
     office payroll are owed whether or not the truck turned a wheel.
     Trucks running is still tracked, but only as context. */
  const fixedTotal = fixedCostPerDay();
  const trucks = Number(d.trucksRunning)>0 ? Number(d.trucksRunning) : trucksRunningPerDay();

  /* v1.4 / v2.1.42: dispatch counts stay on active rows. Money is booked. */
  const lockedLoads = d.currentRows.filter(r=>dayRowActive(r) && isPreloadLocked(r)).length;
  /* v1.7 — Section 2 is counted here so the P&L can disclose it, and ONLY so
     it can disclose it. Not one of these rows touches T.revenue, T.varCost or
     T.cm: `act` is built from currentRows, which is this day's banner and
     nothing else. The money follows the delivery date; only the hours came
     forward. See dayHrs below and the footnote in dayTotalsHTML(). */
  const preRows = preloadSectionRows(d.date);
  const dayHrs  = dayDriverHours(d.date, act, preRows);
  const pastCutoff  = d.currentRows.filter(r=>{ const c=dayRowActive(r)&&cutoffState(r); return c && c.k==='past'; }).length;
  const nearCutoff  = d.currentRows.filter(r=>{ const c=dayRowActive(r)&&cutoffState(r); return c && c.k==='near'; }).length;
  const unassigned  = d.currentRows.filter(isUnassigned).length;

  // Pro-rata by hours on load. If nobody logged hours, spread evenly so the
  // day verdict still means something instead of silently allocating zero.
  // v2.1.33: after ADP swap, T.hours is clocked ADP hours — keep allocating
  // the fixed nut off modelled load hours (estHours) so the row split still
  // matches the loads.
  const allocHrs = (T.estHours!=null) ? T.estHours : T.hours;
  rows.forEach(r=>{ r.fixedAlloc = 0; r.net = r.cm; });
  booked.forEach(r=>{
    r.fixedAlloc = allocHrs>0 ? fixedTotal*(r.hours/allocHrs)
                 : (booked.length? fixedTotal/booked.length : 0);
    r.net = r.cm - r.fixedAlloc;
  });
  const net  = T.cm - fixedTotal;
  const band = Number(s.dayVerdictBandUsd)>0 ? Number(s.dayVerdictBandUsd) : 500;
  const be   = breakevenLoadsPerDay();
  const shortfall = be - booked.length;

  /* ---- Load mix (v1.3) ----
     The day is not just a P&L question. Capacity is deliberately reserved for
     Jun–Nov seasonal work, so a day that clears breakeven on the back of
     standing non-Diamond commitments is a worse day than the number suggests:
     that freight will still be there in harvest season. */
  const mix = {diamond:0, steady:0, seasonal:0, spot:0};
  booked.forEach(r=>{ mix[r.bucket] = (mix[r.bucket]||0)+1; });
  const n = booked.length || 1;
  const share = k => (mix[k]/n)*100;
  const inSeason = inSeasonWindow(d.date);
  const dangerPct = Number(s.steadyDangerPct)||20;
  const mixFlags = [];
  if(booked.length){
    if(!mix.diamond) mixFlags.push('no Diamond baseline on the day at all');
    else if(share('diamond') < 50) mixFlags.push('Diamond is only '+share('diamond').toFixed(0)+'% of the day');
    if(share('steady') > dangerPct)
      mixFlags.push('steady non-Diamond is '+share('steady').toFixed(0)+'% of the day, past the '+dangerPct+'% guard rail');
    /* Encroachment test. The obvious rule — "steady outnumbers seasonal on a
       Jun–Nov day" — fires on literally every day in the 2026 log, because the
       seasonal bucket only ever holds 11 loads while steady runs ~8% of every
       month. A warning that is always on is not a warning. So the day must show
       steady work genuinely ELEVATED against its own baseline before this
       counts as encroachment, not merely present. */
    /* Double the baseline. At 1.5x this fired on an ordinary July day (12%
       steady against an 11% month average) and downgraded a profitable day for
       nothing. 2x puts the trip point clear of normal month-to-month variation,
       so it means "steady work has genuinely doubled its footprint", not
       "steady work exists". */
    const baseline = Number(s.steadySharePct)||8;
    const ENCROACH_MULT = 2.0;
    if(inSeason && mix.steady > mix.seasonal && share('steady') > baseline*ENCROACH_MULT)
      mixFlags.push('this is a '+MONTH_NAMES[+d.date.slice(5,7)-1]+' day inside the Jun–Nov window and steady work is '
        + share('steady').toFixed(0)+'% of it — more than double the '+baseline+'% baseline — while seasonal is only '
        + mix.seasonal+' load'+(mix.seasonal===1?'':'s')+'. That is the encroachment pattern');
  }
  const mixHealthy = mixFlags.length===0;

  let verdict, vClass, vNote;
  const mixLine = booked.length
    ? ' Mix: '+LOAD_BUCKETS.filter(b=>mix[b.k]).map(b=>mix[b.k]+' '+b.label.toLowerCase()).join(' · ')+'.'
    : '';
  if(!act.length){
    verdict='NO LOADS YET'; vClass='reneg';
    vNote='Import the dispatch log and pick a date to get a verdict on the day.';
  } else if(!booked.length){
    verdict='IN PROGRESS'; vClass='reneg';
    vNote=act.length+' load'+(act.length===1?'':'s')+' planned on the board, <b>none in the books yet</b> — revenue is $0 until a load has a driver name AND a freight bill. '
      + 'Blank driver/FB rows (never dispatched) stay on the projection line, not in Today\'s REV.';
  } else if(net > band && mixHealthy){
    verdict='GREEN — GOOD DAY'; vClass='accept';
    vNote=booked.length+' booked load'+(booked.length===1?'':'s')+' clear the '+money(fixedTotal)+' daily fixed cost by <b>'+money(net)+'</b>. Breakeven is '
      + be.toFixed(1)+' loads/day, so today ran '+(booked.length-be).toFixed(1)+' to the good, and the mix is healthy — '
      + 'Diamond baseline present, steady work inside its guard rail'
      + (inSeason?', seasonal capacity not encroached':'')+'.'+mixLine;
  } else if(net < -band || (mixFlags.length>1 && net<0)){
    verdict='RED — LOSS'; vClass='reject';
    vNote=(net < -band
        ? booked.length+' booked load'+(booked.length===1?'':'s')+' fell short of the '+money(fixedTotal)+' daily fixed cost. The day lost <b>'+money(Math.abs(net))+'</b>. '
          + 'Breakeven is '+be.toFixed(1)+' loads/day — today needed '+Math.ceil(shortfall)+' more booked load'+(Math.ceil(shortfall)===1?'':'s')+'.'
        : 'The day is under water (<b>'+money(net)+'</b>) and the mix is bleeding back: ')
      + (mixFlags.length? ' <b style="display:inline">Bleed-back risk:</b> '+mixFlags.join('; ')+'.' : '')
      + mixLine;
  } else if(net > band && !mixHealthy){
    verdict='AMBER — MIX SKEWING'; vClass='reneg';
    vNote='The day clears fixed cost by '+money(net)+', but the load mix is drifting: '+mixFlags.join('; ')+'. '
      + 'A profitable day built on standing non-Diamond commitments still costs you the capacity that Jun–Nov harvest work needs.'+mixLine;
  } else {
    verdict='AMBER — NEAR BREAKEVEN'; vClass='reneg';
    vNote='The day landed within '+money(band)+' of breakeven — net '+money(net)+' after the '+money(fixedTotal)
      + ' daily fixed cost. At '+be.toFixed(1)+' loads/day breakeven and '+booked.length
      + ' booked, this is the knife edge: no cushion for a breakdown or a rejected load.'
      + (mixFlags.length? ' Mix note: '+mixFlags.join('; ')+'.' : '')
      + mixLine;
  }
  return { rows:rows, totals:T, trucks:trucks, perTruck:Number(s.dailyFixedCostPerTruck)||0,
           fixedTotal:fixedTotal, net:net, band:band, breakeven:be,
           mix:mix, mixFlags:mixFlags, mixHealthy:mixHealthy, inSeason:inSeason,
           lockedLoads:lockedLoads, pastCutoff:pastCutoff, nearCutoff:nearCutoff,
           unassigned:unassigned, actuals:A, activeLoads:(T.activeLoads||act.length),
           preRows:preRows, dayHrs:dayHrs, tomorrow:nextDayISO(d.date),
           verdict:verdict, vClass:vClass, vNote:vNote };
}

            + num(H.stdHrs,1)+' hr default' : ''),

  h += '<div class="legend">Deliveries are summed from each load\'s own modelled hours, so a long Harris turn and a '

  return h;
}

/* Split the day's rows into the sheet's sections, keeping the original
   sheet order inside each. Carries the row's index in currentRows so the
   edit handlers still address the right record.

   v1.7: pre-6am rows WERE hoisted OUT of their delivery-point section into
   a `preloaded` group that renders first.
   v1.8.14: James 2026-07-29 — REVERSED. He wants preloaded loads to also
   appear under their D.P. section so the app matches the plant-list layout
   of the dispatch Excel. The 🔒 PRELOADED chip on each row is enough
   visual signal that the dispatcher can't move it. We STILL populate the
   preloaded group for the summary banner at the top (used elsewhere for
   counts) but ALSO push into the plant section — same row appears in both
   places, indexed to the same underlying record. */
function sheetSections(rows){
  const out = { preloaded:[], above:[], lathrop:[], ripon:[], other:[], manual:[], hiddenPoc:0 };
  rows.forEach((r,i)=>{
    // v1.8.6: hide POC-brokered loads when Diamond-only toggle is on
    if(dayDiamondOnly && r.bucket && r.bucket !== 'diamond'){
      out.hiddenPoc++;
      return;
    }
    const rec = {r:r, i:i};
    if(r.source!=='import'){ out.manual.push(rec); return; }
    // v1.8.14: preloaded rows land in their plant section AND stay in
    // the preloaded bucket so the summary banner + counts still work.
    if(isPreloadLocked(r)) out.preloaded.push(rec);
    const dp = String(r.deliveryPoint||'').toUpperCase();
    if(/LATHROP/.test(dp))    out.lathrop.push(rec);
    else if(/RIPON/.test(dp)) out.ripon.push(rec);
    else if(dp)               out.other.push(rec);
    else                      out.above.push(rec);
  });
  return out;
}

/* Week-to-date and month-to-date. These are ALWAYS anchored to the caller's
   `refDate` (which the header strip now passes as todayISO, not the
   day-in-view — see v2.0.1 fix below). Prior to v2.0.1 the header passed
   `shown`, which collapsed WTD/MTD to a single day whenever the operator
   scrolled back to an earlier day in the picker; on Sat Aug 1 that made
   WTD == MTD == day P&L, because Aug 1 was both week-start and month-start.
   Fixed cost accrues per operating day that actually has loads, so a
   partial week is not charged for days that never ran.
   Week convention: Monday-start (see `mon.setDate(d0.getDate() - ((d0.getDay()+6)%7))`
   below — 0=Sun→−6, 1=Mon→0, 2=Tue→−1, ...). */
function runningTotals(refDate){
  const li = state.dayRollup.lastImport;
  if(!li || !li.rows || !li.rows.length || !refDate) return null;
  const d0 = new Date(refDate+'T00:00:00');
  if(isNaN(d0.getTime())) return null;
  const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay()+6)%7));
  const weekStart = isoLocal(mon);
  const monthStart = refDate.slice(0,8)+'01';
  const fpd = fixedCostPerDay(), be = breakevenLoadsPerDay();
  const agg = (from,to)=>{
    /* v2.1.33: group by day first so ADP dollars replace that day's
       modelled driver wages, then sum. Do not blend ADP into a fake $/hr. */
    const perDay = {};
    li.rows.forEach(r=>{
      if(!r.date || r.date<from || r.date>to) return;
      const c = computeDayRow(r);
      if(!c.booked) return;
      const d = perDay[r.date] || (perDay[r.date] = {loads:0, rev:0, varc:0, driver:0, otherPlug:0});
      d.loads++; d.rev+=c.revenue; d.varc+=c.varCost; d.driver+=(Number(c.driverCost)||0);
      d.otherPlug += (Number(c.otherPlug)||0);
    });
    let loads=0, rev=0, varc=0, adpDays=0, estDays=0;
    Object.keys(perDay).forEach(dt=>{
      const d = perDay[dt];
      const actuals = (typeof adpFieldActualsForDate==='function') ? adpFieldActualsForDate(dt) : null;
      let dayVar = d.varc;
      if(actuals){ dayVar = applyAdpToModeled(d.varc, d.driver, actuals.dollars, d.otherPlug); adpDays++; }
      else {
        /* EST-only OT/meals blend. Actuals (file/API) already took the other branch 1:1. */
        const blended = (typeof blendEstDriverWages==='function') ? blendEstDriverWages(d.driver) : d.driver;
        dayVar = d.varc - d.driver + blended;
        estDays++;
      }
      loads += d.loads; rev += d.rev; varc += dayVar;
    });
    const nDays = Object.keys(perDay).length;
    const cm = rev - varc;
    return { loads:loads, rev:rev, varc:varc, cm:cm, days:nDays,
             fixed:nDays*fpd, net:cm-(nDays*fpd), beLoads:nDays*be,
             adpDays:adpDays, estDays:estDays,
             varSource: adpDays ? (estDays ? 'MIX' : 'ADP') : 'EST' };
  };
  return { week:agg(weekStart,refDate), month:agg(monthStart,refDate),
           weekStart:weekStart, monthStart:monthStart };
}

/* =============================================================
   v2.1.34 P&L board (James 2026-08-24)
   v2.1.35: two nets — Ops (rev − wages − fuel − fixed) is the
   headline James means; After wear is fully loaded (still subtracts
   wear + remaining other + Lopez/Prado $150).
   v2.1.36: otherVariablePerLoad is $0 (not in 2025 QBO shop bills).
   v2.1.37: wear is $0.498/mi (313.2+3+4+9 tarps ≈ $448k). WC $92,922
   once in the fixed nut. Sub $150 as used only.
   v2.1.38: sub still as-used only; QBO 326 is not a per-load charge.
   -------------------------------------------------------------
   The landing-strip DAY/WTD/MTD chips were too small — payroll looked
   buried. This board is the thing to LOOK at: revenue, driver wages,
   fuel, wear/other, fixed, contribution, ops net, after wear. Each
   line says ADP / Verizon / EST. Day-in-view follows the picker;
   MTD/WTD stay locked to today (same as runningTotals). Today stays
   EST while open.
   ============================================================= */
function verizonFuelDollarsForDate(dateISO){
  if(!dateISO) return null;
  const fpm = fuelPerMile();
  const v = state.verizonMilesToday || {};
  const vDate = String(v.date||'').slice(0,10);
  if(v.ok && Number(v.fleetMiles)>0 && (vDate===dateISO || (!vDate && dateISO===isoLocal(new Date()))))
    return Number(v.fleetMiles) * fpm;
  const hist = Array.isArray(state.milesHistory) ? state.milesHistory : [];
  const hit = hist.find(x=> x && x.date===dateISO && Number(x.fleetMiles)>0);
  if(hit) return Number(hit.fleetMiles) * fpm;
  return null;
}

function emptyPnlDay(){
  return { rev:0, billed:0, rateEst:0, fuel:0, driver:0, wear:0, other:0, sub:0,
           otherPlug:0, hours:0, loads:0, fuelSrc:'EST', driverSrc:'EST', office:0 };
}

function seedPnlDayFromAdp(dateISO){
  const b = emptyPnlDay();
  b.office = (typeof adpOfficeDollarsForDate==='function') ? adpOfficeDollarsForDate(dateISO) : 0;
  const actuals = (typeof adpFieldActualsForDate==='function') ? adpFieldActualsForDate(dateISO) : null;
  if(actuals){
    b.driver = actuals.dollars; b.driverSrc = 'ADP'; b.hours = actuals.hours;
  }
  const vf = verizonFuelDollarsForDate(dateISO);
  if(vf!=null){ b.fuel = vf; b.fuelSrc = 'Verizon'; }
  return b;
}

function accumulatePnlByDay(){
  const byDay = Object.create(null);
  const li = state.dayRollup && state.dayRollup.lastImport;
  const rows = (li && Array.isArray(li.rows)) ? li.rows : [];
  rows.forEach(raw=>{
    if(!raw || !raw.date) return;
    const r = computeDayRow(raw);
    if(!r.booked) return;
    const b = byDay[raw.date] || (byDay[raw.date] = emptyPnlDay());
    b.rev += Number(r.revenue)||0;
    if(r.billed) b.billed += Number(r.revenue)||0;
    if(r.rateEst) b.rateEst++;
    b.fuel += Number(r.fuelCost)||0;
    b.driver += Number(r.driverCost)||0;
    b.wear += Number(r.wearCost)||0;
    b.other += Number(r.otherCost)||0;
    b.otherPlug = (Number(b.otherPlug)||0) + (Number(r.otherPlug)||0);
    b.sub += Number(r.subHaulCost)||0;
    b.hours += Number(r.hours)||0;
    b.loads++;
  });
  Object.keys(byDay).forEach(d=>{
    const b = byDay[d];
    const actuals = (typeof adpFieldActualsForDate==='function') ? adpFieldActualsForDate(d) : null;
    if(actuals){
      b.driver = actuals.dollars;
      b.driverSrc = 'ADP';
      b.hours = actuals.hours;
      /* Drop a leftover other plug. Wear and Lopez/Prado $150 stay.
         varCostOverride lumps are not in otherPlug, so they remain in other. */
      b.other = stripAdpOtherPlug(b.other, b.otherPlug, true);
      b.otherPlug = 0;
    } else {
      /* EST-only OT/meals blend. Actuals already took the ADP branch 1:1 —
         file import now, API later, same adpFieldActualsForDate gate. */
      b.driver = (typeof blendEstDriverWages==='function') ? blendEstDriverWages(b.driver) : b.driver;
      b.driverSrc = 'EST';
    }
    const vf = verizonFuelDollarsForDate(d);
    if(vf!=null){ b.fuel = vf; b.fuelSrc = 'Verizon'; }
    else b.fuelSrc = 'EST';
    b.office = (typeof adpOfficeDollarsForDate==='function') ? adpOfficeDollarsForDate(d) : 0;
  });
  return byDay;
}

function pnlSumRange(byDay, from, to){
  const out = { rev:0, billed:0, rateEst:0, fuel:0, driver:0, wearOther:0,
                varCost:0, cm:0, loads:0, nDays:0, adpDays:0, estDriverDays:0,
                verizonFuelDays:0, office:0 };
  Object.keys(byDay).forEach(d=>{
    if((from && d<from) || (to && d>to)) return;
    const b = byDay[d];
    const wearOther = (Number(b.wear)||0)+(Number(b.other)||0)+(Number(b.sub)||0);
    const driver = Number(b.driver)||0;
    const fuel = Number(b.fuel)||0;
    const varCost = fuel + driver + wearOther;
    out.rev += Number(b.rev)||0;
    out.billed += Number(b.billed)||0;
    out.rateEst += Number(b.rateEst)||0;
    out.fuel += fuel; out.driver += driver; out.wearOther += wearOther;
    out.varCost += varCost; out.cm += (Number(b.rev)||0) - varCost;
    out.loads += Number(b.loads)||0;
    out.nDays++;
    out.office += Number(b.office)||0;
    if(b.driverSrc==='ADP') out.adpDays++; else out.estDriverDays++;
    if(b.fuelSrc==='Verizon') out.verizonFuelDays++;
  });
  const fpd = fixedCostPerDay();
  out.fixed = out.nDays * fpd;
  const nets = pnlFinishLines(out);
  out.net = nets.net;
  out.opsNet = nets.opsNet;
  out.opsCm = nets.opsCm;
  return out;
}

/* BEGIN PNL_BOARD */
/* Ops net = revenue − driver wages − fuel − fixed (the number James means).
   After wear / fully loaded = ops net − wear − remaining other − sub. */
function pnlFinishLines(x){
  const rev = Number(x && x.rev)||0;
  const driver = Number(x && x.driver)||0;
  const fuel = Number(x && x.fuel)||0;
  const wearOther = Number(x && x.wearOther)||0;
  const fixed = Number(x && x.fixed)||0;
  const opsCm = rev - driver - fuel;
  const opsNet = opsCm - fixed;
  const cm = opsCm - wearOther;
  const net = cm - fixed;
  return { opsCm:opsCm, opsNet:opsNet, cm:cm, net:net };
}
/* END PNL_BOARD */

function pnlWrapDay(b){
  b = b || emptyPnlDay();
  const wearOther = (Number(b.wear)||0)+(Number(b.other)||0)+(Number(b.sub)||0);
  const driver = Number(b.driver)||0;
  const fuel = Number(b.fuel)||0;
  const varCost = fuel + driver + wearOther;
  const fpd = fixedCostPerDay();
  const nets = pnlFinishLines({ rev:b.rev, driver:driver, fuel:fuel, wearOther:wearOther, fixed:fpd });
  return {
    rev: Number(b.rev)||0, billed: Number(b.billed)||0, rateEst: Number(b.rateEst)||0,
    fuel:fuel, driver:driver, wearOther:wearOther, varCost:varCost,
    cm:nets.cm, opsCm:nets.opsCm, opsNet:nets.opsNet,
    loads: Number(b.loads)||0, nDays:1,
    adpDays: b.driverSrc==='ADP' ? 1 : 0,
    estDriverDays: b.driverSrc==='ADP' ? 0 : 1,
    verizonFuelDays: b.fuelSrc==='Verizon' ? 1 : 0,
    office: Number(b.office)||0,
    fixed: fpd, net: nets.net
  };
}

function pnlRevChip(x){
  if(!(x.rev>0)) return { label:'—', cls:'y' };
  if(x.billed>0 && x.billed >= x.rev - 0.5) return { label:'Invoiced', cls:'g' };
  if(x.billed>0) return { label:'Invoiced + EST', cls:'y' };
  if(x.rateEst>0) return { label:'EST', cls:'y' };
  return { label:'Rate card', cls:'b' };
}
function pnlDriverChip(x){
  const src = (typeof pnlDriverSource==='function')
    ? pnlDriverSource(x.adpDays, x.estDriverDays)
    : (x.adpDays ? (x.estDriverDays ? 'ADP+EST' : 'ADP') : 'EST');
  if(src==='ADP') return { label:'ADP', cls:'g' };
  if(src==='ADP+EST') return { label:'ADP + EST', cls:'a' };
  return { label:'EST', cls:'y' };
}
function pnlFuelChip(x){
  if(x.verizonFuelDays && x.nDays && x.verizonFuelDays===x.nDays) return { label:'Verizon', cls:'g' };
  if(x.verizonFuelDays) return { label:'Verizon + EST', cls:'a' };
  return { label:'EST', cls:'y' };
}

function buildPnlBoard(dateISO){
  const todayISO = isoLocal(new Date());
  const shown = dateISO || todayISO;
  const d0 = new Date(todayISO+'T00:00:00');
  const mon = new Date(d0); mon.setDate(d0.getDate() - ((d0.getDay()+6)%7));
  const weekStart = isoLocal(mon);
  const monthStart = todayISO.slice(0,8)+'01';
  const byDay = accumulatePnlByDay();
  if(!Object.keys(byDay).length){
    Object.keys(__adpByDate||{}).forEach(d=>{
      if(d<monthStart || d>todayISO) return;
      if(!adpAppliesToDate(d)) return;
      byDay[d] = seedPnlDayFromAdp(d);
    });
  }
  const dayBucket = byDay[shown] || seedPnlDayFromAdp(shown);
  const day = pnlWrapDay(dayBucket);
  const liRows = (state.dayRollup && state.dayRollup.lastImport && Array.isArray(state.dayRollup.lastImport.rows))
    ? state.dayRollup.lastImport.rows : [];
  day.activeLoads = liRows.filter(r => r && r.date===shown && (typeof dayRowActive==='function' ? dayRowActive(r) : true)).length;
  let planLoads = 0, planRevenue = 0;
  liRows.forEach(raw=>{
    if(!raw || raw.date!==shown) return;
    const c = (typeof computeDayRow==='function') ? computeDayRow(raw) : null;
    if(c && c.active && !c.booked){ planLoads++; planRevenue += Number(c.revenue)||0; }
  });
  day.planLoads = planLoads;
  day.planRevenue = planRevenue;
  const officeMtd = (typeof adpOfficeInRange==='function')
    ? adpOfficeInRange(monthStart, todayISO) : { dollars:0, names:[] };
  const officeWtd = (typeof adpOfficeInRange==='function')
    ? adpOfficeInRange(weekStart, todayISO) : { dollars:0, names:[] };
  const officeDay = (adpAppliesToDate(shown) && typeof adpOfficeDollarsForDate==='function')
    ? adpOfficeDollarsForDate(shown) : 0;
  return {
    shown:shown, todayISO:todayISO, weekStart:weekStart, monthStart:monthStart,
    day: day,
    wtd: pnlSumRange(byDay, weekStart, todayISO),
    mtd: pnlSumRange(byDay, monthStart, todayISO),
    officeDay:officeDay, officeWtd:officeWtd, officeMtd:officeMtd,
    drivers: (adpAppliesToDate(shown) && typeof adpFieldDriversForDate==='function')
      ? adpFieldDriversForDate(shown) : []
  };
}

/* The sheet's Time column is a mix of typed text ("9am", "ASAP", "PRE") and
   real Excel time cells, which arrive as a fraction of a day. Render both the
   way the operator wrote them. */
function fmtSheetTime(v){
  if(v==null || v==='') return '';
  if(v instanceof Date){
    let hh=v.getHours(), mm=v.getMinutes();
    const ap = hh>=12?'pm':'am'; hh = hh%12 || 12;
    return hh+(mm?':'+p2(mm):'')+ap;
  }
  const n = Number(v);
  if(typeof v==='number' || (v!=='' && !isNaN(n) && n>=0 && n<1)){
    const mins = Math.round(n*24*60);
    let hh = Math.floor(mins/60), mm = mins%60;
    const ap = hh>=12?'pm':'am'; hh = hh%12 || 12;
    return hh+(mm?':'+p2(mm):'')+ap;
  }
  return String(v).trim();
}

/* =============================================================
   RULE CHIPS + SUGGESTION CELL (v1.4)
   ============================================================= */

/* Cutoff and pre-6am-lock chips, rendered into the Time cell because
   both rules are consequences of the appointment time.

   v1.7 — `mode` is which section the row is being drawn in, and it changes
   only the pre-6am chip, because that one chip means two different things
   depending on where you are standing:
     'sec2'  this row is on TOMORROW's banner, shown today because today's PM
             crew is prepping it  -> 🔜, forward-looking, work still to do
     default this row is on the day in view and delivers before 6am, so it was
             prepped the afternoon BEFORE -> 🔒, settled, not today's to move */
function ruleChipsHTML(r, mode){
  let out = '';
  if(mode==='sec2'){
    const day = r && r.date ? shortDateLabel(r.date) : 'tomorrow';
    out += '<span class="rchip b" title="'+esc('This load carries the '+(r.date||'next day')
      + ' date banner and delivers at '+(r.time||r.timeRaw||'a pre-6am time')+', before the origins reopen. '
      + 'It has to be on a trailer before they CLOSE this afternoon, so it is this afternoon\'s work — '
      + 'but its revenue books on '+(r.date||'the delivery day')+', not today.')
      + '">🔜 Preload for '+esc(day)+(r&&(r.time||r.timeRaw)?' · '+esc(r.time||r.timeRaw):'')+'</span>';
  }
  const c = cutoffState(r);
  if(c){
    const o = normOrigin(r.origin);
    const late = Math.abs(c.delta);
    if(c.k==='past'){
      /* v1.8.1: reframe. Time is delivery, not pickup. A delivery Time past
         the origin cutoff means this load has to be preloaded the afternoon
         before — prescriptive, not an error. Amber, not red. */
      out += '<span class="rchip a" title="'+esc(o+' closes at '+fmtMins(c.cut)+', but this delivery is booked for '+fmtMins(c.mins)
        + '. Live-loading is not possible — build this load onto a trailer this afternoon so it is ready to roll for the delivery.')
        + '">📦 needs preload</span>';
    } else {
      out += '<span class="rchip a" title="'+esc(o+' closes at '+fmtMins(c.cut)+'. This load is booked for '+fmtMins(c.mins)
        + ' — inside the '+CUTOFF_NEAR_MIN+'-minute band either side. It will be tight.')
        + '">⏰ near cutoff</span>';
    }
  }
  if(mode!=='sec2' && isPreloadLocked(r)){
    const prepped = r && r.date ? shortDateLabel(prevDayISO(r.date)) : '';
    out += '<span class="rchip b" title="'+esc('Delivers before 6am, so it was preloaded '
      + (prepped? prepped+' PM' : 'the afternoon before')+' — before the origins closed. '
      + 'Per the dispatch spec these rows are committed by that afternoon\'s list and do not change in the morning revision. '
      + 'The revenue is still this day\'s: the load delivers today.')
      + '">🔒 PRELOADED'+(prepped? ' · prepped '+esc(prepped)+' PM' : '')+'</span>';
  }
  const eq = equipmentFor(r);
  if(eq && eq===EQUIPMENT_CONSTRAINTS.superHopper){
    out += '<span class="rchip y" title="Chicken Meal / CBM RA runs on the super hopper — trailer #106. There is only one.">⬢ #106</span>';
  }
  /* v1.5 — measured, not inferred. These two only ever appear when a Verizon
     cluster backs them, so they read differently from the clock-based chips
     above: those are what the schedule implies, these are what the truck did. */
  const vz = verizonFor(r);
  if(vz){
    const thr = Number(state.settings.detentionThresholdMin)||60;
    if(vz.detentionMin > thr){
      out += '<span class="rchip r" title="'+esc('Sat '+Math.round(vz.detentionMin)+' min inside the '
        + (vz.diamondDp||'Diamond')+' geofence. Diamond averages 7m 27s on site, so this is dwell worth billing — '
        + 'detention bills at '+money(state.qbo.services[2] ? state.qbo.services[2].rate : 0)+'/hr excess.')
        + '">⏱ detention '+Math.round(vz.detentionMin)+'m</span>';
    }
    if(vz.isPreload && !isPreloadLocked(r)){
      out += '<span class="rchip b" title="GPS says this trip went yard → origin → back to the yard without ever entering a Diamond fence. That is a preload: the trailer was dropped for someone else to deliver.">🔒 preload (GPS)</span>';
    }
  }
  return out ? '<div class="rchips">'+out+'</div>' : '';
}

/* Why a row has no actuals, said plainly on the cell rather than left blank. */
function vzNoMatchWhy(r){
  const day = verizonDay(state.dayRollup.date);
  if(!day) return 'No Verizon timecard loaded for this day.';
  if(!r.driver) return 'No driver on this row yet — nothing to match a trip against.'
    + (r.driverRaw ? ' The sheet says "'+r.driverRaw+'", which did not match the roster.' : '');
  const any = day.clusters.some(c=>c.driver===r.driver);
  if(!any) return r.driver+' has no trips in this timecard. Either they were off, '
    + 'or Verizon logs them under a name the roster does not know — add an alias in Settings → Verizon actuals.';
  const origin = normOrigin(r.origin);
  const hit = day.clusters.some(c=>c.driver===r.driver && c.origins[origin]);
  if(!hit) return r.driver+' ran trips this day, but none of them passed through a '
    + (origin||'matching')+' geofence.';
  return 'Every '+(origin||'matching')+' trip '+r.driver+' ran this day was already claimed by another load on the sheet.';
}

/* Walk open rows in clock order and freeze each row's top picks. The Today
   sheet is grouped Lathrop then Ripon, which is NOT chronological — without
   this pass, a 9am Lathrop row would reserve someone before a 6am Ripon row.
   Queue already sorts; this keeps Today and Queue on the same walk. */
function precomputeSuggestions(rows){
  const open = (rows||[]).filter(isUnassigned).slice().sort((a,b)=>{
    const ta = apptMinutes(a && a.time), tb = apptMinutes(b && b.time);
    if(ta==null && tb==null) return 0;
    if(ta==null) return 1;
    if(tb==null) return -1;
    if(ta !== tb) return ta - tb;
    return String(a.id||'').localeCompare(String(b.id||''));
  });
  open.forEach(r => {
    __precomputedSuggestions.set(r.id, suggestDrivers(r, 3, {respectCap:true, reserve:true}));
  });
}
function picksForRow(r){
  if(r && r.id != null && __precomputedSuggestions.has(r.id)) return __precomputedSuggestions.get(r.id);
  return suggestDrivers(r, 3, {respectCap:true, reserve:true});
}

/* The Suggested-driver cell. Assigned rows say nothing — a suggestion for a
   load that already has a driver on it is noise, not help. */
function suggestCellHTML(r){
  if(!isUnassigned(r)) return '<span style="color:var(--text-faint)">—</span>';
  const top = picksForRow(r);
  if(!top.length) return '<span style="color:var(--text-faint)" title="All drivers hit 2-load cap or are inside cooldown window">—</span>';
  const best = top[0];
  return '<button type="button" class="sug-btn" data-sug="'+esc(r.id)+'" title="'+esc(best.why)+' — tap to assign, shift+click for alternatives">'
    + esc(best.short)
    + (best.overCap
        ? '<span class="sug-pill" style="background:#4a2b1a;color:#f0c988" title="Every eligible driver has 2 loads — this would be a 3rd. Click to override.">override · +1</span>'
        : best.known ? '<span class="sug-pill">suggested</span>'
                     : '<span class="sug-pill q" title="No history at this origin — roster fallback, not a pairing">? suggested</span>')
    + '</button>';
}

/* ---- Send dispatch (v1.8, Phase 3.2 groundwork) ----
   Drawn only on an unassigned Section-1 row, directly under the suggestion,
   because the message it would send goes to exactly that suggested driver —
   putting the button anywhere else would hide which driver is being texted.

   Three states, and the disabled ones say WHY rather than just greying out:
     no Twilio config          -> "Requires Twilio setup — Phase 3.2"
     configured, driver has no number -> names the driver and where to fix it
     configured + number       -> enabled, and still does not call Twilio.
                                  It composes, logs and shows the message.

   Nothing here touches the network. The real send lands in Phase 3.2. */
function smsButtonHTML(r){
  if(!isUnassigned(r)) return '';
  const top = picksForRow(r);
  if(!top.length) return '';
  const target = top[0];
  const ready  = smsConfigured();
  const phone  = driverPhone(target.name);

  let why, cls;
  if(!ready){
    why = 'Requires Twilio setup — Phase 3.2';
    cls = ' off';
  } else if(!phone){
    why = 'No phone number for ' + target.short + ' — add it in Settings → SMS Dispatch';
    cls = ' off';
  } else {
    why = 'Compose the dispatch text to ' + target.short + ' (' + phone + '). '
        + 'Preview only — no message is sent until Phase 3.2.';
    cls = '';
  }
  const enabled = ready && !!phone;
  return '<button type="button" class="sms-btn' + cls + '" data-sms="' + esc(r.id) + '"'
    + (enabled ? '' : ' disabled aria-disabled="true"')
    + ' title="' + esc(why) + '">✉ Send dispatch</button>';
}

/* Top-3 alternatives. A popover, not a modal: it is a peek at the reasoning,
   not a decision screen. Closes on the next tap anywhere. */
function closeSugPop(){

}
function openSugPop(btn, rowId){
  closeSugPop();

  pop.id = 'sugPop';

        + '<span class="sug-opt-n">'+(i+1)+'. '+esc(t.short)+(t.known?'':' <span style="color:var(--text-faint)">?</span>')+'</span>'
        + '<span class="sug-opt-w">'+esc(t.why)+'</span></button>').join('')
    + '<div class="sug-pop-f">Tap a driver to record the assignment. SMS goes out in Phase 3.2 — nothing is sent today.</div>';
  document.body.appendChild(pop);
  const b = btn.getBoundingClientRect();
  const w = Math.min(280, window.innerWidth-20);
  pop.style.width = w+'px';
  pop.style.left = Math.max(10, Math.min(window.innerWidth-w-10, b.left))+'px';
  const below = b.bottom + 6;

  pop.style.top = (below + pop.offsetHeight > window.innerHeight-10)
    ? Math.max(10, b.top - pop.offsetHeight - 6)+'px' : below+'px';
  pop.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    assignDriver(el.dataset.row, el.dataset.pick, true);
    closeSugPop();
  }));
}
/* One place that knows where a row lives — the day in view and the parsed
   import hold separate copies of the same record. */
function findRowById(id){
  return state.dayRollup.currentRows.find(x=>x.id===id)
      || ((state.dayRollup.lastImport&&state.dayRollup.lastImport.rows)||[]).find(x=>x.id===id)
      || null;
}
/* Record an assignment. This is the Phase 3.0 seam: today it writes the
   driver onto the row, flips the status to DISPATCHED and logs the decision.
   Phase 3.2 hangs the SMS off exactly this call. */
function assignDriver(rowId, driverName, wasSuggested){
  const rows = [state.dayRollup.currentRows.find(x=>x.id===rowId),
                ((state.dayRollup.lastImport&&state.dayRollup.lastImport.rows)||[]).find(x=>x.id===rowId)]
               .filter(Boolean);
  if(!rows.length){ toast('That load is no longer in view'); return; }
  const r0 = rows[0];
  // v1.8.34: capture the algo's top-3 at moment of assignment so we can
  // score agreement rate and mine drift patterns against James's picks.
  // Snapshot the recommendations BEFORE writing the driver onto the row so
  // the cap/cooldown gates see the pre-assignment state.
  let top3 = [];
  try {
    top3 = suggestDrivers(r0, 3, {respectCap:true}).map(t=>({
      name: t.name, short: t.short, score: t.score,
      known: !!t.known, confirmed: !!t.confirmed, fits: !!t.fits,
      shiftCls: t.shiftCls || null, why: t.why || ''
    }));
  } catch(e){ top3 = []; }
  const pickedIdx = top3.findIndex(t=>t.name===driverName);
  const diverged = top3[0] ? (top3[0].name !== driverName) : null;
  // v1.8.34b: when the pick disagrees with the algo's top-1, ask WHY.
  // The note is the tuning signal — every override with a reason lets us
  // learn what the algo missed. Optional (Cancel skips), never blocks.
  let note = '';
  if(diverged && top3[0]){
    const askShort = shortNameFor(driverName);
    const algoShort = shortNameFor(top3[0].name);
    const prompt_ = 'Why '+askShort+' instead of '+algoShort+'?\n(Optional — press Cancel to skip)';
    const resp = window.prompt(prompt_, '');
    if(resp && resp.trim()) note = resp.trim();
  }
  rows.forEach(r=>{ r.driver = driverName; r.driverRaw = shortNameFor(driverName); r.status = 'DISPATCHED'; });
  state.dispatchOps.assignments[rowId] = {
    driver: driverName, at: new Date().toISOString(), date: r0.date||'',
    po: r0.po||'', origin: r0.origin||'', dest: r0.destName || r0.destination || '',
    time: r0.time||'', commodity: r0.commodity || r0.product || '',
    trailer: r0.trailer || '', customer: r0.customer || '',
    suggested: !!wasSuggested,
    top3: top3,
    pickedRank: pickedIdx >= 0 ? pickedIdx+1 : null,   // 1/2/3 if in top-3, null if off-list
    algoPickWas: top3[0] ? top3[0].name : null,
    diverged: diverged,
    note: note,
  };
  invalidateVerizonMatch();   // a newly-named driver can now claim a trip
  saveDayImport();
  renderDayRollup();          // re-renders the Queue on its way out
  toast(shortNameFor(driverName)+' assigned — recorded, no SMS sent');
}
// v1.8.34b: after-the-fact note editor — click any assignment row to add or
// change the "why" without having to re-dispatch. Notes are the drift-tuning
// signal, so making them easy to add later matters.
function editAssignmentNote(rowId){
  const A = state.dispatchOps.assignments || {};
  const a = A[rowId]; if(!a) return;
  const current = a.note || '';
  const resp = window.prompt('Note for this dispatch (why you picked '+shortNameFor(a.driver)+'):', current);
  if(resp === null) return;   // Cancel
  a.note = resp.trim();
  save(); renderQueue(); toast('Note saved');
}

const DAY_HOST = '#dayHost';

/* Which alert chip is expanded, if any. Module-level rather than in state:
   it is view position, not data, and persisting it would mean an alert you
   read yesterday is still open tomorrow. */
let alertOpen = '';
/* Cached so the click handler and the render agree on the same list without
   recomputing it — dayAlerts() walks every row and calls verizonFor(). */
let dayAlertList = [];

function alertsStripHTML(dateISO){
  dayAlertList = dayAlerts(dateISO);
  if(!dayAlertList.length){
    return '<div class="card alert-strip"><div class="al-quiet">✓ All quiet — deliveries on track'
      + '<span>no cutoff breaches, nothing unassigned, no measured detention</span></div></div>';
  }
  /* Highest severity first, so the thing that can actually stop a truck is
     the leftmost chip. Ties keep dayAlerts()' own order, which is already
     ordered by how soon it has to be dealt with. */
  const rank = { r:0, a:1, b:2 };
  const list = dayAlertList.map((a,i)=>({a:a, i:i}))
    .sort((x,y)=> (rank[x.a.sev]-rank[y.a.sev]) || (x.i-y.i));

  const open = list.find(x=>x.a.k === alertOpen);
  let h = '<div class="card alert-strip"><div class="alert-row">'
    + '<span class="al-lab">Now</span>';
  list.forEach(x=>{
    h += '<button type="button" class="al-chip ' + x.a.sev + '" data-alert="' + esc(x.a.k) + '" '
      + 'aria-expanded="' + (x.a.k === alertOpen ? 'true' : 'false') + '" '
      + 'title="' + esc(x.a.detail) + '">' + x.a.icon + ' ' + esc(x.a.title) + '</button>';
  });
  h += '</div>';
  if(open){
    const a = open.a;
    h += '<div class="al-detail ' + a.sev + '">' + a.detail;
    h += '<div class="al-act">';
    if(a.rows && a.rows.length)
      h += '<button type="button" data-aljump="' + esc(a.k) + '">Show the '
         + a.rows.length + ' row' + (a.rows.length===1?'':'s') + ' ↓</button>';
    if(a.jump && !(a.rows && a.rows.length))
      h += '<button type="button" data-aljump="' + esc(a.k) + '">Show me ↓</button>';
    if(a.tab)
      h += '<button type="button" data-altab="' + esc(a.tab) + '">Open ' + esc(a.tab === 'info' ? 'Info' : a.tab) + ' →</button>';
    if(a.ack != null)
      h += '<button type="button" data-alack="' + esc(String(a.ack)) + '">Acknowledge</button>';
    h += '</div></div>';
  }
  return h + '</div>';
}

/* =============================================================
   v2.1.22 (2026-08-21) Landing header strip
   -------------------------------------------------------------
   Five live tiles on the today-view — Today's Revenue, Fuel Actual,
   Fleet Calibration, Trucks Reporting, Today's Contribution — plus a
   manual refresh + auto-refresh every 10 min. This is what James looks
   at first thing; before v2.1.22 the same data lived under Info /
   Settings tabs and was never surfaced on the primary view.

   All five tiles compute at render time from state:
     - Revenue + Contribution     ← computeDay().totals (driver+FB books;
                                     v2.1.45 dayRowBooksRevenue(). Active count
                                     is separate — missing driver or FB stay
                                     on the PLAN line, not in the $)
     - Fuel actual                ← state.verizonMilesToday.fleetMiles × fuelPerMile()
       + estimated                  sum(laneMilesFor / fallback avg) × fuelPerMile()
     - Calibration                ← state.laneCalibration.fleetFactor
     - Trucks reporting           ← state.verizonMilesToday.trucksReporting
                                     (fallback: derive from perVehicle map)
   Nothing stored, nothing sent to the worker — everything is a pure
   read of state slots the /miles-real, /calibration and dispatch import
   already populate on boot + timer.
   ============================================================= */
function landingStripHTML(){
  const s = state.settings;
  const dToday = (typeof computeDay === 'function') ? computeDay() : null;
  const v = state.verizonMilesToday || {};
  const lc = state.laneCalibration || {};
  const fpm = fuelPerMile();

  // ---- Tile 1: Today's revenue (driver + freight bill) ----
  const rev = dToday ? dToday.totals.revenue : 0;
  const revLoads = dToday ? dToday.totals.loads : 0;
  const activeLoads = dToday ? (dToday.totals.activeLoads!=null ? dToday.totals.activeLoads : (dToday.activeLoads||revLoads)) : 0;
  const planLoads = dToday ? (dToday.totals.planLoads||0) : 0;
  const planRev = dToday ? (dToday.totals.planRevenue||0) : 0;
  const revSub = activeLoads
    ? (revLoads + ' booked · ' + activeLoads + ' planned'
       + (planLoads ? ' · plan ' + money(planRev) + ' not in books' : ''))
    : 'no planned loads';

  // ---- Tile 2: Fuel actual vs estimate ----
  // Estimate = sum of laneMilesFor(origin, destination) over today's active
  // rows × fuelPerMile(). Falls back to avgMilesPerLoad for rows without a
  // lane match — matches the model in verizonFuelCompareHTML() so the
  // numbers here can't drift from the Info-tab compare panel.
  let calcMi = 0;
  try {
    const rows = (state.dayRollup && state.dayRollup.currentRows) || [];
    const active = rows.filter(r => {
      try { return typeof dayRowActive === 'function' ? dayRowActive(r) : true; }
      catch(_){ return true; }
    });
    active.forEach(r => {
      let lm = 0;
      try { lm = laneMilesFor(r.origin, r.deliveryPoint || r.destination); }
      catch(_){ lm = 0; }
      calcMi += (lm > 0) ? lm : (Number(s.avgMilesPerLoad)||0);
    });
  } catch(_){}
  const fuelEst    = calcMi * fpm;
  const fuelActual = (Number(v.fleetMiles)||0) * fpm;
  const fuelHasActual = v.ok && Number(v.fleetMiles) > 0;
  const fuelGapPct = (fuelHasActual && fuelEst > 0)
    ? ((fuelActual - fuelEst) / fuelEst) * 100 : 0;
  let fuelColor = '', fuelSub = '';
  if(fuelHasActual){
    // Green when actual ≤ estimate, yellow +5–15%, red >15%.
    fuelColor = fuelGapPct <= 0 ? 'g' : fuelGapPct > 15 ? 'r' : fuelGapPct > 5 ? 'y' : '';
    const sign = fuelGapPct >= 0 ? '+' : '';
    fuelSub = 'est ' + money(fuelEst) + ' (' + sign + fuelGapPct.toFixed(0) + '%)';
  } else {
    fuelSub = 'est ' + money(fuelEst) + ' · actual pending';
  }
  const fuelBig = fuelHasActual ? money(fuelActual) : money(fuelEst);
  const fuelLabel = fuelHasActual ? 'FUEL · ACTUAL' : 'FUEL · EST';
  const fuelTitle = fuelHasActual
    ? 'Verizon '+(v.source==='real'?'real odo':'GPS estimate')+' — '
      + num(v.fleetMiles) + ' fleet mi × ' + money2(fpm) + '/mi ('
      + fuelBasisText() + '). Estimate from LANE_MILES × today\'s '
      + activeLoads + ' active load'
      + (activeLoads===1?'':'s') + '.'
    : 'Estimated fuel from LANE_MILES × today\'s active loads × '
      + money2(fpm) + '/mi. Actual Verizon miles will replace this once /miles-real returns non-zero.';

  // ---- Tile 3: Fleet calibration ----
  const ff = Number(lc.fleetFactor);
  const calValid = lc.ok && isFinite(ff) && ff > 0;
  const calFactor = calValid ? ff : 1.0;
  // Matches the per-load pill's color band: green ≤1.10, yellow 1.10–1.25, red >1.25
  const absDev = Math.abs(calFactor - 1.0);
  let calColor = '';
  if(!calValid){
    calColor = '';
  } else if(absDev <= 0.05){
    calColor = 'g';
  } else if(absDev <= 0.15){
    calColor = 'y';
  } else if(absDev <= 0.25){
    calColor = 'a';
  } else {
    calColor = 'r';
  }
  const calArrow = !calValid ? '' : calFactor > 1.02 ? '↑' : calFactor < 0.98 ? '↓' : '·';
  const calBig = calValid ? (calArrow + calFactor.toFixed(2) + '×') : '—';
  const calSub = calValid
    ? (lc.windowDays || 7) + '-day window'
    : (lc.error ? 'unavailable' : 'awaiting data');
  const calTitle = calValid
    ? (lc.windowDays || 7) + '-day rolling actual/predicted from /calibration. '
      + 'Updates hourly + on every dispatch push. computedAt '
      + (lc.computedAt || '—')
      + (lc.coverage ? ' · ' + Math.round(lc.coverage.fleetActualMi) + ' actual mi / '
                              + Math.round(lc.coverage.fleetPredictedMi) + ' predicted mi'
                              + ' across ' + (lc.coverage.daysUsed || 0) + ' day'
                              + ((lc.coverage.daysUsed||0)===1?'':'s') : '')
    : (lc.error ? 'Calibration endpoint error: ' + lc.error
                : 'Waiting for the first /calibration response.');

  // ---- Tile 4: Trucks reporting ----
  // Prefer the worker's trucksReporting count; fall back to counting
  // perVehicle entries with miles > 0 if the field is absent.
  let reporting = null, totalTrucks = null, silent = [];
  if(v.perVehicle && typeof v.perVehicle === 'object'){
    const entries = Object.entries(v.perVehicle);
    totalTrucks = entries.length;
    reporting = (v.trucksReporting != null)
      ? v.trucksReporting
      : entries.filter(([k,mi]) => Number(mi) > 0).length;
    silent = entries.filter(([k,mi]) => !(Number(mi) > 0)).map(([k]) => k);
  } else if(v.trucksReporting != null){
    reporting = v.trucksReporting;
    // Total unknown; use the live-fleet count if available.
    const vl = state.verizonLive;
    totalTrucks = (vl && Array.isArray(vl.vehicles)) ? vl.vehicles.length : reporting;
  }
  const truckBig = (reporting != null && totalTrucks != null)
    ? reporting + '/' + totalTrucks : '—';
  const truckColor = (reporting == null || totalTrucks == null) ? ''
    : (reporting/totalTrucks >= 0.85) ? 'g'
    : (reporting/totalTrucks >= 0.65) ? 'y'
    : 'r';
  const truckSub = (reporting != null)
    ? (silent.length ? silent.length + ' silent' : 'all reporting')
    : 'awaiting data';
  const truckTitle = silent.length
    ? 'Trucks not reporting mileage today: ' + silent.join(', ')
      + '. Click to expand full list.'
    : (reporting != null)
      ? 'All ' + totalTrucks + ' Verizon-tracked vehicles reported miles today.'
      : 'Waiting for the first /miles-real response.';

  // ---- Tile 5: Today's contribution ----
  // Contribution = revenue − variable cost, summed over booked rows
  // (v2.1.45 driver+FB). Active board count is shown next to it; missing
  // driver or FB do not hit the dollars. computeDay().totals.cm is authoritative.
  const cmLive = dToday ? dToday.totals.cm : 0;
  const estHold = (typeof estChipView==='function')
    ? estChipView({ cm: cmLive, dayNet: dToday ? dToday.net : null,
                    daySrc: dToday && dToday.totals && dToday.totals.varSource })
    : { pending:false, cm: cmLive };
  const cm = estHold.pending ? 0 : (estHold.cm!=null ? estHold.cm : cmLive);
  const cmPending = !!estHold.pending;
  const cmColor = cmPending ? '' : (cm > 0 ? 'g' : cm < 0 ? 'r' : '');
  const cmAdp = dToday && dToday.totals.varSource==='ADP';
  const cmSub = cmPending
    ? 'settling estimates…'
    : activeLoads
      ? revLoads + ' booked · ' + activeLoads + ' planned · ' + money(dToday.totals.varCost) + ' var'
        + (cmAdp ? ' · ADP' : ' · EST')
      : 'no planned loads';
  const cmLab = cmAdp ? "CONTRIBUTION · ADP" : "CONTRIBUTION · EST";

  const stampMs = v.fetchedAt ? Date.parse(v.fetchedAt) : 0;
  const stampAge = stampMs ? Math.max(0, Math.floor((Date.now()-stampMs)/60000)) : null;
  const stampTxt = stampAge == null ? 'never refreshed'
    : stampAge === 0 ? 'refreshed just now'
    : 'refreshed ' + stampAge + 'm ago';

  /* v2.1.23: every tile is drill-in capable — data-tile carries the id
     the click handler dispatches on. clickable="0" opts a tile out
     (e.g. calibration when there's no data yet). */
  const tile = (big, lab, sub, opts) => {
    opts = opts || {};
    const drill = opts.drill || '';
    const clickable = opts.clickable === false ? '0' : '1';
    return '<div class="ls-tile"'
      + ' data-clickable="' + clickable + '"'
      + (drill ? ' data-tile="' + esc(drill) + '"' : '')
      + (opts.id ? ' id="'+opts.id+'"' : '')
      + (opts.title ? ' title="'+esc(opts.title)+'"' : '') + '>'
      + '<div class="ls-num' + (opts.numClass ? ' ' + opts.numClass : '') + '">' + big + '</div>'
      + '<div class="ls-lab">' + lab + '</div>'
      + (sub ? '<div class="ls-sub' + (opts.subClass ? ' ' + opts.subClass : '') + '">' + sub + '</div>' : '')
      + '</div>';
  };

  return '<div class="land-strip" id="landStrip">'
    + '<div class="land-strip-row">'
    + tile(moneyResponsive(rev), "TODAY'S REVENUE", revSub,
           { drill: 'revenue', id: 'lsRevenue',
             title: dToday ? ('Books (driver name AND freight bill): '+money(rev)+' across '+revLoads
             + ' booked load'+(revLoads===1?'':'s')+'. '
             + activeLoads+' planned on the board'
             + (planLoads ? ' · projection '+money(planRev)+' is NOT in this number (no driver or no FB).' : '.')
             + ' Matches the P&L board.') : '' })
    + tile(fuelHasActual ? moneyResponsive(fuelActual) : moneyResponsive(fuelEst),
           fuelLabel, fuelSub,
           { drill: 'fuel', id: 'lsFuel', numClass: fuelColor, subClass: fuelColor, title: fuelTitle })
    + tile(calBig, 'CALIBRATION', calSub,
           { drill: 'calibration', id: 'lsCal', numClass: calColor, title: calTitle,
             clickable: calValid || !!lc.error })
    + tile(truckBig, 'TRUCKS REPORTING', truckSub,
           { drill: 'trucks', numClass: truckColor, title: truckTitle, id: 'lsTrucks' })
    + tile(cmPending ? '…' : moneyResponsive(cm), cmLab, cmSub,
           { drill: 'contribution', id: 'lsCM', numClass: cmColor,
           title: cmPending ? 'Waiting for calibration / ADP / Verizon miles so EST does not jump.'
             : dToday ? ('Revenue − variable cost across today\'s '
             + revLoads + ' booked load'+(revLoads===1?'':'s')
             + ' ('+activeLoads+' planned; no driver or no FB not in this $)'
             + (dToday.totals.varSource==='ADP'
                ? ('. Driver wages from ADP '+money(dToday.totals.driverCost)+' / '+num(dToday.totals.hours,1)+' hr (field drivers). Modelled driver was '+money(dToday.totals.estDriverCost)+'.')
                : dToday.totals.adpHeld
                  ? '. Today is still open — ADP on file is a partial clock, not the P&L. Driver wages stay hours × loaded $/hr. Re-drop after close to use ADP for today.'
                  : '. Driver wages estimated (hours × loaded $/hr). Drop ADP Daily Totals to replace closed days.')
             + ' Fixed nut ('
             + money(dToday.fixedTotal) + ') is applied at day-close; net so far = '
             + money(dToday.net) + '.') : '' })
    + '</div>'
    + '<div class="land-strip-foot">'
    + '<span class="ls-stamp" title="Auto-refresh runs every 10 min while the page is visible.">'
    + esc(stampTxt) + (v.source ? ' · ' + esc(v.source==='real'?'real odo':'gps est') : '') + '</span>'
    + '<button type="button" class="ls-refresh" id="lsRefresh" title="Re-pull /miles-real, /calibration and /latest in parallel">↻ Refresh</button>'
    + '</div>'
    + '</div>';
}

/* =============================================================
   v2.1.23 (2026-08-21) Landing-tile drill-in modal
   -------------------------------------------------------------
   Every landing tile now opens a bottom-sheet modal with the
   breakdown that used to require jumping to Info / Settings.
     revenue      → today's revenue split by customer bucket
     fuel         → calc vs actual + 7-day mini bar chart
     calibration  → fleet factor + windowDays + per-lane hint
     trucks       → silent trucks + last-known positions
     contribution → biggest and worst-margin loads today
   One modal system, dispatched off data-tile attribute.
   ============================================================= */

function openLsModal(title, bodyHTML){
  // Clean up any previous modal first — a fast double-tap or a re-render
  // during animation should never leave two overlays stacked. Remove
  // SYNCHRONOUSLY here (closeLsModal's 220ms fade-out timer would leave
  // stale elements with the same IDs in the DOM until the timer fired,
  // and getElementById would then return the OLD one when opening a
  // different drill in quick succession).
  const oldM = document.getElementById('lsModal');
  const oldB = document.getElementById('lsModalBack');
  if(oldM) oldM.remove();
  if(oldB) oldB.remove();
  const back = document.createElement('div');
  back.className = 'ls-modal-back';
  back.id = 'lsModalBack';
  const modal = document.createElement('div');
  modal.className = 'ls-modal';
  modal.id = 'lsModal';
  modal.innerHTML = '<div class="ls-modal-h"><h3>' + esc(title) + '</h3>'
    + '<button type="button" class="ls-modal-x" id="lsModalX" aria-label="Close">×</button></div>'
    + '<div class="ls-modal-body">' + bodyHTML + '</div>';
  document.body.appendChild(back);
  document.body.appendChild(modal);
  // Trigger transitions on the next paint so the on-class animates in.
  requestAnimationFrame(() => { back.classList.add('on'); modal.classList.add('on'); });
  back.addEventListener('click', closeLsModal);
  modal.querySelector('#lsModalX').addEventListener('click', closeLsModal);
  // ESC dismisses too — a11y courtesy.
  const escHandler = (e) => { if(e.key === 'Escape'){ closeLsModal(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

function closeLsModal(){
  const m = document.getElementById('lsModal');
  const b = document.getElementById('lsModalBack');
  if(!m && !b) return;
  if(m){ m.classList.remove('on'); }
  if(b){ b.classList.remove('on'); }
  setTimeout(() => { if(m) m.remove(); if(b) b.remove(); }, 220);
}

/* Group today's active rows by classified bucket and (for Diamond) by tier.
   Returns [{label, revenue, count}]. */
function revenueByBucketToday(){
  const d = state.dayRollup;
  if(!d || !d.currentRows) return [];
  const rows = d.currentRows.map(computeDayRow).filter(r => r.booked);
  const groups = {};
  rows.forEach(r => {
    const key = r.bucket === 'diamond'
      ? ('Diamond · ' + (r.tier || 'standard'))
      : (r.custLabel || (r.bucket ? (r.bucket.charAt(0).toUpperCase() + r.bucket.slice(1)) : 'Unclassified'));
    if(!groups[key]) groups[key] = { label:key, revenue:0, count:0, varCost:0, cm:0 };
    groups[key].revenue += r.revenue;
    groups[key].varCost += r.varCost;
    groups[key].cm      += r.cm;
    groups[key].count   += 1;
  });
  return Object.values(groups).sort((a,b) => b.revenue - a.revenue);
}

function drillRevenueBody(){
  const dToday = computeDay();
  const activeN = dToday ? (dToday.totals.activeLoads!=null ? dToday.totals.activeLoads : (dToday.activeLoads||0)) : 0;
  const doneN = dToday ? dToday.totals.loads : 0;
  if(!dToday || !activeN){
    return '<p style="color:var(--text-muted)">No active loads today yet.</p>';
  }
  if(!doneN){
    return '<p style="color:var(--text-muted)">'+activeN+' planned load'+(activeN===1?'':'s')+' on the board, <b>none in the books</b>. '
      + 'Today\'s REV is $0 until a load has a driver name AND a freight bill. '
      + ((dToday.totals.planLoads||0) ? 'Projection '+money(dToday.totals.planRevenue)+' is the plan, not books.' : '')+'</p>';
  }
  const groups = revenueByBucketToday();
  const total = dToday.totals.revenue;
  let h = '<div class="row" style="font-weight:700;border-bottom:1px solid var(--border-strong)">'
        + '<div class="k" style="color:var(--text)">Bucket / customer</div>'
        + '<div class="v">Loads · Revenue</div></div>';
  groups.forEach(g => {
    const pctS = total > 0 ? (' · ' + Math.round(g.revenue/total*100) + '%') : '';
    h += '<div class="row"><div class="k">' + esc(g.label) + '</div>'
       + '<div class="v">' + g.count + '&nbsp;·&nbsp;' + money(g.revenue) + pctS + '</div></div>';
  });
  h += '<div class="row" style="font-weight:700;border-top:1px solid var(--border-strong);margin-top:6px">'
     + '<div class="k" style="color:var(--text)">Total</div>'
     + '<div class="v">' + dToday.totals.loads + '&nbsp;·&nbsp;' + money(total) + '</div></div>';
  h += '<div class="sub">Completed loads only ('+doneN+' of '+activeN+' active). Contribution: ' + money(dToday.totals.cm)
     + ' · Variable cost: ' + money(dToday.totals.varCost)
     + '. Fixed nut ' + money(dToday.fixedTotal) + ' at day-close → net ' + money(dToday.net) + '.</div>';
  return h;
}

/* Pull the last 7 days of fleet miles + fuel actual for a mini bar chart.
   Reads state.milesHistory (populated by the /miles-real snapshot writer).
   Falls back to a no-data note if the array is empty. */
function drillFuelBody(){
  const v = state.verizonMilesToday || {};
  const fpm = fuelPerMile();
  const dToday = computeDay();
  // ---- Today's calc vs actual ----
  let calcMi = 0;
  try {
    const rows = (state.dayRollup && state.dayRollup.currentRows) || [];
    const active = rows.filter(r => { try { return dayRowActive(r); } catch(_){ return true; } });
    active.forEach(r => {
      let lm = 0;
      try { lm = laneMilesFor(r.origin, r.deliveryPoint || r.destination); } catch(_){ lm = 0; }
      calcMi += (lm > 0) ? lm : (Number(state.settings.avgMilesPerLoad)||0);
    });
  } catch(_){}
  const fuelEst = calcMi * fpm;
  const fuelActual = (Number(v.fleetMiles)||0) * fpm;
  const hasActual = v.ok && Number(v.fleetMiles) > 0;
  const delta = fuelActual - fuelEst;
  const pctDelta = fuelEst > 0 ? (delta/fuelEst*100) : 0;
  let h = '<h4>Today</h4>';
  h += '<div class="row"><div class="k">Calc (LANE_MILES × ' + money2(fpm) + '/mi)</div>'
     + '<div class="v">' + money(fuelEst) + ' <span style="color:var(--text-faint);font-size:11px">('
     + num(calcMi,0) + ' mi)</span></div></div>';
  if(hasActual){
    h += '<div class="row"><div class="k">Actual (Verizon '
       + (v.source==='real'?'odo':'GPS') + ')</div>'
       + '<div class="v">' + money(fuelActual) + ' <span style="color:var(--text-faint);font-size:11px">('
       + num(v.fleetMiles,0) + ' mi)</span></div></div>';
    const deltaColor = delta > 0 ? 'var(--red)' : 'var(--green)';
    h += '<div class="row" style="font-weight:700"><div class="k" style="color:var(--text)">Delta</div>'
       + '<div class="v" style="color:' + deltaColor + '">'
       + (delta >= 0 ? '+' : '') + money(delta) + ' (' + (pctDelta>=0?'+':'')
       + pctDelta.toFixed(1) + '%)</div></div>';
  } else {
    h += '<div class="row"><div class="k">Actual</div>'
       + '<div class="v" style="color:var(--text-faint)">pending — no Verizon data yet</div></div>';
  }
  // ---- 7-day sparkline from state.milesHistory ----
  const hist = (state.milesHistory && Array.isArray(state.milesHistory))
    ? state.milesHistory.slice(-7) : [];
  h += '<h4>Last 7 days · fuel actual</h4>';
  if(hist.length){
    const max = Math.max.apply(null, hist.map(x => Number(x.fleetMiles)*fpm || 0)) || 1;
    h += '<div class="ls-bars">';
    hist.forEach((x,i) => {
      const val = (Number(x.fleetMiles)||0) * fpm;
      const pctH = Math.max(2, Math.round(val/max*100));
      const isToday = i === hist.length - 1;
      const dayLabel = (x.date||'').slice(5); // MM-DD
      h += '<div class="bar' + (isToday?' today':'') + '" style="height:' + pctH + '%">'
        + '<div class="val">' + moneyCompact(val) + '</div>'
        + '<div class="lab">' + esc(dayLabel) + '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<p style="color:var(--text-faint);font-size:11px">7-day history not yet captured — snapshot writer starts on next /miles-real save.</p>';
  }
  h += '<div class="sub">Basis: ' + esc(fuelBasisText()) + '. Diesel × fleet MPG configured in Settings.</div>';
  return h;
}

function drillCalibrationBody(){
  const lc = state.laneCalibration || {};
  if(!lc.ok){
    return '<p style="color:var(--text-muted)">Calibration endpoint has not returned a valid response yet.'
         + (lc.error ? '<br><br><span style="color:var(--red);font-family:var(--mono);font-size:11px">Error: ' + esc(lc.error) + '</span>' : '')
         + '</p>';
  }
  const ff = Number(lc.fleetFactor)||1;
  let h = '<h4>Fleet</h4>';
  h += '<div class="row"><div class="k">Fleet factor</div>'
     + '<div class="v">' + ff.toFixed(3) + '×</div></div>';
  h += '<div class="row"><div class="k">Rolling window</div>'
     + '<div class="v">' + (lc.windowDays || 7) + ' day' + ((lc.windowDays||7)===1?'':'s') + '</div></div>';
  if(lc.coverage){
    h += '<div class="row"><div class="k">Actual fleet miles</div>'
       + '<div class="v">' + num(lc.coverage.fleetActualMi,0) + ' mi</div></div>';
    h += '<div class="row"><div class="k">Predicted fleet miles</div>'
       + '<div class="v">' + num(lc.coverage.fleetPredictedMi,0) + ' mi</div></div>';
    h += '<div class="row"><div class="k">Days sampled</div>'
       + '<div class="v">' + (lc.coverage.daysUsed || 0) + '</div></div>';
  }
  h += '<div class="row"><div class="k">Computed at</div>'
     + '<div class="v" style="font-size:11px;color:var(--text-faint)">' + esc(lc.computedAt || '—') + '</div></div>';
  // Per-lane details when the worker publishes them
  const laneEntries = lc.lanes ? Object.entries(lc.lanes) : [];
  if(laneEntries.length){
    h += '<h4>Per-lane factors</h4>';
    laneEntries.sort((a,b) => (b[1].loadsInWindow||0) - (a[1].loadsInWindow||0)).slice(0,10)
      .forEach(([k,v]) => {
        h += '<div class="row"><div class="k">' + esc(k) + '</div>'
           + '<div class="v">' + Number(v.factor).toFixed(2) + '× · '
           + (v.loadsInWindow||0) + ' loads</div></div>';
      });
    h += '<div class="sub">Per-lane factor requires ≥5 loads in the calibration window. '
       + 'A truck-ID coverage fix is pending — small-sample lanes still fall back to the fleet factor.</div>';
  } else {
    h += '<div class="sub">Per-lane detail not yet published by the worker (waiting on the truck-ID coverage fix). '
       + 'Every load falls back to the fleet factor above.</div>';
  }
  return h;
}

function drillTrucksBody(){
  const v = state.verizonMilesToday || {};
  const vl = state.verizonLive || {};
  const pv = v.perVehicle || {};
  const entries = Object.entries(pv);
  if(!entries.length){
    return '<p style="color:var(--text-muted)">Per-vehicle mileage not yet reported by /miles-real.</p>';
  }
  const silent = entries.filter(([k,mi]) => !(Number(mi) > 0));
  const reporting = entries.filter(([k,mi]) => Number(mi) > 0)
                      .sort((a,b) => Number(b[1]) - Number(a[1]));
  // Build a lookup of Verizon Live positions for silent trucks
  const positions = {};
  if(vl && Array.isArray(vl.vehicles)){
    vl.vehicles.forEach(x => {
      const id = String(x.number||x.name||x.id||'').replace(/^#/,'');
      positions[id] = x;
    });
  }
  let h = '<h4>Silent — ' + silent.length + ' truck' + (silent.length===1?'':'s') + '</h4>';
  if(silent.length){
    silent.forEach(([id]) => {
      const pos = positions[String(id).replace(/^#/,'')];
      const loc = pos ? (pos.address || pos.city || (pos.lat && pos.lng ? (Number(pos.lat).toFixed(3)+','+Number(pos.lng).toFixed(3)) : '—')) : 'no live position';
      const upd = pos && pos.updatedAt ? new Date(pos.updatedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '—';
      h += '<div class="row"><div class="k">#' + esc(id) + '</div>'
         + '<div class="v" style="font-size:11px;text-align:right">' + esc(loc) + '<br>'
         + '<span style="color:var(--text-faint)">last update ' + esc(upd) + '</span></div></div>';
    });
  } else {
    h += '<p style="color:var(--green);font-size:12px;margin:6px 0">All trucks reporting.</p>';
  }
  h += '<h4>Reporting — ' + reporting.length + ' truck' + (reporting.length===1?'':'s') + '</h4>';
  reporting.slice(0,20).forEach(([id,mi]) => {
    h += '<div class="row"><div class="k">#' + esc(id) + '</div>'
       + '<div class="v">' + num(Number(mi),0) + ' mi</div></div>';
  });
  if(reporting.length > 20){
    h += '<div class="sub">Top 20 shown; ' + (reporting.length-20) + ' more truck(s) also reporting.</div>';
  }
  return h;
}

function drillContributionBody(){
  const dToday = computeDay();
  const activeN = dToday ? (dToday.totals.activeLoads!=null ? dToday.totals.activeLoads : 0) : 0;
  if(!dToday || !activeN){
    return '<p style="color:var(--text-muted)">No active loads today yet.</p>';
  }
  if(!dToday.totals.loads){
    return '<p style="color:var(--text-muted)">'+activeN+' planned on the board, none in the books — contribution is $0 until a load has a driver + freight bill.'
      + ((dToday.totals.planLoads||0) ? ' Plan '+money(dToday.totals.planRevenue)+' is projection only.' : '')+'</p>';
  }
  const rows = state.dayRollup.currentRows.map(computeDayRow).filter(r => r.booked);
  const ranked = rows.slice().sort((a,b) => b.cm - a.cm);
  const top = ranked.slice(0,5);
  const bot = ranked.slice().reverse().slice(0,5);
  const rowLine = (r) => {
    const label = (r.customer || r.custLabel || r.bucket || '?') + ' · ' + (r.driver||'—');
    return '<div class="row"><div class="k">' + esc(label) + '</div>'
      + '<div class="v" style="color:' + (r.cm>=0?'var(--green)':'var(--red)') + '">'
      + (r.cm>=0?'+':'') + money(r.cm) + '</div></div>';
  };
  let h = '<h4>Top ' + top.length + ' — best contribution</h4>';
  top.forEach(r => { h += rowLine(r); });
  h += '<h4>Bottom ' + bot.length + ' — worst contribution</h4>';
  bot.forEach(r => { h += rowLine(r); });
  h += '<div class="sub">Contribution = revenue − variable (fuel + driver + wear). '
     + 'Fixed nut ' + money(dToday.fixedTotal) + ' allocated at day-close.</div>';
  return h;
}

/* =============================================================
   v2.1.23 Missing-rates scanner  ·  v2.1.29 fill-in editor
   -------------------------------------------------------------
   Walks today's active rows and flags any that priced off a
   fallback ("no lane match" / "placeholder — no verified rate").
   Groups by origin→destination so a single lane with 6 loads
   surfaces as one row, not six. Rendered as an amber alert card
   on the landing view; tap to FILL the rates (saved on
   state.laneRateOverrides). Do not edit POC_LANE_RATES for this.
   ============================================================= */
function scanMissingRates(){
  const d = state.dayRollup;
  if(!d || !d.currentRows) return [];
  const rows = d.currentRows.map(computeDayRow).filter(r => r.active);
  const gaps = {};
  rows.forEach((r, idx) => {
    const basis = String(r.rateBasis||'');
    const isFallback = r.rateEst && (
         /no lane match/i.test(basis)
      || /placeholder — no verified rate/i.test(basis)
      || /blended avg/i.test(basis)
    );
    if(!isFallback) return;
    const raw = d.currentRows[idx] || {};
    const origin = raw.origin || '';
    const dest = (typeof pocDestHint==='function' ? pocDestHint(raw) : '')
              || raw.destLabel || raw.destination || raw.custLabel || '';
    const commodity = raw.commodity || '';
    const key = (origin||'?') + ' → ' + (dest||'?')
              + (commodity ? ' · ' + commodity : '');
    if(!gaps[key]) gaps[key] = {
      key:key, origin:origin, dest:dest, commodity:commodity,
      ovKey: laneOverrideKey(origin, dest, commodity),
      basis:basis, count:0, revenue:0
    };
    gaps[key].count += 1;
    gaps[key].revenue += r.revenue;
  });
  return Object.values(gaps).sort((a,b) => b.count - a.count);
}

function missingRatesCardHTML(){
  const gaps = scanMissingRates();
  if(!gaps.length) return '';
  const total = gaps.reduce((a,g)=>a+g.count,0);
  return '<div class="missing-rates" id="missingRatesCard" data-tile="missing"'
       + ' title="Tap to type the missing rates. Saved on this phone.">'
       + '<div>'
       + '<div class="mr-lead">⚠ ' + total + ' load' + (total===1?'':'s') + ' on ' + gaps.length + ' lane' + (gaps.length===1?'':'s') + ' using default rate</div>'
       + '<div class="mr-sub">Tap to add the missing rates.</div>'
       + '</div><div class="mr-arrow">→</div></div>';
}

function missingUsingLabel(g){
  const per = g.count ? (g.revenue / g.count) : 0;
  const why = /blended avg/i.test(g.basis||'') ? 'blended average'
            : /placeholder/i.test(g.basis||'') ? 'placeholder'
            : 'default rate';
  return 'Currently using ' + why + ' ' + money(per) + '/load';
}

function drillMissingBody(){
