/* v2.1.5: Dispatch Signals panel — JJ's reactive queue.
   Surfaces truck-start (engine on = driver's here), arrived-yard (freed up),
   arrived-location (delivered, likely empty). Unacknowledged signals sort
   newest first; ack removes from queue but keeps in history.
   Signal sources per fct_dispatch_signal_flow.md. */
function renderDispatchSignalsPanel(){
  const vl = state.verizonLive;
  if(!vl) return '';
  const all = Array.isArray(vl.signals) ? vl.signals : [];
  if(!all.length){
    return `<div class="banner" style="background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--muted)">
      <b>📶 Dispatch Signals</b> — waiting for first truck-start event. Runs every 5 min.
    </div>`;
  }
  const acked = vl.ackedSignals || {};
  const sigId = s => `${s.type}:${s.truck}:${s.at}`;
  const now = Date.now();
  const enriched = all.map((s, idx) => {
    const id = sigId(s);
    const ts = Date.parse(s.at) || 0;
    const ageMin = ts ? Math.floor((now - ts) / 60000) : null;
    return { ...s, __id: id, __idx: idx, __ageMin: ageMin, __acked: !!acked[id] };
  });
  const open = enriched.filter(s => !s.__acked && s.__ageMin != null && s.__ageMin < 240);  // 4h window
  const history = enriched.filter(s => s.__acked || (s.__ageMin != null && s.__ageMin >= 240)).slice(0, 5);
  const ageLbl = m => m == null ? '' : (m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.floor(m/60)}h ${m%60}m ago`);
  const typeIcon = t => ({
    truck_start:'🟢', arrived_yard:'🏠', arrived_location:'📍', left_yard:'🚛', truck_stop:'🛑'
  }[t] || '•');
  const typeLbl = t => ({
    truck_start:'engine on', arrived_yard:'at yard', arrived_location:'arrived',
    left_yard:'left yard', truck_stop:'stopped'
  }[t] || t);
  const priority = s => (s.type === 'truck_start' ? 0 : s.type === 'arrived_yard' ? 1 : s.type === 'arrived_location' ? 2 : 3);
  open.sort((a,b)=> priority(a)-priority(b) || (Date.parse(b.at)||0) - (Date.parse(a.at)||0));
  const rowHtml = (s, isHistory) => {
    const driver = s.driver ? esc(s.driver) : `<span style="color:var(--muted)">truck ${esc(String(s.truck))}</span>`;
    const where = s.addr ? esc(String(s.addr)) : (s.type==='arrived_location' ? esc(s.note||'') : '');
    const opacity = isHistory ? '0.55' : '1';
    const ackBtn = isHistory ? '' : `<button class="btn btn-sm" onclick="ackSignal('${s.__id.replace(/'/g,"\\'")}')" style="background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer">✓ ack</button>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid var(--border);opacity:${opacity}">
      <span style="font-size:14px">${typeIcon(s.type)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px"><b>${driver}</b> · truck ${esc(String(s.truck))} · <span style="color:var(--muted)">${typeLbl(s.type)}</span></div>
        ${where ? `<div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${where}</div>` : ''}
      </div>
      <span style="font-size:11px;color:var(--muted);white-space:nowrap">${ageLbl(s.__ageMin)}</span>
      ${ackBtn}
    </div>`;
  };
  const openHtml = open.length
    ? open.map(s=>rowHtml(s, false)).join('')
    : '<div style="padding:10px 8px;font-size:12px;color:var(--muted);text-align:center">All signals acknowledged. Nothing waiting.</div>';
  const histHtml = history.length
    ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:11px;color:var(--muted);padding:4px 8px">Recent history (${history.length})</summary>${history.map(s=>rowHtml(s, true)).join('')}</details>`
    : '';
  const stampMs = vl.signalsSyncedAt ? Date.parse(vl.signalsSyncedAt) : 0;
  const stampAge = stampMs ? Math.floor((now-stampMs)/1000) : null;
  const stampLbl = stampAge == null ? 'never' : stampAge < 60 ? `${stampAge}s ago` : `${Math.floor(stampAge/60)}m ago`;
  return `
    <div class="card" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <b style="font-family:var(--display);font-size:14px">📶 Dispatch Signals · ${open.length} open</b>
        <span style="font-size:11px;color:var(--muted)">refreshed ${stampLbl}</span>
      </div>
      ${openHtml}
      ${histHtml}
    </div>`;
}

/* 2026-08-18 v2.1.2: full Fleet tab — big map on top, full truck+driver list
   below. Own page so Today stays clean. */
function renderFleet(){
  const host = document.getElementById('p-fleet');
  if(!host) return;
  const vl = state.verizonLive;
  if(!vl || !vl.vehicles.length){
    host.innerHTML = `<div class="banner amber" style="margin:16px"><b>📡 Verizon Live — waiting for first sync</b>Feed is on. Data flows every 10 minutes from fct-verizon.workers.dev/latest.</div>`;
    return;
  }
  const nv = vl.vehicles.length, nd = vl.drivers.length;
  const stampMs = vl.lastSync ? Date.parse(vl.lastSync) : 0;
  const ageSec = stampMs ? Math.floor((Date.now()-stampMs)/1000) : null;
  const ageLabel = ageSec == null ? 'never' :
    ageSec < 60 ? ageSec+'s ago' :
    ageSec < 3600 ? Math.floor(ageSec/60)+'m ago' :
    Math.floor(ageSec/3600)+'h ago';
  const moving = vl.vehicles.filter(v => v._location && v._location.Speed > 0).length;
  const stopped = vl.vehicles.filter(v => v._location && v._location.DisplayState === 'Stop').length;
  const atHome = vl.vehicles.filter(v => v._location && /home terminal/i.test(String(v._location.GeoFenceName||''))).length;

  // Full truck list rows, sorted: fresh + moving first, then fresh + stopped-out,
  // then fresh + home, then stale, then no-location.
  const nowT = Date.now();
  const readyOv = vl.readyOverrides || {};
  const rows = vl.vehicles.map(v => {
    const loc = v._location || {};
    const addr = (loc.Address && loc.Address.AddressLine1) || loc.GeoFenceName || '(no location)';
    const isMoving = loc.Speed > 0;
    const isHome = /home terminal/i.test(String(loc.GeoFenceName||''));
    const gpsMs = loc.UpdateUTC ? Date.parse(loc.UpdateUTC + 'Z') : 0;
    const ageMin = gpsMs ? Math.floor((nowT - gpsMs) / 60000) : Infinity;
    const isFresh = ageMin < 30;
    const isStale = ageMin > 240;
    const truckId = String(v.Name || v.VehicleNumber || '');
    const readyTs = readyOv[truckId];
    const isReady = !!(readyTs && (nowT - Number(readyTs)) < 4*60*60*1000);
    // Rank: fresh moving 0, fresh ready 1, fresh stopped-out 2, fresh yard 3, stale 4, no-loc 5
    const rank = !loc.Latitude ? 5 : isStale ? 4 : (isReady ? 1 : (isMoving ? 0 : (isHome ? 3 : 2)));
    const stateBadge = isReady
      ? `<span style="color:var(--green);font-weight:600;font-size:11px;text-transform:uppercase">✓ READY</span>`
      : isMoving
        ? `<span style="color:var(--green);font-weight:600;font-size:11px;text-transform:uppercase">▶ ${Math.round(loc.Speed)} mph ${esc(loc.Heading||'')}</span>`
        : (isHome ? `<span style="color:var(--text-muted);font-size:11px;text-transform:uppercase">⌂ yard</span>`
                  : `<span style="color:var(--amber);font-size:11px;text-transform:uppercase">■ stopped</span>`);
    // v2.1.14: normal-driver + override-dropdown pattern per James 2026-08-19.
    // Show primary (Verizon-current OR last-known-primary from cache), with a
    // dropdown to override today's driver if someone else is in the truck.
    const isSpare = truckId === '21';
    const primaryCache = (state.verizonLive && state.verizonLive.primaryDriverCache) || {};
    const overrides = (state.verizonLive && state.verizonLive.driverOverrides) || {};
    const activeOverride = overrides[truckId] && overrides[truckId].name;
    const primary = v._driverName || primaryCache[truckId] || '';
    const rosterOpts = ((state.verizonLive && state.verizonLive.drivers) || [])
      .map(d => d.Driver && (d.Driver.FirstName + ' ' + d.Driver.LastName))
      .filter(Boolean)
      .sort();
    let driverLabel;
    if(isSpare){
      driverLabel = `<span style="color:var(--text-muted);font-style:italic">spare truck</span>`;
    } else if(activeOverride){
      driverLabel = `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">`
        + `<span><b>${esc(activeOverride)}</b> <span style="color:var(--text-muted);font-size:11px">(override)</span></span>`
        + (primary && primary !== activeOverride ? `<span style="color:var(--text-muted);font-size:11px">normal: ${esc(primary)}</span>` : '')
        + ` <button onclick="setTruckDriverOverride('${esc(truckId)}','')" style="background:transparent;color:var(--text-muted);border:1px solid var(--border-strong);padding:1px 6px;border-radius:4px;font-size:10px;cursor:pointer">clear</button>`
        + `</div>`;
    } else if(primary){
      driverLabel = `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">`
        + `<b>${esc(primary)}</b>`
        + ` <select onchange="if(this.value){setTruckDriverOverride('${esc(truckId)}',this.value)}" `
        + `style="background:transparent;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:4px;font-size:10px;padding:1px 4px;cursor:pointer">`
        + `<option value="">someone else today?</option>`
        + rosterOpts.filter(n => n !== primary).map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
        + `</select></div>`;
    } else {
      driverLabel = `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">`
        + `<span style="color:var(--text-muted);font-style:italic">no driver assigned</span>`
        + ` <select onchange="if(this.value){setTruckDriverOverride('${esc(truckId)}',this.value)}" `
        + `style="background:transparent;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:4px;font-size:10px;padding:1px 4px;cursor:pointer">`
        + `<option value="">assign for today…</option>`
        + rosterOpts.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
        + `</select></div>`;
    }
    const ageLabel = ageMin === Infinity ? 'no GPS' :
      ageMin < 60 ? `${ageMin} min ago` :
      ageMin < 60*24 ? `${Math.floor(ageMin/60)}h ago` :
      `${Math.floor(ageMin/60/24)}d ago`;
    const ageColor = isFresh ? 'var(--green)' : (isStale ? 'var(--red)' : 'var(--amber)');
    // Ready toggle button — only meaningful for stopped-out trucks (not moving, not at yard)
    const canToggleReady = !isMoving && !isHome && loc.Latitude;
    const readyBtn = canToggleReady
      ? (isReady
          ? `<button onclick="clearTruckReady('${esc(truckId)}')" style="background:var(--green-bg);color:var(--green);border:1px solid var(--green);padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;text-transform:uppercase">Ready ✓</button>`
          : `<button onclick="markTruckReady('${esc(truckId)}')" style="background:transparent;color:var(--text-muted);border:1px solid var(--border-strong);padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;text-transform:uppercase">Mark ready</button>`)
      : '';
    return { rank, html: `
      <div style="display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);${isStale ? 'opacity:0.55' : ''}">
        <div>
          <div style="font-weight:700;font-size:14px">${esc(truckId)}</div>
          <div style="font-size:11px;color:var(--text-muted)">${esc(v.Make ? v.Make.trim() : '')} ${esc(v.Model ? v.Model.trim() : '')}</div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:500">${driverLabel}</div>
          <div style="font-size:12px;color:var(--text-muted)">${esc(addr)}</div>
          <div style="font-size:11px;color:${ageColor};margin-top:2px">GPS ${ageLabel}</div>
        </div>
        <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${stateBadge}
          ${readyBtn}
        </div>
      </div>` };
  }).sort((a,b) => a.rank - b.rank).map(r => r.html).join('');

  host.innerHTML = `
    <div style="padding:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <div>
          <b style="color:var(--green);font-family:var(--display);font-size:17px">📡 Live Fleet</b>
          <div class="hint" style="margin-top:2px">
            ${nv} vehicles · ${nd} drivers · ${atHome} at yard · ${stopped-atHome} stopped in field · ${moving} moving · updated ${ageLabel}
          </div>
        </div>
        <button class="btn btn-sm" onclick="syncFromVerizon({force:true}).then(()=>renderFleet())" style="background:transparent;color:var(--green);border:1px solid color-mix(in oklab,var(--green) 40%,transparent);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">🔄 Refresh</button>
      </div>
      <div id="fleetMapContainer" style="height:52vh;min-height:340px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px"></div>
      <div class="card" style="padding:8px 12px">
        <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;padding:6px 4px 10px">All trucks (${nv})</div>
        ${rows || '<div class="hint">No trucks in feed.</div>'}
      </div>
    </div>`;

  // Render map into the Fleet tab's container
  setTimeout(()=>renderVerizonMapInto('fleetMapContainer'), 100);
}

/* 2026-08-18 v2.1.1: toggle the Leaflet truck map. Lazy-inits on first open so
   the Leaflet script isn't paying render cost on every dashboard paint. */
let __verizonMap = null;
let __verizonMapMarkers = [];
function toggleVerizonMap(){
  const c = document.getElementById('vzMapContainer');
  const lbl = document.getElementById('vzMapToggleLabel');
  if(!c) return;
  const isHidden = c.style.display === 'none';
  if(isHidden){
    c.style.display = 'block';
    if(lbl) lbl.textContent = 'Hide map';
    renderVerizonMap();
  } else {
    c.style.display = 'none';
    if(lbl) lbl.textContent = 'Show map';
  }
}

function renderVerizonMap(){
  renderVerizonMapInto('vzMapContainer');
}
function renderVerizonMapInto(containerId){
  const c = document.getElementById(containerId);
  if(!c || typeof L === 'undefined') return;
  // If switching containers, tear down the old map so Leaflet doesn't collide
  if(__verizonMap && __verizonMap._container !== c){
    __verizonMap.remove();
    __verizonMap = null;
    __verizonMapMarkers = [];
  }
  const vl = state.verizonLive;
  if(!vl || !vl.vehicles.length) return;

  // Init or reset the map
  if(!__verizonMap){
    // Default center on FCT home terminal (French Camp)
    __verizonMap = L.map(c, { zoomControl: true, attributionControl: false })
      .setView([37.87533, -121.275866], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
    }).addTo(__verizonMap);
  } else {
    __verizonMapMarkers.forEach(m => __verizonMap.removeLayer(m));
    __verizonMapMarkers = [];
    // Ensure the map re-lays out if container just became visible
    setTimeout(()=>__verizonMap.invalidateSize(), 50);
  }

  // Add truck markers. 2026-08-18 v2.1.3: fade markers by GPS-age tier so
  // James can tell "this is real right now" from "this is where the truck was
  // parked a week ago." Verizon reports LAST-KNOWN position; a truck that has
  // been sitting silent for days will still show at wherever it last pinged.
  const bounds = [];
  const activeBounds = [];  // fit map to recent trucks first, fall back to all
  const now = Date.now();
  vl.vehicles.forEach(v => {
    const loc = v._location;
    if(!loc || typeof loc.Latitude !== 'number' || typeof loc.Longitude !== 'number') return;
    const lat = loc.Latitude, lng = loc.Longitude;
    if(!lat || !lng) return;
    const isHome = /home terminal/i.test(String(loc.GeoFenceName||''));
    const isMoving = loc.Speed > 0;
    const gpsMs = loc.UpdateUTC ? Date.parse(loc.UpdateUTC + 'Z') : 0;
    const ageMin = gpsMs ? Math.floor((now - gpsMs) / 60000) : Infinity;
    // Age tier: fresh (<30 min), recent (30 min-4 hrs), stale (>4 hrs)
    let ageTier = 'stale';
    if(ageMin < 30) ageTier = 'fresh';
    else if(ageMin < 240) ageTier = 'recent';
    const isFresh = ageTier === 'fresh';
    const isRecent = ageTier === 'recent';
    // Base color by state
    const color = isMoving ? '#4ade80' : (isHome ? '#94a3b8' : '#fbbf24');
    // Stale markers desaturate to gray + shrink + drop opacity
    const staleColor = '#525252';
    const displayColor = ageTier === 'stale' ? staleColor : color;
    const radius = isFresh ? (isMoving ? 10 : 9) : (isRecent ? 7 : 5);
    const fillOpacity = isFresh ? 0.95 : (isRecent ? 0.55 : 0.3);
    const strokeOpacity = isFresh ? 1 : (isRecent ? 0.6 : 0.35);
    const marker = L.circleMarker([lat, lng], {
      radius,
      fillColor: displayColor,
      color: '#0f172a',
      weight: 2,
      opacity: strokeOpacity,
      fillOpacity,
    }).addTo(__verizonMap);
    const speedTxt = isMoving ? ` — ${Math.round(loc.Speed)} mph ${loc.Heading||''}` : ' — stopped';
    const addr = (loc.Address && loc.Address.AddressLine1) || loc.GeoFenceName || '';
    const ageLabel = ageMin === Infinity ? 'never' :
      ageMin < 60 ? `${ageMin} min ago` :
      ageMin < 60*24 ? `${Math.floor(ageMin/60)}h ago` :
      `${Math.floor(ageMin/60/24)}d ago`;
    const ageColor = isFresh ? '#22c55e' : (isRecent ? '#eab308' : '#ef4444');
    marker.bindPopup(
      `<div style="font-family:system-ui,sans-serif;font-size:13px">
        <b>Truck ${v.Name || v.VehicleNumber || '?'}</b>${speedTxt}<br>
        <span style="color:#475569">${addr}</span><br>
        <span style="color:${ageColor};font-size:11px;font-weight:600">Last GPS: ${ageLabel}</span>
      </div>`
    );
    __verizonMapMarkers.push(marker);
    bounds.push([lat, lng]);
    if(isFresh || isRecent) activeBounds.push([lat, lng]);
  });

  // Fit to recent-active trucks if any, otherwise all
  const fitTo = activeBounds.length ? activeBounds : bounds;
  if(fitTo.length){
    __verizonMap.fitBounds(fitTo, { padding: [30, 30], maxZoom: 12 });
  }
}

function fetchDispatchUrl(url){
  let u = url;
  if(/1drv\.ms|sharepoint\.com|onedrive\.live\.com/i.test(u) && u.indexOf('download=1')<0){
    u += (u.indexOf('?')>=0?'&':'?')+'download=1';
  }
  setDispStatus('<div class="hint">Fetching…</div>');
  fetch(u).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(buf=>ingestWorkbook(buf, url.split('/').pop().split('?')[0] || 'dispatch.xlsx'))
    .then(res=>{
      if(res && res.kind==='adp'){
        renderDash();
        toast('ADP '+res.dateMin+'–'+res.dateMax+' · field '+money((res.summary||{}).fieldDollars));
        setDispStatus(adpImportStatusHTML(res));
        return;
      }
      renderDash(); toast(res.rows.length+' loads · '+res.dates.length+' days');
    })
    .catch(e=>{
      setDispStatus('<div class="hint" style="color:var(--amber)">OneDrive would not hand the file over directly ('+esc(String(e&&e.message||e))+'). '
        + 'That is normal — OneDrive blocks cross-origin downloads. Open the link, choose <b>Download</b>, then drop the file on the box above.</div>');
    });
}

function refreshDay(){
  const d = computeDay();
  d.rows.forEach((r,i)=>{
    const set=(cls,txt,col)=>{
      const el=document.querySelector(DAY_HOST+' .'+cls+'[data-i="'+i+'"]');
      if(!el) return; el.textContent=txt; el.style.color = col||'';
    };
    // A placeholder rate must never look like a confirmed one.
    // v2.1.45: unbooked (no driver or no FB) still show the planned $
    // so the row stays on the board, marked "plan" — that $ is not in
    // Today's REV.
    const revTxt = r.active
      ? (money(r.revenue)+(r.booked?'':' plan')+(r.rateEst?' ~':''))
      : '—';
    const revCol = !r.active ? ''
      : r.booked ? (r.rateEst ? 'var(--yellow)' : '')
      : 'var(--text-faint)';
    set('dr-rev', revTxt, revCol);
    const rv = document.querySelector(DAY_HOST+' .dr-rev[data-i="'+i+'"]');
    if(rv) rv.title = r.active
      ? ((r.booked ? '' : 'Plan — not in Today\'s REV until a driver name AND freight bill are attached. ')
         + (r.rateBasis||''))
      : '';
    set('dr-var', r.active? '−'+money(r.varCost) : '—', r.active? 'var(--red)' : '');
    set('dr-cm',  r.active? money(r.cm) : '—', r.active? (r.cm>=0?'var(--green)':'var(--red)') : '');
    /* v2.1.21: append a tiny calibration pill to the CM cell. Only shows when
       a factor is meaningfully off 1.0 (within ±3% is hidden as noise). Arrow
       + factor + hover tooltip. Source labelled: (lane) is per-lane data,
       (fleet) is fallback. */
    if(r.active && r.laneCal && r.laneCal.source !== 'none'){
      const f = Number(r.laneCal.factor);
      if(isFinite(f) && Math.abs(f-1) > 0.03){
        const cmEl = document.querySelector(DAY_HOST+' .dr-cm[data-i="'+i+'"]');
        if(cmEl){
          const up = f > 1;
          const arrow = up ? '↑' : '↓';
          const pillCol = up ? 'var(--yellow)' : 'var(--green)';
          const src = r.laneCal.source;
          const laneLbl = r.laneCal.laneKey || '(no lane)';
          const tip = (src === 'lane'
            ? '7-day actual/predicted for ' + laneLbl + ': ' + f.toFixed(2) + 'x (' + (r.laneCal.loadsInWindow||0) + ' loads in window)'
            : 'Fleet-wide 7-day actual/predicted: ' + f.toFixed(2) + 'x (no per-lane data for ' + laneLbl + ')');
          cmEl.innerHTML = (r.active? money(r.cm) : '—')
            + ' <span title="'+esc(tip)+'" style="font-size:10px;color:'+pillCol
            + ';margin-left:4px;font-weight:600;cursor:help">'+arrow+f.toFixed(2)+'×</span>';
        }
      }
    }
    set('dr-hr',  r.active&&r.hours>0? money2(r.cmPerHour) : '—');
    /* v1.5 measured cells. Hours and miles carry the delta against the modelled
       figure, because "5.8 hrs" only means something next to the 5.0 assumed. */
    const a = r.actual;
    if(a){
      const dh = a.hoursDelta, dm = a.milesDelta;
      set('dr-ahr', num(a.hours,2), Math.abs(dh)>1 ? 'var(--amber)' : '');
      const ahr = document.querySelector(DAY_HOST+' .dr-ahr[data-i="'+i+'"]');
      if(ahr) ahr.title = num(a.hours,2)+' hr measured vs '+num(r.hours,2)+' hr modelled ('
        + (dh>=0?'+':'')+num(dh,2)+' hr) · '+a.legs+' trip legs, truck '+(a.vehicle||'?')
        + (a.parkedTrimHrs>0.05
            ? ' · '+num(a.parkedTrimHrs,1)+' hr of parked time trimmed (Verizon runs the last stop of a shift until the truck next moves)'
            : '');
      set('dr-ami', num(a.miles,1), Math.abs(dm)>25 ? 'var(--amber)' : '');
      const ami = document.querySelector(DAY_HOST+' .dr-ami[data-i="'+i+'"]');
      if(ami) ami.title = num(a.miles,1)+' mi measured vs '+num(r.miles,1)+' mi modelled ('
        + (dm>=0?'+':'')+num(dm,1)+' mi)';
      set('dr-avar','−'+money(a.varCost), 'var(--red)');
      const av = document.querySelector(DAY_HOST+' .dr-avar[data-i="'+i+'"]');
      if(av) av.title = 'Measured: '+num(a.miles,1)+' mi and '+num(a.hours,2)+' hr'
        + (a.driverRate ? ' at '+money2(a.driverRate)+'/hr loaded for '+r.driver : ' at the fleet default rate')
        + '. Estimate was '+money(r.varCost)+' ('+(a.varDelta>=0?'+':'')+money(a.varDelta)+').';
      set('dr-acm', money(a.cm), a.cm>=0?'var(--green)':'var(--red)');
      const ac = document.querySelector(DAY_HOST+' .dr-acm[data-i="'+i+'"]');
      if(ac) ac.title = 'Revenue is unchanged — only the cost side is measured. '
        + 'Estimated contribution '+money(r.cm)+', actual '+money(a.cm)+' ('+(a.cmDelta>=0?'+':'')+money(a.cmDelta)+').';
    }
  });
  /* v1.7 — Section 2's money cells. Priced through exactly the same
     computeDayRow() as Section 1, because the question "what is this load
     worth" has one answer regardless of which screen it is being asked from.
     What differs is only that these figures land in no total on this page:
     the CSS greys them and the banner above says why. The 'p' prefix on
     data-i keeps them out of reach of the numeric selectors above. */
  dayPreloadRows.forEach((r,ix)=>{
    const c = computeDayRow(r);
    const set=(cls,txt,col,tip)=>{
      const el=document.querySelector(DAY_HOST+' .'+cls+'[data-i="p'+ix+'"]');
      if(!el) return;
      el.textContent=txt; el.style.color = col||'';
      if(tip) el.title = tip;
    };
    const bookedOn = 'Books on '+shortDateLabel(r.date)+', the day it delivers — not in this day\'s totals.';
    set('dr-rev', c.active? (money(c.revenue)+(c.rateEst?' ~':'')) : '—', '', bookedOn);
    set('dr-var', c.active? '−'+money(c.varCost) : '—', '', bookedOn);
    set('dr-cm',  c.active? money(c.cm) : '—', '', bookedOn);
  });

  // Sheet footer — totals live at the bottom of the day block.
  const foot = document.getElementById('sheetFoot');
  if(foot) foot.innerHTML = sheetFootHTML(d);
  /* Breakeven gauge for the day in view: green at or above breakeven,
     amber within 3 loads of it, red below that. */
  const g = document.getElementById('dayGauge');
  if(g){
    const n = d.totals.loads, be = d.breakeven, amber = Math.max(0, be-3);
    const col = !n ? 'var(--text-faint)' : n>=be ? 'var(--green)' : n>=amber ? 'var(--yellow)' : 'var(--red)';
    const pct = Math.max(0, Math.min(100, (n/(be*1.5))*100));
    g.innerHTML = '<div class="row" style="border:0;padding:0 0 4px"><div class="row-l">'
      + '<div class="row-t">Breakeven gauge</div>'
      + '<div class="row-s">green ≥ '+be.toFixed(0)+' · amber '+amber.toFixed(0)+'–'+be.toFixed(0)+' · red < '+amber.toFixed(0)+'</div></div>'
      + '<div class="row-v" style="color:'+col+';font-size:20px">'+n+'<div class="row-s">loads</div></div></div>'
      + '<div class="gauge" style="margin-bottom:12px"><i style="width:'+pct.toFixed(1)+'%;background:'+col+'"></i>'
      + '<span style="position:absolute;top:-2px;bottom:-2px;left:'+Math.min(100,(be/(be*1.5))*100).toFixed(1)
      + '%;width:2px;background:var(--text)" title="Breakeven '+be.toFixed(1)+' loads"></span></div>';
  }
  const t = document.getElementById('dayTotals');
  if(t) t.innerHTML = dayTotalsHTML(d);
  const v = document.getElementById('dayVerdictWrap');
  if(v) v.innerHTML = '<div class="verdict '+d.vClass+'"><div class="verdict-t">'+d.verdict+'</div>'
    + '<div class="verdict-s">'+d.vNote+'</div></div>';
}

function saveDaySnapshot(){
  const d = computeDay();
  if(!d.totals.loads){ toast('Import a day or add a what-if load first'); return; }
  const date = state.dayRollup.date || new Date().toISOString().slice(0,10);
  const li = state.dayRollup.lastImport;
  state.dayRollup.snapshots.unshift({
    id:'D'+Date.now(), date:date, ts:new Date().toISOString(),
    loads:d.totals.loads, trucks:d.trucks, perTruck:d.perTruck,
    revenue:d.totals.revenue, varCost:d.totals.varCost, cm:d.totals.cm,
    hours:d.totals.hours, cmPerHour:d.totals.cmPerHour,
    fixedTotal:d.fixedTotal, net:d.net, verdict:d.verdict,
    // v1.3: stamp the model the day was priced under, so a snapshot taken
    // before a parameter change still explains itself.
    model:'v1.3', breakeven:d.breakeven,
    revPerLoad:revenuePerLoad(), varPerLoad:variableCostPerLoad(),
    source: li ? li.fileName : 'manual',
    calibrated: !!state.laneDefaults.calibrated,
    rows: state.dayRollup.currentRows.filter(dayRowActive).map(r=>Object.assign({},r)),
  });
  saveDayImport();
  toast('Day saved — '+state.dayRollup.snapshots.length+' snapshot'+(state.dayRollup.snapshots.length===1?'':'s'));
  renderHist();
}

/* =============================================================
   TAB 2 — QUEUE (v1.4, Phase 3.0 foundation)
   -------------------------------------------------------------
   v2.1.31: Queue is the Excel dispatch board you send from —
   same date banner and D.P. LATHROP / D.P. RIPON blocks as the
   Today sheet, with the driver picker and Send dispatch on open
   rows. Assigned drivers stay locked (v2.1.8). Done stays on the
   sheet, greyed, so the day is still visible.

   v2.1.32: tomorrow's pre-6am preloads (preloadSectionRows, same
   predicate as Today) are this afternoon's dispatch work. A chip
   under the open/assigned line jumps to #qPreSection; the tab
   badge counts today's open rows plus unassigned tomorrow
   preloads; Section 2 groups those rows Lathrop → Ripon → Other
   instead of a flat dump. Revenue still belongs to tomorrow.

   "Send dispatch" is deliberately a misnomer today: it records
   the assignment, flips the row to DISPATCHED and nothing leaves
   the device. Phase 3.2 turns that same call into an SMS. The
   button is named for what it will do so the muscle memory is
   already right — and the row says so, so nobody is misled.
   ============================================================= */
function queueRows(){
  return state.dayRollup.currentRows
    .map((r,i)=>({r:r, i:i}))
    .filter(x=>isUnassigned(x.r));
}
// v2.1.6: return ALL loads for the day (assigned + unassigned + delivered),
// classified. James 2026-08-18: "should have all loads with suggested
// assignments for day." Queue is now the whole day, not just open loads.
function queueRowClass(r){
  const st = String((r && r.status)||'').trim().toUpperCase();
  const hasDriver = !!(String((r && r.driverRaw)||'').trim() || String((r && r.driver)||'').trim());
  if(!hasDriver && (st==='' || st==='P')) return 'unassigned';
  if(st==='DELIVERED' || st==='D' || st==='COMPLETE') return 'done';
  return 'assigned';
}
function queueRowsAll(){
  return state.dayRollup.currentRows
    .map((r,i)=>({r:r, i:i}))
    .filter(x => dayRowActive(x.r))
    .map(x => ({ ...x, cls: queueRowClass(x.r) }));
}
function renderQueue(){
  const host = document.getElementById('p-queue');
  if(!host) return;
  const d = state.dayRollup;
  const shown = d.date;
  const dayPre = (typeof preloadSectionRows === 'function' && shown) ? preloadSectionRows(shown) : [];
  // v2.1.6: full-day queue — assigned + unassigned + done. v2.1.31 lays
  // them out as the Excel sheet (Lathrop then Ripon) instead of Open/Set/Done cards.
  const allRows = queueRowsAll();
  const openRows = allRows.filter(x => x.cls === 'unassigned');
  const assignedRows = allRows.filter(x => x.cls === 'assigned');
  const doneRows = allRows.filter(x => x.cls === 'done');
  const li = d.lastImport;
  const preOpen = dayPre.filter(isUnassigned).length;

  /* Tab badge — today's open rows PLUS unassigned tomorrow preloads.
     Those pre-6am loads are this afternoon's dispatch work. */
  const badge = document.getElementById('qBadge');
  const badgeN = openRows.length + preOpen;
  if(badge){ badge.textContent = String(badgeN); badge.hidden = !badgeN; }

  let h = '';

  if(!li && !d.currentRows.length){
    h += '<div class="card"><h2>Dispatch queue</h2>'
      + '<div class="empty">Nothing to dispatch yet.<br>Import the dispatch log on the <b>Today</b> tab and the day\'s loads land here.</div></div>';
    host.innerHTML = h;
    return;
  }

  const QCOL = 8;
  h += '<div class="card sheet-card"><h2>Dispatch queue</h2>'
    + '<div class="q-sum"><b class="q-open-n">'+openRows.length+' open</b> · '
    + assignedRows.length+' assigned'
    + (doneRows.length ? ' · '+doneRows.length+' done' : '')
    + (allRows.length ? ' · '+allRows.length+' load'+(allRows.length===1?'':'s')+' on the day' : '')
    + '</div>';

  /* v2.1.32: tomorrow preloads at the TOP, not only the bottom. Same
     rows Today uses (preloadSectionRows). Jump lands on #qPreSection.
     Empty is honest — trimmed import vs quiet night — not silence. */
  if(dayPre.length){
    const preN = dayPre.length;
    h += '<div class="q-pre-jump"><a href="#qPreSection" data-qpre-jump>'
      + '<b>📦 '+preN+' tomorrow preload'+(preN===1?'':'s')+' — prep today PM</b>'
      + ' · '+(preOpen ? preOpen+' still open' : 'all assigned')
      + ' <span class="q-pre-go">See them below ↓</span></a></div>';
  } else {
    const note = (typeof preloadSectionNote === 'function' && shown)
      ? preloadSectionNote(shown) : '';
    if(note) h += '<div class="q-pre-jump q-pre-quiet">'+esc(note)+'</div>';
  }

  // v2.1.8: preload-capacity summary. Show how many DAY/AFTERNOON drivers have
  // uncapped slots left for late-PM preloads (PNG/ARA 6pm close, FCG 4pm), and
  // how many NIGHT drivers are pre-committed to early-AM deliveries.
  try {
    resetSuggestionLog();
    seedAssignedDriverSlots(d.currentRows);
    seedAssignedDriverSlots(dayPre);
    const rosterCap = dispatchRoster().filter(x=>x.active);
    let dayFree=0, nightBooked=0, nightFree=0;
    rosterCap.forEach(dr => {
      const already = driverSlotLog(dr.name).length;
      const cls = dr.shift ? dr.shift.cls : '';
      if((cls === 'DAY' || cls === 'AFTERNOON') && already < 2) dayFree++;
      if(cls === 'NIGHT'){
        if(already > 0) nightBooked++;
        else nightFree++;
      }
    });
    h += '<div class="q-sum" style="margin-top:-6px">Capacity · '
      + nightBooked+' early-AM driver'+(nightBooked===1?'':'s')+' booked · '
      + nightFree+' NIGHT free · '+dayFree+' DAY/AFTERNOON open for PM preloads</div>';
  } catch(_){}

  if(!d.currentRows.length && !dayPre.length){
    h += '<div class="empty">Nothing on the day yet. Import the schedule on the Today tab.</div>';
  } else {
    // v1.8.8 / v2.1.31: same cap/cooldown walk as the Today sheet — seed
    // already-assigned drivers (including tomorrow's preloads), then freeze
    // open-row picks in clock order so Lathrop-before-Ripon does not steal
    // a 6am Ripon driver's slot.
    resetSuggestionLog();
    seedAssignedDriverSlots(d.currentRows);
    seedAssignedDriverSlots(dayPre);
    precomputeSuggestions((d.currentRows||[]).concat(dayPre||[]));
    const roster = dispatchRoster().filter(x=>x.active);

    const prevDiamond = dayDiamondOnly;
    dayDiamondOnly = false;
    let S, SPre;
    try {
      S = sheetSections(d.currentRows);
      SPre = sheetSections(dayPre);
    } finally { dayDiamondOnly = prevDiamond; }

    const bannerRow = (cls, text, n)=>
      '<tr class="bnr '+cls+'"><td colspan="'+QCOL+'">'+esc(text)
      + (n!=null?'<span class="bnr-n">'+n+' load'+(n===1?'':'s')+'</span>':'')+'</td></tr>';
    const bannerRow2 = (cls, text, sub, n, id)=>
      '<tr class="bnr '+cls+'"'+(id?' id="'+id+'"':'')+'><td colspan="'+QCOL+'">'+esc(text)
      + (n!=null?'<span class="bnr-n">'+n+' load'+(n===1?'':'s')+'</span>':'')
      + '<span class="bnr-sub">'+sub+'</span></td></tr>';

    const queueLoadRow = (rec, mode)=>{
      const r = rec.r;
      const pre = mode==='sec2';
      const cls = queueRowClass(r);
      const open = cls === 'unassigned';
      const bucket = r.bucket||'diamond';
      const delivered = cls === 'done' || /DELIVER/i.test(String(r.status||''));
      const stCls = statusClass(r.status);
      const dest = String(r.deliveryPoint || r.destination || '').trim() || '—';
      const drvWarn = (r.driverRaw && !r.driver)
        ? ' title="Sheet says &quot;'+esc(r.driverRaw)+'&quot; — no roster match"' : '';

      let act = '';
      if(open){
        const top = picksForRow(r);
        const best = top[0];
        const pickOpts = top.length
          ? top.map((t,ti)=>'<option value="'+esc(t.name)+'"'+(ti===0?' selected':'')+'>'
              + esc(t.short)+(t.known? ' · '+t.runs+' prior' : ' · no history')+'</option>').join('')
          : '<option value="" selected>— no eligible driver —</option>';
        act = '<div class="q-act">'
          + '<select class="q-pick" data-qpick="'+esc(r.id)+'">'
          + pickOpts
          + '<option disabled>──────────</option>'
          + roster.filter(o=>!top.some(t=>t.name===o.name))
                  .map(o=>'<option value="'+esc(o.name)+'">'+esc(o.short)+'</option>').join('')
          + '</select>'
          + '<button type="button" class="q-send" data-qsend="'+esc(r.id)+'">Send dispatch</button>'
          + '</div>'
          + (best ? '<div class="q-why">💡 '+esc(best.short)+(best.known?'':' ?')+' — '+esc(best.why)+'</div>' : '');
      } else if(cls === 'assigned'){
        act = '<span class="q-locked">Set</span>';
      } else {
        act = '<span class="q-locked">Done</span>';
      }

      return '<tr class="sheet-load bk-'+bucket
        + (delivered?' row-del':'')
        + (pre?' pre-row':'')
        + (open?' q-open':'')
        + (cls==='assigned'?' q-set':'')
        + (cls==='done'?' q-done':'')
        + '">'
        + '<td class="c-time">'+esc(r.time || r.timeRaw || '—')+ruleChipsHTML(r, mode)+'</td>'
        + '<td class="c-po">'+esc(r.po||'—')+'</td>'
        + '<td class="c-drv"'+drvWarn+'>'
        + (open ? '—' : driverSheetHTML(r))
        + ((r.driverRaw&&!r.driver)?' <span style="color:var(--amber)">⚠</span>':'')
        + queueSheetMetaHTML(r)+'</td>'
        + '<td class="c-orig">'+esc(r.origin||'—')+'</td>'
        + '<td class="c-comm">'+esc(String(r.commodity||'—').slice(0,26))+'</td>'
        + '<td class="c-dest">'+esc(dest)+'</td>'
        + '<td class="c-st'+(stCls?' '+stCls:'')+'">'+esc(r.status || '—')+'</td>'
        + '<td class="c-act">'+act+'</td>'
        + '</tr>';
    };

    /* Same banner order as the Today sheet. Preloaded rows also live under
       their D.P. (v1.8.14); the 🔒 chip plus the hoist banner is enough. */
    const emit = (list, mode)=>(list||[]).map(rec=>queueLoadRow(rec, mode)).join('');

    const dt = dateFromISO(d.date);
    const dateLabel = dt
      ? DOW_LONG[dt.getDay()].toUpperCase()+'  '+MONTH_NAMES[dt.getMonth()].toUpperCase()+' '+dt.getDate()+', '+dt.getFullYear()
      : (d.date||'NO DATE');

    h += '<div class="sheet-wrap"><table class="sheet sheet-queue" id="qSheet">'
      + '<colgroup>'
      + '<col style="width:200px"><col style="width:100px"><col style="width:170px">'
      + '<col style="width:140px"><col style="width:160px"><col style="width:130px">'
      + '<col style="width:110px"><col style="width:180px">'
      + '</colgroup>'
      + '<thead><tr>'
      + '<th class="c-time">Time</th><th class="c-po">PO / Rel #</th><th class="c-drv">Driver</th>'
      + '<th class="c-orig">Origin</th><th class="c-comm">Commodity</th><th class="c-dest">Dest</th>'
      + '<th class="c-st">Status</th><th class="c-act">Dispatch</th>'
      + '</tr></thead><tbody>';

    h += bannerRow('bnr-date sticky-date', dateLabel, d.currentRows.length);

    if(S.preloaded.length){
      const prepped = shortDateLabel(prevDayISO(d.date));
      h += bannerRow2('bnr-lock', '🔒 PRELOADED — prepped '+(prepped||'the afternoon before')+' PM',
            'Delivering before 6am — committed by that afternoon\'s list. Still this day\'s loads.', S.preloaded.length)
        + emit(S.preloaded);
    }
    if(S.above.length) h += emit(S.above);
    if(S.lathrop.length){
      h += bannerRow('bnr-lath','D.P. LATHROP', S.lathrop.length) + emit(S.lathrop);
    }
    if(S.ripon.length){
      h += bannerRow('bnr-ripo','D.P. RIPON', S.ripon.length) + emit(S.ripon);
    }
    if(S.other.length){
      h += bannerRow('bnr-other','OTHER DELIVERY POINTS', S.other.length) + emit(S.other);
    }
    if(S.manual.length){
      h += bannerRow('bnr-other','WHAT-IF (not on the sheet)', S.manual.length) + emit(S.manual);
    }
    h += '</tbody>';

    /* Section 2 — tomorrow's preloads. Same rows as Today, grouped
       D.P. LATHROP → D.P. RIPON → OTHER (sheetSections). Do not emit
       SPre.preloaded: every preload-locked row is already in a plant
       bucket, and dumping that list would duplicate them. Revenue
       stays on tomorrow — these are not mixed into today's blocks. */
    if(dayPre.length){
      const tom = nextDayISO(d.date);
      const preOther = (SPre.other||[]).concat(SPre.above||[]).concat(SPre.manual||[]);
      const seenPre = new Set(
        (SPre.lathrop||[]).concat(SPre.ripon||[]).concat(preOther).map(x=>x.r)
      );
      dayPre.forEach((r,i)=>{ if(!seenPre.has(r)) preOther.push({r:r, i:i}); });
      h += '<tbody id="qPreSection">'
        + bannerRow2('bnr-pre', '📦 TOMORROW\'S PRELOADS — prep today PM',
            'These carry the '+(tom?dowDateLabel(tom):'next day')+' date banner and deliver before 6am. Prep is this afternoon\'s work. Revenue books on that day — not in today\'s Lathrop/Ripon totals.',
            dayPre.length)
        + (SPre.lathrop.length
            ? bannerRow('bnr-lath','D.P. LATHROP', SPre.lathrop.length)+emit(SPre.lathrop, 'sec2') : '')
        + (SPre.ripon.length
            ? bannerRow('bnr-ripo','D.P. RIPON', SPre.ripon.length)+emit(SPre.ripon, 'sec2') : '')
        + (preOther.length
            ? bannerRow('bnr-other','OTHER DELIVERY POINTS', preOther.length)+emit(preOther, 'sec2') : '')
        + '</tbody>';
    }
    h += '</table></div>';
    h += '<div class="legend">Same layout as the dispatch log — date banner, then D.P. Lathrop, then D.P. Ripon. '
      + 'Tomorrow\'s preloads sit under the blue 📦 banner, grouped the same way (Lathrop then Ripon). '
      + 'Open rows have the driver list and <b>Send dispatch</b> (records the assignment, no SMS yet). '
      + 'Assigned drivers are locked. Done stays on the sheet, greyed. '
      + 'Suggestions still walk the day in clock order with the 2-load cap.</div>';
  }
  h += '</div>';

  /* Recorded assignments — the ledger Phase 3.2 will read from. */
  const A = state.dispatchOps.assignments || {};
  const keys = Object.keys(A).sort((a,b)=>String(A[b].at).localeCompare(String(A[a].at)));
  if(keys.length){
    // v1.8.34: agreement stats — how often James's pick matched the algo's top-1,
    // top-3, and how often James went off-list entirely. This is the tuning signal.
    let agreedTop1=0, agreedTop3=0, offList=0, scored=0;
    keys.forEach(k=>{
      const a = A[k];
      if(!a || !Array.isArray(a.top3) || !a.top3.length) return;
      scored++;
      if(a.pickedRank === 1) agreedTop1++;
      if(a.pickedRank !== null) agreedTop3++;
      else offList++;
    });
    h += '<div class="card"><h2>Recorded assignments</h2>';
    if(scored){
      const pct = n => Math.round(100*n/scored);
      h += '<div class="row" style="background:var(--card-2);padding:10px 12px;border-radius:8px;margin-bottom:10px">'
        + '<div class="row-l"><div class="row-t">Algo vs James: '+pct(agreedTop1)+'% top-1, '+pct(agreedTop3)+'% top-3</div>'
        + '<div class="row-s">'+agreedTop1+'/'+scored+' matched top pick · '+offList+' off-list overrides · '
        + 'each override is a tuning signal</div></div></div>';
    }
    keys.slice(0,25).forEach(k=>{
      const a = A[k];
      const rankTag = a.pickedRank === 1 ? ' · <span style="color:var(--green)">top pick ✓</span>'
                    : a.pickedRank ? ' · rank #'+a.pickedRank
                    : (a.top3 && a.top3.length ? ' · <span style="color:var(--yellow,#c90)">off-list override</span>' : '');
      const algoPick = a.diverged && a.algoPickWas ? ' · algo wanted '+esc(shortNameFor(a.algoPickWas)) : '';
      const noteLine = a.note
        ? '<div class="row-s" style="color:var(--text);margin-top:4px;padding:6px 8px;background:var(--card-2);border-radius:6px;border-left:3px solid var(--yellow,#c90)">📝 '+esc(a.note)+'</div>'
        : '';
      const noteBtn = ' <button type="button" class="linkbtn" data-note-edit="'+esc(k)+'" style="font-size:11px;color:var(--text-faint);text-decoration:underline;background:none;border:none;cursor:pointer;padding:0">'
                    + (a.note?'edit note':'+ add note')+'</button>';
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(shortNameFor(a.driver))+'</div>'
        + '<div class="row-s">'+esc(a.date||'—')+(a.po?' · PO '+esc(a.po):'')+(a.origin?' · '+esc(a.origin):'')
        + (a.time?' · '+esc(a.time):'')+(a.commodity?' · '+esc(a.commodity):'')
        + rankTag+algoPick+noteBtn+'</div>'
        + noteLine
        + '</div>'
        + '<div class="row-v" style="font-size:11px;color:var(--text-faint)">'
        + esc(String(a.at||'').slice(11,16))+'</div></div>';
    });
    h += '<div class="btn-row" style="margin-top:12px">'
       + '<button class="act" id="qExportLog">Export dispatch log (JSON)</button>'
       + '<button class="act ghost" id="qClearLog">Clear the assignment log</button></div>'
      + '<div class="legend">Every dispatch now captures the algo\'s top-3 with scores. Export the JSON at end of day '
      + 'so Claude can compute drift patterns and propose scoring tweaks you approve.</div></div>';
  }

  host.innerHTML = h;

  /* --- wiring --- */
  /* Phone: native #hash into a display:block table often does not
     scroll. Force scrollIntoView on the Section 2 tbody. */
  document.querySelectorAll('#p-queue [data-qpre-jump]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    const t = document.getElementById('qPreSection');
    if(!t) return;
    const target = t.querySelector('tr.bnr-pre') || t;
    try { target.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch(_){ try { target.scrollIntoView(true); } catch(__){} }
  }));
  document.querySelectorAll('#p-queue [data-qsend]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.qsend;
    const sel = document.querySelector('#p-queue [data-qpick="'+CSS.escape(id)+'"]');
    const name = sel ? sel.value : '';
    if(!name){ toast('Pick a driver first'); return; }
    const top = suggestDrivers(findRowById(id)||{}, 1);
    assignDriver(id, name, !!(top[0] && top[0].name===name));
  }));
  const cl = document.getElementById('qClearLog');
  if(cl) cl.addEventListener('click',()=>{
    if(!confirm('Clear the recorded assignment log? The drivers already written onto the loads stay put.')) return;
    state.dispatchOps.assignments = {}; save(); renderQueue(); toast('Assignment log cleared');
  });
  // v1.8.34b: wire the per-row note editors
  document.querySelectorAll('#p-queue [data-note-edit]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    editAssignmentNote(b.dataset.noteEdit);
  }));
  // v1.8.34: export the assignment log as JSON so Claude can mine drift patterns
  const ex = document.getElementById('qExportLog');
  if(ex) ex.addEventListener('click',()=>{
    const A = state.dispatchOps.assignments || {};
    const dump = { version:'v1.8.34', exportedAt:new Date().toISOString(),
                   count:Object.keys(A).length, assignments:A };
    const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = 'fct-dispatch-log-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Exported '+Object.keys(A).length+' assignments');
  });
}

/* =============================================================
   TAB 3 — HISTORY
   ============================================================= */
let histFilter = { from:'', to:'', cust:'', drv:'', verdict:'' };

function renderHist(){
  const s = state.settings;
  const all = state.history;
  const custs = Array.from(new Set(all.map(l=>l.customer))).sort();
  const drvs  = Array.from(new Set(all.map(l=>l.driver).filter(Boolean))).sort();

  const rows = all.filter(l=>{
    if(histFilter.from && l.date < histFilter.from) return false;
    if(histFilter.to   && l.date > histFilter.to)   return false;
    if(histFilter.cust && l.customer!==histFilter.cust) return false;
    if(histFilter.drv  && l.driver!==histFilter.drv) return false;
    if(histFilter.verdict && l.verdict.indexOf(histFilter.verdict)!==0) return false;
    return true;
  });

  /* This-week rollup */
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const monK = mon.toISOString().slice(0,10);
  const wkLoads = all.filter(l=>l.date>=monK);
  const wkRev = wkLoads.reduce((a,l)=>a+l.revenue,0);
  const wkCM  = wkLoads.reduce((a,l)=>a+l.cm,0);
  const wkHrs = wkLoads.reduce((a,l)=>a+l.hours,0);
  const wkDet = wkLoads.reduce((a,l)=>a+(l.detentionBillable||0),0);

  let h = '<div class="card"><h2>This week — from '+monK+'</h2><div class="kpi-grid">'
    + '<div><div class="kpi sm">'+wkLoads.length+'</div><div class="kpi-label">Loads</div></div>'
    + '<div><div class="kpi sm">'+money(wkRev)+'</div><div class="kpi-label">Revenue</div></div>'
    + '<div><div class="kpi sm" style="color:var(--green)">'+money(wkCM)+'</div><div class="kpi-label">Contribution margin</div></div>'
    + '<div><div class="kpi sm">'+money2(wkHrs>0?wkCM/wkHrs:0)+'</div><div class="kpi-label">Avg $/hour</div></div>'
    + '</div>';
  if(wkDet>0) h += '<div class="banner amber" style="margin-top:12px"><b>'+money(wkDet)+' billable detention this week</b>Confirm every one of these hit an invoice.</div>';
  h += '</div>';

  /* --- Day snapshots (v1.2) — Monday vs Tuesday comparison --- */
  {
    const snaps = (state.dayRollup && state.dayRollup.snapshots) || [];
    h += '<div class="card"><h2>Day snapshots</h2>';
    if(!snaps.length){
      h += '<div class="empty">No days saved yet.<br>Build a day in <b>Calculator → Day rollup</b> and tap <b>Save day snapshot</b>. '
        + 'Each save lands here so you can put Monday next to Tuesday.</div>';
    } else {
      const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      h += '<div class="scroll-x"><table><thead><tr><th>Day</th><th class="n">Loads</th><th class="n">Rev</th>'
        + '<th class="n">CM</th><th class="n">Fixed</th><th class="n">Net</th><th class="n">Hrs</th><th class="n">$/hr</th><th>Model</th><th>Verdict</th><th></th></tr></thead><tbody>';
      snaps.forEach(sn=>{
        const dt = new Date(sn.date+'T00:00:00');
        const lbl = isNaN(dt) ? sn.date : dow[dt.getDay()]+' '+sn.date.slice(5);
        // v1.3 verdicts read GREEN/AMBER/RED; v1.2 snapshots still say
        // GOOD DAY / UNDERWATER, so both vocabularies map here.
        const cls = /^GREEN/.test(sn.verdict) || sn.verdict==='GOOD DAY' ? 'g'
                  : /^RED/.test(sn.verdict)   || sn.verdict==='UNDERWATER' ? 'r' : 'y';
        h += '<tr><td style="white-space:nowrap">'+esc(lbl)+'</td>'
          + '<td class="n">'+sn.loads+'</td>'
          + '<td class="n">'+money(sn.revenue)+'</td>'
          + '<td class="n" style="color:'+(sn.cm>=0?'var(--green)':'var(--red)')+'">'+money(sn.cm)+'</td>'
          + '<td class="n">'+money(sn.fixedTotal)+'</td>'
          + '<td class="n" style="color:'+(sn.net>=0?'var(--green)':'var(--red)')+'">'+money(sn.net)+'</td>'
          + '<td class="n">'+num(sn.hours,1)+'</td>'
          + '<td class="n">'+money2(sn.cmPerHour)+'</td>'
          + '<td><span class="chip '+(sn.model==='v1.3'?'b':'y')+'" title="'
          + (sn.model==='v1.3'
              ? esc('Priced on the T12M model — '+money(sn.revPerLoad||0)+' revenue / '+money(sn.varPerLoad||0)+' variable per load, full daily fixed cost.')
              : 'Priced under v1.2 — rate-card revenue and trucks-running × per-truck fixed cost. Not directly comparable.')
          + '">'+(sn.model==='v1.3'?'v1.3':'v1.2')+'</span></td>'
          + '<td><span class="chip '+cls+'">'+esc(sn.verdict.split(' ')[0])+'</span></td>'
          + '<td><button type="button" class="del" data-dsnap="'+esc(sn.id)+'" title="Delete snapshot">✕</button></td></tr>';
      });
      h += '</tbody></table></div>';
      const best = snaps.slice().sort((a,b)=>b.cmPerHour-a.cmPerHour)[0];
      const avgNet = snaps.reduce((a,x)=>a+x.net,0)/snaps.length;
      h += '<div class="legend">'+snaps.length+' day'+(snaps.length===1?'':'s')+' saved · average net after fixed cost '+money(avgNet)
        + ' · best day '+esc(best.date)+' at '+money2(best.cmPerHour)+'/hr. '
        + 'Net is contribution margin less the full daily fixed cost ('+money(fixedCostPerDay())+'/day = '+money(fixedStackAnnual())
        + '/yr ÷ '+operatingDays()+' operating days), against a breakeven of '+breakevenLoadsPerDay().toFixed(1)+' loads/day. '
        + 'Snapshots saved under v1.2 were priced on trucks-running × '+money(state.settings.dailyFixedCostPerTruck)
        + '/truck/day and a rate-card revenue figure, so they are not directly comparable to v1.3 days — those rows are tagged in the Model column.</div>';
    }
    h += '</div>';
  }

  /* Filters */
  h += '<div class="card"><h2>Filter</h2>'
    + '<div class="fld fld2"><div><label for="fFrom">From</label><input id="fFrom" type="date" value="'+esc(histFilter.from)+'"></div>'
    + '<div><label for="fTo">To</label><input id="fTo" type="date" value="'+esc(histFilter.to)+'"></div></div>'
    + '<div class="fld fld3">'
    + '<div><label for="fCust">Customer</label><select id="fCust"><option value="">All</option>'+custs.map(c=>'<option'+(histFilter.cust===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'
    + '<div><label for="fDrv">Driver</label><select id="fDrv"><option value="">All</option>'+drvs.map(c=>'<option'+(histFilter.drv===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'
    + '<div><label for="fVer">Verdict</label><select id="fVer"><option value="">All</option>'
    + ['ACCEPT','RENEGOTIATE','REJECT'].map(v=>'<option'+(histFilter.verdict===v?' selected':'')+'>'+v+'</option>').join('')+'</select></div>'
    + '</div><div class="btn-row"><button class="act ghost" id="fClear">Clear filters</button></div></div>';

  /* Table */
  h += '<div class="card"><h2>'+rows.length+' load'+(rows.length===1?'':'s')+'</h2>';
  if(!rows.length){
    h += '<div class="empty">No loads match.<br>Run a load in the Calculator and tap <b>Save to history</b>.</div>';
  } else {
    h += '<div class="scroll-x"><table><thead><tr><th>Date</th><th>Customer</th><th>Lane</th><th class="n">Rev</th><th class="n">CM</th><th class="n">$/hr</th><th>Verdict</th><th>Driver</th></tr></thead><tbody>';
    rows.forEach(l=>{
      const cls = l.verdict.indexOf('ACCEPT')===0?'g':l.verdict==='RENEGOTIATE'?'y':'r';
      h += '<tr><td class="num" style="white-space:nowrap">'+esc(l.date.slice(5))+'</td>'
        + '<td>'+esc(l.customer)+'</td>'
        + '<td style="white-space:nowrap">'+esc(l.origin)+'→'+esc(l.destination)+'</td>'
        + '<td class="n">'+money(l.revenue)+'</td>'
        + '<td class="n" style="color:'+(l.cm>=0?'var(--green)':'var(--red)')+'">'+money(l.cm)+'</td>'
        + '<td class="n">'+money2(l.cmPerHour)+'</td>'
        + '<td><span class="chip '+cls+'">'+esc(l.verdict.split(' ')[0])+'</span></td>'
        + '<td style="white-space:nowrap">'+esc((l.driver||'—').split(' ')[0])+'</td></tr>';
    });
    h += '</tbody></table></div>';
    const tRev=rows.reduce((a,l)=>a+l.revenue,0), tCM=rows.reduce((a,l)=>a+l.cm,0), tH=rows.reduce((a,l)=>a+l.hours,0);
    h += '<div class="legend">Filtered totals: '+money(tRev)+' revenue · '+money(tCM)+' contribution margin · '+money2(tH>0?tCM/tH:0)+'/hr average.</div>';
  }
  h += '</div>';

  $('#p-hist').innerHTML = h;

  const bind=(id,k)=>{ const el=document.getElementById(id); if(el) el.addEventListener('change',()=>{ histFilter[k]=el.value; renderHist(); }); };
  bind('fFrom','from'); bind('fTo','to'); bind('fCust','cust'); bind('fDrv','drv'); bind('fVer','verdict');
  document.querySelectorAll('[data-dsnap]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.dsnap;
    if(!confirm('Delete this day snapshot?')) return;
    state.dayRollup.snapshots = state.dayRollup.snapshots.filter(x=>x.id!==id);
    save(); renderHist(); toast('Snapshot deleted');
  }));
  const fc=document.getElementById('fClear');
  if(fc) fc.addEventListener('click',()=>{ histFilter={from:'',to:'',cust:'',drv:'',verdict:''}; renderHist(); });
}

/* =============================================================
   TAB 5 — COMPANY INFO (v1.8)
   -------------------------------------------------------------
   The reference material the operator used to hold in his head or
   in a memory file: who the customers are and what they pay, who
   drives what shift, who is in the office, who to ring, what the
   fleet is, and which rules the dispatch engine is enforcing.

   ALMOST NONE OF THIS IS NEW DATA. The roster, the shift patterns,
   the origin pairings, the payroll, the cutoffs and the QBO
   figures are all constants this app already carried — they were
   just never shown anywhere a human could read them. This tab is a
   view, not a second copy, which is why editing is confined to the
   two things that genuinely have no other home: the rate card and
   the contact book.

const HOME_TERMINAL = { name:'FCGE yard', address:'9240 Harlan Rd, French Camp, CA' };
/* Verizon-measured average dwell inside the Diamond geofences. Quoted in the
   rules card as the reason detention is an exception rather than a norm. */
const DIAMOND_AVG_ONSITE_MIN = 7.5;
/* Ownership, as stated by the operator. Jolene's stake is silent — she is on
   payroll and carries a third of the company, and is deliberately NOT listed
   among the people a decision goes through. */
const FCT_OWNERSHIP = [
  { name:'James Grunsky',     pct:66, role:'Owner / operator — decisions', silent:false },
  { name:'Jolene Giovannoni', pct:33, role:'Silent partner',               silent:true  },
];
/* Stated normalized T12M net. Carried as a constant rather than computed
   because it is an operator normalization, and the app's own line-item
   reconciliation lands somewhere different — see the overview card, which
   prints both and names the gap instead of picking a winner. */
const FCT_STATED_NET_T12M = 802000;

function infoRosterGroups(){
  const roster = dispatchRoster();
  const byCls = {};
  roster.forEach(d=>{
    const cls = (d.shift && d.shift.cls) || 'DAY';
    (byCls[cls] = byCls[cls] || []).push(d);
  });
  return SHIFT_GROUPS.map(g=>({ g:g, drivers:(byCls[g.cls]||[]) }));
}

function renderInfo(){
  const s = state.settings, ci = state.companyInfo, q = state.qbo;
  let h = '';

  /* ---- 1. The company ---- */
  {
    const ct = q.costTotals;
    const actualCost = ct.laborLoaded.value + ct.truckTrailerOps.value + ct.insurance.value
                     + ct.insuranceUnclass.value + ct.subhauler.value + ct.companyVehicle.value
                     + ct.overheadAdmin.value;
    const actualNet = q.revenueT12M.value - actualCost;
    const rentLine  = state.fixedStack.find(l=>l.k==='rent');
    const goForward = actualNet + ((rentLine && !rentLine.on) ? rentLine.amount : 0);
    const statedPct = (FCT_STATED_NET_T12M / q.revenueT12M.value) * 100;
    const be = breakevenLoadsPerDay();

    h += '<div class="card"><h2>French Camp Transport, Inc.</h2>'
      + '<div class="kpi-grid" style="margin-bottom:10px">'
      + '<div><div class="kpi sm">'+money(q.revenueT12M.value)+'</div><div class="kpi-label">Revenue T12M</div></div>'
      + '<div><div class="kpi sm" style="color:var(--green)">'+money(FCT_STATED_NET_T12M)+'</div>'
      + '<div class="kpi-label">Normalized net</div></div>'
      + '<div><div class="kpi sm">'+statedPct.toFixed(2)+'%</div><div class="kpi-label">Net margin</div></div>'
      + '<div><div class="kpi sm">'+be.toFixed(1)+'</div><div class="kpi-label">Breakeven loads/day</div></div>'
      + '</div>';

    FCT_OWNERSHIP.forEach(o=>{
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(o.name)+'</div>'
        + '<div class="row-s">'+esc(o.role)
        + (o.silent ? ' — not a decision stakeholder' : '')+'</div></div>'
        + '<div class="row-v">'+o.pct+'%</div></div>';
    });
    h += '<div class="row"><div class="row-l"><div class="row-t">Primary customer</div>'
      + '<div class="row-s">Diamond Pet Foods, a Foster Farms subsidiary. With Penny Newman, '
      + 'Phil O\'Connell Grain and Integrated Proteins, the Diamond system is '
      + q.diamondPetSharePct.value+'% of revenue.</div></div>'
      + '<div class="row-v">'+q.diamondPetSharePct.value+'%</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Operating days</div>'
      + '<div class="row-s">six days a week</div></div>'
      + '<div class="row-v">'+operatingDays()+'/yr</div></div>';

       both is the only honest option: Settings already shows the reconciliation
       live, so quoting only the normalized figure here would put the app in
       visible contradiction with itself one tab away. */
    h += '<div class="banner amber" style="margin-top:13px"><b>⚑ Two different net figures, both real</b>'

      + (rentLine && !rentLine.on ? ' (rent added back, since it is not being paid)' : '')
      + '. The '+money(Math.abs(FCT_STATED_NET_T12M-goForward))+' gap is normalization adjustments that are not '
      + 'in the cost stack — most likely the '+money(ct.insuranceUnclass.value)+' unclassified insurance still '
      + 'pending review and owner add-backs. Worth reconciling once; until then treat the per-load and per-day '
      + 'figures as the ones to act on, exactly as Settings says.</div>';

    h += '<div class="legend">Breakeven is computed live from the fixed stack and the current contribution per '
      + 'load — it reads '+be.toFixed(1)+' loads/day right now against the 30–31 the operating plan assumes. '
      + 'The dispatch log averages just over 40 loads a day.</div></div>';
  }

  /* ---- 2. Rate cards ---- */
  {
    h += '<div class="card" id="infoRates"><h2>Rate cards '
      + '<span style="font-size:10px;color:var(--green);text-transform:none;letter-spacing:0">✓ '

      + '<div class="hint" style="margin-bottom:12px">Average revenue per load and the fuel-surcharge rule, per '
      + 'customer. Both are editable — an edit here is an override and survives the next rate refresh. '
      + 'Revenue drives the per-customer baseline and the what-if calculator; it does not re-price the dispatch '
      + 'sheet, which books off the lane rate table.</div>';

    const names = Object.keys(CUSTOMER_RATE_DEFAULTS);

      const cr   = (state.customerRates && state.customerRates[name]) || {};
      const card = CUSTOMER_RATE_DEFAULTS[name];
      const rev  = cr.revenuePerLoad != null ? cr.revenuePerLoad : '';
      const meth = cr.fscMethod || 'percent_of_linehaul';
      const unit = fscMethodUnit(meth);
      const note = ci.rateNotes[name] || '';

      h += '<div class="info-rate">'
        + '<div class="info-rate-h"><b>'+esc(name)+'</b>'
        + (cr.qboName && cr.qboName !== name
            ? '<span class="info-alt" title="How this customer is spelled on the QBO invoice">'+esc(cr.qboName)+'</span>' : '')
        + '</div>'
        + '<div class="fld fld2" style="margin-bottom:6px">'
        + '<div><label for="ir'+i+'">Avg revenue / load</label>'
        + '<input id="ir'+i+'" type="number" inputmode="decimal" step="1" data-inforev="'+esc(name)+'" '
        + 'value="'+esc(rev)+'" placeholder="'+esc(card.avgRevenue)+'"></div>'
        + '<div><label for="im'+i+'">FSC method</label>'
        + '<select id="im'+i+'" data-infofscm="'+esc(name)+'">'+fscMethodOptions(meth)+'</select></div>'
        + '</div>';
      if(meth !== 'none'){
        h += '<div class="fld"><label for="iv'+i+'">FSC rate ('+esc(unit)+')</label>'
          + '<input id="iv'+i+'" type="number" inputmode="decimal" step="0.5" data-infofsc="'+esc(name)+'" '
          + 'value="'+esc(cr.fscValue==null?'':cr.fscValue)+'"></div>';
      } else if(cr.fscIncluded){
        h += '<div class="hint" style="margin-bottom:8px"><b>Fuel surcharge is inside the rate.</b> '
