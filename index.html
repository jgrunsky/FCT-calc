  const beforeDash = o.split(' - ')[0].trim();
  if(beforeDash && beforeDash !== o) trials.push(beforeDash);
  const twoWord = o.split(/\s+/).slice(0,2).join(' ');
  if(twoWord && trials.indexOf(twoWord) < 0) trials.push(twoWord);
  const firstWord = o.split(/\s+/)[0];
  if(firstWord && trials.indexOf(firstWord) < 0) trials.push(firstWord);
  for(const trial of trials){
    const map = LANE_MILES[trial];
    if(!map) continue;
    for(const destKey in map){
      if(d.indexOf(destKey) >= 0) return map[destKey];
    }
  }
  return null;
}
/* v2.1.21: canonical lane key ("PNG→LATHROP" style) for calibration lookups.
   Must match the worker's canonicalLaneKey exactly, or the factors published
   by the worker will not resolve here. */
function laneKeyFor(origin, destination){
  const o = normOrigin(origin);
  const d = String(destination||'').toUpperCase();
  if(!o) return null;
  const trials = [o];
  const beforeDash = o.split(' - ')[0].trim();
  if(beforeDash && beforeDash !== o) trials.push(beforeDash);
  const twoWord = o.split(/\s+/).slice(0,2).join(' ');
  if(twoWord && trials.indexOf(twoWord) < 0) trials.push(twoWord);
  const firstWord = o.split(/\s+/)[0];
  if(firstWord && trials.indexOf(firstWord) < 0) trials.push(firstWord);
  for(const trial of trials){
    const map = LANE_MILES[trial];
    if(!map) continue;
    for(const destKey in map){
      if(d.indexOf(destKey) >= 0) return trial + '→' + destKey;
    }
  }
  return null;
}
/* v2.1.21: return { factor, source, laneKey } for a given lane. Order of
   precedence:
     1. per-lane factor from worker (if lane has ≥5 loads in window)
     2. fleetFactor (weighted average across the whole calibrated window)
     3. 1.0 (no calibration data yet — behaves like pre-v2.1.21)
   source ∈ 'lane' | 'fleet' | 'none' so the UI can label the pill. */
function laneCalibrationFactor(origin, destination){
  const lc = state.laneCalibration;
  const laneKey = laneKeyFor(origin, destination);
  if(!lc || !lc.ok){
    return { factor: 1.0, source: 'none', laneKey: laneKey };
  }
  if(laneKey && lc.lanes && lc.lanes[laneKey] && isFinite(Number(lc.lanes[laneKey].factor))){
    return { factor: Number(lc.lanes[laneKey].factor),
             source: 'lane', laneKey: laneKey,
             loadsInWindow: lc.lanes[laneKey].loadsInWindow };
  }
  const ff = Number(lc.fleetFactor);
  if(isFinite(ff) && ff > 0){
    return { factor: ff, source: 'fleet', laneKey: laneKey };
  }
  return { factor: 1.0, source: 'none', laneKey: laneKey };
}

function pngLaneRevenue(origin, destination, commodity, lbs){
  const rule = pngLaneRateFor(origin, destination, commodity);
  if(!rule) return null;
  const w = Number(lbs) > 0 ? Number(lbs) : (Number((state.laneDefaults||{}).lbs) || 54000);
  const linehaul = w * rule.ratePerLb;
  const fsc = (w / 2000) * rule.fscPerTon;
  return { amount: linehaul + fsc, linehaul, fsc, rule };
}

/* What v1.2–v1.7 SHIPPED as the FSC rule per customer.
   Needed only by the v1.8 upgrade, and needed badly: mergeCustomerRates()
   lets a saved value win over a shipped one, which is right for an operator
   edit and wrong for a stale default that was never touched. Without this
   record every v1.7 save would carry its own copy of the old rules forward
   and the new rate card would never take effect — American River Ag in
   particular would stay at "no fuel surcharge" forever.

   So: saved entry still equal to what that release shipped -> it is a
   default, replace it. Anything else is the operator's and is left alone. */
const V17_SHIPPED_CUSTOMER_RATES = {
  'Diamond Pet Foods':      { fscMethod:'percent_of_linehaul', fscValue:30   },
  "Phil O'Connell Grain":   { fscMethod:'percent_of_linehaul', fscValue:30   },
  'Foster Farms':           { fscMethod:'percent_of_linehaul', fscValue:30   },
  'Penny Newman':           { fscMethod:'per_ton',             fscValue:2    },
  'American River Ag':      { fscMethod:'none',                 fscValue:null },
};

/* Resolve which FSC rule applies to a customer.
   No override -> settings default (percent_of_linehaul @ 30%). */
function fscRuleFor(cust){
  const r = state.customerRates && state.customerRates[cust];
  if(r && r.fscMethod){
    return { method:r.fscMethod, value:(r.fscValue==null?0:Number(r.fscValue)), source:'customer', note:r.note||'' };
  }
  const s = state.settings;
  return { method: s.defaultFscMethod || 'percent_of_linehaul',
           value: Number(s.defaultFscPercent!=null ? s.defaultFscPercent : 33),
           source:'default', note:'' };
}
/* ctx = { linehaul, lbs, loadedMi } */
function fscAmount(method, value, ctx){
  const v = Number(value)||0;
  switch(method){
    case 'percent_of_linehaul': return (Number(ctx.linehaul)||0) * (v/100);
    case 'per_ton':             return ((Number(ctx.lbs)||0)/2000) * v;
    case 'per_loaded_mile':     return (Number(ctx.loadedMi)||0) * v;
    case 'flat':                return v;
    case 'none':                return 0;
    default:                    return (Number(ctx.linehaul)||0) * (v/100);
  }
}
function fscRuleText(rule){
  if(rule.method==='none') return 'no fuel surcharge';
  const m = FSC_METHODS.find(x=>x.id===rule.method);
  const suffix = m?m.suffix:'';
  return (rule.method==='percent_of_linehaul' ? rule.value+'%' + ' of linehaul'
        : rule.method==='flat' ? money2(rule.value)+' flat'
        : money2(rule.value)+suffix);
}

/* Baseline $/hr per customer.
   Derived, not pulled: built from the verified rate card against a typical
   FB profile (48,000 lb, 120 loaded mi, 5.0 hr on-clock) so the verdict
   engine has something to judge against on day one. As soon as a customer
   has >= MIN_HIST_LOADS real loads in History, actual logged performance
   replaces this seed entirely.
   v1.2: the seed now uses that customer's real FSC rule instead of a flat
   $0.30/mile, so a Penny Newman ($2/ton) baseline no longer looks the same
   as a Diamond Pet (30% of linehaul) baseline. */
const MIN_HIST_LOADS = 3;
const SEED_PROFILE = { lbs:48000, loadedMi:120, deadheadMi:25, hours:5.0 };
function seedBaselineFor(custName, cfg){
  const p = SEED_PROFILE;
  const linehaul = p.lbs*cfg.ratePerLb;
  const rule = fscRuleFor(custName);
  const rev = linehaul + fscAmount(rule.method, rule.value, {linehaul:linehaul, lbs:p.lbs, loadedMi:p.loadedMi});
  const mi  = p.loadedMi + p.deadheadMi;
  const vc  = mi*fuelPerMile() + mi*cfg.wearPerMile + p.hours*cfg.defaultDriverRate;
  return (rev-vc)/p.hours;
}

/* =============================================================
   FUEL COST (v1.2)
   -------------------------------------------------------------
   v1.1 hard-coded $0.60/mi (QBO fuel $724,392 ÷ 1.2M mi). That is a
   trailing-twelve-month average, so it lags the pump by up to a year.
   Fuel cost per mile is now derived live:

       fuelCostPerMile = currentDieselPricePerGal / fleetAvgMPG

   Confirmed fuel vendors (QBO AP aging 2026-07-27) are Ramos Oil Co
   (bulk to the yard tank) and Diesel Master (fuel card fills). Those
   bills are where the real $/gal lives.

   TODO v1.3 — POWER AUTOMATE: extend the flow to pull the latest
   Ramos Oil bill from QBO (total + gallons off the bill line detail)
   and write currentDieselPricePerGal + lastFuelPriceUpdate back into
   this app automatically. Blocked today because the QBO MCP connector
   exposes bill totals only, not line detail, so gallons cannot be read
   through it. Until then this is a manual Settings entry with a
   7-day staleness nudge.
   ============================================================= */
/* Live pricing fallback = QBO-aligned operator figures, not EIA retail.
   $4.50/gal ÷ 6.0 MPG = $0.75/mi, which matches QBO T12M fuel ~$724k on
   ~965k miles. EIA CA weekly avg ($6.919 as of 2026-08-01) is a reference
   only — v2.1.25 auto-applying it as live diesel crushed MTD profit.
   v2.1.27: never use EIA as the calc fallback. */
const FUEL_FALLBACK_PPG = 4.50;
const FUEL_FALLBACK_MPG = 6.0;
const EIA_CA_RETAIL_PPG = 6.919; // reference only — not live FCT pump price
const FUEL_STALE_DAYS = 7;

function fuelPerMile(){
  const s = state.settings;
  const ppg = Number(s.currentDieselPricePerGal);
  const mpg = Number(s.fleetAvgMPG);
  // Guard: a blanked-out MPG must not divide by zero and poison every load.
  if(!(ppg>0) || !(mpg>0)) return FUEL_FALLBACK_PPG / FUEL_FALLBACK_MPG;
  return ppg / mpg;
}
function fuelBasisText(){
  const s = state.settings;
  return money2(Number(s.currentDieselPricePerGal)||FUEL_FALLBACK_PPG)+'/gal ÷ '
       + (Number(s.fleetAvgMPG)||FUEL_FALLBACK_MPG)+' MPG';
}
function fuelPriceAgeDays(){
  const d = state.settings.lastFuelPriceUpdate;
  if(!d) return null;
  const t = new Date(String(d).slice(0,10)+'T00:00:00');
  if(isNaN(t.getTime())) return null;
  return Math.floor((Date.now()-t.getTime())/86400000);
}
/* v2.1.47: staleness is last-updated age only. fuelPriceConfirmed / shipped
   $4.50 must not paint DEFAULT chips, "never confirmed", or $4.50 lectures —
   diesel is the number on this device. */
function fuelPriceUnconfirmed(){ return !state.settings.fuelPriceConfirmed; }
function fuelPriceStale(){
  const a = fuelPriceAgeDays();
  return a!=null && a>FUEL_STALE_DAYS;
}
function fuelPriceWhy(){
  const a = fuelPriceAgeDays();
  return a==null ? 'Diesel price has no last-updated date.' : 'Diesel price was last set '+a+' days ago.';
}
/* Small inline nudge used next to fuel figures. Dated-stale only — never DEFAULT. */
function fuelStaleTag(){
  if(!fuelPriceStale()) return '';
  return '<span class="est" style="color:var(--amber);background:var(--amber-bg);border-color:color-mix(in oklab,var(--amber) 35%,transparent)" '
       + 'title="'+esc(fuelPriceWhy()+' Update it in Settings — fuel is the single biggest variable cost per mile.')+'">🟠 UPDATE</span>';
}

function normalizeFixedStack(saved){
  const base = defaultFixedStack();
  if(!Array.isArray(saved)) return base;
  return base.map(line=>{
    const hit = saved.find(x=>x && x.k===line.k);
    if(!hit) return line;
    const out = Object.assign({}, line);
    if(hit.amount!=null && !isNaN(Number(hit.amount))) out.amount = Number(hit.amount);
    if(typeof hit.on==='boolean') out.on = hit.on;
    return out;
  });
}

/* ---- Fixed side ---- */
function fixedStackAnnual(){
  const st = state.fixedStack || defaultFixedStack();
  return st.reduce((a,l)=> a + (l.on ? (Number(l.amount)||0) : 0), 0);
}
function operatingDays(){ return Number(state.settings.operatingDaysPerYear)>0 ? Number(state.settings.operatingDaysPerYear) : 365; }
function fixedCostPerDay(){ return fixedStackAnnual() / operatingDays(); }
/* Fixed cost carried by a single load, for the fully-loaded single-load net. */
function loadsPerYear(){ return Number(state.settings.loadsPerYear)>0 ? Number(state.settings.loadsPerYear) : 12150; }
function fixedPerLoad(){ return fixedStackAnnual() / loadsPerYear(); }

/* ---- Fleet ----
   Two distinct counts. trucksInFleet is the asset base the fixed cost is
   reported against; trucksRunningPerDay is how many actually roll. Neither
   changes the daily fixed nut — that is owed regardless — so these are
   reporting/allocation figures, not cost drivers. */
function trucksInFleet(){ return Number(state.settings.trucksInFleet)>0 ? Number(state.settings.trucksInFleet) : 24; }
function trucksRunningPerDay(){
  const s = state.settings;
  if(Number(s.trucksRunningPerDay)>0) return Number(s.trucksRunningPerDay);
  if(Number(s.trucksPerDay)>0) return Number(s.trucksPerDay);   // legacy save
  return 22;
}
function fixedPerTruckDay(){ return fixedCostPerDay() / trucksInFleet(); }

/* ---- Variable side: five components, each editable ----
   Returned as a list so the calculator breakdown and the Settings
   card render from exactly the same source. */
/* miles/hours default to the fleet averages, but a rate tier passes its own
   so a 300-mile Harris turn is not costed as an 80-mile Lathrop run. */
/* rateOv (v1.5) is the FULLY LOADED $/hr for a named driver. The estimated
   side leaves it out and gets the fleet default; the Verizon actual side
   passes the driver who actually ran the load, because a 24.00 driver and a
   21.00 driver on the same lane are not the same cost. */
function variableComponents(milesOv, hoursOv, rateOv){
  const s = state.settings;
  const mi   = (milesOv!=null && !isNaN(Number(milesOv))) ? Number(milesOv) : (Number(s.avgMilesPerLoad)||0);
  const hrs  = (hoursOv!=null && !isNaN(Number(hoursOv))) ? Number(hoursOv) : (Number(s.hoursPerLoad)||0);
  const rate = (rateOv!=null && !isNaN(Number(rateOv)) && Number(rateOv)>0)
             ? Number(rateOv) : (Number(s.defaultDriverRate)||0);
  const wear = Number(s.wearPerMile)||0;
  /* v2.0.9 / v2.1.38: subhauler amortization removed and stays removed.
     Historical model spread ~$362,843/yr ÷ ~12,150 loads ≈ $29.88 across
     EVERY load, including in-house ones that never touched a sub.
     Amount on this line is 0. $150 is applied only on Lopez/<name> or
     Prado/<name> rows in computeDayRow. Do not put QBO 326 back into
     this pool, into otherVariablePerLoad, or as a per-load amortization.
     Settings.subhaulerPerYear / QBO_SEED subhauler326 are display only. */
  /* v2.1.36: otherVariablePerLoad ships at $0. The old $35 plug is not
     in 2025 QBO shop bills (313.2/3/4). Tarps $510 already sit inside
     313.2, so they are in wearPerMile. A leftover operator-typed other
     still drops on ADP days via applyAdpToModeled. Wear and the $150
     Lopez/Prado sub stay. */
  const other= Number(s.otherVariablePerLoad)||0;
  return [
    { k:'fuel',   label:'Fuel',              amount: mi*fuelPerMile(),
      basis: num(mi)+' mi × '+money2(fuelPerMile())+'/mi ('+fuelBasisText()+')' },

    { k:'wear',   label:'Wear / maintenance',amount: mi*wear,

    { k:'subhauler', label:'Subhauler pro-rata', amount: 0,
      basis: 'v2.0.9 / v2.1.38: pooled amount stays 0. $150 only on Lopez/<name> · Prado/<name> rows in computeDayRow. QBO 326 '+money(Number(s.subhaulerPerYear)||0)+'/yr is display/reconciliation only — not amortized per load, not in other' },

      basis: 'v2.1.36: $0. Not in 2025 QBO shop bills. Tarps $17,874 live in 313.9 (wear). Old $35/load plug was fake on EST and ADP days. Bonuses and 2025 lawsuit legal are not absorbed here' },

}
function variableCostPerLoad(){ return variableComponents().reduce((a,c)=>a+c.amount,0); }
function revenuePerLoad(customer){
  const r = customer && state.customerRates ? state.customerRates[customer] : null;
  if(r && r.revenuePerLoad!=null && !isNaN(Number(r.revenuePerLoad)) && Number(r.revenuePerLoad)>0) return Number(r.revenuePerLoad);
  const d = Number(state.settings.revenuePerLoadDefault);

/* Rate for one classified row. Precedence, most specific first:
     per-row override -> per-customer-label rate -> per-bucket rate
     -> Diamond: the T12M figure / non-Diamond: the $500 placeholder
   Returns the figure plus whether it is a real rate or still a placeholder,
   so the UI can flag the estimate honestly instead of presenting $500 as fact. */
function pocDestHint(r){
  /* v2.1.43: POC dest is column G (Truck) — ARDENT / PURINA / FARMERS —
     not the classified customer name. Using custLabel first made every
     FCGE→Ardent row miss the lane matrix and fall through to the $425
     Phil O'Connell blend (tooltip: origin FCGE → 'Phil O'Connell Grain'). */
  if(!r) return '';
  const fromTruck = (typeof customerLabelFrom==='function') ? customerLabelFrom(r.truck) : '';
  const dest = r.destLabel || r.destination || fromTruck || '';
  return String(dest||'').trim();
}
function revenueForRow(r){
  const ov = Number(r && r.revenueOverride)||0;
  if(ov>0) return { amount:ov, est:false, basis:'row override' };
  const T = state.rateTable || defaultRateTable();
  const label = normLabel(r && r.custLabel);

  /* v2.1.17a: PENNY NEWMAN lane pricing re-enabled with narrower matching
     (PNG/PENNY NEWMAN origin + D.P. destination + PN commodity list only).
     50-day QBO reconciliation confirms 66.9% of D.P.-Ripon and 69.7% of
     D.P.-Lathrop loads are Penny Newman-billed at $0.00575-0.0075/lb + $2/ton
     FSC, NOT Diamond-billed at $0.00650+33% FSC. */
  const pn = pngLaneRevenue(r && r.origin, r && (r.deliveryPoint || r.destination), r && r.commodity, r && r.lbs);
  if(pn){
    __pnPricedThisRender++;
    return { amount: pn.amount, est:false,
             basis: 'Penny Newman ' + pn.rule.origin + ' → ' + pn.rule.dest
                  + ' — $' + pn.rule.ratePerLb.toFixed(5) + '/lb + $' + pn.rule.fscPerTon + '/ton FSC ('
                  + pn.rule.commodityTier + ')' };
  }

  /* v1.9: POC-brokered lane rate lookup. Fires for any non-Diamond row
     whose origin is a POC-signature pickup point (POC_ORIGINS) or whose
     classified customer is Phil O'Connell Grain. Uses the destination
     hint on r.destLabel — either set by classifyLoad's POC branch, or
     inferred from the Truck cell (ARDENT / PURINA / FARMERS) — that is
     where POC dest lives on the sheet. Never use custLabel "Phil O'Connell
     Grain" as the dest key; that misses the lane matrix and falls through
     to the $425 blend. Falls through to the POC customer avgRevenue when no
     lane matches. */
  const rowBucket = (r && r.bucket) || '';
  const isPocRow = r && rowBucket !== 'diamond' && (
       r.customer === "Phil O'Connell Grain"
    || r.custLabel === "Phil O'Connell Grain"
    || isPocOrigin(normOrigin(r.origin))
  );
  if(isPocRow){
    const dest = pocDestHint(r) || r.custLabel || '';
    /* v2.1.23: commodity is passed so commodity-gated lanes (Perdue ORG CORN,
       ADM Port RICE) can be enforced — other commodities on the same lane
       fall through to the blended average. */
    const lane = pocLaneRevenue(r.origin, dest, r.lbs, r.commodity);
    if(lane) return { amount: lane.amount, est:false, basis: laneRateBasisText(lane) };
    // No lane match: fall through to POC customer avgRevenue.
    const custRev = revenuePerLoad("Phil O'Connell Grain");
    if(custRev > 0) return { amount: custRev, est:true,
             basis: "POC — no lane match for origin '" + (r.origin||'?') + "' → '" + (dest||'?')
                  + "' — using blended avg $" + custRev + '/load.' };
  }

  if(label && T.labels[label]!=null && Number(T.labels[label])>0)
    return { amount:Number(T.labels[label]), est:false, basis:label+' rate' };
  const b = (r && r.bucket) || 'diamond';
  if(b==='diamond'){
    const tier = diamondTier(r && r.origin, r && r.truck);
    return { amount: tierRevenue(tier, r && r.lbs), est:!tier.verified, tier:tier.k,
             basis: tier.label + (tier.useT12M ? ' — T12M average' : ' — '+tierRateText(tier)) };
  }
  const br = Number(T.buckets[b]);
  const placeholder = Number(state.settings.nonDiamondRevenuePerLoad)||500;
  /* v2.1.29: operator-typed lane rates apply to non-POC placeholder
     rows the same way they fill POC gaps — before the $500 guess. */
  const dest2 = pocDestHint(r) || r.custLabel || '';
  const ovRule = laneRateOverrideFor(r.origin, dest2, r.commodity);
  if(ovRule){
    const ovLane = applyLaneRateRule(ovRule, r.lbs);
    if(ovLane) return { amount: ovLane.amount, est:false, basis: laneRateBasisText(ovLane) };
  }
  return { amount: br>0?br:placeholder, est:true,
           basis: bucketMeta(b).label+' placeholder — no verified rate yet' };
}
function contributionPerLoad(customer){ return revenuePerLoad(customer) - variableCostPerLoad(); }
function breakevenLoadsPerDay(){
  const cm = contributionPerLoad();
  return cm>0 ? fixedCostPerDay()/cm : 0;
}
/* Modelled full-year net at the calibrated averages. Shown next to the
   T12M actual so the two are never quietly out of step. */
function modelledAnnualNet(){
  const n = loadsPerYear();
  return n*revenuePerLoad() - n*variableCostPerLoad() - fixedStackAnnual();
}

/* =============================================================
   LOAD CATEGORISATION (v1.3) — four buckets
   -------------------------------------------------------------
   Strategy, per operator 2026-07-27: capacity is deliberately
   RESERVED for the Jun–Nov seasonal harvest work. Off-season fill
   is meant to be SPOT only, never a standing commitment, because
   a steady customer signed in February is still there in August
   when the seasonal freight needs the trucks.

   So every imported row is sorted into one of four buckets:

     DIAMOND   the Diamond Pet system. Detected by any of:
               - sitting under a D.P. LATHROP / D.P. RIPON banner
               - PO matching 7xxxx-n (the Diamond release series)
               - commodity carrying a -NNNN product code
               - the truck column holding a trailer pair like 64/65
     STEADY    year-round non-Diamond: Purina, Cargill, Farmers,
               Diestel, CNP
     SEASONAL  Jun–Nov harvest-tied: POC, Hunt Behrens, Post Brands
     SPOT      occasional / one-off: Perf. Pet, Lockwood, and any
               label not yet assigned

   Verified against the 2026 log (7,693 load rows): this puts 80.0%
   in DIAMOND, against the 79% Diamond revenue concentration QBO
   reports independently. The two agreeing is the check that the
   signature rules are picking up the right freight.

   Customer labels live in column G, which normally holds the
   trailer pair — when a non-Diamond customer is on the load, the
   name goes there instead and the trailer pair shifts right.
   ============================================================= */
const LOAD_BUCKETS = [
  { k:'diamond',  label:'Diamond',  short:'DIA', color:'var(--amber)',  desc:'Diamond Pet system — D.P. banner or Diamond load signature' },
  { k:'steady',   label:'Steady',   short:'STE', color:'var(--accent)', desc:'Year-round non-Diamond customers' },
  { k:'seasonal', label:'Seasonal', short:'SEA', color:'var(--purple)', desc:'Jun–Nov harvest-tied customers' },
  { k:'spot',     label:'Spot',     short:'SPO', color:'var(--blue)',   desc:'Occasional / one-off — the only thing that should fill off-season' },
];
function bucketMeta(k){ return LOAD_BUCKETS.find(b=>b.k===k) || LOAD_BUCKETS[3]; }

/* The seasonal reserve window. Months are 1-based. */
const SEASON_MONTHS = [6,7,8,9,10,11];   // June–November
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function inSeasonWindow(iso){
  if(!iso) return false;
  const m = +String(iso).slice(5,7);
  return SEASON_MONTHS.indexOf(m) >= 0;
}

/* Customer labels by bucket. Editable in Settings — James assigns new names
   as they show up. Everything here was confirmed present in column G of the
   2026 log; the counts in the comments are that year's load volume. */
function defaultCustomerLabels(){
  return {
    steady:   ['PURINA','CARGILL','FARMERS','DIESTEL','CNP'],              // 203/35/179/84/121
    seasonal: ['POC','HUNT BEHRENS','POST BRANDS'],                        // 5/3/3
    spot:     ['PERF. PET','PERFECTION PET','LOCKWOOD'],                   // 18/2/1
  };
}
/* Column-G values that are NOT customer names — origin codes, equipment and
   status text that shares the column. Without this list they would show up as
   unassigned "customers" and clutter the rate table. */
/* v2.1.23 (2026-08-21): ASSOC removed from LABEL_NOISE — it's now a
   billable destination (Perdue Farms ORG CORN → Associated Feed). */
const LABEL_NOISE = ['FCG','FCGE','PNG','ARA','VAN','VAN LOAD','PUSH','DPF','XX/XX','SF','VIF'];

function normLabel(v){
  return String(v==null?'':v).toUpperCase().replace(/\s+/g,' ').trim();
}

/* Diamond PICKUP POINTS (v1.3, operator-confirmed 2026-07-27).
   Harris and Fosters are origins Diamond freight is collected from, not
   customers of their own — "we bill Diamond for Harris and Fosters". A load
   off either origin is Diamond work and prices on the Diamond card.

   NOT to be confused with the QBO customer entities Foster Farms (id 838) and
   Foster Commodities (id 74), which are separate accounts carrying their own
   historical AR and their own FSC rules. Those are legacy/other arrangements;
   this list only ever touches origin classification, never customer records.

   Real spellings in the 2026 log: HARRIS (278), FOSTERS (277), FOSTERS. (1),
   FOSTERS' (1) — hence the punctuation strip rather than an exact match. */
const DIAMOND_ORIGINS = ['HARRIS','FOSTER','FOSTERS'];

/* =============================================================
   DIAMOND RATE TIERS (v1.3, operator-confirmed 2026-07-27)
   -------------------------------------------------------------
   Diamond is not one rate. Three tiers, by pickup origin:

     standard  PNG / FCGE / ARA / FCG -> D.P. Lathrop or Ripon
               $0.00677/lb + 30% FSC. On 48,000 lb the card
               computes $422.45 — but T12M actuals realise $522
               a load. That $99.55 gap is accessorials, heavier
               loads and detention the card alone misses, so the
               tier applies the T12M figure and shows the card
               next to it rather than quietly picking one.
     fosters   $18/ton + 30% FSC. 48,000 lb = 24 tons = $432
               linehaul + $129.60 = $561.60. Livingston/Modesto,
               a short run off FCGE.
     harris    Flat ~$1,100. Long haul from Harris Ranch /
               Coalinga, ~300 mi round trip, a full-day turn.
               FSC is INSIDE the flat rate — nothing added on top.

   Miles and hours are per-tier too, so the variable side moves
   with the lane instead of every Diamond load being priced as an
   80-mile, 5-hour run.
   ============================================================= */
function defaultDiamondTiers(){
  return [
    { k:'standard', label:'Standard Diamond', match:'PNG / FCGE / ARA / FCG → D.P. Lathrop or Ripon',
      method:'per_lb', rate:0.00650, fscPct:33, fscIncluded:false, minWeight:52000,
      miles:50, hours:5, useT12M:false, verified:true,
      note:'v2.0.10: rebased off actual PNG→Lathrop invoice math. $0.00650/lb × 52,000 lb min-weight × 1.33 FSC = $449.54/load — matches Aug 11-13 DPF invoices. The old useT12M shortcut booked a flat $508 (the T12M blended average) on every standard-tier load, which over-counted by ~$60/load because the $522 T12M numerator included Harris ($1,100) and Fosters ($575) premium loads. Standard-tier now prices off the card the same way Fosters and Harris do.' },
    { k:'fosters', label:'Fosters premium', match:'origin FOSTERS / FOSTER / FOSTER’S',
      method:'per_ton', rate:18, fscPct:33, fscIncluded:false,
      miles:40, hours:4.5, useT12M:false, verified:false,
      note:'$18/ton plus 30% FSC. Livingston / Modesto area — short run off FCGE. FSC assumed to match standard Diamond until the operator confirms.' },
    /* v1.4. Foster's super-hopper lane. Spec.md special lanes: "Foster's
       super-hopper: Chicken Meal -> trailer #106". equipment_constraints.json
       confirms the pairing from the live log — a 106 tag in the truck/trailer
       column with a Foster origin is the single super hopper, 73 loads of
       Chicken Meal (Fosters) in the 2026 year to date.

       It seeds to the Fosters premium exactly ($18/ton + 30% FSC, same miles
       and hours), so splitting it out moves NO money today. The point is that
       it can now be moved on its own: the operator can reprice the super-hopper
       lane without repricing every Fosters load, which is not possible while
       the two share one tier. */
    { k:'lane106', label:'Lane #106 (Fosters variant)', match:'origin FOSTERS + truck/trailer 106 — super hopper',
      method:'per_ton', rate:18, fscPct:33, fscIncluded:false,
      miles:40, hours:4.5, useT12M:false, verified:false,
      note:'Seeded to the Fosters premium rate ($18/ton + 30% FSC). Single-unit equipment — only one super hopper exists, so two 106 loads on a day is a conflict, not a plan.' },
    { k:'harris', label:'Harris premium', match:'origin HARRIS',
      method:'flat', rate:1100, fscPct:0, fscIncluded:true,
      miles:300, hours:9, useT12M:false, verified:false,
      note:'Flat ~$1,100 per load, long haul from Harris Ranch / Coalinga. FSC is included in the flat rate, so no 30% goes on top. ~300 mi round trip, 8–10 hr full-day turn.' },
  ];
}
function normalizeDiamondTiers(t){
  const base = defaultDiamondTiers();
  if(!Array.isArray(t)) return base;
  return base.map(tier=>{
    const hit = t.find(x=>x && x.k===tier.k);
    if(!hit) return tier;
    const out = Object.assign({}, tier);
    ['rate','fscPct','miles','hours','minWeight'].forEach(k=>{
      if(hit[k]!=null && !isNaN(Number(hit[k]))) out[k]=Number(hit[k]);
    });
    if(typeof hit.fscIncluded==='boolean') out.fscIncluded=hit.fscIncluded;
    if(typeof hit.useT12M==='boolean')     out.useT12M=hit.useT12M;
    return out;
  });
}
function diamondTiers(){ return state.diamondTiers || defaultDiamondTiers(); }
/* Which tier a Diamond load falls in, from its pickup origin — and, for the
   super-hopper lane, from the truck/trailer cell as well. A bare "106" in a
   truck column is not enough on its own (truck numbers collide with trailer
   numbers), so the origin has to agree. */
function isLane106(origin, truck){
  const o = normOrigin(origin);
  if(o!=='FOSTER' && o!=='FOSTERS') return false;
  return /(^|[^0-9])106([^0-9]|$)/.test(String(truck||''));
}
function diamondTierKey(origin, truck){
  const o = normOrigin(origin);
  if(o==='HARRIS') return 'harris';
  if(isLane106(origin, truck)) return 'lane106';
  if(o==='FOSTER' || o==='FOSTERS') return 'fosters';
  return 'standard';
}
function diamondTier(origin, truck){
  const k = diamondTierKey(origin, truck);
  return diamondTiers().find(t=>t.k===k) || diamondTiers()[0];
}
/* What the tier's rate structure bills on a given weight, FSC included. */
function tierCardRevenue(tier, lbs){
  const raw = Number(lbs)>0 ? Number(lbs) : Number(state.laneDefaults.lbs)||48000;
  // v2.0.10: honor a per-tier minWeight floor the same way pocLaneRevenue does
  // on POC lanes. Standard Diamond bills at the 52,000 lb minimum per PNG→DPF
  // invoice math even when dispatch weight came in lighter (or as the 48K default).
  const minW = Number(tier.minWeight)||0;
  const w = minW > 0 ? Math.max(raw, minW) : raw;
  let linehaul;
  if(tier.method==='per_ton')     linehaul = (w/2000) * Number(tier.rate);
  else if(tier.method==='flat')   linehaul = Number(tier.rate);
  else                            linehaul = w * Number(tier.rate);
  const fsc = tier.fscIncluded ? 0 : linehaul * ((Number(tier.fscPct)||0)/100);
  return { linehaul:linehaul, fsc:fsc, total:linehaul+fsc };
}
/* What the app actually books for the tier. Standard defers to the
   T12M-calibrated figure so the whole model stays reconciled; the other two
   bill their quoted rate, which is more specific than a blended average. */
function tierRevenue(tier, lbs){
  if(tier.useT12M) return revenuePerLoad('Diamond Pet Foods');
  return tierCardRevenue(tier, lbs).total;
}
function tierRateText(tier){
  const base = tier.method==='per_ton' ? money2(tier.rate)+'/ton'
             : tier.method==='flat'    ? money(tier.rate)+' flat'
             : '$'+Number(tier.rate).toFixed(5)+'/lb';
  return base + (tier.fscIncluded ? ' (FSC included)' : ' + '+(Number(tier.fscPct)||0)+'% FSC');
}
function tierVariable(tier){
  return variableComponents(tier.miles, tier.hours).reduce((a,c)=>a+c.amount,0);
}
function tierContribution(tier, lbs){ return tierRevenue(tier, lbs) - tierVariable(tier); }
function normOrigin(v){
  // Uppercase, collapse whitespace, drop trailing punctuation and apostrophes
  // so FOSTERS. / FOSTERS' / FOSTER'S all land on FOSTERS.
  return String(v==null?'':v).toUpperCase().replace(/\s+/g,' ').trim().replace(/[.'`]/g,'');
}
function isDiamondOrigin(origin){
  return DIAMOND_ORIGINS.indexOf(normOrigin(origin)) >= 0;
}
/* Pull the customer label out of the truck column, if there is one there. */
function customerLabelFrom(truckCell){
  const g = normLabel(truckCell);
  if(!g) return '';
  if(/^\d+\s*\/\s*\d+$/.test(g)) return '';    // trailer pair
  if(/^\d+(\.\d+)?$/.test(g)) return '';       // bare truck number
  if(LABEL_NOISE.indexOf(g) >= 0) return '';
  return g;
}
function labelBucket(label){
  if(!label) return '';
  const L = state.customerLabels || defaultCustomerLabels();
  const hit = k => (L[k]||[]).some(x=>normLabel(x)===label);
  if(hit('steady'))   return 'steady';
  if(hit('seasonal')) return 'seasonal';
  if(hit('spot'))     return 'spot';
  return '';
}

/* v1.8.2: POC (Phil O'Connell Grain) brokers freight through FCT to a rotating
   set of destinations. On the dispatch sheet these show up with non-Diamond
   customer/destination labels. Map those to POC so the rate card applies. */
const POC_DESTINATIONS = [
  'DIESTEL', 'CNP', 'CAL NATURAL', 'CAL NATURAL PRODUCTS',
  'IWP SELMA', 'IWP', 'SELMA',
  'PLEASANT GROVE', 'SUNWEST', 'CF&R', 'CFR',
  'FCGE',  // FCGE-origin outbound loads billed to POC
  /* v1.9 (2026-08-03): added the mill destinations POC brokers freight to
     that we confirmed on QBO invoices 2026-06 through 2026-07-31. Without
     these, a PNG → Purina load (POC-brokered) was falling into steady
     labelled 'PURINA' and pricing off the $500 bucket placeholder instead
     of the real ~$360/load POC rate. */
  'PURINA',          // PNG / FCG → Purina Turlock (POC-brokered)
  'FARMERS',         // FCG → Farmers Warehouse Keyes (POC-brokered)
  'FARMERS WAREHOUSE',
  'ARDENT',          // FCG / Jacques → Ardent Mills Stockton (POC-brokered)
  'ARDENT MILLS',
  'PURITY',          // POC-brokered per fct_dispatch_scope memory
  'CARGILL',         // per fct_dispatch_scope memory — POC/mill outbound
  'FARMERS RICE',    // Farmers Rice Coop per memory
  'RIPON M',         // "RIPON M..." per memory — Ripon Mills (POC-brokered)
  /* v2.0.10 (2026-08-14): Miller Milling, Berry Seed & Feed, and Lockwood
     Seed & Grain are POC-brokered mill destinations confirmed from Aug 5-13
     invoices. Adding them here so the classifier routes those loads to the
     POC bucket → pocLaneRateFor picks up the new FCG/FCGE → MILLER/BERRY/
     LOCKWOOD entries in POC_LANE_RATES instead of dropping to $425 fallback. */
  'MILLER',          // FCG/FCGE → Miller Milling Oakland
  'MILLER MILLING',
  'BERRY',           // FCG/FCGE → Berry Seed & Feed Keyes
  'BERRY SEED',
  'BERRYS',
  "BERRY'S",
  'LOCKWOOD',        // FCG/FCGE → Lockwood Seed & Grain
  /* v2.1.23 (2026-08-21): Associated Feed destination — Perdue Farms
     ORG CORN out of PNG. Adds ASSOC / ASSOCIATED / ASSOCIATED FEED so
     the classifier routes into the POC bucket with destLabel='ASSOC' and
     pocLaneRateFor resolves the $15/ton rate. */
  'ASSOC',
  'ASSOCIATED',
  'ASSOCIATED FEED',
];
function isPocDestination(label){
  if(!label) return false;
  const L = normLabel(label);
  return POC_DESTINATIONS.some(d => L === d || L.indexOf(d) === 0);
}

/* Classify one parsed row. ctx carries the banner state the parser tracked.
   Returns { bucket, label, why } — `why` is surfaced in the UI so a
   classification is never a black box. */
function classifyLoad(r){
  const po   = String(r.po||'').replace(/\s+/g,'');
  const comm = String(r.commodity||'');
  const truck= String(r.truck||'');

  if(r.deliveryPoint)                        return { bucket:'diamond', label:'', why:'under the D.P. '+r.deliveryPoint+' banner' };
  if(/^7[4-9]\d{3}-\d+$/.test(po))           return { bucket:'diamond', label:'', why:'PO '+po+' is in the Diamond release series' };
  if(/-\s*\d{4}\s*$/.test(comm))             return { bucket:'diamond', label:'', why:'commodity carries a Diamond product code' };
  if(/^\s*\d+\s*\/\s*\d+\s*$/.test(truck))   return { bucket:'diamond', label:'', why:'trailer pair in the truck column' };
  // Origin is a Diamond pickup point — billed to Diamond regardless of any
  // customer label on the row.
  if(isDiamondOrigin(r.origin))
    return { bucket:'diamond', label:'', why:normOrigin(r.origin)+' is a Diamond pickup point — billed to Diamond' };

  const label = customerLabelFrom(truck);

  // v1.8.2 / v2.0.10: POC-brokered — routed by DESTINATION, not origin.
  //
  // Pre-v2.0.10 this branch also caught origin===FCGE with a non-Diamond
  // destination and swept every one into the POC bucket. That over-reached:
  // FCGE→MILLER MILLING / →BERRY SEED / →LOCKWOOD loads are still POC-
  // brokered, but the classifier had no destination signal and the app
  // defaulted them to the $425 POC blended fallback instead of the real
  // per-lb rate. Removing the FCGE origin short-circuit means those loads
  // now route through the normal destination check — with MILLER, BERRY,
  // LOCKWOOD (and the pre-existing ARDENT/PURINA/FARMERS/DIESTEL) all
  // present in POC_DESTINATIONS, every legitimate FCGE outbound still
  // lands in the POC bucket AND arrives with destLabel set so
  // pocLaneRateFor can find the lane rate.
  //
  // v1.9: preserve the raw destination label so revenueForRow() can look up
  // the lane rate. Without destLabel the POC lane matrix has nothing to match on.
  if(isPocDestination(label)) {
    return { bucket:'steady', label:"Phil O'Connell Grain",
             destLabel: label || '',
             why:'POC-brokered — destination '+label+' matches known POC lane' };
  }

  const b = labelBucket(label);
  if(b) return { bucket:b, label:label, why:label+' is on the '+bucketMeta(b).label.toLowerCase()+' list' };
  return { bucket:'spot', label:label,
           why: label ? label+' is not assigned to a bucket yet — defaulting to spot'
                      : 'no Diamond signature and no customer label' };
}

function defaultVerizonLive(){

function normalizeVerizonLive(v){
  const out = defaultVerizonLive();
  if(!v || typeof v!=='object') return out;
  if(Array.isArray(v.vehicles)) out.vehicles = v.vehicles.slice(0, 300);
  if(Array.isArray(v.drivers)) out.drivers = v.drivers.slice(0, 300);
  ['lastSync','lastIngestedAt','lastError','signalsSyncedAt'].forEach(k=>{
    if(typeof v[k]==='string') out[k] = v[k];
  });
  if(v.readyOverrides && typeof v.readyOverrides === 'object'){
    // Filter out expired overrides (> 4 hrs old)
    const now = Date.now();
    Object.keys(v.readyOverrides).forEach(k => {
      const ts = Number(v.readyOverrides[k]);
      if(ts && (now - ts) < 4*60*60*1000) out.readyOverrides[k] = ts;
    });
  }
  if(Array.isArray(v.signals)) out.signals = v.signals.slice(0, 100);
  if(v.ackedSignals && typeof v.ackedSignals === 'object'){
    const now = Date.now();
    Object.keys(v.ackedSignals).forEach(k => {
      const ts = Number(v.ackedSignals[k]);
      if(ts && (now - ts) < 12*60*60*1000) out.ackedSignals[k] = ts;  // 12h retention
    });
  }
  if(v.primaryDriverCache && typeof v.primaryDriverCache === 'object'){
    Object.keys(v.primaryDriverCache).forEach(k => {
      const n = String(v.primaryDriverCache[k]||'').trim();
      if(n) out.primaryDriverCache[k] = n;
    });
  }
  if(v.driverOverrides && typeof v.driverOverrides === 'object'){
    const now = Date.now();
    Object.keys(v.driverOverrides).forEach(k => {
      const o = v.driverOverrides[k];
      if(o && o.name && o.ts && (now - Number(o.ts)) < 12*60*60*1000){
        out.driverOverrides[k] = { name: String(o.name), ts: Number(o.ts) };
      }
    });
  }
  return out;
}

  /* Contacts merge BY KEY, not by index: a shipped contact that gains a new
     field in a later release still picks it up, a hand-edited value still
     wins, and a contact the operator added by hand is kept. */
  const byKey = {};
  (Array.isArray(saved.contacts)?saved.contacts:[]).forEach(c=>{ if(c && c.k) byKey[c.k]=c; });
  base.contacts = base.contacts.map(c=>Object.assign({}, c, byKey[c.k]||{}));
  const shipped = {};
  base.contacts.forEach(c=>{ shipped[c.k]=1; });
  (Array.isArray(saved.contacts)?saved.contacts:[]).forEach(c=>{
    if(c && c.k && !shipped[c.k]) base.contacts.push(Object.assign({group:'Other',kind:'phone'}, c));
  });
  if(saved.rateNotes && typeof saved.rateNotes==='object'){
    Object.keys(saved.rateNotes).forEach(k=>{ base.rateNotes[k] = String(saved.rateNotes[k]||''); });
  }
  if(saved.arAck && typeof saved.arAck==='object' && Number(saved.arAck.amount) > 0){
    base.arAck = { amount:Number(saved.arAck.amount), at:String(saved.arAck.at||'') };
  }
  base.editedAt = String(saved.editedAt||'');
  return base;
}

/* =============================================================
   SMS DISPATCH CONFIG (v1.8) — Phase 3.2 groundwork
   -------------------------------------------------------------
   UI-level only. Nothing in this build makes a network call to
   Twilio; smsSend() composes the message, logs it and toasts it.

   The auth token is stored in the clear, like every other field in
   this app's state, and the Settings card says so. A static page
   has no key store — encrypting it would mean shipping the key in
   the same localStorage blob as the ciphertext, which protects
   against nothing and would be a false claim on screen. The field
   is masked against shoulder-surfing and that is the whole of the
   protection offered. The mitigation that actually works is a
   scoped Twilio API key rather than the account auth token.

   phones is keyed by the driver's FULL roster name (the same key
   state.settings.drivers uses) and starts empty, so it neither
   duplicates the roster nor breaks when a driver is added.
   ============================================================= */
function defaultSmsConfig(){
  return { accountSid:'', authToken:'', fromNumber:'', phones:{}, testTo:'' };
}
function normalizeSmsConfig(saved){
  const out = defaultSmsConfig();
  if(!saved || typeof saved!=='object') return out;
  ['accountSid','authToken','fromNumber','testTo'].forEach(k=>{
    if(saved[k]!=null) out[k] = String(saved[k]);
  });
  if(saved.phones && typeof saved.phones==='object'){
    Object.keys(saved.phones).forEach(n=>{ out.phones[n] = String(saved.phones[n]||''); });
  }
  return out;
}
/* Configured = every field Twilio needs to send at all. The driver's own
   number is checked per row, not here, so a half-filled phone table disables
   the rows it is missing rather than the whole feature. */
function smsConfigured(){
  const c = state.sms || {};
  return !!(String(c.accountSid||'').trim() && String(c.authToken||'').trim() && String(c.fromNumber||'').trim());
}
function driverPhone(name){ return String(((state.sms||{}).phones||{})[name]||'').trim(); }

/* The dispatch template. Destination is the delivery point where the sheet
   has one and the origin otherwise — a driver needs to know where it goes,
   and on the non-Diamond rows that sit above the banners the origin is the
   only place answer there is. */
function smsTemplateFor(r){
  const dest = String((r&&r.deliveryPoint)||'').trim() || String((r&&r.origin)||'').trim() || 'TBD';
  const time = String((r&&(r.time||r.timeRaw))||'').trim() || 'TBD';
  return 'FCT Dispatch: Load ' + (String((r&&r.po)||'').trim() || 'TBD')
       + ' → ' + dest + ', ' + time + ' pickup, truck ' + (String((r&&r.truck)||'').trim() || 'TBD')
       + '. Reply YES to accept, NO to decline. James';
}

/* ---- Rate-card reconciliation ----
   Runs AFTER mergeCustomerRates(), on the merged result, on EVERY load.

   Deliberately NOT gated on the version stamp. The stamp is written on any
   load that sees a version change, including one that happened before this
   code existed, so gating on it makes the upgrade a one-shot that can be
   missed for good — and a rate card that silently failed to apply is exactly
   the failure nobody would notice. Gating on the SAVED record's own `asOf`
   instead makes it idempotent and self-healing: a record already reconciled
   against this card is skipped, anything older is brought forward, and
   running it twice changes nothing.

   `savedRates` is the raw persisted object, not the merged one, because the
   merge has already blended shipped defaults into `merged` and can no longer
   answer "what did the operator actually have".

   For each customer on the card:

     · FSC rule still equal to what v1.2–v1.7 shipped  -> take the v1.8 rule.
       It was never edited, so it is a default and defaults are ours to move.
     · FSC rule differs                                -> operator edit, kept
       verbatim, and `rateCardSkipped` records that the new rule did not land
       so Settings can show both and let them choose.
     · No revenue override set                         -> take the v1.8
       avgRevenue. v1.7 shipped none of these, so any value present is the
       operator's and survives.

   Everything else on the record — notes, qboName, asOf, supersedes — always
   refreshes, because none of it is operator-editable. */
function reconcileCustomerRateCard(merged, savedRates){
  const card = defaultCustomerRates();
  Object.keys(card).forEach(name=>{
    const nu    = card[name];
    const cur   = merged[name] || (merged[name] = {});
    const saved = (savedRates && savedRates[name]) || null;

    /* Already reconciled against THIS card. Leave the whole record alone —
       including anything edited since, which is the point of the check.

       The marker has to be one that ONLY this function ever writes.
       `asOf` looked like the obvious candidate and is the wrong one:
       defaultCustomerRates() sets it, so mergeCustomerRates() plants it on
       every record it touches, and the check would then skip records the
       reconcile had never actually seen. rateCardApplied is deliberately
       absent from the shipped defaults for exactly that reason. */
    if(saved && String(saved.rateCardApplied||'') === CUSTOMER_RATES_ASOF) return;

    const ship  = V17_SHIPPED_CUSTOMER_RATES[name] || null;

    const untouched = !saved
      || !ship
      || (String(saved.fscMethod||'') === String(ship.fscMethod||'')
          && Number(saved.fscValue==null?-1:saved.fscValue) === Number(ship.fscValue==null?-1:ship.fscValue));

    if(untouched){
      cur.fscMethod = nu.fscMethod;
      cur.fscValue  = nu.fscValue;
      cur.rateCardSkipped = '';
    } else {
      cur.rateCardSkipped = 'The '+CUSTOMER_RATES_ASOF+' rate card says '
        + fscRuleText({method:nu.fscMethod, value:nu.fscValue})
        + ', but this customer carries a hand-set rule and was left alone.';
    }
    // Revenue: land the card figure only where the operator has no opinion.
    const hasOwnRev = saved && saved.revenuePerLoad!=null && Number(saved.revenuePerLoad)>0;
    if(!hasOwnRev) cur.revenuePerLoad = nu.revenuePerLoad;

    cur.fscIncluded = nu.fscIncluded;
    cur.verified    = true;
    cur.asOf        = nu.asOf;
    cur.qboName     = nu.qboName;
    cur.supersedes  = nu.supersedes;
    cur.note        = nu.note;
    // Stamped last, and only here — this is what makes the pass idempotent.
    cur.rateCardApplied = CUSTOMER_RATES_ASOF;
  });
  return merged;
}

/* Merge saved per-customer FSC overrides over the shipped defaults so a
   user edit survives an upgrade but new default customers still land. */
function mergeCustomerRates(saved){
  const out = {};
  const base = defaultCustomerRates();
  Object.keys(base).forEach(k=>{ out[k]=Object.assign({},base[k]); });
  if(saved && typeof saved==='object'){
    Object.keys(saved).forEach(k=>{
      if(saved[k] && typeof saved[k]==='object') out[k]=Object.assign({}, out[k]||{}, saved[k]);
    });
  }
  return out;
}

function defaultState(){
  return { v:3, appVersion:APP_VERSION, settings:defaultSettings(),
           customerRates:defaultCustomerRates(), dayRollup:defaultDayRollup(),
           laneDefaults:defaultLaneDefaults(), dispatchImport:defaultDispatchImport(),
           fixedStack:defaultFixedStack(),
           customerLabels:defaultCustomerLabels(), rateTable:defaultRateTable(),
           diamondTiers:defaultDiamondTiers(), dispatchOps:defaultDispatchOps(),
           verizon:defaultVerizon(), verizonLive:defaultVerizonLive(),
           adpPay:defaultAdpPay(),
           companyInfo:defaultCompanyInfo(), sms:defaultSmsConfig(),
           /* v2.1.29: operator-typed missing-lane rates. Empty on a fresh
              install; mergeLaneRateOverrides() unions a saved map on boot
              the same way customerRates does. Never baked into POC_LANE_RATES. */
           laneRateOverrides:{},
           /* v2.1.19: runtime-only fleet-day miles from the Verizon /miles
              endpoint. Not persisted — pulled fresh on boot / date change. */
           verizonMilesToday:{ fleetMiles:0, ok:false, error:null, fetchedAt:null, date:null },
           /* v2.1.21: per-lane rolling calibration from /calibration. Runtime-only,
              refreshed on boot + hourly. lanes[key].factor multiplies LANE_MILES
              before fuel/wear costing so day-of estimates track actual driving. */
           laneCalibration:{ ok:false, lanes:{}, fleetFactor:1.0, windowDays:0, computedAt:null, error:null },
           history:[], qbo:QBO_SEED, lastCalc:null };
}
let state = defaultState();

function loadState(){
  const raw = storageRead(STORAGE_KEY);
  if(!raw) return;
  try{
    const p = JSON.parse(raw);
    if(p && typeof p==='object'){
      state = Object.assign(defaultState(), p);
      state.settings = Object.assign(defaultSettings(), p.settings||{});
      /* v2.1.46: never restore a saved calibration / miles-today blob.
         Those are live fetches. A stale 1.15x would paint EST then drop. */
      state.laneCalibration = { ok:false, lanes:{}, fleetFactor:1.0, windowDays:0, computedAt:null, error:null };
      state.verizonMilesToday = { fleetMiles:0, ok:false, error:null, fetchedAt:null, date:null };
      state.history = Array.isArray(p.history)?p.history:[];
      // v1.2 slots — always normalized, always merged over the shipped defaults.
      /* v1.8: the merge alone is not enough for rates. mergeCustomerRates()
         lets a SAVED value win, which is right for an operator edit and wrong
         for a stale shipped default sitting in an old save — without the
         reconcile pass every v1.7 save would carry the old FSC rules forward
         and the new rate card would never take effect. Runs unconditionally
         and is idempotent; see reconcileCustomerRateCard(). */
      state.customerRates   = reconcileCustomerRateCard(mergeCustomerRates(p.customerRates), p.customerRates);
      /* v2.1.29: same merge-over-empty-default pattern as customerRates —
         a saved fill survives refresh/upgrade; a missing key lands {}. */
      state.laneRateOverrides = mergeLaneRateOverrides(p.laneRateOverrides);
      state.dayRollup       = normalizeDayRollup(p.dayRollup);
      state.laneDefaults    = normalizeLaneDefaults(p.laneDefaults);
      state.dispatchImport  = normalizeDispatchImport(p.dispatchImport);
      // v1.3 slot. Merges saved amounts + on/off over the shipped stack, so
      // a user who re-enabled rent or edited a line keeps that edit.
      state.fixedStack      = normalizeFixedStack(p.fixedStack);
      state.customerLabels  = normalizeCustomerLabels(p.customerLabels);
      state.rateTable       = normalizeRateTable(p.rateTable);
      state.diamondTiers    = normalizeDiamondTiers(p.diamondTiers);
      // v1.4 slot. Absent on every pre-v1.4 save, which is the normal case on
      // upgrade — normalizeDispatchOps() hands back an empty ledger and every
      // driver falls through to the shipped HOS default.
      state.dispatchOps     = normalizeDispatchOps(p.dispatchOps);
      // v1.5 slot. Absent on every pre-v1.5 save — an empty day map means the
      // app is on estimates, which is exactly the v1.4 behaviour.
      state.verizon         = normalizeVerizon(p.verizon);
      state.verizonLive     = normalizeVerizonLive(p.verizonLive);
      state.adpPay          = normalizeAdpPay(p.adpPay);
      /* v1.8 slots. Both absent on every pre-v1.8 save, which is the normal
         case on upgrade: contacts land from the shipped book with the
         operator's edits merged by key, and the SMS block lands empty, which
         is what keeps every Send-dispatch button correctly disabled. */
      state.companyInfo     = normalizeCompanyInfo(p.companyInfo);
      state.sms             = normalizeSmsConfig(p.sms);

      const savedVersion = p.appVersion || '';
      /* Which schema generation did this save come from?
         v1.2 tested /v1\.1/ literally, which read "is this exactly v1.1"
         when it meant "is this v1.1 or newer". A v1.2 save therefore fell
         into the pre-v1.1 branch and had its driver + office rosters reset,
         destroying every hand-edited pay rate on upgrade. Parse the version
         properly instead of pattern-matching one release. */
      const vm = savedVersion.match(/v(\d+)\.(\d+)/);
      const preV11 = !vm || (+vm[1] < 1) || (+vm[1] === 1 && +vm[2] < 1);
      if(savedVersion !== APP_VERSION){
        state.qbo = QBO_SEED;
        if(preV11){
          // Pre-v1.1 only: rosters before v1.1 were estimates, not QBO reads,
          // so they are replaced wholesale. From v1.1 on the roster is real
          // and any edit on top of it is the operator's — never clobber it.
          state.settings.drivers = QBO_SEED.drivers.map(d=>({name:d.name, rate:d.rate, verified:d.verified}));
          state.settings.office  = QBO_SEED.office .map(o=>({name:o.name, base:o.base, verified:o.verified, role:o.role}));
          if(state.settings.defaultDriverRate === 30) state.settings.defaultDriverRate = 28.82;
        }
        // v1.1 -> v1.2 upgrade in place. History, customer-rate overrides,
        // baseline overrides and roster edits are all retained; only the
        // stale FSC default is corrected.
        if(state.settings.defaultFscMethod == null) state.settings.defaultFscMethod = 'percent_of_linehaul';
        if(state.settings.defaultFscPercent == null) state.settings.defaultFscPercent = 30;
        if(state.settings.dailyFixedCostPerTruck == null)
          state.settings.dailyFixedCostPerTruck = QBO_SEED.fixedCostRecurring.perTruckDay;
        if(state.settings.dayTargetMarginPct == null) state.settings.dayTargetMarginPct = 20;
        // Fuel became derived (diesel price ÷ MPG). Seed the new fields, then
        // drop the stale stored $/mi so there is only one source of truth.
        if(state.settings.currentDieselPricePerGal == null) state.settings.currentDieselPricePerGal = FUEL_FALLBACK_PPG;
        if(state.settings.fleetAvgMPG == null)              state.settings.fleetAvgMPG = FUEL_FALLBACK_MPG;
        if(state.settings.lastFuelPriceUpdate == null)      state.settings.lastFuelPriceUpdate = '';
        // Upgrading from a build with no diesel field means the price has
        // never been operator-confirmed, whatever the stamp says.
        if(p.settings && p.settings.currentDieselPricePerGal == null) state.settings.fuelPriceConfirmed = false;
        delete state.settings.fuelCostPerMile;

        /* ---- v1.2 -> v1.3: corrected unit economics ----
           Saved settings win over shipped defaults (Object.assign above), so
           the two figures v1.2 got wrong have to be moved explicitly. Both
           are only forced when they still hold the v1.2 SHIPPED value — if
           James had already tuned one by hand, his number stands.

           Everything the operator owns is untouched here: day-rollup
           snapshots, per-customer FSC rules and revenue overrides, driver
           and office roster edits, diesel price, MPG, lane calibration and
           saved load history all carry across unchanged. */
        const fromPreV13 = !/v1\.3/.test(savedVersion);
        if(fromPreV13){
          const ps = p.settings || {};
          // 260 -> 312 operating days: FCT runs six days a week. Every
          // release up to v1.2 shipped 260, so that value is a default.
          if(ps.operatingDaysPerYear == null || Number(ps.operatingDaysPerYear) === 260)
            state.settings.operatingDaysPerYear = 312;
          // -> 0.35 (R&M + tires + wash). Both previously shipped defaults
          // count as "untouched": 0.20 in v1, 0.26 in v1.1/v1.2.
          const SHIPPED_WEAR = [0.20, 0.26];
          if(ps.wearPerMile == null || SHIPPED_WEAR.indexOf(Number(ps.wearPerMile)) >= 0)
            state.settings.wearPerMile = 0.35;
          // Lane hours: v1.2 shipped 3 hrs everywhere, which is short of the
          // real door-to-door clock. Lift to 5 only where the guess survives.
          const L = state.laneDefaults;
          if(!L.calibrated){
            if(Number(L.hoursDefault) === 3) L.hoursDefault = 5;
            if(Number(L.milesDefault) === 145) L.milesDefault = 80;
            Object.keys(L.lanes).forEach(k=>{ if(Number(L.lanes[k].hours) === 3) L.lanes[k].hours = 5; });
          }
        }
        // New v1.3 parameters land from defaultSettings() when absent, but be
        // explicit so a partially-written save cannot leave a hole that
        // divides by zero downstream.
        const seed = defaultSettings();
        ['revenuePerLoadDefault','loadsPerYear','avgMilesPerLoad','hoursPerLoad',
         'subhaulerPerYear','otherVariablePerLoad','dayVerdictBandUsd',
         'nonDiamondRevenuePerLoad','steadySharePct','steadyDangerPct',
         'trucksInFleet','trucksRunningPerDay',
         // v1.4 dispatch heuristics — same treatment: land from the shipped
         // defaults when a pre-v1.4 save has no opinion, never overwrite one.
         'preloadHrsPerLoad','afternoonHrsPerDriver','defaultDriverHosHrs',
         'detentionThresholdMin',
         // v2.1.40: EST-only OT/meals blend on P&L. Land 1.21 when absent.
         'estDriverWageBlend'].forEach(k=>{
          if(state.settings[k] == null || isNaN(Number(state.settings[k]))) state.settings[k] = seed[k];
        });
        /* Fleet correction 2026-07-27: the fleet is 24 trucks, not 12.
           Every release up to v1.2 shipped trucksPerDay:12, so that value is
           a stale default rather than an operator choice — split it into the
           two real numbers. A hand-edited count is left alone. */
        if(fromPreV13){
          const ps2 = p.settings || {};
          if(ps2.trucksInFleet == null)
            state.settings.trucksInFleet = (ps2.trucksPerDay == null || Number(ps2.trucksPerDay) === 12)
              ? 24 : Number(ps2.trucksPerDay);
          if(ps2.trucksRunningPerDay == null)
            state.settings.trucksRunningPerDay = (ps2.trucksPerDay == null || Number(ps2.trucksPerDay) === 12)
              ? 22 : Number(ps2.trucksPerDay);
          state.settings.trucksPerDay = state.settings.trucksRunningPerDay;   // keep the alias honest
        }
      } else {
        state.qbo = p.qbo||QBO_SEED;
      }
      state.v = 3;
      state.appVersion = APP_VERSION;   // stamp so the upgrade path is idempotent

      /* v2.1.17c (2026-08-20, James directive after QBO YTD-Aug reconciliation):
         Force-migration for four values that drifted:
         - Insurance: $648,808 or $544,000 → $598,000 (WC moved to variable, non-WC total)
         - Management (329): $31,200 → $93,000 (QBO YTD-Aug annualized)
         - avgMilesPerLoad: 80 → 50 (actual FC→PNG→Ripon→FC round trip per James)
         - Diamond standard tier miles: 80 → 50 (same lane) */
      if(!state.settings.migrated_v217c){
        try {
          if(Array.isArray(state.fixedStack)){
            state.fixedStack.forEach(function(line){
              if(line && line.k === 'insurance')  line.amount = 598000;
              if(line && line.k === 'management') line.amount = 93000;
            });
          }
          if(Array.isArray(state.diamondTiers)){
            state.diamondTiers.forEach(function(tier){
              if(tier && tier.k === 'standard') tier.miles = 50;
            });
          }
        } catch(_){}
        state.settings.avgMilesPerLoad = 50;
        state.settings.migrated_v217c = true;
        try { save(); } catch(_){}
        window.__v217cMigrationJustRan = true;
      }

      /* v2.1.19 (2026-08-21): first boot on the Verizon-fuel-actual build.
         Everything the fuel compare needs (currentDieselPricePerGal,
         fleetAvgMPG) was already seeded by v2.0.6, so this migration just
         ensures the runtime slot for the /miles pull exists on saves that
         predate it — the slot isn't persisted so it never survives a
         reload, but a missing key would crash the compare renderer if a
         race put render() before the first fetch. */
      if(!state.settings.migrated_v219){
        if(!state.verizonMilesToday){
          state.verizonMilesToday = { fleetMiles:0, ok:false, error:null,
                                       fetchedAt:null, date:null };
        }
        if(state.settings.currentDieselPricePerGal == null){
          state.settings.currentDieselPricePerGal = 4.50; // QBO-aligned, not EIA 6.919
        }
        if(state.settings.fleetAvgMPG == null){
          state.settings.fleetAvgMPG = 6.0;   // QBO-aligned (v2.1.19 had 6.3; that overstated $/mi)
        }
        state.settings.migrated_v219 = true;
        try { save(); } catch(_){}
      }

      /* v2.0.6 (2026-08-05, James greenlit after full QBO audit):
         second force-migration. Sits AFTER v2.0.5's block so both fire
         cleanly on any device coming from pre-v2.0.5. Overwrites:
         - fixedStack line amounts (13 lines, every one QBO-anchored)

         - wearPerMile (0.35 → 0.53 from QBO 313.2+ annualized)
         Preserves any operator-toggled `on:false` states (e.g., rent). */
      if(!state.settings.migrated_v206){

          officerWages: 332241, truckLicense: 66000, telephone: 28000,

        };
        try {

            state.fixedStack.forEach(function(line){
              if(line && V206_STACK[line.k] != null){
                line.amount = V206_STACK[line.k];
                line.verified = true;
              }

        state.settings.wearPerMile = 0.53;
        state.settings.operatingDaysPerYear = 365;   // v2.0.6: 7 days/week per James
        state.settings.migrated_v206 = true;
        try { save(); } catch(_){}
        window.__v206MigrationJustRan = true;
      }

      /* v2.1.36 (2026-08-24, James 2025 QBO shop actuals):
         otherVariablePerLoad $35 was not in 313.2/3/4 — drop shipped plugs
         to $0 (EST and ADP). Recalibrate wearPerMile from the old $0.53
         ($475k / 900k mi, a bit high) to $0.478 so 900k mi × rate ≈ $430k
         (313.2 $319,811 + 313.3 $75,893 + 313.4 $34,787). Do not touch

      if(!state.settings.migrated_v2136){

      if(!state.settings.migrated_v2137){

        if(state.settings.wearPerMile == null || SHIPPED_WEAR37.indexOf(w37) >= 0)
          state.settings.wearPerMile = 0.498;

      /* v2.0.5 (2026-08-05, James directive "both devices must match"):

         devices. Baked-in shipped baseline wins over per-device saved
         values on FIRST boot of v2.0.5. After that the migrated_v205 flag
         gates the overwrite, so a later operator edit is respected.
         Diesel and FSC are the two known drift vectors — fixedStack is
         intentionally NOT touched here (needs separate reconciliation per
         James's instruction). */
      if(!state.settings.migrated_v205){
        state.settings.currentDieselPricePerGal = 6.919;
        state.settings.fleetAvgMPG = 6.0;
        state.settings.lastFuelPriceUpdate = '2026-08-05';
        state.settings.fuelPriceConfirmed = true;
        state.settings.defaultFscPercent = 33;
        state.settings.defaultFscMethod = 'percent_of_linehaul';
        /* Also overwrite per-customer FSC rates that were at the old
           defaults. Any customer whose saved FSC pct matches an old
           default (30% or 27% or 32% or 20%) gets forced to 33%. If an
           operator had already picked a non-default value not in that
           set, it's respected. */
        const OLD_FSC_DEFAULTS = [30, 27, 32, 20];
        try {
          Object.keys(state.customerRates || {}).forEach(function(name){
            const r = state.customerRates[name];
            if(!r || r.fscMethod !== 'percent_of_linehaul') return;
            const v = Number(r.fscValue);
            if(OLD_FSC_DEFAULTS.indexOf(v) >= 0){
              r.fscValue = 33;
            }
          });
        } catch(_){}
        state.settings.migrated_v205 = true;
        // Persist immediately so a page refresh sees the migrated state.
        try { save(); } catch(_){}
        // Toast fires from boot() after DOM is ready.
        window.__v205MigrationJustRan = true;
      }
    }
  }catch(e){ showStorageError('Saved data could not be read', String(e&&e.message||e)); }
}
function save(){
  state.appVersion = APP_VERSION;
  /* v2.0.2: dispatch rows travel to IDB via saveDayImport(); the LS blob
     stays small (settings + snapshots + normalized metadata only). Every
     one of the ~30 direct save() callers gets the small write for free. */
  const res = storageWrite(STORAGE_KEY, compactStateForStorage(state));
  if(res.ok && res.tier!=='localStorage'){
    showStorageError('Saved to '+res.tier+' (localStorage unavailable)',
      'localStorage is not persisting here: '+(res.error||'silent no-op')+'. Data went to '+res.tier+' plus an IndexedDB mirror, but may not survive a browser restart.',
      {severity:'warn'});
  } else if(!res.ok){
    showStorageError('SAVE FAILED — your data is only in memory',
      'Neither localStorage nor sessionStorage accepted the write. Reason: '+(res.error||'unknown')+'. Tap "Copy all data" NOW.');
  }
  return res;
}

/* Office overhead allocated per on-clock hour of a load.
   annual office payroll / operating days / trucks running / hours per truck day */
function overheadPerHour(){
  const s = state.settings;
  const annual = s.office.reduce((a,o)=>a+(Number(o.base)||0),0);
  const perDay = annual / Math.max(1,s.operatingDaysPerYear);
  // Spread across the trucks that actually roll, not the whole fleet — an
  // idle truck generates no on-clock hours to absorb overhead.
  const perTruckDay = perDay / Math.max(1,trucksRunningPerDay());
  return perTruckDay / Math.max(0.5,s.hoursPerTruckDay);
}
function officeAnnual(){ return state.settings.office.reduce((a,o)=>a+(Number(o.base)||0),0); }

/* Customer baseline $/hr: real history wins once we have enough loads. */
function baselineFor(cust){
  const s = state.settings;
  if(s.customerBaselines && s.customerBaselines[cust]!=null)
    return { value:Number(s.customerBaselines[cust]), source:'override', n:0 };
  const h = state.history.filter(l=>l.customer===cust && l.hours>0);
  if(h.length >= MIN_HIST_LOADS){
    const avg = h.reduce((a,l)=>a+l.cmPerHour,0)/h.length;
    return { value:avg, source:'history', n:h.length };
  }
  return { value:seedBaselineFor(cust,s), source:'seed', n:h.length };
}

/* Core load economics. */
function computeLoad(inp){
  const s = state.settings;
  const lbs = inp.lbs;
  const totalMi = inp.loadedMi + inp.deadheadMi;
  const linehaul = lbs * s.ratePerLb;
  const revenue  = linehaul + inp.fsc;

  const fpm        = fuelPerMile();
  const fuelCost   = totalMi * fpm;
  const wearCost   = totalMi * s.wearPerMile;
  // Apply payroll loading factor (1.31 from QBO payroll taxes ratio) to base rate.
  const loadedDriverRate = inp.driverRate * (s.driverLoadingFactor || 1);
  const driverCost = inp.hours * loadedDriverRate;
  const varCost    = fuelCost + wearCost + driverCost;

  // Deadhead portion, broken out for visibility (already inside fuel+wear).
  const deadheadCost = inp.deadheadMi * (fpm + s.wearPerMile);

  const cm = revenue - varCost;
  const cmPerHour = inp.hours>0 ? cm/inp.hours : 0;

  const oh = overheadPerHour();
  const fixedAlloc = oh * inp.hours;
  const net = cm - fixedAlloc;
  const netPerHour = inp.hours>0 ? net/inp.hours : 0;

  const base = baselineFor(inp.customer);
  const ratio = base.value>0 ? (cmPerHour/base.value)*100 : 0;

  let verdict, vClass, vNote;
  if(ratio >= 110){ verdict='ACCEPT'; vClass='accept'; vNote='Above this customer\'s normal contribution. Take it.'; }
  else if(ratio >= 90){ verdict='ACCEPT — AT MARKET'; vClass='market'; vNote='In line with what this customer normally pays. Fine, but no upside — worth a nudge if you have leverage.'; }
  else if(ratio >= 75){ verdict='RENEGOTIATE'; vClass='reneg'; vNote='Below this customer\'s normal contribution. Counter before accepting.'; }
  else { verdict='REJECT'; vClass='reject'; vNote='Well below this customer\'s normal contribution. This load subsidizes the customer.'; }

  // Counter-rate to reach 100% of baseline.
  const targetCM   = base.value * (s.targetPct/100) * inp.hours;
  const targetRev  = targetCM + varCost;
  const targetLine = Math.max(0, targetRev - inp.fsc);
  const counter = {
    total: targetRev,
    linehaul: targetLine,
    perLb: lbs>0 ? targetLine/lbs : 0,
    perCwt: lbs>0 ? targetLine/(lbs/100) : 0,
    perTon: lbs>0 ? targetLine/(lbs/2000) : 0,
    deltaTotal: targetRev - revenue,
  };

  return {
    lbs, totalMi, linehaul, revenue, fuelCost, wearCost, driverCost, loadedDriverRate, deadheadCost, fuelPerMile:fpm,
    varCost, cm, cmPerHour, overheadPerHr:oh, fixedAlloc, net, netPerHour,
    baseline:base, ratio, verdict, vClass, vNote, counter,
    rates:{ perLb: lbs>0?linehaul/lbs:0, perCwt: lbs>0?linehaul/(lbs/100):0, perTon: lbs>0?linehaul/(lbs/2000):0 },
    // v1.2: wait is no longer a separate time input — total time on load
    // absorbs it. These stay for history records logged under v1.1.
    detentionExposure: (Number(inp.longestWait)||0) > 2,
    detentionBillable: Math.max(0, (Number(inp.longestWait)||0)-2) * s.detentionPerHr,
  };
}

function weeklyBuckets(){
  const map = {};
  state.history.forEach(l=>{
    const d = new Date(l.date+'T00:00:00');
    if(isNaN(d)) return;
    const day = d.getDay();
    const mon = new Date(d); mon.setDate(d.getDate() - ((day+6)%7));
    const k = mon.toISOString().slice(0,10);
    if(!map[k]) map[k]={week:k,rev:0,cm:0,hours:0,n:0};
    map[k].rev+=l.revenue; map[k].cm+=l.cm; map[k].hours+=l.hours; map[k].n++;
  });
  return Object.values(map).sort((a,b)=>a.week<b.week?-1:1);
}
function sparkline(vals,w,h){
  if(vals.length<2) return '';
  const max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  const rng = (max-min)||1;
  const pts = vals.map((v,i)=>{
    const x = (i/(vals.length-1))*(w-4)+2;
    const y = h-2 - ((v-min)/rng)*(h-6);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const last = vals[vals.length-1], lx=w-2;
  const ly = h-2 - ((last-min)/rng)*(h-6);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block">'
    + '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3" fill="var(--accent)"/></svg>';
}
function donut(slices,size){
  const total = slices.reduce((a,s)=>a+s.v,0)||1;
  const R=size/2, r=R*0.62, cx=R, cy=R;
  let a0 = -Math.PI/2, out='';
  slices.forEach(s=>{
    const frac = s.v/total, a1 = a0 + frac*Math.PI*2;
    const big = frac>0.5?1:0;
    const p=(ang,rad)=>[(cx+rad*Math.cos(ang)).toFixed(2),(cy+rad*Math.sin(ang)).toFixed(2)];
    const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);
    out += '<path d="M'+x0+' '+y0+' A'+R+' '+R+' 0 '+big+' 1 '+x1+' '+y1+' L'+x2+' '+y2+' A'+r+' '+r+' 0 '+big+' 0 '+x3+' '+y3+' Z" fill="'+s.c+'"/>';
    a0=a1;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+out+'</svg>';
}
