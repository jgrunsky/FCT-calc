      asks.forEach(a=>{
        h += '<div class="row"><div class="row-l"><div class="row-t">'+a.t+'</div>'
          + '<div class="row-s">'+a.s+'</div></div>'
          + '<div class="row-v" style="color:'+a.c+'">'+money(a.v)+'</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';   /* /card */
  }

  h += prov;   /* reference material, below the glance widgets */

  /* --- Headline KPIs --- */
  h += '<div class="card"><h2>French Camp Transport — trailing 12 months</h2>'
    + '<div class="kpi-grid">'
    + '<div><div class="kpi">'+money(rev)+'</div><div class="kpi-label">Revenue T12M</div></div>'
    + '<div><div class="kpi" style="color:var(--amber)">'+pct(q.diamondPetSharePct.value)+'</div><div class="kpi-label">Diamond Pet system</div></div>'
    + '<div><div class="kpi sm">'+money(q.ar.total.value)+'</div><div class="kpi-label">AR total</div></div>'
    + '<div><div class="kpi sm" style="color:var(--green)">'+money(q.ar.realOverdue.value)+'</div><div class="kpi-label">Real overdue</div></div>'
    + '</div></div>';

  /* --- Typical load — the T12M-calibrated unit economics (v1.3) --- */
  {
    const s = state.settings;
    const comps = variableComponents();
    const rev = revenuePerLoad();
    const varC = variableCostPerLoad();
    const cm  = contributionPerLoad();
    const be  = breakevenLoadsPerDay();
    const fpd = fixedCostPerDay();
    const cmClass = cm>0?'var(--green)':'var(--red)';
    // What the rate card alone would have billed on the same load — the v1.2 basis.
    const cardLinehaul = Number(s.avgLoadLbs||48000)*s.ratePerLb;
    const cardFsc = fscAmount(s.defaultFscMethod||'percent_of_linehaul', s.defaultFscPercent,
                              {linehaul:cardLinehaul, lbs:48000, loadedMi:s.avgMilesPerLoad});
    const card = cardLinehaul + cardFsc;

    h += '<div class="card"><h2>Typical load — the math ('+num(state.laneDefaults.lbs)+' lb · '
      + num(s.avgMilesPerLoad)+' mi · '+num(s.hoursPerLoad,1)+' hr) '
      + '<span style="font-size:10px;color:var(--green);text-transform:none;letter-spacing:0">✓ calibrated to T12M 2026-07-27</span></h2>'
      + '<div class="kpi-grid">'
      + '<div><div class="kpi sm">'+money(rev)+'</div><div class="kpi-label">Revenue</div></div>'
      + '<div><div class="kpi sm" style="color:var(--red)">−'+money(varC)+'</div><div class="kpi-label">Variable cost</div></div>'
      + '<div><div class="kpi" style="color:'+cmClass+'">'+money(cm)+'</div><div class="kpi-label">Contribution</div></div>'
      + '<div><div class="kpi">'+be.toFixed(1)+'</div><div class="kpi-label">Breakeven loads/day</div></div>'
      + '</div>';

    /* The five variable components, itemised. */
    h += '<div style="margin-top:12px">';
    comps.forEach(c=>{
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(c.label)+'</div>'
        + '<div class="row-s">'+esc(c.basis)+'</div></div>'
        + '<div class="row-v" style="color:var(--red)">−'+money2(c.amount)+'</div></div>';
      /* v2.1.19: right below the per-load Fuel line, lay a fleet-day
         "calc (LANE_MILES) vs Verizon actual" pair so the operator can see
         at a glance whether the model is tracking real burn. Amounts are
         fleet-day dollars, deliberately in a different plane than the
         per-load row above, and are NOT summed into varC. */
      if(c.k === 'fuel') h += verizonFuelCompareHTML();
    });
    h += '<div class="row"><div class="row-l"><div class="row-t"><b>Variable cost per load</b></div></div>'
      + '<div class="row-v" style="color:var(--red)"><b>−'+money2(varC)+'</b></div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t"><b>Contribution per load</b></div>'
      + '<div class="row-s">'+money(rev)+' revenue − '+money2(varC)+' variable</div></div>'
      + '<div class="row-v" style="color:'+cmClass+'"><b>'+money2(cm)+'</b></div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Daily fixed cost</div>'
      + '<div class="row-s">'+money(fixedStackAnnual())+'/yr ÷ '+operatingDays()+' operating days'
      + (state.fixedStack.find(l=>l.k==='rent'&&!l.on) ? ' · rent excluded' : '')+'</div></div>'
      + '<div class="row-v" style="color:var(--red)">−'+money(fpd)+'</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t"><b>Breakeven</b></div>'
      + '<div class="row-s">'+money(fpd)+' fixed ÷ '+money(cm)+' contribution per load</div></div>'
      + '<div class="row-v"><b>'+be.toFixed(1)+' loads/day</b></div></div></div>';

    h += '<div class="legend" style="margin-top:12px">'
      + '<b style="color:var(--accent)">v1.3 correction — this is the number that changed.</b> '
      + 'v1.2 priced a load off the rate card at '+money2(card)+' (linehaul '+money2(cardLinehaul)+' + '+money2(cardFsc)+' FSC) '
      + 'and charged variable cost per HOUR and per MILE while the same driver wages were also sitting in the fixed payroll stack — '
      + 'so driver pay was counted twice and per-load miles were understated. Against the actual T12M P&amp;L the real figures are '
      + money(rev)+' revenue ('+money(state.qbo.revenueT12M.value)+' ÷ '+num(loadsPerYear())+' loads) and '+money(varC)+' variable, '
      + 'leaving '+money(cm)+' of contribution. The rate card understates realised revenue by '+money2(rev-card)+' a load.<br><br>'
      + '<b style="color:var(--amber)">Rent is out of the baseline.</b> The T12M carries '+money(30000)+' in 323 Rent Expense, but the '
      + 'operator confirmed on 2026-07-27 that he is not paying rent going forward, so the line ships switched off: '
      + money(7308)+'/day becomes '+money(fpd)+'/day. It is a toggle in Settings → Unit economics, not a deletion.</div></div>';
  }

  /* --- Seasonal Reserve Health (v1.3) ---
     Capacity is deliberately held for Jun–Nov harvest work. This widget asks
     one question: is standing non-Diamond work growing into that reserve? */
  {
    const li = state.dayRollup && state.dayRollup.lastImport;
    const rows = li && li.rows ? li.rows : [];
    h += '<div class="card"><h2>Seasonal reserve health</h2>';
    if(!rows.length){
      h += '<div class="empty">No dispatch log imported yet.<br>Import <b>2026 FCT Dispatch Log.xlsx</b> in '
        + '<b>Calculator → Day rollup</b> and this fills in — load mix by bucket, YTD, against the seasonal guard rail.</div>';
    } else {
      const tot = {diamond:0, steady:0, seasonal:0, spot:0};
      const byMonth = {};
      rows.forEach(r=>{
        tot[r.bucket] = (tot[r.bucket]||0)+1;
        if(!r.date) return;
        const m = +r.date.slice(5,7);
        if(!byMonth[m]) byMonth[m] = {diamond:0,steady:0,seasonal:0,spot:0,n:0};
        byMonth[m][r.bucket]++; byMonth[m].n++;
      });
      const N = rows.length;
      const pctOf = k => (tot[k]/N)*100;
      const dangerPct = Number(s.steadyDangerPct)||20;
      const steadyPct = pctOf('steady');
      const months = Object.keys(byMonth).map(Number).sort((a,b)=>a-b);
      const cur = months.length ? months[months.length-1] : 0;
      const curM = cur ? byMonth[cur] : null;
      const curSteadyPct = curM && curM.n ? (curM.steady/curM.n)*100 : 0;
      const curInSeason = SEASON_MONTHS.indexOf(cur) >= 0;

      /* Three bars — Diamond / Steady / Seasonal — with the danger line on
         the steady bar, which is the one that can crowd the reserve. */
      const bar = (b, pctv, danger)=>
        '<div class="row"><div class="row-l"><div class="row-t"><span style="color:'+b.color+'">■</span> '+b.label
        + '<span style="color:var(--text-faint);font-weight:400"> — '+esc(b.desc)+'</span></div>'
        + '<div class="bar" style="position:relative;height:8px">'
        + '<i style="width:'+Math.min(100,pctv).toFixed(1)+'%;background:'+b.color+'"></i>'
        + (danger!=null ? '<span style="position:absolute;top:-2px;bottom:-2px;left:'+Math.min(100,danger).toFixed(1)
            + '%;width:2px;background:var(--red)" title="Danger threshold '+danger+'% — above this, steady work is eating seasonal capacity"></span>' : '')
        + '</div></div>'
        + '<div class="row-v">'+pctv.toFixed(0)+'%<div class="row-s">'+(tot[b.k]||0)+' loads</div></div></div>';

      h += bar(bucketMeta('diamond'),  pctOf('diamond'))
        +  bar(bucketMeta('steady'),   steadyPct, dangerPct)
        +  bar(bucketMeta('seasonal'), pctOf('seasonal'))
        +  bar(bucketMeta('spot'),     pctOf('spot'));

      /* Verdict */
      if(steadyPct > dangerPct){
        h += '<div class="banner red" style="margin-top:14px"><b>⚑ Steady work is past the guard rail</b>'
          + 'Standing non-Diamond commitments are <b style="display:inline">'+steadyPct.toFixed(0)+'%</b> of loads year to date, '
          + 'against a '+dangerPct+'% threshold. That freight does not go away in June — it is capacity the harvest season '
          + 'will need and will not have. Convert the marginal ones to spot, or price them so the crowding is paid for.</div>';
      } else if(curInSeason && curM && curM.steady > curM.seasonal){
        h += '<div class="banner amber" style="margin-top:14px"><b>⚑ '+MONTH_NAMES[cur-1]+' is inside the reserve window</b>'
          + MONTH_NAMES[cur-1]+' is running <b>'+curM.steady+'</b> steady loads against <b>'+curM.seasonal+'</b> seasonal. '
          + 'Inside Jun–Nov that ordering is backwards — the reserve exists so seasonal work has trucks. '
          + 'Steady is '+curSteadyPct.toFixed(0)+'% of the month against '+steadyPct.toFixed(0)+'% YTD.</div>';
      } else {
        h += '<div class="banner" style="margin-top:14px;background:var(--green-bg);border:1px solid color-mix(in oklab,var(--green) 45%,transparent);color:#c4e0c3">'
          + '<b style="color:var(--green);display:block;font-family:var(--display);font-size:16px;margin-bottom:5px">✓ Reserve intact</b>'
          + 'Steady non-Diamond is '+steadyPct.toFixed(0)+'% of loads YTD, inside the '+dangerPct+'% guard rail. '
          + 'Diamond carries '+pctOf('diamond').toFixed(0)+'% of the book and spot fill is '+pctOf('spot').toFixed(0)+'% — '
          + 'that is the intended shape: spot flexes, commitments do not.</div>';
      }

      /* Month-by-month mix */
      if(months.length>1){
        h += '<details><summary>Month-by-month mix</summary><div class="scroll-x" style="margin-top:10px">'
          + '<table><thead><tr><th>Month</th><th class="n">Diamond</th><th class="n">Steady</th><th class="n">Seasonal</th>'
          + '<th class="n">Spot</th><th class="n">Total</th><th class="n">Steady %</th></tr></thead><tbody>';
        months.forEach(m=>{
          const x = byMonth[m], sp = x.n? (x.steady/x.n)*100 : 0;
          const season = SEASON_MONTHS.indexOf(m)>=0;
          h += '<tr'+(season?' style="background:color-mix(in oklab,var(--purple) 10%,transparent)"':'')+'>'
            + '<td style="white-space:nowrap">'+MONTH_NAMES[m-1]+(season?' <span style="color:var(--purple)">◆</span>':'')+'</td>'
            + '<td class="n">'+x.diamond+'</td><td class="n">'+x.steady+'</td><td class="n">'+x.seasonal+'</td>'
            + '<td class="n">'+x.spot+'</td><td class="n">'+x.n+'</td>'
            + '<td class="n"'+(sp>dangerPct?' style="color:var(--red)"':'')+'>'+sp.toFixed(0)+'%</td></tr>';
        });
        h += '</tbody></table></div><div class="legend">◆ marks the Jun–Nov reserve window.</div></details>';
      }

      h += '<div class="legend"><b>Load mix strategy:</b> reserved capacity for Jun–Nov seasonal harvest work. '
        + 'Off-season fill = SPOT only, not commitments.<br><br>'
        + 'Buckets are assigned automatically on import — Diamond from the D.P. banners and load signature, the rest from the '
        + 'customer name in the truck column. Anything unrecognised lands in spot; assign it in '
        + '<b>Settings → Load categories &amp; rates</b> so it is not quietly misfiled.</div>';
    }
    h += '</div>';
  }

  /* --- T12M expense breakdown (v1.1) --- */
  {
    const ct = q.costTotals;
    /* v1.3: bars are sized by SHARE OF TOTAL RECURRING COST, not share of
       revenue. "% of revenue" answers a different question and made the
       buckets look smaller than they are — payroll reads 43% of revenue but
       is nearly half of every dollar the company spends. Both are shown. */
    const totalCost = ct.laborLoaded.value + ct.truckTrailerOps.value + ct.insurance.value
                    + ct.insuranceUnclass.value + ct.subhauler.value + ct.companyVehicle.value
                    + ct.overheadAdmin.value;
    const bar = (label,val,pctR,color)=>{
      const pctC = totalCost>0 ? (val/totalCost)*100 : 0;
      return '<div class="row"><div class="row-l"><div class="row-t">'+label+'</div>'
      + '<div class="row-s">'+pctC.toFixed(0)+'% of total cost · '+pctR.toFixed(1)+'% of revenue</div>'
      + '<div class="bar"><i style="width:'+Math.min(100,pctC).toFixed(1)+'%;background:'+color+'"></i></div></div>'
      + '<div class="row-v">'+money(val)+'<div class="row-s">'+pctC.toFixed(0)+'% cost</div></div></div>';
    };
    h += '<div class="card"><h2>T12M cost structure (real QBO)</h2>'
      + bar('Payroll & Labor (loaded)', ct.laborLoaded.value, ct.laborLoaded.pctRev, 'var(--amber)')
      + bar('Truck / Trailer Ops',       ct.truckTrailerOps.value, ct.truckTrailerOps.pctRev, 'var(--accent)')
      + bar('Insurance (recurring)',     ct.insurance.value, ct.insurance.pctRev, 'var(--blue)')
      + bar('Subhauler (326)',           ct.subhauler.value, ct.subhauler.pctRev, 'var(--purple)')
      + bar('Overhead & Admin',          ct.overheadAdmin.value, ct.overheadAdmin.pctRev, 'var(--yellow)')
      + bar('Company Vehicle',           ct.companyVehicle.value, ct.companyVehicle.pctRev, 'var(--green)')
      + '<div class="row"><div class="row-l"><div class="row-t" style="color:var(--amber)">⚑ Insurance — unclassified (needs review)</div>'
      + '<div class="row-s" style="color:var(--amber)">QBO 304.1 raw was $435K but operator-validated liability is $300K. Remaining '+money(ct.insuranceUnclass.value)+' likely cargo policy, umbrella catch-up, or premium audit — EXCLUDED from recurring baseline pending manual QBO vendor-detail review.</div></div>'
      + '<div class="row-v" style="color:var(--amber)">'+money(ct.insuranceUnclass.value)+'<div class="row-s">'+ct.insuranceUnclass.pctRev.toFixed(1)+'% rev</div></div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t" style="color:var(--yellow)">Legal & Accounting — one-time</div>'
      + '<div class="row-s">2025 lawsuit spend, EXCLUDED from recurring cost baseline</div></div>'
      + '<div class="row-v" style="color:var(--yellow)">'+money(ct.legalOneTime.value)+'<div class="row-s">'+ct.legalOneTime.pctRev.toFixed(1)+'% rev</div></div></div>'
      + '<div class="row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:12px">'
      + '<div class="row-l"><div class="row-t"'+(fuelPriceStale()?' style="color:var(--amber)"':'')+'>'
      + (fuelPriceStale()?'🟠 Diesel price stale?' : '⛽ Diesel price')+'</div>'
      + '<div class="row-s">'+(fuelPriceStale()
          ? 'Update in Settings — last set: '+esc(String(s.lastFuelPriceUpdate||'never'))+'. Fuel is the largest per-mile variable cost, so a stale price skews every verdict.'
          : 'Last set '+esc(String(s.lastFuelPriceUpdate||''))+' · '+fuelBasisText()+' · vendors Ramos Oil / Diesel Master')+'</div></div>'
      + '<div class="row-v"'+(fuelPriceStale()?' style="color:var(--amber)"':'')+'>'+money2(fuelPerMile())+'<div class="row-s">/mi</div></div></div>'
      + '<div class="legend">Subhauler at '+ct.subhauler.pctRev.toFixed(1)+'% of revenue is the "load capacity exceeded → outsource" pattern. Watch it — dispatch that consistently exceeds 12-truck capacity should trigger a fleet-size conversation, not permanent subhauler dependence.<br><br><b style="color:var(--amber)">Insurance action item:</b> pull the 304.1 vendor detail in QBO. If a cargo policy is sitting inside 304.1, split it into its own line — it is real recurring cost. If it is a one-time premium audit or umbrella catch-up, note it as non-recurring and the $300K liability figure stands as-is.</div></div>';
  }

  /* --- Weekly revenue trend --- */
  const wk = weeklyBuckets();
  h += '<div class="card"><h2>Weekly revenue trend</h2>';
  if(wk.length>=2){
    h += sparkline(wk.map(w=>w.rev),320,54)
      + '<div class="row"><div class="row-l"><div class="row-t">'+wk.length+' weeks logged</div>'
      + '<div class="row-s">'+wk[0].week+' → '+wk[wk.length-1].week+'</div></div>'
      + '<div class="row-v">'+money(wk[wk.length-1].rev)+'<div class="row-s">latest week</div></div></div>';
  } else {
    h += '<div class="empty">Not enough logged loads to draw a trend.<br>QBO time-split data was not available at build time, so this chart is driven by your saved loads. Log a few weeks in the Calculator and it fills in.</div>';
  }
  h += '</div>';

  /* --- Customer concentration --- */
  const dpRev = q.customers.filter(c=>c.group==='Diamond Pet system').reduce((a,c)=>a+c.rev,0);
  const otherRev = q.customers.filter(c=>c.group!=='Diamond Pet system').reduce((a,c)=>a+c.rev,0);
  const slices = [
    {v:dpRev, c:'var(--amber)'},
    {v:otherRev, c:'var(--accent)'}
  ];
  h += '<div class="card"><h2>Customer concentration</h2>'
    + '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'
    + '<div style="flex:0 0 auto">'+donut(slices,124)+'</div>'
    + '<div style="flex:1;min-width:170px">'
    + '<div class="row"><div class="row-l"><div class="row-t"><span style="color:var(--amber)">■</span> Diamond Pet system</div>'
    + '<div class="row-s">Penny Newman + Phil O\'Connell + Integrated Proteins + Diamond Pet direct</div></div>'
    + '<div class="row-v">'+pct(q.diamondPetSharePct.value)+'</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t"><span style="color:var(--accent)">■</span> All other customers</div></div>'
    + '<div class="row-v">'+pct(100-q.diamondPetSharePct.value)+'</div></div>'
    + '</div></div>';

  h += '<div class="banner red" style="margin:14px 0 0"><b>Single-customer risk</b>'
    + 'Four billing relationships all terminate at Diamond Pet. At '+pct(q.diamondPetSharePct.value)
    + ' of revenue this is one customer, not four. A Diamond Pet sourcing change is an existential event, not a bad quarter.</div>';

  h += '<details><summary>Full customer breakdown (T12M revenue)</summary><div style="margin-top:8px">';
  q.customers.forEach(c=>{
    const share = (c.rev/rev)*100;
    const isBankruptcy = /bankruptcy|written off/i.test(c.note||'');
    h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(c.name)+E(c.verified)+'</div>'
      + (c.note?'<div class="row-s" style="color:'+(isBankruptcy?'var(--red)':'var(--text-faint)')+'">'+esc(c.note)+'</div>':'')
      + '<div class="bar"><i style="width:'+share.toFixed(1)+'%;background:'+(c.group==='Diamond Pet system'?'var(--amber)':'var(--accent)')+'"></i></div></div>'
      + '<div class="row-v">'+money(c.rev)+'<div class="row-s">'+share.toFixed(1)+'%</div></div></div>';
  });
  h += '</div></details></div>';

  /* --- AR aging --- */
  h += '<div class="card"><h2>AR aging</h2>';
  const arMax = Math.max.apply(null,q.ar.buckets.map(b=>b.value));
  q.ar.buckets.forEach(b=>{
    const crit = !!b.flag;
    h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(b.label)+' days'+E(b.verified)+'</div>'
      + (crit?'<div class="row-s" style="color:var(--red)">⚑ '+esc(b.flag)+'</div>':'')
      + '<div class="bar"><i style="width:'+((b.value/arMax)*100).toFixed(1)+'%;background:'+(crit?'var(--red)':'var(--accent)')+'"></i></div></div>'
      + '<div class="row-v"'+(crit?' style="color:var(--red)"':'')+'>'+money(b.value)+'</div></div>';
  });
  h += '<div class="banner red" style="margin-top:14px"><b>Integrated Proteins bad debt — '+money(q.ar.badDebtIP.value)+'</b>'
    + 'The 91+ bucket looks scary at '+money(q.ar.buckets[q.ar.buckets.length-1].value)+', but '+money(q.ar.badDebtIP.value)
    + ' of it is Integrated Proteins Chapter 11 exposure — not collectible slow-pay. An additional $337K was already written off earlier. '
    + 'Real overdue excluding Integrated is <b style="display:inline">'+money(q.ar.realOverdue.value)+'</b> (~20% of real AR) — that is a healthy book. '
    + 'Do not run collections effort against the bankruptcy balance; write it down and work the '+money(q.ar.realOverdue.value)+'.</div>';
  h += '</div>';

  /* --- Detention: reframed in v1.1 ---
     Per operator: rate cards bake in expected wait time. Detention is only
     worth flagging when a specific lane consistently exceeds its baked-in
     expected wait. This is a lane-level pattern check, not a systemic leak. */
  h += '<div class="card"><h2>Detention capture</h2>'
    + '<div class="kpi-grid">'
    + '<div><div class="kpi sm">'+money(det)+'</div><div class="kpi-label">Detention billed YTD</div></div>'
    + '<div><div class="kpi sm">'+detPct.toFixed(1)+'%</div><div class="kpi-label">% of revenue</div></div>'
    + '</div>'
    + '<div class="legend" style="margin-top:14px">Detention captured: '+money(det)+' ('+detPct.toFixed(1)+'% of revenue). '
    + 'Normal for rate cards that price wait time in — the wait is already inside the linehaul, so most loads bill zero detention on top and that is correct. '
    + 'Watch for a specific lane where actual wait consistently exceeds the baked-in expectation. That is the only pattern worth chasing.</div></div>';

  /* --- Lane rankings --- */
  const lanes = laneRankings();
  const top5 = lanes.slice(0,5), bot5 = lanes.slice(-5).reverse();
  const laneRows = (arr,color)=> arr.map(r=>
    '<div class="row"><div class="row-l"><div class="row-t">'+esc(r.label)+'</div>'
    + '<div class="row-s">'+r.n+' load'+(r.n>1?'s':'')+' logged</div></div>'
    + '<div class="row-v" style="color:'+color+'">'+money2(r.val)+'<div class="row-s">/hr</div></div></div>').join('');
  const noLanes = '<div class="empty">No lane ranking yet.<br>QBO does not carry lane-level $/hour — that only exists once loads are logged here. '
    + 'A seeded ranking would be fabricated (every customer bills off the same rate card, so they would all tie), so this stays empty until it is real. Log loads in the Calculator.</div>';

  h += '<div class="card"><h2>Top lanes by contribution $/hr</h2>'+(top5.length?laneRows(top5,'var(--green)'):noLanes)+'</div>';
  h += '<div class="card"><h2>Bottom lanes — renegotiation candidates</h2>'+(bot5.length?laneRows(bot5,'var(--red)'):noLanes)
    + '<div class="legend">Ranked on contribution margin per on-clock hour, which is the only number that accounts for a load tying up a truck. A high-revenue load that burns 11 hours can rank below a small one that turns in 4.</div></div>';

  /* --- Overhead readout --- */
  h += '<div class="card"><h2>Office overhead allocation</h2>'
    + '<div class="kpi-grid">'

const DEFAULT_CALC_CUSTOMER = 'Diamond Pet Foods';

const VZ_TAG = '<span class="vz" title="This is the field Verizon Fleet will auto-populate in Phase 2 — total time from pickup arrival to delivery departure.">🚚 Verizon-ready</span>';

function driverOptions(selected){

/* v1.3: the Calculator is now ONLY the manual single-load what-if. The day

/* -------------------------------------------------------------

   ------------------------------------------------------------- */
function renderSingleCalc(){
  const s = state.settings;
  const u = s.weightUnit;
  const rule = fscRuleFor(DEFAULT_CALC_CUSTOMER);

  let h = '<div class="card"><h2>Load entry</h2>'
    + '<div class="fld"><label for="cCust">Customer</label><select id="cCust">'+customerOptions(DEFAULT_CALC_CUSTOMER)+'</select></div>'
    + '<div class="fld fld2"><div><label for="cOrig">Origin</label><input id="cOrig" placeholder="Ripon"></div>'
    + '<div><label for="cDest">Destination</label><input id="cDest" placeholder="Meridian"></div></div>'
    + '<div class="fld fld2"><div><label for="cLoaded">Loaded miles</label><input id="cLoaded" type="number" inputmode="decimal" value="120"></div>'
    + '<div><label for="cDead">Deadhead miles</label><input id="cDead" type="number" inputmode="decimal" value="25"></div></div>'

    + '<div class="fld"><label>Weight unit</label><div class="seg" id="cUnit">'
    + '<button type="button" data-u="lbs" aria-pressed="'+(u==='lbs')+'">lbs</button>'
    + '<button type="button" data-u="cwt" aria-pressed="'+(u==='cwt')+'">cwt</button>'
    + '<button type="button" data-u="tons" aria-pressed="'+(u==='tons')+'">tons</button></div></div>'
    + '<div class="fld"><label for="cWt">Loaded weight (<span id="cWtU">'+u+'</span>)</label>'
    + '<input id="cWt" type="number" inputmode="decimal" value="'+fromLbs(48000,u)+'">'
    + '<div class="hint" id="cWtConv"></div></div>'

    /* --- FSC: method + rate + resulting $ (v1.2) --- */
    + '<div class="fld fld2">'
    + '<div><label for="cFscMethod">Fuel surcharge method</label><select id="cFscMethod">'+fscMethodOptions(rule.method)+'</select></div>'
    + '<div><label for="cFscVal">FSC rate (<span id="cFscUnit">'+esc(fscMethodUnit(rule.method))+'</span>)</label>'
    + '<input id="cFscVal" type="number" inputmode="decimal" step="0.01" value="'+(rule.method==='none'?'':rule.value)+'"></div></div>'
    + '<div class="fld"><label for="cFsc">Fuel surcharge $</label><input id="cFsc" type="number" inputmode="decimal" value="0">'
    + '<div class="hint" id="cFscHint"></div></div>'

    /* --- Total time on load (v1.2, replaces hours-on-clock + wait) --- */
    + '<div class="fld"><label for="cHours">Total time on load (hrs)'+VZ_TAG+'</label>'
    + '<input id="cHours" type="number" inputmode="decimal" step="0.25" value="5">'
    + '<div class="hint">Pickup + line-haul + delivery + any wait — the whole clock on this load, one number. '
    + 'Drives driver cost at base rate × '+((s.driverLoadingFactor||1).toFixed(2))+' loading.</div></div>'

    + '<div class="fld"><label for="cDrv">Driver</label><select id="cDrv">'+driverOptions('')+'</select></div>'
    + '<div class="fld"><label for="cNotes">Notes</label><textarea id="cNotes" rows="2" placeholder="Broker, appointment window, equipment…"></textarea></div>'
    + '<div class="btn-row"><button class="act" id="cRun">Calculate</button></div></div>'
    + '<div id="cOut"></div>';

  $('#calcBody').innerHTML = h;

  const fscEl = document.getElementById('cFsc');
  const syncFsc = ()=>{
    const method = sv('cFscMethod');
    const lbs = toLbs(fv('cWt'), state.settings.weightUnit);
    const linehaul = lbs * state.settings.ratePerLb;
    const amt = fscAmount(method, fv('cFscVal'), {linehaul:linehaul, lbs:lbs, loadedMi:fv('cLoaded')});
    if(!fscEl.__touched) fscEl.value = amt.toFixed(2);
    const hint = document.getElementById('cFscHint');
    const shown = fv('cFsc');
    const pctOfLine = linehaul>0 ? (shown/linehaul)*100 : 0;
    hint.innerHTML = fscEl.__touched
      ? 'Manual override — '+pctOfLine.toFixed(1)+'% of the '+money2(linehaul)+' linehaul. Change the method or rate above to snap back to the customer rule.'
      : fscRuleText({method:method, value:fv('cFscVal')})+' = '+money2(amt)+' ('+pctOfLine.toFixed(1)+'% of the '+money2(linehaul)+' linehaul).';
  };
  const applyCustomerRule = ()=>{
    const r = fscRuleFor(sv('cCust'));
    document.getElementById('cFscMethod').value = r.method;
    document.getElementById('cFscVal').value = (r.method==='none' ? '' : r.value);
    document.getElementById('cFscUnit').textContent = fscMethodUnit(r.method);

    $('#cWtConv').textContent = num(lbs)+' lbs · '+num(lbs/100,1)+' cwt · '+num(lbs/2000,2)+' tons';

    document.getElementById('cFscUnit').textContent = fscMethodUnit(sv('cFscMethod'));
    if(sv('cFscMethod')==='none') document.getElementById('cFscVal').value='';
    fscEl.__touched=false; syncFsc();
  });
  document.getElementById('cFscVal').addEventListener('input',()=>{ fscEl.__touched=false; syncFsc(); });
  document.getElementById('cLoaded').addEventListener('input',syncFsc);
  document.getElementById('cWt').addEventListener('input',()=>{ syncConv(); syncFsc(); });
  $('#cUnit').addEventListener('click',e=>{
    const b=e.target.closest('button[data-u]'); if(!b) return;
    const old = state.settings.weightUnit, lbs = toLbs(fv('cWt'), old);
    state.settings.weightUnit = b.dataset.u; save();

    $('#cWtU').textContent = b.dataset.u;
    [].forEach.call($('#cUnit').children,x=>x.setAttribute('aria-pressed', String(x.dataset.u===b.dataset.u)));
    syncConv(); syncFsc();
  });
  document.getElementById('cRun').addEventListener('click',runCalc);
  syncConv(); syncFsc();
}

function currentInputs(){
  const s = state.settings;
  const drvName = sv('cDrv');
  const drv = s.drivers.find(d=>d.name===drvName);
  return {
    customer: sv('cCust'), origin: sv('cOrig')||'—', destination: sv('cDest')||'—',
    loadedMi: fv('cLoaded'), deadheadMi: fv('cDead'),
    lbs: toLbs(fv('cWt'), s.weightUnit),
    fsc: fv('cFsc'), fscMethod: sv('cFscMethod'), fscValue: fv('cFscVal'),
    hours: fv('cHours'),
    // v1.2: total time on load absorbs wait. Kept at 0 so v1.1 history
    // records with a real longestWait still render correctly.
    longestWait: 0,
    driver: drvName, driverRate: drv? Number(drv.rate) : s.defaultDriverRate,
    notes: sv('cNotes'),
  };
}

function runCalc(){
  const inp = currentInputs();
  if(inp.hours<=0){ toast('Enter total time on load'); return; }
  if(inp.lbs<=0){ toast('Enter loaded weight'); return; }
  const r = computeLoad(inp);
  state.lastCalc = {inp:inp, r:r};
  renderCalcOut(inp,r);
  document.getElementById('cOut').scrollIntoView({behavior:'smooth',block:'start'});
}

    h += '<div class="banner amber"><b>⚑ Unusual wait — pattern-check this lane</b>'

          : '')
      + 'One-off waits are noise; the rate card already assumes some wait. If this lane consistently exceeds 2 hrs, that is a rate-card conversation with the customer, not a per-load detention chase.</div>';

    + '<div><div class="kpi sm">'+money(r.net)+'</div><div class="kpi-label">Fully-loaded net</div></div>'

    + '</div></div>';

    + '<div><div class="kpi sm">$'+r.rates.perLb.toFixed(5)+'</div><div class="kpi-label">per lb</div></div>'
    + '<div><div class="kpi sm">$'+r.rates.perCwt.toFixed(3)+'</div><div class="kpi-label">per cwt</div></div>'
    + '<div><div class="kpi sm">$'+r.rates.perTon.toFixed(2)+'</div><div class="kpi-label">per ton</div></div></div>'
    + '<div class="legend">'+num(r.lbs)+' lbs · '+num(r.lbs/100,1)+' cwt · '+num(r.lbs/2000,2)+' tons. Card rate (code 101 FB) is $'
    + s.ratePerLb.toFixed(5)+'/lb = $0.68/cwt = $13.55/ton.</div></div>';

  /* Breakdown */
  const line=(t,sub,v,col)=>'<div class="row"><div class="row-l"><div class="row-t">'+t+'</div>'+(sub?'<div class="row-s">'+sub+'</div>':'')+'</div><div class="row-v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div></div>';
  h += '<div class="card"><h2>Breakdown</h2>'

    + line('Deadhead miles', num(inp.deadheadMi)+' mi', money2(r.deadheadCost))

  /* --- T12M benchmark (v1.3) ---

     baseline. Fixed cost per load is the full stack ÷ annual loads. */
  {
    const bRev = revenuePerLoad(inp.customer);
    const bVar = variableCostPerLoad();
    const bCm  = bRev - bVar;
    const fpl  = fixedPerLoad();

      + 'while the fleet average is <b>realised T12M revenue</b> ('+money(state.qbo.revenueT12M.value)+' ÷ '+num(loadsPerYear())

  h += '<div class="btn-row"><button class="act" id="cSave">Save to history</button></div>';

  document.getElementById('cOut').innerHTML = h;

function saveLoad(){
  const lc = state.lastCalc;
  if(!lc){ toast('Calculate first'); return; }
  const {inp,r} = lc;
  state.history.unshift({
    id: 'L'+Date.now(),
    date: new Date().toISOString().slice(0,10),
    ts: new Date().toISOString(),
    customer:inp.customer, origin:inp.origin, destination:inp.destination,
    loadedMi:inp.loadedMi, deadheadMi:inp.deadheadMi, lbs:inp.lbs,
    fsc:inp.fsc, fscMethod:inp.fscMethod, fscValue:inp.fscValue,
    hours:inp.hours, longestWait:inp.longestWait,
    driver:inp.driver, driverRate:inp.driverRate, notes:inp.notes,
    revenue:r.revenue, varCost:r.varCost, cm:r.cm, cmPerHour:r.cmPerHour,
    net:r.net, verdict:r.verdict, ratio:r.ratio,
    detentionBillable: r.detentionExposure? r.detentionBillable : 0,
  });
  save();
  toast('Saved — '+state.history.length+' loads');
  renderHist(); renderDash();
}

/* =============================================================
   MODE B — DAY ROLLUP (v1.2)
   -------------------------------------------------------------
   Primary path is IMPORT, not typing. James drops in
   "2026 FCT Dispatch Log.xlsx" and the app reads the day out of
   it. Manual add-row survives only as a what-if scratchpad for a
   one-off offer that is not on the sheet yet.

   Whole-day P&L: fixed cost = trucks running × $468/truck/day
   (QBO recurring fixed $1,460,222 ÷ 260 days ÷ 12 trucks),
   distributed across loads pro-rata by hours on load — the
   truck-hour is the scarce resource, so it is what fixed cost
   should follow.

   Simplification vs single-load mode: a day row carries ONE miles
   number (total miles run for that load, loaded + deadhead) rather
   than a loaded/deadhead split. Fuel and wear run on it, and a
   per-loaded-mile FSC rule uses it as the loaded figure.
   ============================================================= */

/* ---- SheetJS, loaded on demand (nothing is fetched until the
        user actually imports a file) ---- */
const SHEETJS_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
let __xlsxP = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(__xlsxP) return __xlsxP;
  __xlsxP = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = SHEETJS_CDN; sc.async = true;
    sc.onload = ()=> window.XLSX ? res(window.XLSX) : rej(new Error('SheetJS loaded but the XLSX global is missing.'));
    sc.onerror = ()=> { __xlsxP=null; rej(new Error('Could not load the spreadsheet reader from the CDN. Check the internet connection and try again.')); };
    document.head.appendChild(sc);
  });
  return __xlsxP;
}

/* ---- Cell parsing helpers ---- */
function p2(n){ return (n<10?'0':'')+n; }
function isoLocal(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
/* Human date labels. Three call sites in v1.4/v1.6 each grew their own inline
   version of these; v1.7 needs them from the chip builders too, so they move
   out here rather than becoming a fourth and fifth copy. */
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dateFromISO(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}
function shortDateLabel(iso){                    // "Jul 29"
  const d = dateFromISO(iso);
  return d ? MONTH_NAMES[d.getMonth()]+' '+d.getDate() : (iso||'');
}
function dowDateLabel(iso){                      // "Wed Jul 29"
  const d = dateFromISO(iso);
  return d ? DOW_SHORT[d.getDay()]+' '+MONTH_NAMES[d.getMonth()]+' '+d.getDate() : (iso||'');
}
/* Excel's day-zero is 1899-12-30 on Windows, and 25569 is the offset from
   there to the Unix epoch. Built in UTC and read back in UTC — a serial is a
   whole day, so shifting it into local time would move it across a midnight
   for anyone west of Greenwich and land the day one earlier. */
function excelSerialToDate(serial){
  const ms = (Number(serial) - 25569) * 86400 * 1000;
  return new Date(ms);
}
/* Returns 'YYYY-MM-DD' or null. Rejects anything outside 1990–2100 so that
   time-of-day cells (Excel stores those as 1899-12-30 dates) and 6-digit
   BOL numbers never masquerade as a date banner. */
function parseCellDate(v){
  if(v==null || v==='') return null;
  if(v instanceof Date){
    /* Same UTC calendar day as the serial path. SheetJS cellDates:true
       builds UTC-midnight Dates; isoLocal() in Pacific time reads the
       previous afternoon and moved ADP / file-drop banners back one day
       (Wed 9/2 pay landed on Tue 9/1). Worker ingest already stringifies
       serials and stayed correct. */
    if(isNaN(v.getTime())) return null;
    const y=v.getUTCFullYear();
    return (y>=1990 && y<=2100)
      ? (y+'-'+p2(v.getUTCMonth()+1)+'-'+p2(v.getUTCDate()))
      : null;
  }
  if(typeof v==='number'){
    if(v>32874 && v<73415){                      // 1990-01-01 .. 2100-12-31 as Excel serials
      const d = excelSerialToDate(v);
      if(isNaN(d.getTime())) return null;
      return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
    }
    return null;
  }
  const s = String(v).trim();
  /* v1.6: a date banner arriving from the worker is a serial that went through
     JSON as TEXT — "45500", not 45500. Only bare 5-digit runs qualify, which
     keeps 6-digit FB / BOL numbers (192563) and PO strings ("75811-49") out;
     the 1990–2100 window below then throws out anything else that slips in. */
  if(/^\d{5}(\.\d+)?$/.test(s)){
    const n = Number(s);
    if(n>32874 && n<73415){
      const d = excelSerialToDate(n);
      if(!isNaN(d.getTime())) return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
    }
    return null;
  }
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){ const y=+m[1]; if(y>=1990&&y<=2100) return y+'-'+p2(+m[2])+'-'+p2(+m[3]); }
  m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);   // 1/1/2026, also inside "THURSDAY 1/1/2026"
  if(m){
    const mo=+m[1], da=+m[2]; let yr=+m[3];
    if(yr<100) yr += 2000;
    if(mo>=1&&mo<=12 && da>=1&&da<=31 && yr>=1990&&yr<=2100) return yr+'-'+p2(mo)+'-'+p2(da);
  }
  return null;
}
/* Delivery-point banner: "D.P. LATHROP" / "D.P. RIPON".

   requireMarker forces the literal "D.P." prefix. Pass it for any row that
   carries real load data, because the Grower/Origin column legitimately
   holds a bare "RIPON" on genuine loads — the AD-series Egg Pmx runs are
   written that way. Without this guard those rows were read as banners and
   silently dropped from the day (8 of them across the 2026 log). A true
   banner row has only the one cell filled, so it never needs the marker. */
function parseDPBanner(v, requireMarker){
  const s = String(v==null?'':v).toUpperCase().trim();
  if(!s) return null;
  const hasMarker = /\bD\.?\s*P\.?\b/.test(s);
  const bare = /^(LATHROP|RIPON)$/.test(s);
  if(!hasMarker && !bare) return null;
  if(!hasMarker && requireMarker) return null;
  if(/LATHROP/.test(s)) return 'LATHROP';
  if(/RIPON/.test(s))   return 'RIPON';
  const rest = s.replace(/\bD\.?\s*P\.?\b/,'').replace(/[^A-Z ]/g,'').trim();
  return rest || null;
}

function suggestionLogKey(name){

  if(!raw) return '';

  const norm = s=>String(s||'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  const hit = roster.find(d => norm(d.name) === upper);
  return hit ? hit.name : raw;

/* Fraction of a driver's total history spent on POC-signature origins.
   0 = pure Diamond driver, 1 = pure POC specialist. Cached per name so
   the suggestion engine doesn't recompute per row. */
const __DRIVER_POC_SHARE = {};
function driverPocShare(name){
  if(__DRIVER_POC_SHARE[name] != null) return __DRIVER_POC_SHARE[name];
  const hist = originHistoryFor(name);
  let poc = 0, total = 0;
  for(const k in hist){
    const n = Number(hist[k]) || 0;
    total += n;
    if(isDriverPocOrigin(k)) poc += n;
  }
  const share = total ? poc/total : 0;
  __DRIVER_POC_SHARE[name] = share;
  return share;
}

function trailerLastCommodity(pair, todaysRows){
  // Prefer today's commodity if the trailer is on today's sheet
  if(todaysRows){
    for(const r of todaysRows){
      if(!r) continue;
      if(parseTrailerPair(r.truck) === pair && r.commodity){
        return String(r.commodity).trim();
      }
    }
  }
  // v1.8.23: prefer LIVE lookup from the parsed dispatch log.
  // v1.8.35 (James 2026-07-31): sort by DATE+TIME desc before walking so
  // "newest" is truly newest across sheets. Old behavior trusted array order,
  // which broke when the parse combined multiple day-sheets out of chronology
  // (a stale earlier-day row could win over today's actual last haul).
  // Only DELIVERED / DISPATCHED / PRELOAD rows count as "the trailer hauled
  // that commodity" — future/unassigned rows on tomorrow's sheet don't count.
  const li = state.dayRollup && state.dayRollup.lastImport;
  if(li && li.rows && li.rows.length){
    const candidates = [];
    for(let i = 0; i < li.rows.length; i++){
      const r = li.rows[i];
      if(!r || !r.commodity) continue;
      let p = parseTrailerPair(r.truck);
      if(!p && r.rawCells){
        for(const c of r.rawCells){
          p = parseTrailerPair(c);
          if(p) break;
        }
      }
      if(p !== pair) continue;
      // Only count rows that actually represent a haul: has a status of
      // DELIVERED/DISPATCHED/PRELOADED, OR has a driver name (which means
      // it's been assigned and worked). Skip blank future rows.
      const st = String(r.status || '').toUpperCase();
      const looksHauled = /DELIVER|DISPATCH|PRE/.test(st) || (r.driver && String(r.driver).trim());
      if(!looksHauled) continue;
      candidates.push({
        r: r,
        dateKey: (r.date || '') + ':' + String(apptMinutes(r.time) || 0).padStart(4, '0'),
      });
    }
    if(candidates.length){
      // Sort desc so [0] is newest across all sheets, not just newest array index.
      candidates.sort((a, b) => b.dateKey.localeCompare(a.dateKey));
      return String(candidates[0].r.commodity).trim();
    }
  }
  return TRAILER_LAST_COMMODITY[pair] || null;
}
function parseTrailerPair(s){
  const m = String(s||'').trim().match(/^(\d{1,3})\s*\/\s*(\d{1,3})$/);
  if(m){
    const a = +m[1], b = +m[2];
    return (a<=b) ? (a+'/'+b) : (b+'/'+a);
  }
  const single = String(s||'').trim().match(/^(\d{2,3})$/);
  return single ? single[1] : null;
}
/* Categorize today's rows into trailer buckets. James's ask 2026-07-30:
   simple list — In Use, Preloaded, In Yard, with a manual toggle to mark
   a trailer done (moves it to Yard).
   PRELOADED = row is PRE LOADED/PRELOADED status OR has the preload lock
   (pre-6am delivery, staged the afternoon before).
   IN USE = row has a driver, status is DISPATCHED (not preloaded, not
   delivered), and NOT manually toggled done.
   YARD = active roster minus in-use minus preloaded, PLUS any pair the
   operator manually toggled done.
   Manual toggles live in state.dispatchOps.trailerDone (keyed by ISO date). */
function getTrailerDoneSet(dateISO){
  const ops = state.dispatchOps || {};
  const td = ops.trailerDone || {};
  return new Set(td[dateISO] || []);
}
function toggleTrailerDone(dateISO, pair){
  state.dispatchOps = state.dispatchOps || {};
  state.dispatchOps.trailerDone = state.dispatchOps.trailerDone || {};
  const day = state.dispatchOps.trailerDone[dateISO] = state.dispatchOps.trailerDone[dateISO] || [];
  const i = day.indexOf(pair);
  if(i>=0) day.splice(i,1); else day.push(pair);
  save();
}
function computeTrailerStatus(rows, dateISO){
  const inUse = new Set();
  const preloaded = new Set();
  const unknownPairs = new Set();
  const rowsByPair = {};
  const done = getTrailerDoneSet(dateISO || (state.dayRollup && state.dayRollup.date));
  (rows||[]).forEach(r=>{
    if(!r) return;
    // v1.8.22: check r.truck first (column G), then fall back to any other
    // cell on the row that looks like a pair — POC rows put the customer
    // name in G and the trailer pair in H or later.
    let p = parseTrailerPair(r.truck);
    if(!p && r.notes) p = parseTrailerPair(r.notes);
    // Scan raw row values if we've kept them (some parsers do)
    if(!p && r.rawCells){
      for(const c of r.rawCells){
        p = parseTrailerPair(c);
        if(p) break;
      }
    }
    if(!p) return;
    const isRoster = ACTIVE_TRAILER_PAIRS.indexOf(p) >= 0 || ACTIVE_SINGLE_TRAILERS.indexOf(p) >= 0;
    if(!isRoster) unknownPairs.add(p);
    rowsByPair[p] = (rowsByPair[p] || []); rowsByPair[p].push(r);
    if(done.has(p)) return;   // manually cleared to yard
    const st = String(r.status||'').trim().toUpperCase();
    // v1.8.36 (James 2026-07-31): DELIVERED loads mean the trailer has been
    // unloaded and is back in yard. Previously time-based isPreloadLocked
    // still flagged the row as preloaded even after DELIVERED, so 4 trailers
    // that ran overnight preloads showed as "still preloaded" the next morning
    // when they were actually empty. Skip delivered rows entirely so they
    // don't lock the trailer into In Use or Preloaded.
    if(/DELIVER/.test(st)) return;
    // v1.8.26: James types just "PRE" in status column — accept any status
    // starting with PRE (PRE, PRE LOADED, PRELOADED, PREP, etc).
    const isPreload = /^PRE/.test(st) || (typeof isPreloadLocked === 'function' && isPreloadLocked(r));
    const assigned = !!(r.driver || r.driverRaw);
    if(isPreload) preloaded.add(p);
    else if(assigned) inUse.add(p);
  });
  // v1.8.22: dedupe — if a trailer has BOTH a preload and a later dispatched
  // load today, it's In Use now (driver has it), not still Preloaded. This
  // fixes the visual overlap where 72/73 etc. appeared in both columns.
  preloaded.forEach(p => { if(inUse.has(p)) preloaded.delete(p); });
  const allRoster = ACTIVE_TRAILER_PAIRS.concat(ACTIVE_SINGLE_TRAILERS);
  // v1.8.27: split roster by note flag. Red-tagged and at-customer trailers
  // don't count as yard-available; they get their own buckets.
  const redTag = [];
  const atCustomer = [];
  const yard = [];
  allRoster.forEach(p => {
    if(inUse.has(p) || preloaded.has(p)) return;
    const note = TRAILER_NOTES[p];
    if(note && note.flag === 'red-tag') redTag.push(p);
    else if(note && note.flag === 'at-customer') atCustomer.push(p);
    else yard.push(p);
  });
  return {
    inUse: Array.from(inUse).sort(sortPair),
    preloaded: Array.from(preloaded).sort(sortPair),
    yard: yard.sort(sortPair),
    redTag: redTag.sort(sortPair),
    atCustomer: atCustomer.sort(sortPair),
    done: Array.from(done).sort(sortPair),
    unknown: Array.from(unknownPairs).sort(sortPair),
    rowsByPair: rowsByPair,
    rosterSize: allRoster.length,
  };
}
function sortPair(a,b){ return (+String(a).split('/')[0]) - (+String(b).split('/')[0]); }

/* =============================================================
   DISPATCH RULE ENGINE (v1.4)
   ============================================================= */

/* The Time column is dispatcher free-text. fmtSheetTime() has already
   turned real Excel time cells into "9am" / "4:15pm"; typed text like
   "Afternoon", "ASAP" or "PRE" survives as itself. Anything that is not
   a clock time returns null and simply draws no chip — a rule that
   fires on a guess is worse than no rule. */
function apptMinutes(v){
  const s = String(v==null?'':v).trim();
  if(!s) return null;
  let m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m\.?$/i);
  if(m){
    const hh = (+m[1])%12, mm = m[2]?+m[2]:0;
    if(+m[1]>12 || mm>59) return null;
    return (hh + (/p/i.test(m[3])?12:0))*60 + mm;
  }
  m = s.match(/^(\d{1,2}):(\d{2})$/);
  if(m && +m[1]<24 && +m[2]<60) return (+m[1])*60 + (+m[2]);
  return null;
}
function fmtMins(m){
  if(m==null) return '—';
  let hh = Math.floor(m/60)%24, mm = m%60;
  const ap = hh>=12?'pm':'am'; hh = hh%12 || 12;
  return hh+(mm?':'+p2(mm):'')+ap;
}

/* Cutoff verdict for one row.
   -------------------------------------------------------------
   Read literally, the two rules the operator gave overlap: 4:15pm off
   FCG is BOTH "past the 4pm cutoff" and "within 30 minutes of it". His
   own worked example calls that one amber, so the pair is implemented
   as a single band around the cutoff rather than two separate tests:

       more than 30 min past   -> RED    it cannot be loaded, it needs
                                         a preload the day before
       within +/- 30 min       -> AMBER  it is going to be tight
       more than 30 min early  -> nothing

   Pre-6am loads land far below every cutoff and so draw no cutoff chip;
   they carry the lock chip instead, which is the rule that owns them. */
function cutoffState(r){
  const cut = ORIGIN_CUTOFFS[normOrigin(r && r.origin)];
  if(cut==null) return null;
  const m = apptMinutes(r && r.time);
  if(m==null) return null;
  /* v1.8.1: Time is DELIVERY appointment, not origin pickup. A late delivery
     Time vs early origin cutoff is normal for preloaded loads. If the load
     is already handled (DISPATCHED/DELIVERED/PRE LOADED), the cutoff is
     moot — draw no chip. Only un-handled loads earn a preload-required chip. */
  const st = String((r && r.status) || '').trim().toUpperCase();
  if(st === 'DISPATCHED' || st === 'DELIVERED' || st === 'PRE LOADED' || st === 'PRELOADED') return null;
  const delta = m - cut;
  if(delta >  CUTOFF_NEAR_MIN) return {k:'past', delta:delta, cut:cut, mins:m};
  if(delta >= -CUTOFF_NEAR_MIN) return {k:'near', delta:delta, cut:cut, mins:m};
  return null;
}
/* Spec.md: 12:00am–6:00am deliveries are locked in from yesterday's PM list. */
function isPreloadLocked(r){
  const m = apptMinutes(r && r.time);
  return m!=null && m>=0 && m<PRELOAD_LOCK_END_MIN;
}

/* driver_shifts.json counts weekdays 0=Monday; JS Date counts 0=Sunday. */
function shiftWorksOn(sh, dateISO){
  if(!sh || !sh.days) return true;
  if(!dateISO) return true;
  const d = new Date(dateISO+'T00:00:00');
  if(isNaN(d.getTime())) return true;
  return sh.days.indexOf((d.getDay()+6)%7) >= 0;
}
function shiftCovers(cls, mins){
  const w = SHIFT_WINDOWS[cls];
  if(!w || mins==null) return false;
  return w.from <= w.to ? (mins>=w.from && mins<=w.to)
                        : (mins>=w.from || mins<=w.to);   // wraps midnight
}
/* v2.1.28: shift-start matching. James 2026-08-24: suggest people as their
   truck starts at the beginning of the day. DAY 6:00–6:45 starters need a
   lead so a 6am PNG is theirs even though the baked average start is 6:22.
   Evening wraps: a 2am load is after a 4pm start, not before it. */
const SHIFT_START_LEAD_MIN  = 90;  // may take a load up to 90 min before official start
const SHIFT_START_GRACE_MIN = 75;  // still "truck is starting" this long after start
function shiftStartDelta(shift, mins){
  if(!shift || mins==null || shift.start==null) return null;
  let t = mins;
  if(shift.cls === 'EVENING' && mins < shift.start) t = mins + 24*60;
  return t - shift.start;
}
function shiftIsStarting(shift, mins){
  const d = shiftStartDelta(shift, mins);
  return d!=null && d >= -SHIFT_START_LEAD_MIN && d <= SHIFT_START_GRACE_MIN;
}
function shiftHasStarted(shift, mins){
  const d = shiftStartDelta(shift, mins);
  return d!=null && d >= -SHIFT_START_LEAD_MIN;
}

/* Stable pseudo-random. Math.random() would reshuffle the "no history"
   fallback on every re-render, which reads as the app changing its mind. */
function stableHash(s){
  let h = 2166136261;
  for(let i=0;i<String(s).length;i++){ h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0)/4294967296;
}

/* ---- Dispatch-ops roster view ----
   The pay roster in Settings is the source of names and rates; the
   dispatch-ops slot adds the operational fields (HOS budget, clocked
   in, active) that Phase 2/3 will eventually drive from Verizon. */
function dispatchDriver(name){

  const rec = ops[name] || {};
  return {
    name: name,
    short: shortNameFor(name),
    hos: rec.hos!=null ? Number(rec.hos) : Number(state.settings.defaultDriverHosHrs)||10,
    clockedIn: !!rec.clockedIn,
    active: rec.active !== false,
    shift: DRIVER_SHIFTS[shortNameFor(name)] || null,

}

/* 2026-08-18 v2.1.4: cross-reference FCT roster names → Verizon Live feed to get
   each driver's real-time status. Returns null if the driver isn't matched to a
   truck in Verizon (either not assigned, or one of the 10 unlinked trucks).
   Match strategy: exact case-insensitive, then first-name + last-initial. */
function verizonDriverStatus(fctName){
  const vl = state.verizonLive;
  if(!vl || !vl.vehicles || !vl.vehicles.length) return null;
  const target = String(fctName||'').trim().toLowerCase();
  if(!target) return null;
  const targetFirst = target.split(/\s+/)[0];
  const targetLast = target.split(/\s+/).slice(-1)[0];
  const targetLastInit = targetLast[0] || '';
  // v2.1.14: check per-truck driver overrides first (JJ marked someone else
  // in this truck for today). Fall back to Verizon-reported driver + primary
  // cache for trucks where nobody is logged in right now.
  const overrides = vl.driverOverrides || {};
  const primaryCache = vl.primaryDriverCache || {};
  const nameMatchesTruckDriver = (truckDriverName) => {
    const vname = String(truckDriverName||'').trim().toLowerCase();
    if(!vname) return false;
    if(vname === target) return true;
    const vf = vname.split(/\s+/)[0];
    const vl2 = vname.split(/\s+/).slice(-1)[0];
    return vf === targetFirst && vl2[0] === targetLastInit;
  };
  const match = vl.vehicles.find(v => {
    const tid = String(v.Name || v.VehicleNumber || '');
    const overrideName = overrides[tid] && overrides[tid].name;
    if(overrideName && nameMatchesTruckDriver(overrideName)) return true;
    if(v._driverName && nameMatchesTruckDriver(v._driverName)) return true;
    if(!v._driverName && primaryCache[tid] && nameMatchesTruckDriver(primaryCache[tid])) return true;
    return false;
  });
  if(!match) return null;
  const loc = match._location || {};
  const gpsMs = loc.UpdateUTC ? Date.parse(loc.UpdateUTC + 'Z') : 0;
  const ageMin = gpsMs ? Math.floor((Date.now() - gpsMs) / 60000) : null;
  const isMoving = loc.Speed > 0;
  const isHome = /home terminal/i.test(String(loc.GeoFenceName||''));
  const addr = (loc.Address && loc.Address.AddressLine1) || loc.GeoFenceName || '';
  const status = isMoving ? 'moving' : (isHome ? 'yard' : 'stopped');
  const truckId = String(match.Name || match.VehicleNumber || '');
  const readyTs = state.verizonLive.readyOverrides && state.verizonLive.readyOverrides[truckId];
  const readyOverride = !!(readyTs && (Date.now() - Number(readyTs) < 4*60*60*1000));
  return {
    linked: true,
    truck: truckId,
    driverName: match._driverName,
    status, isMoving, isHome, readyOverride,
    // Effective availability: available if at yard, or manually marked ready, or stopped at customer > 30 min AND not moving
    available: isHome || readyOverride || (!isMoving && status === 'stopped' && ageMin != null && ageMin > 30),
    speed: loc.Speed || 0,
    heading: loc.Heading || '',
    addr,
    ageMin,
    fresh: ageMin != null && ageMin < 30,
    stale: ageMin == null || ageMin > 240,
  };
}

/* 2026-08-18 v2.1.4: mark/unmark a truck as "ready for next load" (driver empty
   at customer, waiting for dispatch). Called from Fleet tab buttons. Auto-expires
   after 4 hrs via normalize step. */
function markTruckReady(truckId){
  if(!state.verizonLive) state.verizonLive = defaultVerizonLive();
  if(!state.verizonLive.readyOverrides) state.verizonLive.readyOverrides = {};
  state.verizonLive.readyOverrides[String(truckId)] = Date.now();
  save();
  try { renderFleet(); renderDash(); } catch(_){}
}
function clearTruckReady(truckId){
  if(!state.verizonLive || !state.verizonLive.readyOverrides) return;
  delete state.verizonLive.readyOverrides[String(truckId)];
  save();
  try { renderFleet(); renderDash(); } catch(_){}
}
// v2.1.14: per-truck driver override — for cases like truck 24 where today's
// driver differs from the primary. Value "" or null clears the override.
function setTruckDriverOverride(truckId, driverName){
  if(!state.verizonLive) state.verizonLive = defaultVerizonLive();
  if(!state.verizonLive.driverOverrides) state.verizonLive.driverOverrides = {};
  const tid = String(truckId);
  const n = String(driverName||'').trim();
  if(!n){ delete state.verizonLive.driverOverrides[tid]; }
  else   { state.verizonLive.driverOverrides[tid] = { name: n, ts: Date.now() }; }
  save();
  try { renderFleet(); renderDash(); } catch(_){}
}
window.setTruckDriverOverride = setTruckDriverOverride;

/* v1.8.3: Per-render capacity tracker so the suggestion engine stops
   putting the same driver on 7 loads. James rule (updated v1.8.4):
     - Max 2 loads per driver per day
     - Delivery loads: 3 hr apart minimum (9am load: leave 7am, unload ~11am,
       able to do a 12pm next — so 9am + 12pm is fine)
     - Preload cooldown: 2 hr (driver drops pre-built trailer, no load time)
   The log resets at the start of every renderDayRollup pass. */
let __suggestionLog = new Map();  // driverName -> [minutes1, minutes2]
let __precomputedSuggestions = new Map(); // row.id -> top picks (chrono walk)
// James 2026-07-29 after my briefly bumping to 3: "We almost certainly
// can't do 3 a guy. We will see how tomorrow goes." Keep at 2 — operator
// ground truth, don't reopen without new data.
const MAX_LOADS_PER_DRIVER = 2;
// v1.8.33: James 2026-07-31 "It takes 5 hours per load" — bumped cooldown
// from 3hr to 5hr to match actual round-trip duration (drive + load + drive
// + unload). Prior 3hr was appointment-to-appointment but drivers can't
// physically do 6am delivery then 9am delivery, they need time to return.
const COOLDOWN_DELIVERY_MIN = 300;   // 5 hours — Diamond LIVE load (wait to load + deliver + return)
const COOLDOWN_PRELOADED_MIN = 180;  // 3 hours — Diamond PRELOADED (trailer ready, just deliver + return)
const COOLDOWN_PRELOAD_MIN  = 180;   // 3 hours — preload trailer drop + return
// 2026-08-18 v2.1.5: Harris Ranch is a ~10hr round-trip full-day burn (James
// confirmed). A driver on Harris is out for the day — no second delivery.
// Verify actual number from Verizon segment data when we have it.
const COOLDOWN_HARRIS_MIN   = 600;   // 10 hours — full-day burn

function resetSuggestionLog(){
  __suggestionLog = new Map();
  __precomputedSuggestions = new Map();
}

function driverSlotLog(name){
  return __suggestionLog.get(suggestionLogKey(name)) || [];
}

/* Duration of a prior reserved/assigned slot. Assigned rows use the real
   load duration; suggested-only slots that are not yet on the sheet use
   preloaded=3hr for pre-6am (those trailers are built the afternoon before)
   and live Diamond=5hr otherwise. Same-clock-time loads always conflict. */
function priorSlotDuration(name, prevMins){
  if(prevMins == null) return COOLDOWN_DELIVERY_MIN;
  const key = suggestionLogKey(name);
  const rows = (state.dayRollup && state.dayRollup.currentRows) || [];
  for(const r of rows){
    if(!r || suggestionLogKey(r.driver) !== key) continue;
    if(apptMinutes(r.time) === prevMins) return loadDurationMins(r);
  }
  if(prevMins >= 0 && prevMins < 360) return COOLDOWN_PRELOADED_MIN;
  return COOLDOWN_DELIVERY_MIN;
}

/* v1.8.5: seed the log with rows that ALREADY have a driver assigned so those
   count against the cap. James's early-AM preloads are dispatched by JJ the
   night before — the suggestion engine has to see Francisco already has a 4am
   load or it will suggest him for 2 MORE and blow past what's realistic.
   v2.1.28: always key the log on the roster full name so "GREG" / "Greg" /
   "Gregorio Martinez" count as the same person. */
function seedAssignedDriverSlots(rows){
  if(!Array.isArray(rows)) return;
  rows.forEach(r => {
    const driverName = r && (r.driver || r.driverRaw);
    if(!driverName) return;
    const mins = apptMinutes(r.time);
    reserveDriverSlot(driverName, mins);
    // if the row lists a separate preloader, count that person too
    if(r.preloader){
      const preloadName = suggestionLogKey(r.preloader);
      if(preloadName && preloadName !== suggestionLogKey(driverName)){
        // preloaders drop trailers pre-6am; their slot is nominally the pre-6am window
        reserveDriverSlot(preloadName, mins != null && mins < 360 ? mins : 0);
      }
    }
  });
}

function driverCanTakeLoad(name, mins, isPreload, isHarris){
  const log = driverSlotLog(name);
  if(log.length >= MAX_LOADS_PER_DRIVER) return false;
  if(isHarris && log.length >= 1) return false;
  // v2.1.11: cooldown uses ACTUAL duration of prior load (3hr preloaded, 5hr
  // live, 10hr Harris) not a flat 5hr. James 2026-08-18: preloaded loads free
  // the driver in ~3hr — algo needs to surface them for next early AM load.
  for(const prev of log){
    if(mins == null || prev == null) continue;
    const priorDur = priorSlotDuration(name, prev);
    // Directional check: if new load is AFTER prev, prev's cooldown must have expired.
    // If new load is BEFORE prev, use the new load's own duration to check backwards.
    if(mins >= prev){
      if(mins - prev < priorDur) return false;
    } else {
      const newDur = isHarris ? COOLDOWN_HARRIS_MIN : (isPreload ? COOLDOWN_PRELOAD_MIN : COOLDOWN_DELIVERY_MIN);
      if(prev - mins < newDur) return false;
    }
  }
  return true;
}
function reserveDriverSlot(name, mins){
  const key = suggestionLogKey(name);
  if(!key) return;
  const log = __suggestionLog.get(key) || [];
  log.push(mins);
  __suggestionLog.set(key, log);
}

/* v2.1.9/10: driver trajectory helper — given a driver name and the load appt
   time we're considering, compute when they'll be empty from their earlier
   commitments. Uses the ACTUAL duration of the earlier load (3hr if preloaded,
   5hr live, 10hr Harris) by scanning dayRollup rows for that driver.
   James 2026-08-18: "If the load was preloaded for him it will take less than
   5 hours more like 3." */
function loadDurationMins(r){
  if(!r) return COOLDOWN_DELIVERY_MIN;
  if(String(r.origin||'').toUpperCase() === 'HARRIS') return COOLDOWN_HARRIS_MIN;
  // Preloaded when the row lists a preloader distinct from the delivery driver.
  if(r.preloader && matchDriver(r.preloader) !== r.driver) return COOLDOWN_PRELOADED_MIN;
  return COOLDOWN_DELIVERY_MIN;
}
function driverTrajectory(name, apptMins){
  const log = driverSlotLog(name).filter(m => m != null).sort((a,b)=>a-b);
  if(!log.length) return { earliestFree: null, wasBusy: false, nextBooking: null };
  let latestBefore = null;
  let nextAfter = null;
  for(const t of log){
    if(apptMins == null){ latestBefore = t; break; }
    if(t < apptMins) latestBefore = t;
    else if(nextAfter == null) nextAfter = t;
  }
  const priorDuration = latestBefore != null ? priorSlotDuration(name, latestBefore) : COOLDOWN_DELIVERY_MIN;
  const earliestFree = latestBefore != null ? (latestBefore + priorDuration) : null;
  return {
    earliestFree: earliestFree,
    wasBusy: latestBefore != null,
    priorSlot: latestBefore,
    priorDuration: priorDuration,
    nextBooking: nextAfter
  };
}

/* ---- Suggestion engine (Phase 3.0 foundation) ----
   v2.1.28 rebuild (James 2026-08-24): restore the spread older versions
   had, then rank by shift-start. Archaeology (git only has the v2.1.24
   snapshot, so this is from comments + SHADOW_CHANGELOG + the live bug):

     v1.8.3  cap + reserve — this is what USED to spread the Queue.
     v1.8.9  hard shift filter for JJ-confirmed NIGHT/AFTERNOON/EVENING.
     v1.8.18 hard Diamond/POC bucket split (pocShare > 10%).
     v1.8.19 overCap fallback — keep someone clickable when the day is packed.
     v2.1.4  Verizon -1200 moving — wipes DAY roster at 6am when trucks roll.
     v2.1.6/11 NIGHT off-window exemptions — kept Greg eligible through 9am.
     v2.1.23 PNG added to POC_ORIGINS for Perdue RATE lookup. Combined with
             v1.8.18 this made 0/24 drivers Diamond-eligible. Queue top[]
             was empty; the dropdown fell through to roster order; Gregorio
             Martinez is first in settings.drivers. THAT is the all-Greg
             regression. Older versions (v1.8.18 through v2.1.22) spread.

   Ranking now, in order:
     1. shift-start / window fit (truck starting at T)
     2. remaining capacity — nobody gets a 2nd until this wave has a 1st
     3. origin history as a tie-break only (no more +1000 steamroller)
   Hard filters (unchanged intent): confirmed off-window NIGHT/AFTERNOON/
   EVENING out; POC vs Diamond bucket; Felix meal/salmon; day-off;
   dedicated preloaders; 2-load cap + cooldown including same clock time. */
function suggestDrivers(r, n, opts){
  opts = opts || {};
  const origin = normOrigin(r && r.origin);
  const mins = apptMinutes(r && r.time);
  const isPreload = mins != null && mins >= 0 && mins < 360;  // pre-6am
  const isHarris = origin === 'HARRIS';
  const dateISO = (r && r.date) || state.dayRollup.date || '';
  const loadBucket = (r && r.bucket) || '';
  // v2.1.5: preload window reserve — afternoon Diamond only. Leave it, but
  // it must not outrank shift-start on the morning wave.
  const preloadReserve = (function(){
    try {
      const roster = dispatchRoster().filter(d=>d.active);
      let candidates = 0;
      const nowHr = new Date().getHours();
      for(const d of roster){
        if(!d.shift) continue;
        const cls = d.shift.cls;
        let eligible = false;
        if(cls === 'DAY' || cls === 'AFTERNOON') eligible = true;
        else if(cls === 'NIGHT' && nowHr >= 9 && nowHr <= 16) eligible = true;
        if(!eligible) continue;
        const already = driverSlotLog(d.name).length;
        if(already >= MAX_LOADS_PER_DRIVER) continue;
        candidates++;
      }
      return candidates;
    } catch(_){ return 99; }
  })();
  const hourNow = new Date().getHours();
  const preloadReserveThin = preloadReserve < 3 && hourNow >= 11;
  const nowMins = hourNow*60 + new Date().getMinutes();
  let out = dispatchRoster().filter(d=>d.active).map(d=>{
    const hist = originHistoryFor(d.name);
    const runs = Number(hist[origin]) || 0;
    const total = Object.keys(hist).reduce((a,k)=>a+(Number(hist[k])||0), 0);
    const onDay = d.shift ? shiftWorksOn(d.shift, dateISO) : true;
    const fits  = d.shift ? shiftCovers(d.shift.cls, mins) : false;
    const starting = d.shift ? shiftIsStarting(d.shift, mins) : false;
    const started  = d.shift ? shiftHasStarted(d.shift, mins) : false;
    let pocShare = driverPocShare(d.name);
    const bucketOverride = driverBucketOverride(d.short, dateISO);
    if(bucketOverride === 'poc') pocShare = 1.0;
    else if(bucketOverride === 'diamond') pocShare = 0.0;
    const confirmed = d.shift && /\(JJ\)/.test(String(d.shift.note||''));
    const why = [];
    if(d.shift && onDay && starting && fits) why.push(d.shift.cls.toLowerCase()+' truck starting ~'+fmtMins(d.shift.start)+' for '+fmtMins(mins));
    else if(d.shift && onDay && fits) why.push(d.shift.cls.toLowerCase()+' shift covers '+fmtMins(mins));
    else if(d.shift && !onDay)   why.push('off on this weekday');
    else if(d.shift && mins!=null && !fits) why.push(d.shift.cls.toLowerCase()+' shift is off-window');
    if(d.clockedIn) why.push('clocked in');
    if(runs) why.push(runs+' prior run'+(runs===1?'':'s')+' at '+origin);
    let score = 0;
    const currentLoad = driverSlotLog(d.name).length;
    // v2.1.28: shift-start outranks origin counts. DAY 6:00–6:45 starters
    // beat Greg (2–3am NIGHT, already 3+ hours into his shift) on 6am PNG.
    if(starting && fits) score += 900;
    else if(fits && started) score += 350;
    else if(fits) score += 80;
    score += onDay ? 80 : 0;
    score += d.clockedIn ? 40 : 0;
    // First-wave: 0 loads before 1 before 2. James: nobody gets a second
    // until that wave has a first. Hard-filtered to 0-load below as well;
    // this score keeps the ranking honest if the filter cannot apply.
    if(currentLoad === 0) score += 500;
    else if(currentLoad === 1){
      score -= 200;
      why.push('1 load already today');
    } else {
      score -= currentLoad * 400;
      why.push(currentLoad+' loads already today');
    }
    if(currentLoad > 0){
      const traj = driverTrajectory(d.name, mins);
      if(traj.priorSlot != null && traj.earliestFree != null && mins != null){
        const priorLbl = fmtMins(traj.priorSlot);
        const freeLbl = fmtMins(traj.earliestFree % (24*60));
        const slack = mins - traj.earliestFree;
        const priorTag = traj.priorDuration === COOLDOWN_PRELOADED_MIN ? ' preloaded' : (traj.priorDuration === COOLDOWN_HARRIS_MIN ? ' Harris' : '');
        if(slack >= 0 && slack <= 120){
          why.push('empty ~'+freeLbl+' (from '+priorLbl+priorTag+' load)');
        } else if(slack > 120){
          why.push('has '+priorLbl+priorTag+' load, this is later');
        } else {
          why.push('busy until ~'+freeLbl+' (from '+priorLbl+priorTag+' load) — conflict');
        }
        if(traj.nextBooking != null){
          const gap = traj.nextBooking - mins;
          if(gap > 0 && gap < COOLDOWN_DELIVERY_MIN){
            score -= 500;
            why.push('has '+fmtMins(traj.nextBooking)+' load coming — no room for this first');
          }
        }
      }
    }
    // Commodity-family continuity — supporting, below shift-start + first-wave.
    const loadFam = commodityFamily(r && r.commodity);
    if(loadFam){
      const dayRows = state.dayRollup && state.dayRollup.currentRows;
      if(dayRows && dayRows.length){
        let matched = false, avoid = false;
        for(const other of dayRows){
          if(!other || other === r) continue;
          if(!other.driver) continue;
          if(shortNameFor(other.driver) !== d.short) continue;
          const otherFam = commodityFamily(other.commodity);
          if(!otherFam) continue;
          if(otherFam === loadFam){ matched = true; }
          else if(isAvoidPair(otherFam, loadFam)) avoid = true;
        }
        if(matched){
          score += 80;
          why.push('already on '+loadFam.replace('_',' ')+' family today');
        }
        if(avoid){
          score -= 400;
          why.push('cross-contamination risk — switching from '+loadFam);
        }
      }
    }
    // Origin history is a TIE-BREAK only. v1.8 used `score += 1000 + runs`
    // which let Greg's 218 PNG (and Francisco's 256) dominate every row.
    if(runs) score += Math.min(runs, 80);
    score += runs && total ? (runs/total)*20 : 0;
    // Soft bucket hint — the HARD filter below is what actually splits
    // Diamond vs POC. Keep a small why-tag so the dropdown still explains it.
    if(loadBucket === 'diamond' && pocShare > 0.10){
      why.push('POC-leaning ('+Math.round(pocShare*100)+'%) — Diamond load');
    } else if(loadBucket === 'steady'){
      if(pocShare > 0.10) why.push('POC-experienced ('+Math.round(pocShare*100)+'%) — POC load');
      else why.push('pure-Diamond history — POC load');
    }
    // Verizon live: context, not a steamroller. v2.1.4's -1200 moving
    // penalty wiped every DAY truck at 6am (they were rolling to PNG) and
    // left unlinked Greg as the only un-penalized name. James: suggest
    // people as their truck starts — moving near this appointment IS the start.
    const vzs = verizonDriverStatus(d.name);
    if(vzs && vzs.linked){
      const nearThisAppt = mins!=null && Math.abs(mins - nowMins) <= 90;
      if(vzs.readyOverride){
        why.unshift('🟢 marked ready · Truck '+vzs.truck);
        score += 40;
      } else if(vzs.isMoving){
        if(nearThisAppt && currentLoad === 0){
          why.unshift('🟢 Truck '+vzs.truck+' rolling — shift starting');
        } else {
          why.unshift('🟡 Truck '+vzs.truck+' moving, '+Math.round(vzs.speed)+' mph');
          score -= 80;
        }
      } else if(vzs.isHome){
        why.unshift('🟢 at yard · Truck '+vzs.truck);
      } else if(vzs.available){
        why.unshift('🟡 Truck '+vzs.truck+' stopped — probably empty');
      } else if(vzs.addr){
        why.unshift('🟡 Truck '+vzs.truck+' at '+(vzs.addr.split(',')[0]||''));
      }
    }
    if(preloadReserveThin && loadBucket === 'diamond'
       && (d.shift && (d.shift.cls === 'DAY' || d.shift.cls === 'AFTERNOON'))){
      if(currentLoad >= 1){
        score -= 120;
        why.push('preload reserve thin ('+preloadReserve+' left) — save for PM preload');
      }
    }
    score += stableHash((r&&r.id||'')+d.name)*8;         // stable tiebreak
    return { name:d.name, short:d.short, runs:runs, known:runs>0, score:score,
             clockedIn:d.clockedIn, hos:d.hos, verizon: vzs,
             confirmed:confirmed, fits:fits, onDay:onDay, starting:starting,
             shiftCls: d.shift ? d.shift.cls : null,
             __pocShare: pocShare, __loads: currentLoad,
             why: why.length? why.join(' · ') : 'no history at '+(origin||'this origin')+' — roster fallback' };
  });
  // v1.8.9 HARD shift filter, without the v2.1.6/11 NIGHT exemptions.
  // James 2026-08-24: do not keep stacking Greg through 9am because he
  // "had an earlier suggested slot" or Verizon shows him at yard. Confirmed
  // NIGHT/AFTERNOON/EVENING stay in their window. DAY stays off 9pm–4am.
  if(mins != null){
    out = out.filter(c => !c.confirmed || c.fits);
    if(mins >= 21*60 || mins < 4*60){
      out = out.filter(c => c.shiftCls !== 'DAY');
    }
  }
  // v1.8.29: preloader role filter. Rafa and Prado are dedicated preloaders
  // — never suggest for delivery. Marcos (flex) gets docked but stays in the
  // pool as a fallback when no pure-delivery driver is available.
  out = out.filter(c => !isPreloader(c.short));
  out.forEach(c => {
    if(isPreloaderFlex(c.short)){ c.score -= 400; c.why = (c.why||'') + ' · preloader (Marcos) — flex delivery'; }
  });
  // v1.8.18 HARD bucket filter, now using driver-bucket origins that do
  // NOT count PNG as POC (v2.1.28). Empty pool used to silently fall
  // through to Greg in the Queue dropdown — if this filter empties the
  // list, the cell must show "—" not the first roster name.
  if(loadBucket === 'diamond' || loadBucket === 'steady'){
    out = out.filter(c => {
      const share = c.__pocShare;
      if(share == null) return true;
      if(loadBucket === 'diamond') return share <= 0.10;
      return share > 0.10;
    });
  }
  // v1.8.12: driver commodity exclusions (Felix on meals/salmon, etc).
  const commodity = r && r.commodity;
  if(commodity){
    out = out.filter(c => !driverExcludesCommodity(c.short, commodity));
  }
  // v1.8.13: one-off day-off overrides (Jess 7/30, Albert 7/31, etc).
  if(dateISO){
    out = out.filter(c => !driverIsOff(c.short, dateISO));
  }
  // v1.8.3 / v1.8.19: cap + cooldown, then first-wave (0 loads before 1).
  if(opts.respectCap){
    const uncapped = out.filter(c => driverCanTakeLoad(c.name, mins, isPreload, isHarris));
    if(uncapped.length){
      out = uncapped;
      const firstWave = out.filter(c => driverSlotLog(c.name).length === 0);
      if(firstWave.length) out = firstWave;
    } else {
      out = out.map(c => {
        c.overCap = true;
        c.score -= 800;
        c.why = (c.why||'') + ' · at 2-load cap (override)';
        return c;
      });
    }
  }
  out.sort((a,b)=>b.score-a.score);
  const picks = out.slice(0, n||3);
  // v1.8.3: reserve the top pick so the next open row cannot reuse them
  // if it would break the cap or cooldown (including two loads at 6am).
  if(opts.reserve && picks.length && !picks[0].overCap){
    reserveDriverSlot(picks[0].name, mins);
  }
  return picks;
}

function isUnassigned(r){
  if(!r) return false;
  if(!dayRowActive(r)) return false;
  if(String(r.driverRaw||'').trim() || String(r.driver||'').trim()) return false;
  const st = String(r.status||'').trim().toUpperCase();
  return st==='' || st==='P';
}

/* =============================================================
   THE PRELOAD SPLIT (v1.7)
   -------------------------------------------------------------
   FCT preloads tomorrow's pre-6am work today in the afternoon,
   because the origins close at 4–6pm. So a day view has two
   populations in it:

     Section 1  loads with THIS day's banner — today's deliveries
     Section 2  loads with TOMORROW's banner, timed 00:00–06:00 —
                the trailers today's PM crew is building

   Revenue attribution is locked to the date banner and does not
   follow the preload: a load's money belongs to the day it
   delivers, up to the midnight boundary. Driver-hours DO follow
   it, because the prep is real work done today. Both facts are
   stated on screen; neither is left to be inferred from where a
   row happens to appear.
   ============================================================= */
function shiftDayISO(dateISO, n){
  if(!dateISO) return '';
  const d = new Date(dateISO+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate()+n);
  return isoLocal(d);
}
const nextDayISO = iso=>shiftDayISO(iso, 1);
const prevDayISO = iso=>shiftDayISO(iso, -1);

/* Section 2 for a given day, straight off the parsed import. Derived on every
   render and never persisted — the full-year parse is already close to the
   storage ceiling, and a second copy of rows that are three lines away in
   li.rows would buy nothing. Note the corollary: if saveDayImport() has trimmed
   the parse to a single day to fit, there is no next-day block and this is
   legitimately empty. preloadSectionNote() is what says so out loud. */
function preloadSectionRows(dateISO){
  const li = state.dayRollup.lastImport;
  if(!li || !li.rows || !li.rows.length || !dateISO) return [];
  const tom = nextDayISO(dateISO);
  if(!tom) return [];
  return li.rows.filter(r=>r.date===tom && dayRowActive(r) && isPreloadLocked(r));
}
/* Why Section 2 is empty, when it is. Three different silences — no import, a
   trimmed parse, or a genuinely quiet night — read identically on screen
   otherwise, and only one of them means "nothing to prep". */
function preloadSectionNote(dateISO){
  const li = state.dayRollup.lastImport;
  if(!li || !li.rows || !li.rows.length) return 'No dispatch log loaded.';
  if(li.trimmed) return 'The parse was trimmed to this day to fit storage, so the next day\'s '
    + 'block is not in memory to read. Re-sync on a device with room, or pick the next day directly.';
  const tom = nextDayISO(dateISO);
  if(!li.rows.some(r=>r.date===tom)) return 'The dispatch log has no block for '+(tom||'the next day')+' yet.';
  return 'Nothing delivers before 6am tomorrow — this afternoon owes no preloads.';
}

/* ---- Backward planning (Spec.md north-star item 4) ----
   Tonight's afternoon has to carry tomorrow's pre-6am commitments,
   because those loads must be preloaded before their origin closes.
   Look at TOMORROW's block in the imported file, count its pre-6am
   loads, and price them at the 2.5 hr preload heuristic. Compare that
   against the driver-hours this afternoon actually has spare.

   v1.7: the pre-6am rows come from preloadSectionRows(), the same call
   Section 2 renders from, so the banner and the list under it cannot
   disagree about how many loads there are. */
function tomorrowPreloadPlan(dateISO){
  const li = state.dayRollup.lastImport;
  if(!li || !li.rows || !li.rows.length || !dateISO) return null;
  const tomorrow = nextDayISO(dateISO);
  if(!tomorrow) return null;
  const block = li.rows.filter(r=>r.date===tomorrow);
  if(!block.length) return null;                 // no next-day block in the file
  const locked = preloadSectionRows(dateISO);

  const s = state.settings;
  const perLoad = Number(s.preloadHrsPerLoad)>0 ? Number(s.preloadHrsPerLoad) : 2.5;
  const perDrv  = Number(s.afternoonHrsPerDriver)>0 ? Number(s.afternoonHrsPerDriver) : 3;
  const needHrs = locked.length * perLoad;

  /* Who can preload this afternoon: a driver whose shift is on today and
     whose window reaches into the afternoon. Night drivers are asleep.

     Capacity is counted in DRIVERS, not in load-hours, on purpose. A load's
     `hours` is total time on load — pickup, line haul, delivery — and only
     part of that sits inside the afternoon window, so netting 5-hour loads
