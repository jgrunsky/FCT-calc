      if(cr.supersedes)
        h += '<div class="banner amber" style="margin:8px 0 0"><b>⚑ This reverses an earlier verified value</b>'
           + esc(cr.supersedes)+'</div>';
      if(cr.rateCardSkipped)
        h += '<div class="banner amber" style="margin:8px 0 0"><b>⚑ Your rule was kept</b>'
           + esc(cr.rateCardSkipped)+'</div>';
      h += '<div class="fld" style="margin-top:8px"><label for="in'+i+'">Your note</label>'
        + '<input id="in'+i+'" data-infonote="'+esc(name)+'" value="'+esc(note)+'" '
        + 'placeholder="anything the rate card does not say"></div>'
        + '</div>';
    });
    h += '<div class="legend">Rates auto-updated '+esc(CUSTOMER_RATES_ASOF)+' from QBO last 90-day averages. '
      + 'Manual overrides supported per-customer. To pull fresh figures use <b>Refresh rates from QBO</b> in '
      + 'Settings → Unit economics.</div></div>';
  }

  /* ---- 3. Driver roster ---- */
  {
    const groups = infoRosterGroups();
    const total = dispatchRoster().length;
    h += '<div class="card" id="infoRoster"><h2>Driver roster</h2>'
      + '<div class="hint" style="margin-bottom:12px">'+total+' drivers, grouped by the shift patterns the '
      + 'suggestion engine actually ranks on. Base rates come from QBO payroll; HOS is the hand-set budget from '
      + 'Settings → Drivers, standing in for the Verizon/ADP feed that lands in Phase 3.1. '
      + 'Home terminal is <b>'+esc(HOME_TERMINAL.name)+'</b> for all of them.</div>';

    /* The open question rides at the top of this card, not buried under the
       group it concerns — it changes who gets suggested for every pre-6am
       load, which is too consequential to render as a footnote. */
    h += '<div class="banner amber" style="margin-bottom:14px"><b>❓ '+esc(SHIFT_OPEN_QUESTION.ask)+'</b>'
      + SHIFT_OPEN_QUESTION.detail+'</div>';

    groups.forEach(gr=>{
      const rateOf = n=>{ const d = s.drivers.find(x=>x.name===n); return d ? Number(d.rate) : null; };
      h += '<div class="info-grp"><div class="info-grp-h">'+esc(gr.g.label)
        + '<span>'+esc(gr.g.when)+'</span>'
        + '<b class="bnr-n">'+gr.drivers.length+'</b></div>'
        + '<div class="info-grp-note">'+gr.g.note+'</div>';
      if(!gr.drivers.length){
        h += '<div class="empty" style="padding:14px">Nobody on this shift.</div>';
      } else {
        gr.drivers.forEach(d=>{
          const hist  = originHistoryFor(d.name);
          const pairs = Object.keys(hist).sort((a,b)=>hist[b]-hist[a]).slice(0,4).map(k=>k+' '+hist[k]).join(' · ');
          const rate  = rateOf(d.name);
          h += '<div class="drv-row">'
            + '<div class="drv-n">'
            + '<div style="font:600 13.5px/1.25 var(--body);color:'+(d.active?'var(--text)':'var(--text-faint)')+'">'
            + esc(d.short)+' <span style="font-weight:400;color:var(--text-faint);font-size:11px">'+esc(d.name)+'</span>'
            + (d.active?'':' <span class="chip y">unavailable</span>')+'</div>'
            + '<div class="drv-o" title="'+esc(pairs||'no origin history in the 2026 log')+'">'
            + (pairs || 'no origin history')+'</div>'
            + (d.shift ? '<div class="drv-o" style="color:var(--text-muted)">'+esc(d.shift.note)+'</div>' : '')
            + '</div>'
            + '<div style="flex:0 0 68px;text-align:right">'
            + '<div class="row-v">'+(rate!=null?money2(rate):'—')+'</div>'
            + '<div class="row-s">base /hr</div></div>'
            + '<div style="flex:0 0 54px;text-align:right">'
            + '<div class="row-v">'+num(d.hos,1)+'</div>'
            + '<div class="row-s">HOS hrs</div></div>'
            + '</div>';
        });
      }
      h += '</div>';
    });
    h += '<div class="legend">Origin pairings are each driver\'s most-run origins out of the 2026 dispatch log '
      + '('+Object.keys(DRIVER_ORIGIN_HISTORY).length+' drivers matched) — the signal behind every Suggested '
      + 'driver cell on the load list. HOS is a placeholder budget, not a measured remaining-hours figure; '
      + 'edit it per driver in Settings → Drivers — dispatch.</div></div>';
  }

  /* ---- 4. Office & admin ---- */
  {
    const silentNames = FCT_OWNERSHIP.filter(o=>o.silent).map(o=>o.name);
    const operating = s.office.filter(o=>silentNames.indexOf(o.name) < 0);
    const silent    = s.office.filter(o=>silentNames.indexOf(o.name) >= 0);
    h += '<div class="card" id="infoOffice"><h2>Office &amp; admin '
      + '<span style="font-size:10px;color:var(--green);text-transform:none;letter-spacing:0">✓ QBO payroll</span></h2>';
    operating.forEach(o=>{
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(o.name)+'</div>'
        + '<div class="row-s">'+esc(o.role||'')+'</div></div>'
        + '<div class="row-v">'+money(o.base)+'</div></div>';
    });
    if(silent.length){
      h += '<div class="info-sep">Ownership — not in the decision path</div>';
      silent.forEach(o=>{
        h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(o.name)+'</div>'
          + '<div class="row-s">'+esc(o.role||'')+' — silent partner. On payroll and holding a third of the '
          + 'company, and deliberately not listed as a decision stakeholder.</div></div>'
          + '<div class="row-v">'+money(o.base)+'</div></div>';
      });
    }
    h += '<div class="row"><div class="row-l"><div class="row-t"><b>Total office base pay</b></div>'
      + '<div class="row-s">base salary only, no bonuses · hourly staff annualized</div></div>'
      + '<div class="row-v"><b>'+money(officeAnnual())+'</b></div></div>'
      + '<div class="legend">Hourly staff are shown annualized — the hourly figure each was hired at is in the '
      + 'role line. Edit any of these in Settings → Office base salaries.</div></div>';
  }

  /* ---- 5. Key contacts ---- */
  {
    h += '<div class="card" id="infoContacts"><h2>Key contacts</h2>'
      + '<div class="hint" style="margin-bottom:12px">Editable and saved locally. A blank field is shown as a '
      + 'placeholder rather than hidden — a number nobody has written down is worth seeing.</div>';
    const groups = [];
    ci.contacts.forEach(c=>{ if(groups.indexOf(c.group) < 0) groups.push(c.group); });
    groups.forEach(g=>{
      h += '<div class="info-sep">'+esc(g)+'</div>';
      ci.contacts.filter(c=>c.group===g).forEach((c,i)=>{
        const id = 'ic_'+esc(c.k);
        h += '<div class="fld"><label for="'+id+'">'+esc(c.name)
          + (c.org && c.org!==c.name ? ' <span style="color:var(--text-faint);font-weight:400">— '+esc(c.org)+'</span>' : '')
          + '</label>'
          + '<div class="row-s" style="margin:-4px 0 5px">'+esc(c.role||'')+'</div>'
          + '<input id="'+id+'" type="'+(c.kind==='email'?'email':'tel')+'" data-infocontact="'+esc(c.k)+'" '
          + 'value="'+esc(c.value||'')+'" placeholder="'+(c.kind==='email'?'email address':'phone number')+' — not on file">'
          + '</div>';
      });
    });
    h += '<div class="legend">Ramos Oil and Diesel Master are the two fuel vendors the QBO AP aging confirms; '
      + 'their numbers are not in the app yet, which is why those two fields ship empty rather than guessed at. '
      + 'AR chasing starts here — the AR 91+ alert on the landing page links to this card.</div></div>';
  }

  /* ---- 6. Fleet ---- */
  {
    const drivers = s.drivers.length;
    const officeN = s.office.length;
    const headcount = drivers + officeN;
    h += '<div class="card" id="infoFleet"><h2>Fleet &amp; facility</h2>'
      + '<div class="kpi-grid" style="margin-bottom:10px">'
      + '<div><div class="kpi sm">'+trucksInFleet()+'</div><div class="kpi-label">Trucks in fleet</div></div>'
      + '<div><div class="kpi sm">'+drivers+'</div><div class="kpi-label">Drivers</div></div>'
      + '<div><div class="kpi sm">'+headcount+'</div><div class="kpi-label">Active employees</div></div>'
      + '<div><div class="kpi sm">'+trucksRunningPerDay()+'</div><div class="kpi-label">Trucks running/day</div></div>'
      + '</div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Trucks to drivers</div>'
      + '<div class="row-s">one truck per driver — no team trucks, so a truck without its driver is not capacity</div></div>'
      + '<div class="row-v">'+(trucksInFleet()===drivers?'1 : 1':trucksInFleet()+' : '+drivers)+'</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Home terminal</div>'
      + '<div class="row-s">'+esc(HOME_TERMINAL.address)+'</div></div>'
      + '<div class="row-v" style="font-size:12px">'+esc(HOME_TERMINAL.name)+'</div></div>';
    (q.fuelVendors||[]).forEach(v=>{
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(v.name)+'</div>'
        + '<div class="row-s">'+esc(v.kind)+'</div></div>'
        + '<div class="row-v" style="font-size:12px">fuel</div></div>';
    });
    if(headcount !== q.headcount.active){
      h += '<div class="hint" style="margin-top:10px">Two headcounts disagree: the roster in this app totals '
        + headcount+' ('+drivers+' drivers + '+officeN+' office), while the QBO payroll pull of '
        + esc(q.pulledAt)+' reports '+q.headcount.active+' active. A one-person gap is usually a starter or a '
        + 'leaver between the two pulls — worth confirming rather than assuming.</div>';
    }
    h += '<div class="legend">Trucks running per day is the working assumption for a normal day, not a count of '
      + 'today\'s actual trucks — fixed cost is charged in full regardless, because the lease and the insurance '
      + 'are owed whether or not a truck turned a wheel.</div></div>';
  }

  /* ---- 7. Rules & policies ---- */
  {
    h += '<div class="card" id="infoRules"><h2>Rules &amp; policies</h2>'
      + '<div class="hint" style="margin-bottom:12px">These are the operating rules the app enforces, not '
      + 'preferences. Each one drives a chip, a banner or a suggestion on the load list.</div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Origin cutoffs</div>'
      + '<div class="row-s">past the cutoff a load cannot be live-loaded — it needs a preload the day before. '
      + 'Yeast comes off ARA rather than FCG precisely because ARA runs two hours later.</div></div>'
      + '<div class="row-v" style="font-size:12px">'
      + Object.keys(ORIGIN_CUTOFFS).map(k=>k+' '+fmtMins(ORIGIN_CUTOFFS[k])).join('<br>')+'</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Pre-6am loads preload the previous PM</div>'
      + '<div class="row-s">a delivery between midnight and '+fmtMins(PRELOAD_LOCK_END_MIN)+' was committed by '
      + 'yesterday afternoon\'s list and cannot move in the morning revision. This is the whole basis of the '
      + 'two-section load list.</div></div>'
      + '<div class="row-v" style="font-size:12px">12:00am–'+fmtMins(PRELOAD_LOCK_END_MIN)+'</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Day preload, night deliver</div>'
      + '<div class="row-s">the PM crew builds trailers for the pre-6am run; the night and early drivers take '
      + 'them out. Preload is budgeted at '+num(Number(s.preloadHrsPerLoad)||2.5,1)+' hrs against a full '
      + 'pick-and-deliver at '+num(Number(s.hoursPerLoad)||5,1)+' hrs.</div></div>'
      + '<div class="row-v" style="font-size:12px">heuristic</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Queue suggestions follow shift start</div>'
      + '<div class="row-s">walk open loads in clock order. Suggest the driver whose truck is starting '
      + '(or already started) for that appointment, then move on. Greg (NIGHT, 2–3am) may take 1–2 of the '
      + 'earliest loads in the night window; 6am–9am PNG→RIPON/LATHROP goes to DAY 6:00–6:45 starters. '
      + 'Max 2 loads per driver. Two loads at the same time are always different people. Origin history '
      + 'is a tie-break, not the thing that puts one name on every dropdown.</div></div>'
      + '<div class="row-v" style="font-size:12px">v2.1.28</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">HOS budget</div>'
      + '<div class="row-s">on-duty hours per driver per day — driving plus loading plus paperwork. '
      + 'Overridable per driver.</div></div>'
      + '<div class="row-v">~'+num(Number(s.defaultDriverHosHrs)||10,0)+' hrs</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">No team trucks</div>'
      + '<div class="row-s">one driver per truck. Capacity is measured in people-hours, not tractors.</div></div>'
      + '<div class="row-v" style="font-size:12px">1 : 1</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Diamond average time on site</div>'
      + '<div class="row-s">measured from Verizon geofence dwell. This is why detention is treated as an '
      + 'exception worth flagging rather than a systemic leak — anything past '
      + num(Number(s.detentionThresholdMin)||60,0)+' min is well outside the norm.</div></div>'
      + '<div class="row-v">'+num(DIAMOND_AVG_ONSITE_MIN,1)+' min</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">Equipment — one of each</div>'
      + '<div class="row-s">a single van trailer and a single super hopper (#106). Two loads needing either on '
      + 'the same day is a conflict the load list flags.</div></div>'
      + '<div class="row-v" style="font-size:12px">van · #106</div></div>'
      + '<div class="legend">Cutoffs and the lock window are facts about the origins\' own hours, so they are '
      + 'shown here rather than made editable. The heuristics — preload hours, afternoon hours, HOS — are '
      + 'operator settings and live in Settings → Dispatch operations.</div></div>';
  }

  $('#p-info').innerHTML = h;

  /* --- wiring --- */
  const touch = ()=>{ state.companyInfo.editedAt = isoLocal(new Date()); };

  document.querySelectorAll('#p-info [data-inforev]').forEach(el=>el.addEventListener('change',()=>{
    const name = el.dataset.inforev, raw = el.value.trim();
    const cr = state.customerRates[name] || (state.customerRates[name] = {});
    if(raw === ''){
      /* Cleared = "go back to the shipped card figure", not "zero revenue". */
      cr.revenuePerLoad = defaultCustomerRates()[name].revenuePerLoad;
    } else {
      const v = parseFloat(raw);
      if(isNaN(v) || v < 0){ toast('Enter a revenue of zero or more'); renderInfo(); return; }
      cr.revenuePerLoad = v;
    }
    touch(); save(); renderInfo(); renderSet(); renderDash(); renderCalc();
  }));
  document.querySelectorAll('#p-info [data-infofscm]').forEach(el=>el.addEventListener('change',()=>{
    const name = el.dataset.infofscm;
    const cr = state.customerRates[name] || (state.customerRates[name] = {});
    cr.fscMethod = el.value;
    if(cr.fscMethod === 'none') cr.fscValue = null;
    else if(cr.fscValue == null) cr.fscValue = 0;
    touch(); save(); renderInfo(); renderSet(); renderCalc();
  }));
  document.querySelectorAll('#p-info [data-infofsc]').forEach(el=>el.addEventListener('change',()=>{
    const name = el.dataset.infofsc, v = parseFloat(el.value);
    if(isNaN(v) || v < 0){ toast('Enter an FSC rate of zero or more'); renderInfo(); return; }
    const cr = state.customerRates[name] || (state.customerRates[name] = {});
    cr.fscValue = v;
    touch(); save(); renderInfo(); renderSet(); renderCalc();
  }));
  document.querySelectorAll('#p-info [data-infonote]').forEach(el=>el.addEventListener('change',()=>{
    const name = el.dataset.infonote, v = el.value.trim();
    if(v) state.companyInfo.rateNotes[name] = v;
    else delete state.companyInfo.rateNotes[name];
    touch(); save();
  }));
  document.querySelectorAll('#p-info [data-infocontact]').forEach(el=>el.addEventListener('change',()=>{
    const c = state.companyInfo.contacts.find(x=>x.k === el.dataset.infocontact);
    if(!c) return;
    c.value = el.value.trim();
    touch(); save();
    toast(c.value ? c.name+' updated' : c.name+' cleared');
  }));
}

/* =============================================================
   TAB 4 — SETTINGS
   ============================================================= */
function renderSet(){
  const s = state.settings;
  const nf=(id,label,val,step,hint,est)=>'<div><label for="'+id+'">'+label+(est?E(false):'')+'</label>'
    +'<input id="'+id+'" type="number" inputmode="decimal" step="'+step+'" value="'+val+'">'
    +(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';

  let h = '';

  /* =============================================================
     UNIT ECONOMICS (v1.3) — the model everything else hangs off.
     Placed first because it is now the primary thing to get right.
     ============================================================= */
  {
    const comps = variableComponents();
    const rev = revenuePerLoad(), varC = variableCostPerLoad(), cm = contributionPerLoad();
    const fpd = fixedCostPerDay(), be = breakevenLoadsPerDay();
    const rentLine = state.fixedStack.find(l=>l.k==='rent');
    const q = state.qbo, ct = q.costTotals;
    const actualCost = ct.laborLoaded.value + ct.truckTrailerOps.value + ct.insurance.value
                     + ct.insuranceUnclass.value + ct.subhauler.value + ct.companyVehicle.value
                     + ct.overheadAdmin.value;
    const actualNet = q.revenueT12M.value - actualCost;
    const goForward = actualNet + ((rentLine && !rentLine.on) ? rentLine.amount : 0);
    const modelNet  = modelledAnnualNet();
    const gapPct = goForward!==0 ? Math.abs((modelNet/goForward - 1)*100) : 0;

    h += '<div class="card" id="unitEconCard"><h2>Unit economics '
      + '<span style="font-size:10px;color:var(--green);text-transform:none;letter-spacing:0">✓ calibrated to T12M 2026-07-27</span></h2>'
      + '<div class="kpi-grid">'
      + '<div><div class="kpi sm">'+money(rev)+'</div><div class="kpi-label">Revenue / load</div></div>'
      + '<div><div class="kpi sm" style="color:var(--red)">−'+money(varC)+'</div><div class="kpi-label">Variable / load</div></div>'
      + '<div><div class="kpi" style="color:'+(cm>0?'var(--green)':'var(--red)')+'">'+money(cm)+'</div><div class="kpi-label">Contribution / load</div></div>'
      + '<div><div class="kpi">'+be.toFixed(1)+'</div><div class="kpi-label">Breakeven loads/day</div></div>'
      + '</div>';

    /* --- Revenue side --- */
    h += '<h2 style="margin-top:18px">Revenue</h2><div class="fld fld2">'
      + nf('sRevLoad','Revenue $/load', s.revenuePerLoadDefault,'1',
          money(q.revenueT12M.value)+' T12M ÷ '+num(s.loadsPerYear)+' loads = '+money(q.revenueT12M.value/(s.loadsPerYear||1))+'. Overridable per customer below.')
      + nf('sLoadsYr','Loads / year', s.loadsPerYear,'50','T12M load count. Drives the full-year check. Subhauler is not spread across this count — only Lopez/Prado slash rows pay $150.')
      + '</div>';

    /* --- Variable side, component by component --- */
    h += '<h2 style="margin-top:18px">Variable cost per load</h2>'
      + '<div class="hint" style="margin-bottom:12px">Five components, each editable. The total is their sum — nothing is forced. '
      + 'Change any one and every load, day rollup and breakeven figure re-derives.</div>'
      + '<div class="fld fld2">'
      + nf('sAvgMi','Avg miles / load', s.avgMilesPerLoad,'1','~965K fleet miles ÷ '+num(s.loadsPerYear)+' loads = 79.4. Drives the fuel and wear lines.')
      + nf('sHrsLoad','Hours / load', s.hoursPerLoad,'0.25','Total time on load. Drives the driver line.')
      + '</div><div class="fld fld2">'
      + nf('sSubYr','Subhauler $/yr (QBO 326, display only)', s.subhaulerPerYear,'1000','v2.0.9 / v2.1.38: not charged per load. Loads pay $150 only when the driver is Lopez/<name> or Prado/<name>. This yearly figure is QBO 326 for reconciliation — it is not amortized across in-house loads and it is not in other.')
      + nf('sOtherVar','Other / unallocated $/load', s.otherVariablePerLoad,'0.01','v2.1.37: $0. Not in 2025 QBO shop bills. Tarps $17,874 sit in 313.9 (wear). Bonuses and 2025 lawsuit legal are not absorbed here.')
      + '</div>';
    comps.forEach(c=>{
      h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(c.label)+'</div>'
        + '<div class="row-s">'+esc(c.basis)+'</div></div>'
        + '<div class="row-v" style="color:var(--red)">−'+money2(c.amount)+'</div></div>';
      /* v2.1.19: fleet-day fuel calc vs Verizon actual, injected right under
         the per-load Fuel row for the same reason as in the Info-tab card. */
      if(c.k === 'fuel') h += verizonFuelCompareHTML();
    });
    h += '<div class="row"><div class="row-l"><div class="row-t"><b>Variable cost per load</b></div></div>'
      + '<div class="row-v" style="color:var(--red)"><b>−'+money2(varC)+'</b></div></div>'
      + '<div class="hint">Wear and driver rates live in <b>Cost assumptions</b> below; diesel price lives in the <b>Diesel price</b> card. '
      + 'The two greyed <b>Fuel (calc / actual)</b> lines below the Fuel row are fleet-day dollars from LANE_MILES and the Verizon /miles feed — they are context, not summed into the per-load total.</div>';

    /* --- Fixed stack --- */
    h += '<h2 style="margin-top:18px">Fixed cost stack</h2>'
      + '<div class="hint" style="margin-bottom:12px">Untick a line to take it out of the baseline — it stays visible with its number intact. '
      + 'The daily figure and the breakeven above recompute as you go.</div>';
    state.fixedStack.forEach((l,i)=>{
      h += '<div class="row" style="align-items:flex-start">'
        + '<div class="row-l"><label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500;margin-bottom:0;cursor:pointer;color:'
        + (l.on?'var(--text)':'var(--text-faint)')+'">'
        + '<input type="checkbox" data-fxon="'+esc(l.k)+'"'+(l.on?' checked':'')+' style="width:auto;flex:0 0 auto;margin:0">'
        + esc(l.label)+(l.verified?'':E(false,'Derived, not a clean QBO line — see the note.'))
        + (l.k==='rent' && !l.on ? ' <span class="chip y" style="margin-left:2px">paused</span>' : '')+'</label>'
        + (l.note?'<div class="row-s" style="margin-top:5px'+(l.k==='rent'?';color:var(--amber)':'')+'">'+esc(l.note)+'</div>':'')
        + '</div>'
        + '<div style="flex:0 0 118px"><input type="number" inputmode="decimal" step="500" data-fxamt="'+esc(l.k)+'" value="'+esc(l.amount)+'" '
        + 'style="text-align:right;font-family:var(--mono);padding:8px 9px;font-size:14px'+(l.on?'':';opacity:.5')+'"></div>'
        + '</div>';
    });
    h += '<div class="fld" style="margin-top:13px">'
      + nf('sOpDays','Operating days / year', s.operatingDaysPerYear,'1','Six days a week = 312. v1.2 used 260 (five days), which overstated fixed cost per day by 20%.')
      + '</div>'
      + '<div class="row"><div class="row-l"><div class="row-t"><b>Fixed cost per day</b></div>'
      + '<div class="row-s">'+money(fixedStackAnnual())+'/yr ÷ '+operatingDays()+' days'
      + (rentLine && !rentLine.on ? ' · with rent back on it is '+money((fixedStackAnnual()+rentLine.amount)/operatingDays())+'/day' : '')+'</div></div>'
      + '<div class="row-v" style="color:var(--red)"><b>'+money(fpd)+'</b></div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t">…per truck per day</div>'
      + '<div class="row-s">'+money(fpd)+' ÷ '+trucksInFleet()+' trucks in fleet</div></div>'
      + '<div class="row-v">'+money(fixedPerTruckDay())+'</div></div>'
      + '<div class="row"><div class="row-l"><div class="row-t"><b>Breakeven loads / day</b></div>'
      + '<div class="row-s">'+money(fpd)+' ÷ '+money(cm)+' contribution per load</div></div>'
      + '<div class="row-v"><b>'+be.toFixed(1)+'</b></div></div>';

    + nf('sPmHrs','Afternoon hrs / driver', s.afternoonHrsPerDriver,'0.25','How much of a day driver\'s shift is still free in the PM to preload.')
    + '</div><div class="fld">'
    + nf('sHos','Default HOS hrs / driver / day', s.defaultDriverHosHrs,'0.5','Spec: ~10 on-duty hrs — driving + loading + paperwork. This is the capacity side of the utilisation card. Per-driver overrides sit in the card above.')
    + '</div>'
    /* The other half of the utilisation arithmetic lives in Unit economics and
       is not duplicated here — two inputs on one setting is a way to be wrong
       twice. Shown read-only so the pair can still be read side by side. */
    + '<div class="row"><div class="row-l"><div class="row-t">Delivery hrs / load</div>'
    + '<div class="row-s">the Section 1 side of the same sum — only used where a row carries no hours of its own. '
    + 'Edit it in <b>Unit economics</b> above, where it also drives the cost model</div></div>'
    + '<div class="row-v">'+num(s.hoursPerLoad,1)+' hr</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t">Origin cutoffs</div>'
    + '<div class="row-s">a load booked past its origin\'s cutoff cannot be live-loaded — it needs a preload the day before</div></div>'
    + '<div class="row-v" style="font-size:12px">'
    + Object.keys(ORIGIN_CUTOFFS).map(k=>k+' '+fmtMins(ORIGIN_CUTOFFS[k])).join(' · ')+'</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t">Pre-6am lock window</div>'
    + '<div class="row-s">deliveries in this window are fixed by the previous afternoon\'s list and do not change in the '
    + 'morning revision. This window is what splits the load list in two: a day\'s own pre-6am loads are hoisted to the top '
    + 'as 🔒 PRELOADED, and the NEXT day\'s become Section 2, the trailers this afternoon has to build</div></div>'
    + '<div class="row-v" style="font-size:12px">12:00am–'+fmtMins(PRELOAD_LOCK_END_MIN)+'</div></div>'
    + '<div class="legend">Cutoffs and the lock window are rules, not settings — they come from the origins\' own hours and from '
    + 'how the schedule is published, so they are shown here rather than made editable. Yeast is the one to remember: it comes '
    + 'off ARA rather than FCG precisely because ARA runs two hours later.</div></div>';

  /* =============================================================
     SMS DISPATCH (v1.8) — Phase 3.2 groundwork
     Config only. Nothing in this build sends a message.
     ============================================================= */
  {
    const sms = state.sms;
    const ready = smsConfigured();
    const roster = s.drivers;
    const withPhones = roster.filter(d=>driverPhone(d.name)).length;

    h += '<div class="card" id="smsCard"><h2>SMS dispatch '
      + (ready ? '<span class="chip g">configured</span>' : '<span class="chip y">not configured</span>')+'</h2>'
      + '<div class="banner amber" style="margin-bottom:14px"><b>⚑ Not wired up yet — Phase 3.2</b>'
      + 'SMS dispatch requires: a Twilio account ($15/mo minimum), driver phone numbers, and message template '
      + 'approval. Enable when ready for Phase 3.2 (autonomous dispatch). Until then the <b>Send dispatch</b> '
      + 'buttons on the load list compose the message and show it to you — they do not send anything, and '
      + 'nothing here talks to the network.</div>';

    /* The security note is a card of its own weight, not a footnote. Anyone
       typing a live auth token into a web page deserves to be told what
       happens to it BEFORE they type it, not in a legend underneath. */
    h += '<div class="banner" style="background:var(--red-bg);border:1px solid color-mix(in oklab,var(--red) 40%,transparent);'
      + 'color:#f0b9b4;margin-bottom:14px"><b style="color:var(--red)">🔒 About the auth token</b>'
      + 'This is a static page and everything it knows lives in this browser\'s localStorage, in the clear. '
      + 'There is no key store to encrypt against — any key would have to sit next to what it encrypted, which '
      + 'protects nothing. The field below is masked so it cannot be read over your shoulder, and that is the '
      + 'whole of the protection on offer. <b>Use a scoped Twilio API key restricted to sending SMS, never the '
      + 'account auth token</b>, so that anything with access to this browser profile cannot take over the '
      + 'account. Tap <b>Copy all data</b> in the Data card and the token comes with it.</div>';

    h += '<div class="fld"><label for="smsSid">Twilio Account SID</label>'
      + '<input id="smsSid" spellcheck="false" autocomplete="off" value="'+esc(sms.accountSid)+'" placeholder="AC…"></div>'
      + '<div class="fld"><label for="smsTok">Twilio Auth Token / API key secret</label>'
      + '<input id="smsTok" type="password" spellcheck="false" autocomplete="new-password" value="'+esc(sms.authToken)+'" '
      + 'placeholder="stored unencrypted — use a scoped API key"></div>'
      + '<div class="fld"><label for="smsFrom">Twilio "from" number</label>'
      + '<input id="smsFrom" type="tel" spellcheck="false" value="'+esc(sms.fromNumber)+'" placeholder="+1…"></div>';

    h += '<h2 style="margin-top:18px">Driver phone numbers</h2>'
      + '<div class="hint" style="margin-bottom:12px">'+withPhones+' of '+roster.length+' on file. A load\'s '
      + '<b>Send dispatch</b> button stays disabled until the driver it would text has a number here, so a '
      + 'half-filled table disables only the rows it is missing.</div>';
    roster.forEach((d,i)=>{
      h += '<div class="fld"><label for="smsP'+i+'">'+esc(shortNameFor(d.name))
        + ' <span style="color:var(--text-faint);font-weight:400">'+esc(d.name)+'</span></label>'
        + '<input id="smsP'+i+'" type="tel" spellcheck="false" data-smsphone="'+esc(d.name)+'" '
        + 'value="'+esc(driverPhone(d.name))+'" placeholder="+1…"></div>';
    });

    h += '<h2 style="margin-top:18px">Test</h2>'
      + '<div class="fld"><label for="smsTest">Your phone number</label>'
      + '<input id="smsTest" type="tel" spellcheck="false" value="'+esc(sms.testTo)+'" placeholder="+1…"></div>'
      + '<div class="btn-row"><button class="act ghost" id="smsTestBtn"'+(ready?'':' disabled')+'>'
      + 'Test SMS to my phone</button></div>'
      + (ready ? '' : '<div class="hint">Enabled once the SID, token and from-number are all filled in.</div>');

    h += '<div class="legend"><b>The template.</b> Every dispatch text is composed as:<br>'
      + '<span style="font-family:var(--mono);font-size:11px;color:var(--text-muted)">'
      + esc('FCT Dispatch: Load [PO] → [Destination], [time] pickup, truck [truck]. Reply YES to accept, NO to decline. James')
      + '</span><br><br>Destination is the delivery point where the sheet has one and the origin otherwise. '
      + 'The reply handling — YES/NO back into the assignment — is Phase 3.2 along with the send itself; today '
      + 'the button composes, logs to the console and shows you the message.</div></div>';
  }

  /* =============================================================
     VERIZON ACTUALS (v1.5)
     Loaded timecard days, the alias map, and the detention knob.
     ============================================================= */
  {
    const V = state.verizon;
    const days = Object.keys(V.days).sort().reverse();
    const unresolved = {};
    days.forEach(k=>(V.days[k].unresolved||[]).forEach(n=>{ unresolved[n]=1; }));
    const unres = Object.keys(unresolved).filter(n=>!V.aliases[n]);

    h += '<div class="card" id="verizonCard"><h2>Verizon actuals</h2>'
      + '<div class="hint" style="margin-bottom:12px">Drop the <b>Daily Timecard</b> CSV on the load list. Each day is stored as '
      + 'round trips rather than raw legs — a 780-leg file becomes a couple of hundred trips, which is what fits in storage and '
      + 'what the matcher actually reads. Revenue never moves off a timecard; only miles, hours and therefore variable cost do.</div>';

    if(!days.length){
      h += '<div class="empty">No timecards loaded. The day rollup is running on modelled '
        + num(s.avgMilesPerLoad)+' mi / '+num(s.hoursPerLoad,1)+' hr averages.</div>';
    } else {
      days.forEach(k=>{
        const dd = V.days[k];
        const drv = {};
        dd.clusters.forEach(c=>{ if(c.driver) drv[c.driver]=1; });
        const pre = dd.clusters.filter(c=>c.isPreload).length;
        h += '<div class="row"><div class="row-l"><div class="row-t">'+esc(k)
          + (k===state.dayRollup.date?' <span class="chip g">IN VIEW</span>':'')+'</div>'
          + '<div class="row-s">'+esc(dd.fileName)+' · '+dd.legCount+' legs → '+dd.clusters.length+' trips · '
          + Object.keys(drv).length+' drivers · '+pre+' preload'+(pre===1?'':'s')+'</div></div>'
          + '<div class="row-v"><button type="button" data-vzdel="'+esc(k)+'" style="all:unset;cursor:pointer;'
          + 'font-size:11px;color:var(--text-faint);border-bottom:1px dotted var(--border-strong)">remove</button></div></div>';
      });
    }

    h += '<div class="fld" style="margin-top:14px">'
      + nf('sDet60','Detention threshold (min)', s.detentionThresholdMin,'5',
          'Dwell inside a Diamond geofence past this raises a detention chip. Diamond\'s own average on-site time is 7m 27s, so 60 min is well past normal.')
      + '</div>';

    /* Driver alias map — only ever shown with something to resolve. */
    h += '<h2 style="margin-top:18px">Driver name matching</h2>'
      + '<div class="hint" style="margin-bottom:12px">Verizon carries the payroll spelling and the dispatch log carries the short one. '
      + Object.keys(VERIZON_DRIVER_NAME).length+' names are bridged already — “Jesus Estrada III” → Jesus Estrada, '
      + '“Juan Manuel Jr Castillo” → Juan Castillo. Anything the file throws up that is not on the roster lands here. '
      + 'A truck logged as <b>(Unassigned)</b> is never guessed at.</div>';
    if(!unres.length && !Object.keys(V.aliases).length){
      h += '<div class="row"><div class="row-l"><div class="row-t">All names matched</div>'
        + '<div class="row-s">every driver in the loaded timecards resolved to the roster</div></div>'
        + '<div class="row-v" style="color:var(--green)">✓</div></div>';
    }
    unres.forEach((n,i)=>{
      h += '<div class="fld"><label for="vza'+i+'">'+esc(n)+' <span style="color:var(--amber);text-transform:none">— unmatched</span></label>'
        + '<select id="vza'+i+'" data-vzalias="'+esc(n)+'"><option value="">— leave unmatched —</option>'
        + s.drivers.map(d=>'<option value="'+esc(d.name)+'">'+esc(d.name)+'</option>').join('')
        + '</select></div>';
    });
    Object.keys(V.aliases).forEach((n,i)=>{
      h += '<div class="fld"><label for="vzb'+i+'">'+esc(n)+' <span style="color:var(--green);text-transform:none">— mapped</span></label>'
        + '<select id="vzb'+i+'" data-vzalias="'+esc(n)+'"><option value="">— remove mapping —</option>'
        + s.drivers.map(d=>'<option value="'+esc(d.name)+'"'+(V.aliases[n]===d.name?' selected':'')+'>'+esc(d.name)+'</option>').join('')
        + '</select></div>';
    });

    h += '<div class="legend">Matching a load to a trip needs three things to line up: the row names a driver the roster knows, '
      + 'the timecard has that driver on that date, and one of their round trips passed through the load\'s origin geofence. '
      + 'A trip can only be claimed once, so two loads off the same origin take two different trips. '
      + 'Where any of that fails the row keeps its estimate and shows a <b>?</b> — hover it for the specific reason.</div></div>';
  }

  /* Customer baseline overrides */
  h += '<div class="card"><h2>Customer baseline $/hr</h2>';
  allCustomerNames().forEach((name,i)=>{
    const b = baselineFor(name);
    const ov = s.customerBaselines[name];
    h += '<div class="fld"><label for="sb'+i+'">'+esc(name)+' — <span style="text-transform:none;letter-spacing:0">'
      + (b.source==='history'? b.n+' logged loads' : b.source==='override'? 'manual override' : 'seed from rate card, '+esc(fscRuleText(fscRuleFor(name))))+'</span></label>'
      + '<input id="sb'+i+'" type="number" inputmode="decimal" step="1" placeholder="'+b.value.toFixed(2)+' (auto)" value="'+(ov!=null?ov:'')+'" data-bc="'+esc(name)+'"></div>';
  });
  h += '<div class="legend">Leave blank to let the app decide: once a customer has <b>'+MIN_HIST_LOADS+'</b> logged loads, real performance replaces the seed baseline automatically. Type a number to pin it.</div></div>';

  /* QBO refresh */
  h += '<div class="card warn"><h2>QBO data</h2>'
    + '<div class="row"><div class="row-l"><div class="row-t">Last live pull</div>'
    + '<div class="row-s">'+esc(state.qbo.source)+'</div></div>'
    + '<div class="row-v" style="color:var(--amber)">'+(state.qbo.pulledAt?esc(state.qbo.pulledAt):'never')+'</div></div>'
    + '<div class="legend">A static page cannot call the QuickBooks MCP connector directly — that is a build-time operation, not something this page can do at runtime. To refresh: ask Claude to re-pull QBO and hand you a <code>qboSeed</code> JSON block, then paste it below.</div>'
    + '<div class="fld" style="margin-top:12px"><label for="sQbo">Paste refreshed QBO JSON</label>'
    + '<textarea id="sQbo" rows="4" placeholder=\'{"pulledAt":"2026-07-27","revenueT12M":{"value":6350000,"verified":true}, ...}\'></textarea></div>'
    + '<div class="btn-row"><button class="act ghost" id="sQboImport">Import QBO JSON</button></div></div>';

  /* Data / version */
  h += '<div class="card"><h2>Data</h2>'
    + '<div class="row"><div class="row-l"><div class="row-t">Saved loads</div></div><div class="row-v">'+state.history.length+'</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t">Saved day snapshots</div>'
    + '<div class="row-s">'+state.dayRollup.currentRows.filter(dayRowActive).length+' row(s) in the current unsaved day</div></div>'
    + '<div class="row-v">'+state.dayRollup.snapshots.length+'</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t">Storage tier</div>'
    + '<div class="row-s">'+esc(STORAGE_ENV?STORAGE_ENV.protocol:'?')+' · localStorage '+(STORAGE_ENV&&STORAGE_ENV.localStorageOK?'ok':'FAIL')+' · IndexedDB '+(STORAGE_ENV&&STORAGE_ENV.indexedDBOK?'ok':'FAIL')+'</div></div>'
    + '<div class="row-v">'+(STORAGE_ENV&&STORAGE_ENV.localStorageOK?'✓':'⚠')+'</div></div>'
    + '<div class="row"><div class="row-l"><div class="row-t">Version</div></div><div class="row-v" style="font-size:11px">'+APP_VERSION+'</div></div>'
    + '<div class="btn-row" style="margin-top:12px">'
    + '<button class="act" id="sCopy">Copy all data</button>'
    + '<button class="act ghost" id="sExport">Export loads as CSV</button>'
    + '<button class="act danger" id="sWipe">Erase all saved loads</button></div></div>';

  $('#p-set').innerHTML = h;

  /* --- wiring --- */
  const bindNum=(id,key,after)=>{ const el=document.getElementById(id); if(!el) return; el.addEventListener('change',()=>{
    const v=parseFloat(el.value); if(!isNaN(v)){ s[key]=v; save(); renderSet(); renderDash(); if(typeof after==='function') after(); }
  }); };
  bindNum('sRate','ratePerLb'); bindNum('sFsc','fscPerMile'); bindNum('sDet','detentionPerHr');
  bindNum('sTgt','targetPct'); bindNum('sWear','wearPerMile');
  bindNum('sDrvDef','defaultDriverRate', pushCanonicalSettings); bindNum('sDays','operatingDaysPerYear');
  bindNum('sTHrs','hoursPerTruckDay');
  bindNum('sMiles','annualMiles'); bindNum('sLoad','driverLoadingFactor');
  bindNum('sFscPct','defaultFscPercent');
  /* sFixedTruck / sDayMargin retired in v1.3 — the day rollup no longer
     scales fixed cost by trucks running, and the verdict is absolute
     dollars rather than a margin percentage. */

  /* --- v1.3 unit economics --- */
  /* Same as bindNum but also re-renders the Calculator, because every one of
     these moves the day rollup and the single-load benchmark. */
  const bindEcon=(id,key)=>{ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change',()=>{
      const v=parseFloat(el.value);
      if(isNaN(v)){ renderSet(); return; }
      if(v<0){ toast('Enter a number of zero or more'); renderSet(); return; }
      s[key]=v; save(); renderSet(); renderDash(); renderCalc();
    }); };
  bindEcon('sRevLoad','revenuePerLoadDefault'); bindEcon('sLoadsYr','loadsPerYear');
  bindEcon('sAvgMi','avgMilesPerLoad');         bindEcon('sHrsLoad','hoursPerLoad');
  bindEcon('sSubYr','subhaulerPerYear');        bindEcon('sOtherVar','otherVariablePerLoad');
  bindEcon('sOpDays','operatingDaysPerYear');   bindEcon('sDayBand','dayVerdictBandUsd');

  /* --- v1.4 dispatch operations --- */
  /* These move the preload banner and the suggestions, not the money, so they
     re-render the dash and the queue but leave the calculator alone. */
  const bindOps=(id,key)=>{ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change',()=>{
      const v=parseFloat(el.value);
      if(isNaN(v) || v<0){ toast('Enter a number of zero or more'); renderSet(); return; }
      s[key]=v; save(); renderSet(); renderDash();
    }); };
  bindOps('sPreHrs','preloadHrsPerLoad'); bindOps('sPmHrs','afternoonHrsPerDriver');
  bindOps('sHos','defaultDriverHosHrs');  bindOps('sDet60','detentionThresholdMin');
  /* v2.1.40: EST-only P&L blend. Re-renders Today so the board moves; Queue
     ranking does not read this number, so we do not re-score suggestions. */
  {
    const el = document.getElementById('sAdpBlend');
    if(el) el.addEventListener('change', ()=>{
      const v = parseFloat(el.value);
      if(isNaN(v) || v <= 0){
        toast('ADP blend has to be more than 0. 1.00 = no lift, 1.21 = August OT & meals.');
        renderSet();
        return;
      }
      s.estDriverWageBlend = v;
      save();
      renderSet();
      renderDash();
    });
  }

  /* --- v1.8 rate refresh ---
     Explains rather than pretends. QBO's MCP connector is not reachable from a
     static page, so there is no button that can actually go and get this —
     saying so, with the exact command to ask for, beats a spinner that fails. */
  {
    const rr = document.getElementById('sRateRefresh');
    if(rr) rr.addEventListener('click',()=>{
      showStorageError('Rate refresh via QBO requires a manual pull (Claude session)',
        'Ask Claude in cowork to run `refresh_customer_rates` — takes 30 sec. '
        + 'This page cannot reach QBO on its own: the connector needs credentials a static file has nowhere '
        + 'safe to keep, so the pull happens in a session and the new figures are baked into the next build. '
        + 'Current card: '+CUSTOMER_RATES_SOURCE+', '+CUSTOMER_RATES_ASOF+'. '
        + 'Your per-customer overrides are never touched by a refresh.',
        {severity:'warn'});
    });
  }

  /* --- v1.8 SMS dispatch config ---
     Re-renders the dash on every change because the Send-dispatch buttons on
     the load list enable and disable off exactly these fields. */
  {
    const bindSms=(id,key)=>{ const el=document.getElementById(id); if(!el) return;
      el.addEventListener('change',()=>{
        state.sms[key] = el.value.trim();
        save(); renderSet(); renderDash();
      }); };
    bindSms('smsSid','accountSid'); bindSms('smsTok','authToken');
    bindSms('smsFrom','fromNumber'); bindSms('smsTest','testTo');

    document.querySelectorAll('[data-smsphone]').forEach(el=>el.addEventListener('change',()=>{
      const n = el.dataset.smsphone, v = el.value.trim();
      if(v) state.sms.phones[n] = v; else delete state.sms.phones[n];
      save(); renderSet(); renderDash();
    }));

    const tb = document.getElementById('smsTestBtn');
    if(tb) tb.addEventListener('click',()=>{
      if(!smsConfigured()) return;
      const to = String(state.sms.testTo||'').trim();
      if(!to){ toast('Add your phone number first'); return; }
      const msg = 'FCT Dispatch: test message from the load calculator. Reply YES to accept, NO to decline. James';
      console.log('[FCT SMS stub — not sent] to='+to+' from='+(state.sms.fromNumber||'(unset)')+'\n'+msg);
      toast('Would send: '+msg);
    });
  }

  /* --- v1.6 dispatch data source --- */
  {
    const srcEl = document.getElementById('sDataSrc');
    if(srcEl) srcEl.addEventListener('change',()=>{
      const v = srcEl.value;
      s.dispatchDataSource = (v==='file'||v==='hybrid'||v==='worker') ? v : 'worker';
      /* Switching away from the worker retires its pill; switching TO it goes
         and gets the data rather than waiting for the next page load, because
         the point of picking it is to have today's sheet now. */
      if(s.dispatchDataSource==='file') workerState = { kind:'idle', at:'', ingestedAt:'', rowCount:0, msg:'' };
      save(); renderSet(); renderDash();
      if(s.dispatchDataSource!=='file') syncFromWorker({force:true}).then(()=>renderSet());
      toast('Dispatch source: '+s.dispatchDataSource);
    });
    const urlEl = document.getElementById('sWorkerUrl');
    if(urlEl) urlEl.addEventListener('change',()=>{
      const v = urlEl.value.trim();
      state.dispatchImport.workerUrl = v || WORKER_URL;
      /* A different endpoint is a different feed, so the stamp we compare
         against is meaningless — clear it or the first sync would no-op. */
      state.dispatchImport.lastIngestedAt = '';
      save(); renderSet();
      toast(v ? 'Worker endpoint saved' : 'Worker endpoint reset to the default');
    });
    const syncEl = document.getElementById('sWorkerSync');
    if(syncEl) syncEl.addEventListener('click',()=>{ syncFromWorker({force:true}).then(()=>renderSet()); });
    const sAdpPick = document.getElementById('sAdpPick');
    const sAdpFile = document.getElementById('sAdpFile');
    if(sAdpPick && sAdpFile){
      sAdpPick.addEventListener('click',()=>sAdpFile.click());
      sAdpFile.addEventListener('change',()=>{ handleDroppedFiles(sAdpFile.files); sAdpFile.value=''; });
    }
    const sAdpClear = document.getElementById('sAdpClear');
    if(sAdpClear) sAdpClear.addEventListener('click',()=>{
      if(!confirm('Clear ADP pay actuals on this phone? Dispatch stays. Days go back to estimated driver wages.')) return;
      rebuildAdpIndex([]);
      state.adpPay = defaultAdpPay();
      idbDel(IDB_ADP_KEY).catch(()=>{});
      save(); renderSet(); renderDash();
      toast('ADP pay cleared');
    });
  }

  /* --- v1.5 Verizon --- */
  document.querySelectorAll('[data-vzdel]').forEach(b=>b.addEventListener('click',()=>{
    const k = b.dataset.vzdel;
    if(!confirm('Remove the '+k+' timecard? That day goes back to estimated figures.')) return;
    delete state.verizon.days[k];
    invalidateVerizonMatch(); save(); renderSet(); renderDash();
    toast(k+' timecard removed');
  }));
  document.querySelectorAll('[data-vzalias]').forEach(el=>el.addEventListener('change',()=>{
    const n = el.dataset.vzalias;
    if(el.value) state.verizon.aliases[n] = el.value;
    else delete state.verizon.aliases[n];
    /* An alias changes who a stored cluster belongs to, so re-stamp the driver
       on every cluster already parsed rather than making the operator re-drop
       the file to see the effect. */
    Object.keys(state.verizon.days).forEach(k=>{
      state.verizon.days[k].clusters.forEach(c=>{ c.driver = resolveVerizonDriver(c.vName); });
    });
    invalidateVerizonMatch(); save(); renderSet(); renderDash();
    toast(el.value ? n+' → '+shortNameFor(el.value) : n+' unmapped');
  }));

  const opsDriver = name=>{
    if(!state.dispatchOps.drivers[name]) state.dispatchOps.drivers[name] = {};
    return state.dispatchOps.drivers[name];
  };
  document.querySelectorAll('[data-dophos]').forEach(el=>el.addEventListener('change',()=>{
    const v = parseFloat(el.value);
    if(isNaN(v) || v<0 || v>24){ toast('HOS hours must be between 0 and 24'); renderSet(); return; }
    opsDriver(el.dataset.dophos).hos = v; save(); renderDash();
  }));
  document.querySelectorAll('[data-dopclk]').forEach(el=>el.addEventListener('change',()=>{
    opsDriver(el.dataset.dopclk).clockedIn = el.checked;
    save(); renderSet(); renderDash();
  }));
  document.querySelectorAll('[data-dopact]').forEach(el=>el.addEventListener('change',()=>{
    opsDriver(el.dataset.dopact).active = el.checked;
    save(); renderSet(); renderDash();
    if(!el.checked) toast(shortNameFor(el.dataset.dopact)+' taken out of suggestions');
  }));

  /* Fixed stack — toggling a line or editing an amount re-derives

  document.querySelectorAll('[data-fxon]').forEach(el=>el.addEventListener('change',()=>{

  }));

  /* Day-in-view + trucks running, relocated here from the landing page. */
  {

  bindEcon('sSteadyDanger','steadyDangerPct'); bindEcon('sSteadyBase','steadySharePct');

  /* --- Diamond rate tiers (v1.3) --- */
  document.querySelectorAll('[data-tier]').forEach(el=>el.addEventListener('change',()=>{
    const tier = diamondTiers().find(x=>x.k===el.dataset.tier);
    if(!tier) return;
    const f = el.dataset.tf;
    if(f==='fscIncluded'){ tier.fscIncluded = el.value==='1'; }
    else {
      const v = parseFloat(el.value);
      if(isNaN(v) || v<0){ renderSet(); return; }
      tier[f] = v;
    }
    save(); renderSet(); renderDash(); renderCalc();
  }));

  /* --- Load categories & rates (v1.3) --- */
  document.querySelectorAll('[data-rtb]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value);

  /* Assigning a label re-runs classification on the rows already imported,

  const addLabel=(bucket)=>{
    const el=document.getElementById('lbl_'+bucket);
    const v=normLabel(el && el.value);
    if(!v){ toast('Type the customer name first'); return; }
    ['steady','seasonal','spot'].forEach(k=>{
      state.customerLabels[k]=(state.customerLabels[k]||[]).filter(x=>normLabel(x)!==v);
    });
    state.customerLabels[bucket].push(v);
    reclassifyImported();
    save(); renderSet(); renderDash(); renderCalc();
    toast(v+' → '+bucketMeta(bucket).label);
  };
  document.querySelectorAll('[data-lblbtn]').forEach(b=>b.addEventListener('click',()=>addLabel(b.dataset.lblbtn)));
  document.querySelectorAll('[data-lbladd]').forEach(el=>el.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); addLabel(el.dataset.lbladd); }
  }));
  document.querySelectorAll('[data-lblrm]').forEach(b=>b.addEventListener('click',()=>{
    const v=normLabel(b.dataset.lblrm);
    ['steady','seasonal','spot'].forEach(k=>{
      state.customerLabels[k]=(state.customerLabels[k]||[]).filter(x=>normLabel(x)!==v);
    });
    reclassifyImported();
    save(); renderSet(); renderDash(); renderCalc();
    toast(v+' unassigned — back to spot');
  }));

  /* Per-customer revenue per load. Blank clears the override without
     disturbing that customer's FSC rule. */
  document.querySelectorAll('[data-crrev]').forEach(el=>el.addEventListener('change',()=>{
    const c = el.dataset.crrev, v = parseFloat(el.value);
    const cur = state.customerRates[c] || (state.customerRates[c] = {});
    if(el.value==='' || isNaN(v) || v<=0) delete cur.revenuePerLoad;
    else cur.revenuePerLoad = v;
    save(); renderSet(); renderDash(); renderCalc();
  }));

  document.getElementById('sFscMethod').addEventListener('change',function(){
    s.defaultFscMethod = this.value; save(); renderSet(); renderDash(); renderCalc();
  });

  /* Diesel price — changing the price or MPG stamps the update date, which is
     what the 7-day staleness nudge reads. */
  const stampFuel=(id,key)=>{ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change',()=>{
      const v=parseFloat(el.value);
      if(isNaN(v) || v<=0){ toast('Enter a number above zero'); renderSet(); return; }
      s[key]=v;
      s.lastFuelPriceUpdate = new Date().toISOString().slice(0,10);
      s.fuelPriceConfirmed = true;
      save(); renderSet(); renderDash(); renderCalc();
      toast('Fuel now '+money2(fuelPerMile())+'/mi');
      pushCanonicalSettings();
    }); };
  stampFuel('sDiesel','currentDieselPricePerGal');
  stampFuel('sMPG','fleetAvgMPG');
  const fuEl = document.getElementById('sFuelUpd');
  if(fuEl) fuEl.addEventListener('change',()=>{
    s.lastFuelPriceUpdate = fuEl.value || '';
    save(); renderSet(); renderDash();
  });

  /* Lane defaults */
  const bindLane=(id,key)=>{ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change',()=>{ const v=parseFloat(el.value); if(!isNaN(v)){ state.laneDefaults[key]=v; save(); renderSet(); } }); };
  bindLane('sLdLbs','lbs'); bindLane('sLdHours','hoursDefault'); bindLane('sLdMiles','milesDefault');
  /* Per-delivery-point hours (v1.3) */
  document.querySelectorAll('[data-dph]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value); if(isNaN(v)||v<0){ renderSet(); return; }
    state.laneDefaults.dpHours[el.dataset.dph] = v;
    reapplyLaneDefaults(); save(); renderSet(); renderCalc();
  }));
  document.querySelectorAll('[data-lane]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value); if(isNaN(v)) return;
    const lane = state.laneDefaults.lanes[el.dataset.lane];
    if(!lane) return;
    lane[el.dataset.lf] = v; lane.est = false;
    reapplyLaneDefaults(); save(); renderSet();
  }));
  const calEl = document.getElementById('sLdCal');
  if(calEl) calEl.addEventListener('change',()=>{
    state.laneDefaults.calibrated = calEl.value==='1';
    reapplyLaneDefaults(); save(); renderSet(); renderCalc();
    toast(state.laneDefaults.calibrated ? 'Lane defaults locked in' : 'Lane defaults flagged EST again');
  });

  /* Per-customer FSC rules */
  document.querySelectorAll('[data-crm]').forEach(el=>el.addEventListener('change',()=>{
    const c = el.dataset.crm;
    if(!el.value){ delete state.customerRates[c]; }
    else {
      const prev = state.customerRates[c] || {};
      state.customerRates[c] = Object.assign({}, prev, {fscMethod:el.value, verified:false});
      if(el.value==='none') state.customerRates[c].fscValue = null;
    }
    save(); renderSet(); renderDash(); renderCalc();
  }));
  document.querySelectorAll('[data-crv]').forEach(el=>el.addEventListener('change',()=>{
    const c = el.dataset.crv, v = parseFloat(el.value);
    const cur = state.customerRates[c];
    if(!cur || !cur.fscMethod){ toast('Pick a method for '+c+' first'); renderSet(); return; }
    cur.fscValue = (el.value===''||isNaN(v)) ? null : v;
    cur.verified = false;
    save(); renderSet(); renderDash(); renderCalc();
  }));

  document.querySelectorAll('[data-oi]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value); if(!isNaN(v)){ s.office[+el.dataset.oi].base=v; s.office[+el.dataset.oi].verified=true; save(); renderSet(); renderDash(); }
  }));
  document.querySelectorAll('[data-di]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value); if(!isNaN(v)){ s.drivers[+el.dataset.di].rate=v; s.drivers[+el.dataset.di].verified=true; save(); renderSet(); }
  }));
  document.querySelectorAll('[data-bc]').forEach(el=>el.addEventListener('change',()=>{
    const c=el.dataset.bc, v=parseFloat(el.value);
    if(el.value===''||isNaN(v)) delete s.customerBaselines[c]; else s.customerBaselines[c]=v;
    save(); renderSet(); renderDash();
  }));
  document.getElementById('sdAdd').addEventListener('click',()=>{
    const n=sv('sdNew').trim(); if(!n){ toast('Enter a name'); return; }
    s.drivers.push({name:n, rate:fv('sdNewR')||s.defaultDriverRate, verified:true});
    save(); renderSet(); renderCalc(); toast('Driver added');
  });
  document.getElementById('sQboImport').addEventListener('click',()=>{
    const raw=sv('sQbo').trim(); if(!raw){ toast('Paste JSON first'); return; }
    try{
      const p=JSON.parse(raw);
      state.qbo = Object.assign({}, state.qbo, p);
      if(!p.pulledAt) state.qbo.pulledAt = new Date().toISOString().slice(0,10);
      save(); renderSet(); renderDash(); renderCalc(); toast('QBO data imported');
    }catch(e){ toast('Bad JSON — not imported'); }
  });
  document.getElementById('sCopy').addEventListener('click',copyAllData);
  document.getElementById('sExport').addEventListener('click',exportCSV);
  document.getElementById('sWipe').addEventListener('click',()=>{
    if(!confirm('Erase all '+state.history.length+' saved loads? Settings are kept. This cannot be undone — copy your data first.')) return;
    state.history=[]; save(); renderSet(); renderHist(); renderDash(); toast('Loads erased');
  });
}

function exportCSV(){
  if(!state.history.length){ toast('No loads to export'); return; }
  const cols=['date','customer','origin','destination','loadedMi','deadheadMi','lbs','fsc','fscMethod','fscValue','hours','longestWait','driver','driverRate','revenue','varCost','cm','cmPerHour','net','ratio','verdict','detentionBillable','notes'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(state.history.map(l=>cols.map(c=>q(l[c])).join(','))).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(csv).then(()=>toast('CSV copied')).catch(()=>fallbackCopy(csv,()=>toast('CSV copied')));
  else fallbackCopy(csv,()=>toast('CSV copied'));
}

function switchTab(t){

/* The suggestion popover closes on the next tap anywhere else, and on scroll
   — it is positioned against the viewport, so a scroll would leave it stranded. */
document.addEventListener('click',e=>{ if(!e.target.closest('#sugPop')) closeSugPop(); });

(function boot(){
  STORAGE_ENV = detectStorageEnv();
  loadState();
  $('#hdrVer').textContent = APP_VERSION.replace(/^\d{4}-\d{2}-\d{2}-/,'');
  renderDash(); renderQueue(); renderCalc(); renderHist(); renderInfo(); renderSet();

  /* v2.0.2: pull the dispatch parse in from IDB. Runs after the first paint
     so the app is on screen immediately — if IDB has more rows than LS gave
     us (the normal case, and always the case after upgrade from a pre-v2.0.2
     save that was trimmed), the second render below shows the full totals.
     Idempotent — if IDB and LS agree, the re-render is a no-op. */
  /* v2.0.5: fire the migration toast after first paint. */
  if(window.__v205MigrationJustRan){
    setTimeout(function(){
      try { toast('Settings baseline updated to v2.0.5 — FSC 33% · Diesel $6.919/gal.'); } catch(_){}
    }, 400);
    delete window.__v205MigrationJustRan;
  }
  /* v2.0.6: fire the QBO-anchored baseline toast. */
  if(window.__v206MigrationJustRan){
    setTimeout(function(){
      try { toast('Settings baseline updated to v2.0.6 — QBO-anchored stack ($5,758/day fpd, 7-day operating year) + driver rate $22.28.'); } catch(_){}
    }, 800);
    delete window.__v206MigrationJustRan;
  }

  hydrateLastImportRows().then(function(hydrated){
    try { markBootSettle('rows'); } catch(_){}
    if(hydrated){
      // Repaint the surfaces that read li.rows so WTD/MTD, Section 2, and the
      // day picker all reflect the full dataset instead of the trimmed LS view.
      try { renderDash(); } catch(_){}
      try { renderQueue(); } catch(_){}
      try { renderHist(); } catch(_){}
    }
  }).catch(function(){ try { markBootSettle('rows'); } catch(_){} });
  hydrateAdpPay().then(function(hydrated){
    try { markBootSettle('adp'); } catch(_){}
    if(hydrated){
      try { renderDash(); } catch(_){}
      try { renderSet(); } catch(_){}
    }
  }).catch(function(){ try { markBootSettle('adp'); } catch(_){} });

  /* v1.6 — the whole point of the release: the day arrives on its own.
     Fired after the first paint so a slow or dead worker never holds the app
     hostage; whatever was last stored is already on screen by the time this
     resolves, and a failure only repaints the pill. Quiet on success because
     the pill says it better than a toast would. */
  if(dataSource()!=='file'){
    syncFromWorker({quiet:true}).then(()=>{
      // Settings shows sync status too, and it was rendered before the fetch.
      if(document.getElementById('sDataSrc')) renderSet();
    });
    // v1.8.25: auto-poll every 5 min. Even without the ⚡ button, if
    // someone else opens the file in Excel Online during the day, the
    // worker gets a fresh push and this timer picks it up. Silent by
    // design — the sync pill shows the timestamp.
    setInterval(()=>{
      if(dataSource()!=='file' && !document.hidden){
        syncFromWorker({quiet:true}).then(()=>{
          if(document.getElementById('sDataSrc')) renderSet();
        }).catch(()=>{});
      }
    }, 5 * 60 * 1000);
  }

  /* 2026-08-18 v2.1.0: Verizon Reveal live-driver feed. Same boot+interval
     pattern as the dispatch worker, but independently gated by
     settings.useVerizonLive so we can dark-launch or roll back without
     breaking the dispatch pipeline. */
  if(state.settings && state.settings.useVerizonLive){
    syncFromVerizon({quiet:true}).catch(()=>{});
    syncSignals().catch(()=>{});  // v2.1.5
    setInterval(()=>{
      if(!document.hidden && state.settings.useVerizonLive){
        syncFromVerizon({quiet:true}).catch(()=>{});
        syncSignals().catch(()=>{});  // v2.1.5
      }
    }, 5 * 60 * 1000);
  }

  /* v2.1.19 (2026-08-21): fleet-day miles pull for the Verizon-actual vs
     LANE_MILES-calc fuel compare. Fires unconditionally on every boot —
     the /miles endpoint is public + cheap and the compare shows a muted
     "unavailable" note when it fails, so no useVerizonLive gate. Also
     refreshes every 10 min so the compare doesn't stale-freeze on a phone
     left open all afternoon. */
  refreshVerizonMilesToday();
  setInterval(()=>{
    if(!document.hidden) refreshVerizonMilesToday();
  }, 10 * 60 * 1000);

  /* v2.1.21 (2026-08-21): per-lane calibration. Two-step:
       1. push our local dispatch log to the worker so it has the inputs
          (worker can't parse Excel — only the browser can).
       2. fetch the resulting /calibration and apply factors to per-load
          fuel/wear in computeDayRow.
     Both are silent-fail; a missing calibration just means factor=1.0.
     Refetch every hour so a fresh POST from another tab/day rolls in. */
  setTimeout(()=>{
    pushDispatchLog({days:8}).catch(()=>{});
  }, 2500);  // let boot settle first
  setTimeout(()=>{
    refreshLaneCalibration();
  }, 1200);  // read cached calibration while POST runs in parallel
  setInterval(()=>{
    if(!document.hidden) refreshLaneCalibration();
  }, 60 * 60 * 1000);

  if(STORAGE_ENV.warnings.length){
    showStorageError('Storage warning', STORAGE_ENV.warnings.join(' '), {severity:'warn'});
  }
  /* Post-boot IndexedDB recovery: if localStorage lost data but IDB has more. */
  idbGet(STORAGE_KEY).then(v=>{
    if(!v) return;
    try{
      const idbState=JSON.parse(v);
      const idbN=(idbState.history||[]).length, lsN=state.history.length;
      if(idbN>lsN){
        showStorageError('Backup found: IndexedDB has '+idbN+' loads, current storage has '+lsN+'.',
          'localStorage may have been cleared or is unreliable here. Reload after restoring, or copy your data now.',
          {severity:'warn'});
      }
    }catch(_){}
  }).catch(()=>{});

  /* v1.8.9: Version-check nudge. Fetches this page with a cache-buster
     every 10 min and compares its meta[app-version] to the one running.
     If they differ, drops a small banner asking to reload — never auto-
     reloads, and silently skips if offline. */
  async function __checkForNewVersion(){
    try{
      const r = await fetch(location.pathname + '?_ver=' + Date.now(), {cache:'no-store'});
      if(!r.ok) return;
      const t = await r.text();
      const m = t.match(/name=["']app-version["']\s+content=["']([^"']+)/);
      if(!m || !m[1] || m[1] === APP_VERSION) return;
      __showVersionBanner(m[1]);
    }catch(_){/* offline or transient — skip */}
  }
  function __showVersionBanner(newVersion){
    if(document.getElementById('__versionBanner')) return;
    const b = document.createElement('div');
    b.id = '__versionBanner';
    b.setAttribute('role','status');
    b.style.cssText = 'position:fixed;bottom:88px;left:50%;transform:translateX(-50%);'
      + 'background:#164e2a;color:#c8e6d0;padding:10px 14px;border-radius:10px;'
      + 'box-shadow:0 6px 20px rgba(0,0,0,0.5);z-index:99999;font-size:14px;'
      + 'display:flex;align-items:center;gap:10px;max-width:92vw;'
      + 'font-family:inherit;line-height:1.35;';
    const shortNew = newVersion.replace(/^.*fct-calc-/,'');
    b.innerHTML = '<span style="opacity:0.9">New build: <b style="color:#a7f3c9">'+shortNew
      + '</b></span>'
      + '<button id="__vbReload" style="background:#22c55e;color:#062010;border:0;padding:6px 12px;border-radius:6px;font-weight:600;cursor:pointer;">Reload</button>'
      + '<button id="__vbDismiss" style="background:transparent;color:#c8e6d0;border:0;padding:4px 8px;cursor:pointer;font-size:16px;line-height:1;">✕</button>';
    document.body.appendChild(b);
    document.getElementById('__vbReload').addEventListener('click', function(){
      location.href = location.pathname + '?v=' + Date.now();
    });
    document.getElementById('__vbDismiss').addEventListener('click', function(){ b.remove(); });
  }
  // First check 5s after boot, then every 10 minutes while the tab is open.
  setTimeout(__checkForNewVersion, 5000);
  setInterval(__checkForNewVersion, 10 * 60 * 1000);

  /* v2.1.47: Device-out-of-sync red bar DELETED. James: gone for good.
     Do not GET canonical-settings to compare or overwrite local diesel.
     Do not paint a banner for MPG / driver rate either. Settings still
     POSTs via pushCanonicalSettings; v2.1.25 silent auto-apply stays REVERTED. */
  setTimeout(function(){
    try {
      if(!__bootSettle.cal && !__calInFlight) markBootSettle('cal');
      if(!__bootSettle.miles) markBootSettle('miles');
      if(!__bootSettle.adp) markBootSettle('adp');
      if(!__bootSettle.rows) markBootSettle('rows');
    } catch(_){}
  }, 8000);
})();
</script>

/* ---- v2.0 UI: RULEBOOK TAB ---- */
function renderV2Rulebook(){
  const el = document.getElementById('p-rule');
  if(!el) return;
  const confirmed = shadowLoadConfirmed();
  const confPill = c => {
    if (c.includes('HIGH')) return '<span class="v2-pill hi">'+c+'</span>';
    if (c.includes('LOW'))  return '<span class="v2-pill lo">'+c+'</span>';
    return '<span class="v2-pill med">'+c+'</span>';
  };
  let html = '<div class="v2-panel-h"><h2>Dispatch Rulebook</h2>'
    + '<div class="sub">10 hypotheses distilled from 217 versions × 2,738 events (2026-07-20 → 2026-07-28). Confirmed rules feed the Today-tab driver ranking.</div></div>'
    + '<div class="v2-panel-body">';
  SHADOW_HYPOTHESES.forEach(h => {
    const isConf = confirmed[h.id] === 'confirmed';
    const isDism = confirmed[h.id] === 'dismissed';
    html += '<div class="v2-card">'
      + '<h3>'+h.id+' — '+h.title+'</h3>'
      + '<div class="v2-meta">'
      + '<span class="v2-pill '+(h.category==='Recovery'?'lo':(h.category==='Pairing'?'hi':'med'))+'">'+h.category+'</span>'
      + confPill(h.confidence)
      + '<span>evidence: '+h.evidence+'</span>'
      + (isConf ? '<span class="v2-pill confirmed">CONFIRMED</span>' : '')
      + (isDism ? '<span class="v2-pill lo">DISMISSED</span>' : '')
      + '</div>'
      + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px"><b>Trigger:</b> '+h.trigger+'</div>'
      + '<div style="font-size:13px;margin-bottom:6px"><b>Rule:</b> '+h.rule+'</div>'
      + '<div style="font-size:11px;color:var(--text-faint);font-family:var(--mono)">'+h.evidenceNote+'</div>'
      + '<div>'
      + '<button class="v2-btn primary" data-conf="'+h.id+'">'+(isConf?'Unconfirm':'Mark confirmed')+'</button>'
      + '<button class="v2-btn" data-ask="'+h.id+'">Ask JJ</button>'
      + '<button class="v2-btn" data-dism="'+h.id+'">'+(isDism?'Undismiss':'Dismiss')+'</button>'
      + '</div>'
      + '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-conf]').forEach(b => b.addEventListener('click', e => {
    const id = e.currentTarget.dataset.conf; const m = shadowLoadConfirmed();
    m[id] = (m[id]==='confirmed') ? null : 'confirmed'; shadowSaveConfirmed(m); renderV2Rulebook();
  }));
  el.querySelectorAll('[data-dism]').forEach(b => b.addEventListener('click', e => {
    const id = e.currentTarget.dataset.dism; const m = shadowLoadConfirmed();
    m[id] = (m[id]==='dismissed') ? null : 'dismissed'; shadowSaveConfirmed(m); renderV2Rulebook();
  }));
  el.querySelectorAll('[data-ask]').forEach(b => b.addEventListener('click', () => {
    if (typeof toast === 'function') toast('Question queued in Interview tab');
    switchTab('int');
  }));
}

/* ---- v2.0 UI: TIMELINE TAB ---- */
function renderV2Timeline(date){
  const el = document.getElementById('p-tl');
  if(!el) return;
  const activeDate = date || SHADOW_TIMELINE_DATES[SHADOW_TIMELINE_DATES.length - 1];
  const meta = SHADOW_TIMELINE_META[activeDate] || {events:0,sessions:0,note:''};
  const text = SHADOW_TIMELINE_TEXT[activeDate] || '';
  let html = '<div class="v2-panel-h"><h2>Dispatch Timeline</h2>'
    + '<div class="sub">Per-day event feed reconstructed from OneDrive version-history diffs.</div>'
    + '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
  SHADOW_TIMELINE_DATES.forEach(d => {
    html += '<button class="v2-btn '+(d===activeDate?'primary':'')+'" data-tldate="'+d+'">'+d.slice(5)+'</button>';
  });
  html += '</div></div>'
    + '<div class="v2-panel-body">'
    + '<div class="v2-card"><div class="v2-meta">'
    + '<span class="v2-pill hi">'+activeDate+'</span>'
    + '<span>events: '+meta.events+'</span>'
    + '<span>sessions: '+meta.sessions+'</span>'
    + '</div>'
    + (meta.note ? '<div class="tl-note">'+meta.note+'</div>' : '')
    + '</div>';
  // Split text into sessions on ##
  const blocks = text.split(/\n(?=## )/);
  blocks.forEach(b => {
    if (!b.trim()) return;
    const lines = b.split('\n');
    const header = lines[0].replace(/^## /,'');
    const body = lines.slice(1).join('\n');
    html += '<div class="v2-card">'
      + '<div class="tl-session">'+header+'</div>'
      + body.split('\n').map(line => {
        line = line.trim(); if (!line) return '';
        if (line.startsWith('- ')) return '<div class="tl-event">'+line.slice(2)
          .replace(/⏰/g,'<span style="color:var(--yellow)">⏰</span>')
          .replace(/↔/g,'<span style="color:var(--blue)">↔</span>')
          .replace(/\+ r/g,'<span style="color:var(--green)">+</span> r')
          .replace(/- r/g,'<span style="color:var(--red)">-</span> r')
          .replace(/Ω/g,'<span style="color:var(--purple)">Ω</span>')
          + '</div>';
        if (line.startsWith('**NOTE:**')) return '<div class="tl-note">'+line+'</div>';
        return '<div class="tl-event">'+line+'</div>';
      }).join('')
      + '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-tldate]').forEach(b => b.addEventListener('click', e => {
    renderV2Timeline(e.currentTarget.dataset.tldate);
  }));
}

/* ---- v2.0 UI: MARGIN BREAKDOWN CARD (Today tab enhancement) ---- */
/* Reuses existing fuelPerMile(), driver rates, and settings. Adds a compact
   card showing Revenue / -Fuel / -Labor / -Overhead / =Margin colored by
   James's thresholds ($150+ green, $50-150 yellow, <$50 red). */
function computeV2Margin(sampleLoad){
  // sampleLoad: {revenue, miles, hours, driverRate}
  const rev = Number(sampleLoad.revenue) || 0;
  const mi  = Number(sampleLoad.miles) || 0;
  const hrs = Number(sampleLoad.hours) || 0;
  const drvRate = Number(sampleLoad.driverRate) || 28.82;
  const fuel = mi * (typeof fuelPerMile === 'function' ? fuelPerMile() : (5.00/6.5));
  const labor = hrs * drvRate;
  const overhead = (state && state.settings && state.settings.overheadPctPerLoad != null)
    ? (rev * (Number(state.settings.overheadPctPerLoad)/100))
    : (rev * 0.12);
  const margin = rev - fuel - labor - overhead;
  return { rev, fuel, labor, overhead, margin };
}
function renderV2MarginCard(hostSelector, sampleLoad, label){
  const host = document.querySelector(hostSelector);
  if(!host) return;
  const m = computeV2Margin(sampleLoad);
  const cls = m.margin >= 150 ? 'margin-good' : (m.margin >= 50 ? 'margin-warn' : 'margin-bad');
  const fmt = n => '$' + (Math.round(n*100)/100).toFixed(2);
  const html = '<div class="margin-card">'
    + '<h3>Margin breakdown — '+(label||'sample load')+'</h3>'
    + '<div class="margin-row"><span>Revenue</span><span>'+fmt(m.rev)+'</span></div>'
    + '<div class="margin-row"><span>− Fuel ('+ (sampleLoad.miles||0)+' mi @ '+(typeof fuelBasisText === 'function' ? fuelBasisText() : '$5.00/gal ÷ 6.5 MPG')+')</span><span>−'+fmt(m.fuel)+'</span></div>'
    + '<div class="margin-row"><span>− Labor ('+(sampleLoad.hours||0)+' hrs @ $'+((sampleLoad.driverRate||28.82).toFixed(2))+'/hr)</span><span>−'+fmt(m.labor)+'</span></div>'
    + '<div class="margin-row"><span>− Overhead ('+(state&&state.settings&&state.settings.overheadPctPerLoad!=null?state.settings.overheadPctPerLoad:12)+'%)</span><span>−'+fmt(m.overhead)+'</span></div>'
    + '<div class="margin-row total '+cls+'"><span>= Margin</span><span>'+fmt(m.margin)+'</span></div>'
    + '</div>';
  // Append (don't overwrite) so v1.8.11 scoring output stays put
  let existing = host.querySelector('.margin-card');
  if (existing) existing.outerHTML = html;
  else host.insertAdjacentHTML('beforeend', html);
}

function shadowGetDriverList(){
  if (typeof DRIVER_SHIFTS !== 'undefined' && DRIVER_SHIFTS) return Object.keys(DRIVER_SHIFTS).sort();
  return ['FELIPE','MARCOS','RAMON','FELIX','RUDY','JOEL','JUAN M','JESUS E','FRANCISCO','SILVINO','HUGO','RAFA','JOSE','VICTOR','GREG','MUNOZ','JOE','ORLANDO'];
}
function renderV2WageSection(){
  // Append into the Settings panel if not already present
  const panel = document.getElementById('p-set');
  if(!panel) return;
  let host = panel.querySelector('#v2-wage-section');
  if(!host){
    host = document.createElement('div');
    host.id = 'v2-wage-section';
    host.style.cssText = 'padding:20px 16px;border-top:1px solid var(--border-strong);margin-top:20px;';
    panel.appendChild(host);
  }
  const wages = shadowLoadWageMatrix();
  const drivers = shadowGetDriverList();
  let html = '<h2 style="font-family:var(--display);font-size:16px;margin:0 0 6px">Driver wage matrix</h2>'
    + '<div style="font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-bottom:12px">'
    + 'Fully-loaded $/hr per driver (wage + WC + payroll tax). Default $28.82/hr. Feeds the Margin card on Today.'
    + '</div>';
  html += '<div class="wage-row" style="font-weight:700;color:var(--text-muted);font-size:11px;text-transform:uppercase"><span>Driver</span><span>$/hr</span><span></span></div>';
  drivers.forEach(d => {
    const w = wages[d] != null ? wages[d] : 28.82;
    html += '<div class="wage-row">'
      + '<span style="font-family:var(--mono);font-size:12px">'+d+'</span>'
      + '<input type="number" step="0.01" value="'+w+'" data-drv="'+d+'">'
      + '<button class="v2-btn" data-reset="'+d+'" style="margin:0">reset</button>'
      + '</div>';
  });
  host.innerHTML = html;
  host.querySelectorAll('input[data-drv]').forEach(inp => inp.addEventListener('change', e => {
    const d = e.currentTarget.dataset.drv;
    const v = parseFloat(e.currentTarget.value);
    const m = shadowLoadWageMatrix();
    if (isFinite(v) && v > 0) m[d] = v; else delete m[d];
    shadowSaveWageMatrix(m);
    if (typeof toast === 'function') toast('Saved wage for '+d);
  }));
  host.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', e => {
    const d = e.currentTarget.dataset.reset;
    const m = shadowLoadWageMatrix(); delete m[d]; shadowSaveWageMatrix(m); renderV2WageSection();
  }));
}

/* ---- v2.0 BOOT: inject nav buttons + panels, patch switchTab, run initial paints ---- */
(function bootV2(){
  // 1) Inject panels
  const main = document.querySelector('main');
  if (main && !document.getElementById('p-rule')) {
    ['rule','tl','int','log'].forEach(k => {
      const sec = document.createElement('section');
      sec.className = 'panel';
      sec.id = 'p-'+k;
      main.appendChild(sec);
    });
  }
  // 2) Inject nav buttons
  const nav = document.querySelector('nav.tabs');
  if (nav && !nav.querySelector('[data-tab="rule"]')) {
    const mkBtn = (k, label, svgPath) => {
      const b = document.createElement('button');
      b.setAttribute('role','tab');
      b.setAttribute('data-tab', k);
      b.setAttribute('aria-selected','false');
      b.innerHTML = '<svg viewBox="0 0 24 24">'+svgPath+'</svg>'+label;
      return b;
    };
    nav.appendChild(mkBtn('rule','Rules','<path d="M4 4h13l3 3v13H4z"/><path d="M8 10h8M8 14h8M8 18h5"/>'));
    nav.appendChild(mkBtn('tl','Timeline','<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="7" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="18" r="1.5"/>'));
    nav.appendChild(mkBtn('int','Q&amp;A','<circle cx="12" cy="12" r="9"/><path d="M10 9a2 2 0 1 1 3 2c-1 .7-1 1-1 2"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/>'));
    nav.appendChild(mkBtn('log','Log','<path d="M4 4h13l3 3v13H4z"/><path d="M8 10h6M8 14h8M8 18h4"/><circle cx="17" cy="18" r="1.3" fill="currentColor" stroke="none"/>'));
  }
  // 3) Patch switchTab to route new tabs (does not replace — wraps)
  if (typeof switchTab === 'function' && !window.__v2SwitchPatched){
    const _origSwitch = switchTab;
    window.switchTab = function(t){
      if (t === 'rule' || t === 'tl' || t === 'int' || t === 'log'){
        document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===t)));
        document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='p-'+t));
        window.scrollTo({top:0,behavior:'instant'});
        if (t === 'rule') renderV2Rulebook();
        if (t === 'tl')   renderV2Timeline();
        if (t === 'int')  renderV2Interview();
        if (t === 'log')  renderV2Changelog();
        return;
      }
      _origSwitch(t);
      // After Settings renders, append wage matrix
      if (t === 'set') setTimeout(renderV2WageSection, 30);
      // After Today renders, tack on a sample-load margin card
      if (t === 'dash') setTimeout(() => {
        renderV2MarginCard('#p-dash', { revenue: 377, miles: 128, hours: 4.5, driverRate: 28.82 }, 'Pelican → Purina (POC benchmark)');
      }, 60);
    };
    window.__v2SwitchPatched = true;
  }
  // 4) Initial paint of new tabs (so they're populated when user first visits)
  renderV2Rulebook();
  renderV2Timeline();
  renderV2Interview();
  renderV2Changelog();
  renderV2WageSection();
  // Also paint the Today margin card immediately
  setTimeout(() => {
    renderV2MarginCard('#p-dash', { revenue: 377, miles: 128, hours: 4.5, driverRate: 28.82 }, 'Pelican → Purina (POC benchmark)');
  }, 200);
  // Update the header version pill
  const verEl = document.getElementById('hdrVer');
  if (verEl) verEl.textContent = APP_VERSION.replace(/^\d{4}-\d{2}-\d{2}-/,'');
})();
</script>
