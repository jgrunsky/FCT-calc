<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  /* Palette inherited from Lift Log's dark theme: warm near-black ground,
     sage green accent, amber for warnings, terracotta red for critical. */
  :root{
    --bg:#12100e;
    --bg-elev:#1a1815;
    --bg-inset:#161311;
    --border:rgba(245,245,244,.08);
    --border-strong:rgba(245,245,244,.16);
    --text:#f5f4f0;
    --text-muted:#a8a29e;
    --text-faint:#78716c;
    --accent:#8fb590;
    --accent-2:#a8c6a7;
    --accent-fg:#12100e;
    --accent-soft:#2a3a2a;
    --green:#7fa07e;
    --green-bg:#2a3a2a;
    --yellow:#c9a86a;
    --yellow-bg:#3f2e1a;
    --amber:#e8926a;
    --amber-bg:#4a2a1a;
    --red:#c46b6b;
    --red-bg:#3a1e1e;
    --blue:#6b95c2;
    --blue-bg:#182533;
    --purple:#a897b8;
    --purple-bg:#221c2b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
    --shadow-lg:0 12px 32px -8px rgba(0,0,0,.5),0 6px 16px -4px rgba(0,0,0,.4);
    --radius:6px;
    --radius-lg:10px;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --display:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --focus-ring:0 0 0 3px color-mix(in oklab,var(--accent) 30%,transparent);
    --ease:cubic-bezier(.32,.72,0,1);
    --dur:.22s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:400 15px/1.5 var(--body);
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---- Header ---- */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in oklab,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .hdr-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  header h1{font-size:17px}
  header h1 span{color:var(--accent)}
  .hdr-sub{font-size:11px;color:var(--text-faint);font-family:var(--mono)}

  /* ---- Tabs ---- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;   /* v1.4: + Queue · v1.8: + Info */
    background:color-mix(in oklab,var(--bg-elev) 96%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border-strong);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    /* v2.0.7 (2026-08-05, James report: nav floating mid-content on Queue tab):
       force a compositor layer so the fixed nav is always painted against the
       visual viewport, not an ancestor's containing block. Fixes an iOS Safari
       bug where an active panel transform animation (from .panel fade) or a
       dynamically-injected v2.0 stacking-context sibling causes the fixed nav
       to pin to the wrong reference frame mid-scroll. translateZ(0) + will-change
       promote the element to its own layer with the visual viewport as CB. */
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    will-change:transform;
    contain:layout paint;
  }
  nav.tabs button{
    appearance:none;border:0;background:transparent;color:var(--text-faint);
    /* v1.8: six tabs instead of five. The label has to survive a 360px phone
       at one sixth of the width, so it shrinks a shade and stops wrapping —
       a two-line tab would push the row taller than the safe-area padding. */
    font:600 10px/1.2 var(--body);letter-spacing:0;white-space:nowrap;
    padding:9px 2px 7px;border-radius:var(--radius);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:color var(--dur) var(--ease),background var(--dur) var(--ease);
  }
  nav.tabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
  nav.tabs button:focus-visible{box-shadow:var(--focus-ring);outline:none}
  nav.tabs button{position:relative}
  .tab-badge{
    position:absolute;top:3px;left:calc(50% + 7px);min-width:15px;padding:1px 4px;
    border-radius:8px;background:var(--amber);color:#1a1408;
    font:700 9px/1.4 var(--body);text-align:center;
  }
  .tab-badge[hidden]{display:none}

  main{padding:16px;max-width:min(1400px, 96vw);margin:0 auto}
  /* v1.8.15: sheet-wrap breaks out of any narrower text sections so the full
     12-column dispatch table is visible on desktop without horizontal scroll. */
  .card:has(.sheet-wrap){max-width:none}
  .panel{display:none;animation:fade .25s var(--ease)}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- Cards ---- */
  .card{
    background:var(--bg-elev);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .card>h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);font-weight:600;margin-bottom:12px;font-family:var(--body)}
  .card.crit{border-color:color-mix(in oklab,var(--red) 45%,transparent);background:linear-gradient(var(--red-bg),var(--bg-elev) 70%)}
  .card.warn{border-color:color-mix(in oklab,var(--amber) 42%,transparent);background:linear-gradient(var(--amber-bg),var(--bg-elev) 70%)}

  .kpi{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .kpi.sm{font-size:22px}
  .kpi-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* ---- Estimate flag ---- */
  .est{
    display:inline-flex;align-items:center;gap:3px;vertical-align:super;
    font:600 9px/1 var(--body);letter-spacing:.05em;
    color:var(--yellow);background:var(--yellow-bg);
    border:1px solid color-mix(in oklab,var(--yellow) 35%,transparent);
    padding:2px 4px;border-radius:3px;margin-left:5px;cursor:help;text-transform:uppercase;
  }
  .legend{font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .legend b{color:var(--yellow);font-weight:600}

  /* ---- Bars / rows ---- */
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .row-l{min-width:0;flex:1}
  .row-t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-s{font-size:11px;color:var(--text-faint);margin-top:2px}
  .row-v{font-family:var(--mono);font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
  .bar{height:4px;border-radius:2px;background:var(--bg-inset);overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}

  .chip{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.05em;padding:4px 7px;border-radius:4px;text-transform:uppercase}
  .chip.g{color:var(--green);background:var(--green-bg)}
  .chip.y{color:var(--yellow);background:var(--yellow-bg)}
  .chip.a{color:var(--amber);background:var(--amber-bg)}
  .chip.r{color:var(--red);background:var(--red-bg)}
  .chip.b{color:var(--blue);background:var(--blue-bg)}

  /* v2.1.34: Today P&L board — one scannable card, not a trophy chip. */
  .pnl-board{padding:12px 14px;margin-bottom:12px}
  .pnl-board .pnl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .pnl-board .pnl-title{font:700 16px/1.2 var(--display);letter-spacing:-.01em}
  .pnl-board .pnl-lede{font:400 11.5px/1.45 var(--body);color:var(--text-faint);margin:0 0 10px;max-width:46em}
  .pnl-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 18px}
  .pnl-col-h{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
    padding:0 0 7px;margin:0 0 4px;border-bottom:1px solid var(--border)}
  .pnl-col-h b{color:var(--text);font:700 12px/1.2 var(--display);letter-spacing:0;text-transform:none;display:block;margin-top:3px}
  .pnl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;line-height:1.25}
  .pnl-row .pnl-lab{color:var(--text-muted);min-width:0}
  .pnl-row .pnl-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pnl-row .pnl-amt .chip{font-size:8.5px;padding:3px 5px;letter-spacing:.04em}
  .pnl-row.tot{border-top:1px solid var(--border);margin-top:4px;padding-top:8px;font-weight:700}
  .pnl-row.tot .pnl-lab{color:var(--text)}
  .pnl-row.net{border-top:1px dashed var(--border-strong);padding-top:8px;margin-top:2px}
  .pnl-row.net .pnl-lab{font-size:13px}
  .pnl-row.net-full{border-top:none;padding-top:4px;margin-top:0;font-weight:500;font-size:12px}
  .pnl-row.net-full .pnl-lab{color:var(--text-muted);font-weight:500}
  .pnl-row .pnl-hint{display:block;font:400 10px/1.25 var(--body);color:var(--text-faint);text-transform:none;letter-spacing:0;margin-top:1px}
  .pnl-foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
  .pnl-drv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:3px 0;font-size:12.5px}
  .pnl-drv .n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
  .pnl-drv .hrs{color:var(--text-faint);font-family:var(--mono);font-size:11px;margin-left:6px}
  @media (max-width:720px){
    .pnl-cols{grid-template-columns:1fr 1fr;gap:14px 16px}
    .pnl-col-wtd{grid-column:1 / -1}
  }
  @media (max-width:520px){
    .pnl-board{padding:12px 12px}
    .pnl-cols{grid-template-columns:1fr;gap:16px}
    .pnl-col-wtd{grid-column:auto}
    .pnl-row{font-size:14px;padding:6px 0}
    .pnl-row .pnl-amt .chip{font-size:9px}
  }

  /* ---- Forms ---- */
  label{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:5px}
  input,select,textarea{
    width:100%;background:var(--bg-inset);color:var(--text);
    border:1px solid var(--border-strong);border-radius:var(--radius);
    padding:11px 12px;font:500 16px/1.2 var(--body);
  }
  input.num-in,input[type=number]{font-family:var(--mono)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring)}
  .fld{margin-bottom:13px}
  .fld2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .fld3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .hint{font-size:11px;color:var(--text-faint);margin-top:5px;line-height:1.45}
  button.act{
    appearance:none;width:100%;border:0;border-radius:var(--radius);
    background:var(--accent);color:var(--accent-fg);
    font:700 15px/1 var(--body);padding:15px;cursor:pointer;
    transition:filter var(--dur) var(--ease);
  }
  button.act:active{filter:brightness(.88)}
  button.act.ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong);font-weight:600}
  button.act.danger{background:transparent;color:var(--red);border:1px solid color-mix(in oklab,var(--red) 45%,transparent)}
  .btn-row{display:grid;gap:9px;margin-top:4px}

  .seg{display:grid;grid-auto-flow:column;gap:3px;background:var(--bg-inset);padding:3px;border-radius:var(--radius)}
  .seg button{appearance:none;border:0;background:transparent;color:var(--text-muted);font:600 12px/1 var(--body);padding:9px 6px;border-radius:4px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

  /* ---- Verdict ---- */
  .verdict{border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;border:1px solid}
  .verdict.accept{background:var(--green-bg);border-color:color-mix(in oklab,var(--green) 55%,transparent)}
  .verdict.market{background:var(--green-bg);border-color:color-mix(in oklab,var(--green) 40%,transparent)}
  .verdict.reneg{background:var(--yellow-bg);border-color:color-mix(in oklab,var(--yellow) 55%,transparent)}
  .verdict.reject{background:var(--red-bg);border-color:color-mix(in oklab,var(--red) 55%,transparent)}
  .verdict-t{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em}
  .verdict.accept .verdict-t,.verdict.market .verdict-t{color:var(--green)}
  .verdict.reneg .verdict-t{color:var(--yellow)}
  .verdict.reject .verdict-t{color:var(--red)}
  .verdict-s{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.5}

  .banner{border-radius:var(--radius-lg);padding:15px;margin-bottom:14px;border:1px solid;font-size:13.5px;line-height:1.5}
  .banner.amber{background:var(--amber-bg);border-color:color-mix(in oklab,var(--amber) 55%,transparent);color:#f3c7ae}
  .banner.amber b{color:var(--amber);display:block;font-family:var(--display);font-size:16px;margin-bottom:5px}
  .banner.red{background:var(--red-bg);border-color:color-mix(in oklab,var(--red) 55%,transparent);color:#f0c4c4}
  .banner.red b{color:var(--red);display:block;font-family:var(--display);font-size:16px;margin-bottom:5px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
  td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:top}
  td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px}

  .empty{text-align:center;color:var(--text-faint);font-size:13px;padding:26px 12px;line-height:1.6}
  .toast{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);font:700 13px/1 var(--body);padding:12px 18px;border-radius:22px;box-shadow:var(--shadow-lg);z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
  /* ---- Verizon-ready tag (v1.2) ---- */
  .vz{
    display:inline-flex;align-items:center;gap:3px;
    font:600 9px/1 var(--body);letter-spacing:.05em;text-transform:none;
    color:var(--blue);background:var(--blue-bg);
    border:1px solid color-mix(in oklab,var(--blue) 38%,transparent);
    padding:3px 5px;border-radius:3px;margin-left:6px;cursor:help;vertical-align:middle;
  }

  /* ---- Day rollup table (v1.2) ---- */
  .dr-tbl{font-size:12px}
  .dr-tbl th{padding:6px 4px}
  .dr-tbl td{padding:5px 4px;vertical-align:middle}
  .dr-tbl input,.dr-tbl select{padding:7px 6px;font:500 14px/1.2 var(--body);border-radius:4px}
  .dr-tbl input[type=number]{font-family:var(--mono);text-align:right}
  .dr-tbl .del{
    appearance:none;border:1px solid color-mix(in oklab,var(--red) 45%,transparent);
    background:transparent;color:var(--red);border-radius:4px;
    font:700 13px/1 var(--body);padding:8px 9px;cursor:pointer;
  }
  /* ================================================================
     DISPATCH SHEET MIRROR (v1.3, polished v2.1.30)
     The day rollup is laid out to look like the 2026 FCT Dispatch Log
     itself — orange date banner, D.P. LATHROP / D.P. RIPON section
     banners, same column order — with three economics columns bolted on
     the right. Phone uses the same grouping in a compact scan; desktop
     keeps the full wide table.
     ================================================================ */
  .sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
  /* v2.0.8: table-layout:fixed + explicit col widths in colgroup — was table-layout:auto
     which resized columns per-day to widest content, so switching days shifted every
     column and the horizontal scroll landed on different cells day-to-day. min-width
     bumped to cover the col-width sum so cols always take their explicit sizes when the
     viewport is narrower than the table. */
  table.sheet{width:100%;min-width:1890px;border-collapse:separate;border-spacing:0;font-size:11.5px;table-layout:fixed}
  table.sheet th{
    position:sticky;top:0;z-index:3;
    background:var(--bg-inset);color:var(--text-muted);
    font:600 9.5px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;
    padding:6px;border-bottom:1px solid var(--border-strong);white-space:nowrap;text-align:left;
  }
  table.sheet th.n,table.sheet td.n{text-align:right}
  table.sheet td{padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  table.sheet td.money{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  /* keep the Time column pinned — it is the operator's row anchor on a phone */
  table.sheet td.c-time,table.sheet th.c-time{
    position:sticky;left:0;z-index:2;background:var(--bg-elev);
    box-shadow:1px 0 0 var(--border);font-family:var(--mono);font-size:11px;
  }
  table.sheet th.c-time{z-index:4;background:var(--bg-inset)}

  /* --- banner rows (Excel date / D.P. LATHROP / D.P. RIPON fills) --- */
  tr.bnr td{
    font:700 12.5px/1.2 var(--display);letter-spacing:.06em;
    padding:8px 12px;border-bottom:1px solid var(--border-strong);
    text-transform:uppercase;
  }
  tr.bnr-date td{background:#c45a12;color:#fff8ee}
  tr.bnr-lath td{background:#1f4e79;color:#e8f2fc}
  tr.bnr-ripo td{background:#375623;color:#eaf6e4}
  tr.bnr-other td{background:var(--bg-inset);color:var(--text-muted)}
  tr.bnr td .bnr-n{float:right;font-family:var(--mono);font-weight:700;opacity:.85;letter-spacing:0;text-transform:none}
  tr.bnr.sticky-date td{position:sticky;top:26px;z-index:2}
  /* --- v1.7 preload split ---
     Section 2 (tomorrow's preloads, prepped today PM) and the PRELOADED block
     at the top of a day that was prepped the afternoon before. Both are blue,
     the colour the 🔒 chip already uses for "this was settled yesterday", so
     the banner and the chips on the rows under it read as one idea. Section 2
     is separated by a heavier rule because it is a different DAY's money, not
     just a different delivery point. */
  tr.bnr-pre td{background:linear-gradient(90deg,#1b3550,#12233a);color:#a9c9ef;
    border-top:3px solid color-mix(in oklab,var(--blue) 55%,transparent)}
  tr.bnr-lock td{background:color-mix(in oklab,var(--blue) 16%,var(--bg-inset));color:#a9c9ef}
  tr.bnr td .bnr-sub{display:block;font:400 10.5px/1.4 var(--body);letter-spacing:0;
    text-transform:none;opacity:.8;margin-top:3px}
  /* A Section-2 row is real work, but not today's money. Muting the money cells
     alone (not the whole row) says exactly that: the dispatch detail is live,
     the dollars belong to another day. */
  tr.pre-row td{background:color-mix(in oklab,var(--blue) 4%,transparent)}
  tr.pre-row td.money{opacity:.5;font-style:italic}
  tr.pre-row td.c-time{border-left-color:var(--blue)!important}

  /* --- status styling, mirroring how the sheet reads --- */
  td.st-pre{background:color-mix(in oklab,var(--yellow) 22%,transparent);color:#f0dcae;font-weight:600}
  td.st-del{color:var(--text-faint)}
  tr.row-del td:not(.money):not(.c-time){color:var(--text-faint)}

  /* --- bucket stripe on the left edge of each load row --- */
  td.c-time{border-left:3px solid transparent}
  tr.bk-diamond  td.c-time{border-left-color:var(--amber)}
  tr.bk-steady   td.c-time{border-left-color:var(--accent)}
  tr.bk-seasonal td.c-time{border-left-color:var(--purple)}
  tr.bk-spot     td.c-time{border-left-color:var(--blue)}

  /* --- day totals row --- */
  tr.sheet-tot td{
    background:var(--bg-inset);border-top:2px solid var(--border-strong);border-bottom:0;
    font-weight:700;padding:10px 6px;
  }
  tr.sheet-tot td.money{font-family:var(--mono)}
  tr.sheet-sub td{background:color-mix(in oklab,var(--bg-inset) 60%,transparent);color:var(--text-muted);
    font-size:11px;padding:5px 6px;border-bottom:1px solid var(--border)}

  /* Economics bolted on the right — same sheet, not the hero columns */
  table.sheet th.c-rev,table.sheet th.c-var,table.sheet th.c-cm,
  table.sheet td.c-rev,table.sheet td.c-var,table.sheet td.c-cm{
    background:color-mix(in oklab,var(--bg-inset) 70%,transparent);
  }
  table.sheet th.c-rev,table.sheet td.c-rev{
    border-left:2px solid color-mix(in oklab,var(--yellow) 40%,var(--border-strong));
  }
  table.sheet td.c-cm{font-weight:700}
  .sheet-meta{display:none}
  .drv-sec{color:var(--text-muted);font-weight:500}

  /* Trailer status lives UNDER the sheet (v2.1.30). Collapsed by default so
     the Excel date + LATHROP/RIPON blocks are what you scan first. Summary
     still shows the counts. */
  details.trl-fold>summary{
    cursor:pointer;list-style:none;display:flex;align-items:baseline;
    justify-content:space-between;gap:10px;flex-wrap:wrap;
    font:600 12px/1.3 var(--body);letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-muted);
  }
  details.trl-fold>summary::-webkit-details-marker{display:none}
  details.trl-fold>summary::before{
    content:'▸';display:inline-block;margin-right:6px;color:var(--text-faint);
    font-size:11px;letter-spacing:0;text-transform:none;
  }
  details.trl-fold[open]>summary::before{content:'▾'}
  details.trl-fold>summary .trl-sum-n{
    font:500 11px/1.4 var(--body);letter-spacing:0;text-transform:none;color:var(--text-faint);
  }
  details.trl-fold .trl-body{margin-top:10px}

  /* inline edit inputs that sit flush in a sheet cell */
  table.sheet input.cell,table.sheet select.cell{
    width:100%;min-width:66px;background:transparent;border:1px solid var(--border);
    border-radius:3px;padding:4px 5px;font:500 12px/1.2 var(--mono);text-align:right;color:var(--text);
  }
  table.sheet select.cell{font-family:var(--body);text-align:left;min-width:92px}
  table.sheet input.cell:focus,table.sheet select.cell:focus{border-color:var(--accent);box-shadow:none}

  /* --- v1.4 dispatch rule chips (origin cutoff, pre-6am lock, equipment) --- */
  .rchips{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:3px}
  .rchip{display:inline-block;font:700 9px/1 var(--body);letter-spacing:.03em;padding:3px 5px;
    border-radius:3px;white-space:nowrap;cursor:help}
  .rchip.r{color:var(--red);background:var(--red-bg)}
  .rchip.a{color:var(--amber);background:var(--amber-bg)}
  .rchip.y{color:var(--yellow);background:var(--yellow-bg)}
  .rchip.b{color:var(--blue);background:var(--blue-bg)}

  /* --- v1.8 "actionable now" strip ---
     Sits above the day picker, so it has to earn its height: one row of
     chips, and the detail only appears once a chip is tapped. The quiet
     state is a single green line rather than an empty box, because "there
     is nothing wrong" is itself the answer the strip exists to give. */
  .alert-strip{padding:9px 12px;margin-bottom:10px}
  .alert-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .al-lab{font:700 9px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-faint);flex:0 0 auto;margin-right:1px}
  .al-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    padding:5px 9px;border-radius:5px;font:600 11.5px/1.15 var(--body);
    border:1px solid transparent;white-space:nowrap;max-width:100%}
  .al-chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .al-chip.r{color:var(--red);background:var(--red-bg);border-color:color-mix(in oklab,var(--red) 32%,transparent)}
  .al-chip.a{color:var(--amber);background:var(--amber-bg);border-color:color-mix(in oklab,var(--amber) 32%,transparent)}
  .al-chip.b{color:var(--blue);background:var(--blue-bg);border-color:color-mix(in oklab,var(--blue) 32%,transparent)}
  .al-chip[aria-expanded="true"]{border-style:solid;border-width:1px;filter:brightness(1.16)}
  .al-quiet{display:flex;align-items:center;gap:8px;font:600 12px/1.2 var(--body);color:var(--green)}
  .al-quiet span{font-weight:400;font-size:11px;color:var(--text-faint)}
  .al-detail{margin-top:9px;padding:9px 11px;border-radius:0 4px 4px 0;
    font:400 11.5px/1.55 var(--body);color:var(--text-muted);background:var(--bg-inset)}
  .al-detail.r{border-left:2px solid var(--red)}
  .al-detail.a{border-left:2px solid var(--amber)}
  .al-detail.b{border-left:2px solid var(--blue)}
  .al-act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .al-act button{all:unset;cursor:pointer;padding:4px 9px;border-radius:4px;
    border:1px solid var(--border-strong);font:600 10.5px/1.3 var(--body);color:var(--text-muted)}

  /* The flash a row gets when an alert jumps to it. Deliberately a long,
     slow fade — a quick blink is easy to miss on a 40-row sheet, and the
     point is to find the row, not to decorate it. */
  @keyframes fctRowFlash{
    0%,55%{background:color-mix(in oklab,var(--accent) 34%,transparent)}
    100%{background:transparent}
  }
  tr.row-flash>td{animation:fctRowFlash 2.4s ease-out 1}

  /* --- v1.4 suggested driver --- */
  table.sheet td.c-sug{max-width:150px}
  .sug-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    padding:3px 5px;border-radius:4px;border:1px dashed var(--border-strong);
    font:600 11px/1.2 var(--body);color:var(--text-muted)}

  /* --- v1.8 SMS dispatch stub ---
     Sits under the suggestion it would text. The disabled state keeps its
     border so the control is legibly PRESENT-but-off rather than looking
     like a rendering failure — the tooltip carries the reason. */
  .sms-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
    margin-top:4px;padding:3px 6px;border-radius:4px;border:1px solid var(--border-strong);
    font:600 10px/1.2 var(--body);color:var(--accent);white-space:nowrap}
  .sms-btn.off{cursor:not-allowed;color:var(--text-faint);opacity:.62;border-style:dotted}
  .sug-btn:hover{border-color:var(--accent);color:var(--text)}
  .sug-pill{font:700 8px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;
    padding:2px 4px;border-radius:3px;color:var(--accent);background:var(--accent-soft)}
  .sug-pill.q{color:var(--text-faint);background:var(--bg-inset)}
  .sug-pop{position:fixed;z-index:9000;background:var(--bg-elev);border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);box-shadow:0 10px 28px rgba(0,0,0,.55);padding:8px;font-size:12px}
  .sug-pop-h{font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-faint);padding:2px 4px 7px}
  .sug-opt{all:unset;cursor:pointer;display:block;width:calc(100% - 12px);padding:6px;border-radius:5px}
  .sug-opt:hover{background:var(--bg-inset)}
  .sug-opt-n{display:block;font:700 12.5px/1.3 var(--body);color:var(--text)}
  .sug-opt-w{display:block;font:400 10.5px/1.35 var(--body);color:var(--text-muted);margin-top:2px}
  .sug-pop-f{font:400 10px/1.35 var(--body);color:var(--text-faint);padding:7px 4px 2px;
    border-top:1px solid var(--border);margin-top:5px}

  /* --- v1.5 Verizon actual columns ---
     Tinted as a block so the measured half of the sheet reads as a different
     kind of number from the modelled half, without a second table. */
  table.sheet th.vz-h{background:color-mix(in oklab,var(--blue) 14%,var(--bg-inset));color:var(--blue)}
  table.sheet td.dr-ahr,table.sheet td.dr-ami,
  table.sheet td.dr-avar,table.sheet td.dr-acm,
  table.sheet td.vz-none{background:color-mix(in oklab,var(--blue) 5%,transparent)}
  table.sheet td.vz-none{text-align:center;color:var(--text-faint);font-weight:700;cursor:help}

  /* v2.1.30 phone scan: same date → LATHROP / RIPON sheet, without a 1890px
     horizontal hunt. Time, Driver, Origin, Status stay on screen; PO / FB /
     commodity / truck fold onto a second line; contribution stays bolted on
     the right. Desktop keeps the full wide table. */
  @media (max-width:860px){
    .sheet-card{padding:10px 8px 12px}
    .sheet-wrap{overflow-x:visible;margin:0 -4px;padding:0}
    table.sheet{
      min-width:0;width:100%;table-layout:auto;font-size:12px;
      display:block;
    }
    table.sheet colgroup{display:none}
    table.sheet thead,table.sheet tbody{display:block;width:100%}
    table.sheet thead tr{
      display:grid;
      grid-template-columns:3.5rem minmax(0,1fr) minmax(3.6rem,.7fr) auto 3.4rem;
      grid-template-areas:"time drv orig st money";
      gap:0 6px;align-items:end;
      padding:4px 6px 4px 0;
      border-bottom:1px solid var(--border-strong);
    }
    table.sheet thead th{position:static;padding:4px 2px;white-space:normal}
    table.sheet thead th.c-time{grid-area:time}
    table.sheet thead th.c-drv{grid-area:drv}
    table.sheet thead th.c-orig{grid-area:orig}
    table.sheet thead th.c-st{grid-area:st;text-align:right}
    table.sheet thead th.c-cm{grid-area:money;text-align:right;border-left:0;background:transparent;font-size:8.5px}
    table.sheet thead th.c-po,
    table.sheet thead th.c-fb,
    table.sheet thead th.c-comm,
    table.sheet thead th.c-truck,
    table.sheet thead th.c-sug,
    table.sheet thead th.c-rev,
    table.sheet thead th.c-var,
    table.sheet thead th.vz-h{display:none}
    table.sheet tr.bnr{display:block;width:100%}
    table.sheet tr.bnr td{
      display:flex;width:100%;box-sizing:border-box;
      justify-content:space-between;align-items:baseline;gap:10px;
      white-space:normal;padding:8px 10px;letter-spacing:.05em;
    }
    table.sheet tr.bnr td .bnr-n{float:none;flex:0 0 auto}
    table.sheet tr.bnr.sticky-date td{top:0}
    table.sheet tr.sheet-load{
      display:grid;
      grid-template-columns:3.5rem minmax(0,1fr) minmax(3.6rem,.7fr) auto 3.4rem;
      grid-template-areas:"time drv orig st money";
      column-gap:6px;
      padding:5px 6px 6px 0;align-items:start;
      border-bottom:1px solid var(--border);
      width:100%;box-sizing:border-box;
    }
    table.sheet tr.sheet-load td{
      white-space:normal;overflow:hidden;padding:1px 2px;border-bottom:0;
    }
    table.sheet tr.sheet-load td.c-time{
      grid-area:time;position:static;box-shadow:none;
      font-size:11px;padding:1px 4px 1px 8px;white-space:nowrap;
      background:var(--bg-elev);
    }
    table.sheet tr.sheet-load td.c-drv{grid-area:drv;font-weight:600;min-width:0}
    table.sheet tr.sheet-load td.c-orig{grid-area:orig;min-width:0;white-space:nowrap;text-overflow:ellipsis}
    table.sheet tr.sheet-load td.c-st{grid-area:st;text-align:right;font-size:11px}
    table.sheet tr.sheet-load td.c-cm{
      grid-area:money;text-align:right;font-size:11px;border-left:0;
      background:transparent;padding-top:1px;
    }
    table.sheet tr.sheet-load .sheet-meta{
      display:block;font:400 10px/1.3 var(--body);color:var(--text-faint);
      font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      margin-top:1px;
    }
    table.sheet tr.sheet-load td.c-po,
    table.sheet tr.sheet-load td.c-fb,
    table.sheet tr.sheet-load td.c-comm,
    table.sheet tr.sheet-load td.c-truck,
    table.sheet tr.sheet-load td.c-sug,
    table.sheet tr.sheet-load td.c-rev,
    table.sheet tr.sheet-load td.c-var,
    table.sheet tr.sheet-load td.dr-ahr,
    table.sheet tr.sheet-load td.dr-ami,
    table.sheet tr.sheet-load td.dr-avar,
    table.sheet tr.sheet-load td.dr-acm,
    table.sheet tr.sheet-load td.vz-none{display:none}
    table.sheet.editing tr.sheet-load td.c-rev,
    table.sheet.editing tr.sheet-load td.c-var{display:block;grid-column:2 / -1}
    .drv-pri{display:inline}
    .drv-sec{display:inline;font-size:10.5px}
    table.sheet tr.sheet-tot,
    table.sheet tr.sheet-sub{
      display:block;width:100%;padding:8px 10px;box-sizing:border-box;
    }
    table.sheet tr.sheet-tot td,
    table.sheet tr.sheet-sub td{
      display:inline;border:0;padding:0 8px 0 0;white-space:normal;
      background:transparent;
    }
    .rchips{flex-direction:row;flex-wrap:wrap;gap:3px;margin-top:2px}

    /* v2.1.31 Queue board: same Time / Driver / Origin / Status scan as Today,
       with Dest folded into the driver meta line and Send dispatch kept on
       the row (Today hides the suggested-driver cell on phone). */
    table.sheet.sheet-queue{min-width:0;width:100%}
    table.sheet.sheet-queue thead tr{
      grid-template-columns:3.5rem minmax(0,1fr) minmax(3.6rem,.7fr) auto;
      grid-template-areas:"time drv orig st";
    }
    table.sheet.sheet-queue thead th.c-act,
    table.sheet.sheet-queue thead th.c-dest,
    table.sheet.sheet-queue thead th.c-comm,
    table.sheet.sheet-queue thead th.c-po{display:none}
    table.sheet.sheet-queue tr.sheet-load{
      grid-template-columns:3.5rem minmax(0,1fr) minmax(3.6rem,.7fr) auto;
      grid-template-areas:"time drv orig st";
    }
    table.sheet.sheet-queue tr.sheet-load.q-open{
      grid-template-areas:
        "time drv orig st"
        "act  act  act  act";
    }
    table.sheet.sheet-queue tr.sheet-load td.c-dest{display:none}
    table.sheet.sheet-queue tr.sheet-load td.c-act{
      display:none;grid-area:act;padding-top:6px;white-space:normal;
    }
    table.sheet.sheet-queue tr.sheet-load.q-open td.c-act{display:block}
    table.sheet.sheet-queue .q-act{
      flex-direction:row;align-items:stretch;min-width:0;width:100%;
    }
    table.sheet.sheet-queue .q-pick{flex:1 1 auto;min-width:0;padding:8px 8px}
    table.sheet.sheet-queue .q-send{flex:0 0 auto;padding:10px 12px;white-space:nowrap}
    table.sheet.sheet-queue .q-why{display:none}

    /* v2.1.32: tomorrow's preload banner + rows stay in the compact scan.
       Do not hide bnr-pre / pre-row — those are this afternoon's dispatch work. */
    table.sheet tr.bnr-pre{display:block !important;width:100%}
    table.sheet tr.bnr-pre td{
      display:flex !important;flex-wrap:wrap;width:100%;box-sizing:border-box;
    }
    table.sheet tr.bnr-pre td .bnr-sub{flex:1 0 100%;display:block}
    table.sheet tr.sheet-load.pre-row{display:grid !important}
    table.sheet.sheet-queue tbody#qPreSection{display:block;width:100%}
    table.sheet.sheet-queue tr.sheet-load.pre-row.q-open td.c-act{display:block}
    #qPreSection{scroll-margin-top:72px;scroll-margin-bottom:96px}
  }

  /* --- v1.4 queue --- */
  .q-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
  .q-row:last-child{border-bottom:0}
  .q-main{flex:1 1 auto;min-width:0}
  .q-t{font:700 13.5px/1.25 var(--body);color:var(--text)}
  .q-s{font:400 11px/1.4 var(--body);color:var(--text-muted);margin-top:3px}
  .q-act{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:128px}
  .q-pick{width:100%;padding:6px 7px;font:500 12px/1.2 var(--body)}
  .q-send{all:unset;cursor:pointer;text-align:center;padding:7px 10px;border-radius:6px;
    background:var(--accent);color:var(--accent-fg);font:700 11px/1 var(--body);letter-spacing:.04em;text-transform:uppercase}
  .q-send:hover{filter:brightness(1.08)}
  .q-sum{font:500 12.5px/1.4 var(--body);color:var(--text-muted);margin:-4px 0 12px}
  .q-sum b{color:var(--text);font-weight:700}
  .q-sum .q-open-n{color:var(--amber)}
  /* v2.1.32: tomorrow-preload chip under the open/assigned line. Mirrors
     Today's jump to #preSection so James can land on Section 2 without
     scrolling past the whole day. */
  .q-pre-jump{
    margin:-2px 0 12px;padding:9px 11px;border-radius:6px;
    background:color-mix(in oklab,var(--blue) 16%,var(--bg-inset));
    border:1px solid color-mix(in oklab,var(--blue) 42%,transparent);
    color:#a9c9ef;font:500 12.5px/1.4 var(--body);
  }
  .q-pre-jump a{color:inherit;text-decoration:none;display:block}
  .q-pre-jump a .q-pre-go{text-decoration:underline dotted}
  .q-pre-jump.q-pre-quiet{
    background:var(--bg-inset);border-color:var(--border);color:var(--text-muted);
  }
  #qPreSection{scroll-margin-top:72px;scroll-margin-bottom:96px}
  .q-locked{font:600 10.5px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint)}
  .q-why{font:400 10px/1.35 var(--body);color:var(--text-muted);margin-top:4px}
  /* Queue board is the Excel sheet minus money / Verizon / suggested-driver.
     Desktop is a wide sheet; phone compact rules in the 860px query above
     must win this min-width (two classes beat table.sheet { min-width:0 }). */
  @media (min-width:861px){
    table.sheet.sheet-queue{min-width:1120px}
  }
  table.sheet.sheet-queue td.c-act{white-space:normal;vertical-align:top;min-width:148px}
  table.sheet.sheet-queue td.c-dest{max-width:160px;overflow:hidden;text-overflow:ellipsis}
  tr.q-done td{opacity:.55}
  tr.q-set td.c-drv{font-weight:600}
  .drv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .drv-n{flex:1 1 150px;min-width:0}
  .drv-o{font:400 10.5px/1.4 var(--mono);color:var(--text-faint);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* --- v1.8 Company Info tab ---
     Long reference page, so the job of this styling is purely to keep the
     eye's place: a rule between customers, a labelled band per shift group,
     and a quiet divider between sub-lists inside one card. */
  .info-rate{padding:12px 0;border-bottom:1px solid var(--border)}
  .info-rate:last-of-type{border-bottom:0;padding-bottom:2px}
  .info-rate-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .info-rate-h b{font:700 14px/1.25 var(--display)}
  .info-alt{font:400 10.5px/1.3 var(--mono);color:var(--text-faint);cursor:help}
  .info-note{font:400 11px/1.5 var(--body);color:var(--text-faint);margin-top:2px}

  .info-grp{margin-bottom:16px}
  .info-grp-h{display:flex;align-items:baseline;gap:9px;
    font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);padding:8px 10px;border-radius:4px 4px 0 0;background:var(--accent-soft)}
  .info-grp-h span{font:400 10px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--text-muted)}
  .info-grp-h b{margin-left:auto;font-family:var(--mono);color:var(--text-muted)}
  .info-grp-note{font:400 10.5px/1.5 var(--body);color:var(--text-faint);
    padding:7px 10px;background:var(--bg-inset);border-radius:0 0 4px 4px;margin-bottom:4px}
  .info-sep{font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);margin:16px 0 7px;padding-top:11px;border-top:1px solid var(--border)}

  /* --- running totals strip --- */

<script>
"use strict";
/* =============================================================
   FCT LOAD PROFITABILITY CALCULATOR v1.8
   Version: 2026-07-31-fct-calc-v1.8.36-preload-clears-on-delivered

   WHAT CHANGED IN v1.8 (company info + actionable landing, 2026-07-28)
   -------------------------------------------------------------
   Four additions, one build.

   1. REAL PER-CUSTOMER RATES. v1.2 shipped a blended tier default
      and five hand-entered FSC rules. v1.8 replaces both with the
      last-90-day averages off QBO invoicing, one row per customer,
      in CUSTOMER_RATE_DEFAULTS. That constant is the literal shape
      of the pull; defaultCustomerRates() translates it into the
      schema the engine already speaks (fscMethod ids from
      FSC_METHODS, revenuePerLoad as the per-customer override), so
      the new numbers actually drive pricing rather than sitting on
      screen as decoration.

      TWO THINGS TO KNOW ABOUT THIS DATA:

      a) American River Ag REVERSES a verified value. v1.2 recorded
         "does not bill a fuel surcharge", marked verified from the
         2026-07-27 invoicing pull. The 2026-07-28 90-day pull says
         20%. The newer pull wins and the older claim is kept in
         `supersedes` so the reversal is visible rather than silently
         overwritten. Worth a human confirming which is right.

      b) Harris Ranch bills FSC baked into the linehaul, so its
         method is 'none' — NOT because it charges no fuel, but
         because $1,100 already contains it. Modelling it as a
         percent on top would double-count. `fscIncluded` carries
         the distinction that the method id cannot.

   2. INFO TAB. A new bottom-nav tab holding the reference material
      that was previously only in James's head or in a memory file:
      rate cards, the driver roster grouped by shift, office/admin
      pay, key contacts, the fleet, the operating rules, and the
      company overview. Rate cards and contacts are editable and
      persist; everything else is a read-only view onto constants
      that already existed.

      The roster groups are rendered FROM DRIVER_SHIFTS rather than
      from a second hand-typed list, so the Info page cannot drift
      out of step with the engine that ranks suggestions. See
      SHIFT_GROUPS for the one place the v1.8 spec and that constant
      disagree — Jesus Estrada vs Jesus Flores — which is surfaced
      on screen as a question rather than resolved by guessing.

   3. ACTIONABLE-NOW STRIP. The landing page keeps the dispatch
      sheet, but gains a compact alert strip above the day picker:
      origin-cutoff breaches, unassigned loads, Verizon-measured
      detention, tomorrow's preload shortfall, and AR 91+. Each
      alert scrolls to and flashes the rows it is about, so it is a
      control rather than a notice. Silent — "all quiet" — when
      nothing qualifies, which on a normal day is the common case.

      Every alert reads the SAME predicates the sheet already draws
      chips from (cutoffState, isUnassigned, verizonFor,
      tomorrowPreloadPlan), so the strip and the rows under it can
      never disagree about what is wrong.

   4. SMS DISPATCH STUBS (Phase 3.2 groundwork). UI only: a "Send
      dispatch" button on every unassigned Section-1 row, a Twilio
      config block and a 24-driver phone table in Settings. With no
      config the buttons are disabled and say why. With config they
      enable and log the composed message — they do NOT call Twilio.
      That call lands in Phase 3.2.

      ON STORING THE AUTH TOKEN: this is a static page and its state
      lives in localStorage. There is no key store to encrypt
      against — any key would have to sit next to the ciphertext,
      which is obfuscation, not encryption. So the token is stored
      in the clear like the rest of state, the field is masked
      against shoulder-surfing only, and the card says so plainly.
      Use a scoped Twilio API key, never the account auth token.

   Migration: v1.7 -> v1.8 preserves everything — day snapshots,
   customer rate overrides, roster edits, lane calibration, history.
   Two new state slots (companyInfo, sms) land from their defaults
   and merge saved edits over them the same way customerRates does.

   WHAT CHANGED IN v1.7 (operational preload split, 2026-07-28)
   -------------------------------------------------------------
   Up to v1.6 a day view showed exactly the loads carrying that
   day's date banner. That is the right answer for the P&L and the
   WRONG answer for the dispatcher, because FCT physically preloads
   tomorrow's pre-6am work TODAY in the afternoon — the origins
   close at 4–6pm, so anything scheduled before tomorrow 6am has to
   be on a trailer tonight. Those loads were consuming today's
   afternoon crew while appearing only on tomorrow's screen.

   v1.7 renders every day as TWO sections.

   1. SECTION 1 — TODAY'S LOADS. The v1.6 dispatch sheet, unchanged:
      every load with the current-day banner, full P&L, and the day
      totals built on exactly these rows.

   2. SECTION 2 — TOMORROW'S PRELOADS. The next day's 00:00–06:00
      loads, pulled forward and shown under Section 1 with a
      🔜 chip naming the day they actually deliver. They are the
      work today's PM crew is doing.

   3. REVENUE ATTRIBUTION IS LOCKED TO THE DATE BANNER. A load's
      revenue belongs to the day it delivers, which is the day of
      its banner, up to the midnight boundary — 11:59pm Jul 27 is
      Jul 27 revenue, 12:00am Jul 28 is Jul 28 revenue. No load
      straddles days. So Section 2 contributes NOTHING to today's
      revenue, variable or contribution; its placement on today's
      screen is operational, not financial. The Day P&L card says
      so in a footnote rather than leaving it to be inferred.

   4. DRIVER-HOURS DO CROSS THE BOUNDARY. Preload prep is real work
      done today, so Section 2 counts against TODAY's driver-hour
      capacity at the 2.5 hr preload heuristic while Section 1
      counts at each load's own modelled hours. The new driver-hour
      card states both halves and the utilisation against the

   WHAT CHANGED IN v1.6 (worker auto-fetch, 2026-07-27)
   -------------------------------------------------------------
   Up to v1.5 the dispatch log arrived by hand: open the calc,
   find the xlsx, drop it on the box. On a phone that is three
   apps and a file picker, every single morning. v1.6 removes the
   step entirely — an Office Script pushes the whole log to a
   Cloudflare Worker, and the calc pulls it on load.

   1. WORKER AS THE DEFAULT SOURCE. On boot the app GETs
        https://fct-dispatch.jamesgrunsky.workers.dev/latest
      which answers { rows:[...], ingestedAt, rowCount }. The rows
      are the dispatch sheet in object form — time / po / driver /
      origin / fb / commodity / truck / status / extra — in the
      same column order as the workbook, banner rows included. So
      they are turned back into an array-of-arrays and fed to the
      SAME walker the xlsx path uses (parseDispatchRows). One
      parser, one set of rules, two transports.

   2. SETTINGS -> DISPATCH DATA SOURCE. Three modes:
        worker  (default) — worker only
        file              — the v1.4/v1.5 drag-drop, worker never called
        hybrid            — worker first, drop zone reappears if it fails
      The worker URL itself is editable next to it.

   3. STATUS PILL + SYNC NOW. The day header carries a pill built
      off the payload's ingestedAt — "Synced 4m ago" — so the age
      of the data is on screen rather than assumed, and a 🔄
      button next to it refetches on demand.

   4. GRACEFUL DEGRADATION, THREE STATES.
        200 with rows -> green pill, fallback UI stays hidden
        404           -> amber "No dispatch data yet — click Run
                         on the Excel script"
        network error -> red "Worker offline — drop xlsx to
                         import", and the drop zone comes back
      A failed sync never touches the rows already in hand, so a
      dead worker degrades to yesterday's data plus a red pill
      rather than to an empty screen.

   5. AUTO-SYNC DOES NOT CLOBBER HAND EDITS. The boot fetch
      compares the payload's ingestedAt against the one already
      stored; if the worker has nothing newer it refreshes the
      pill and leaves the parsed rows — and therefore every
      per-row override — alone. The 🔄 button forces a re-parse.

   Everything from v1.4/v1.5 is untouched: the Verizon CSV merge,
   cutoff and preload chips, suggested driver, the four buckets,
   the day totals footer and the rate tiers all sit downstream of
   the parser and neither know nor care where the rows came from.

   WHAT CHANGED IN v1.5 (Verizon actuals, 2026-07-28)
   -------------------------------------------------------------
   Every figure in this app up to v1.4 was MODELLED: 80 miles and
   5 hours a load, from fleet averages. v1.5 lets the day be
   measured instead. Drop the Verizon Connect Daily Timecard CSV
   next to the dispatch xlsx and each load prices off the miles
   and hours the truck actually ran.

   Scope is deliberately narrow, per operator 2026-07-28: "we
   paused that project because agent wasn't understanding, so only
   use what is useful to us now." Two files in, real actuals out.
   NOT ported from the May–June work: the mailbox OAuth puller

   1. TWO-FILE DROP. The drop zone takes .xlsx and .csv, one drop
      or two, in either order. The file is sniffed by its header
      row, not its extension — a Verizon CSV routes to the
      timecard parser, anything else to the dispatch parser.

   2. TRIP CLUSTERING. The CSV is 780-odd trip LEGS a day, not
      loads. Legs are grouped per driver and cut at the yard, so a
      cluster is one yard-to-yard round trip — which is what a load
      actually is. Per Spec.md's preload insight:
          yard -> ORIGIN -> yard            = PRELOAD
          yard -> ORIGIN -> Diamond -> yard = DIRECT delivery
      A load claims the cluster off its own origin nearest its
      appointment time; each cluster can only be claimed once.

   3. ACTUAL COLUMNS. When a matched CSV is loaded the sheet grows
      Actual Hrs / Actual Mi / Actual Variable / Actual Contribution
      beside the estimated three, and the day footer carries the

      columns — the actuals are not empty cells waiting to be
      filled, they simply are not there.

   4. DETENTION + PRELOAD, MEASURED. A stop over 60 min inside a
      Diamond geofence raises a detention chip with the real dwell
      on it. A cluster that ends back at the yard without touching
      Diamond is a preload, confirmed from GPS rather than inferred
      from the clock.

   5. HONEST FALLBACK. No CSV for the day in view, or a driver the
      timecard cannot be matched to, and the row stays on estimates

   WHAT CHANGED IN v1.4 (dispatch rules + Phase 3 foundation)
   -------------------------------------------------------------
   Two related moves. (1) The operational rules already captured
   in the paused dispatch build get folded into the load list, so
   the day reads like a dispatcher reads it and not just like a

   2. PRE-6AM LOCK. Spec.md's key rule: a load delivering between

   3. BACKWARD-PLANNING BANNER. Looks at TOMORROW's block in the

   WHAT CHANGED IN v1.3 (T12M reconciliation, 2026-07-27)
   -------------------------------------------------------------
   1. UNIT ECONOMICS REBUILT AGAINST T12M ACTUALS. The v1.2 split
      double-counted driver wages (they sat in BOTH the per-hour
      variable cost AND the fixed payroll stack) and understated
      real per-load miles. The corrected model, calibrated to the
      T12M P&L:

          revenuePerLoad   $522   = $6.35M / 12,150 loads
          variableCostPerLoad $283
          fixedCostPerDay  $7,212 (rent excluded — see below)
          operatingDaysPerYear 312 (6 days/week)
          contributionPerLoad  $239
          breakevenLoadsPerDay 30.2

      Variable cost is DERIVED from five editable components, not
      typed in as a lump, so tuning any one flows through:
          fuel      80 mi x $4.50/gal / 6.0 MPG   =  $60.00
          driver     5 hr x $28.82 loaded         = $144.10
          wear      80 mi x $0.35/mi              =  $28.00
          subhauler $363,000 / 12,150 loads       =  $29.88
          other/unallocated                       =  $21.02
                                                    -------
                                                    $283.00
      The "other" line is an HONEST PLUG, not a fudge: it is the
      residual that reconciles the four modelled components to the
      $283 the T12M actually spent per load, and most of it is
      driver non-productive paid time plus tarps/wash/tow. It is
      shown and editable rather than buried inside another rate.

   2. RENT REMOVED FROM THE GO-FORWARD BASELINE. Per operator
      2026-07-27: "I'm not paying rent as of yet this year." The
      T12M carries $30,000 in 323 Rent Expense. The fixed stack
      therefore ships with the rent line PRESENT BUT SWITCHED OFF:
          with rent    $2,280,096/yr = $7,308/day
          without rent $2,250,096/yr = $7,212/day
      It is a toggle, not a deletion — if rent restarts, tick it
      back on and every downstream figure re-derives.

   3. FIXED COST IS A LINE-ITEM STACK, NOT A CONSTANT. Settings
      now shows all 13 fixed lines with an on/off switch and an
      editable amount, and recomputes fixedCostPerDay + breakeven
      loads/day live. v1.2's "trucks running x $468/truck/day"
      is retired: fixed cost does not fall because a truck sat
      idle, so scaling it by trucks running flattered slow days.
      The day rollup now carries the FULL daily fixed nut.

   4. DAY ROLLUP PRICED OFF THE T12M MODEL. Imported dispatch rows
      price at $522 revenue / $283 variable (both per-customer and
      per-row overridable) instead of rate-card linehaul + FSC,
      which modelled $422 on a 48,000 lb Diamond load and so
      understated realised revenue by ~$100/load. Day verdict is
      now an absolute-dollar test on net after full fixed cost:
          GREEN  net >  +$500
          AMBER  net within +/-$500 of breakeven
          RED    net <  -$500

   5. LANE HOURS PER DELIVERY POINT. D.P. Lathrop and D.P. Ripon
      each carry their own hours-per-load default (both 5.0 hrs),
      editable in Settings, on top of the existing four-combo
      miles table.

   WHAT CHANGED IN v1.2 (operator-driven, 2026-07-27)
   -------------------------------------------------------------
   1. FUEL SURCHARGE. v1.1 defaulted FSC to $0.30/loaded mile,
      which produced $36 on a $324.96 linehaul (11%). Actual FCT
      invoicing pulled from QBO 2026-07-27 shows Diamond Pet and
      Phil O'Connell (POC) both bill FSC as a flat 30% OF
      LINEHAUL, and Penny Newman bills $2/ton. Default is now
      percent_of_linehaul @ 30%, with per-customer overrides in
      state.customerRates and a four-method picker (percent of
      linehaul / $ per ton / $ per loaded mile / flat $) so a
      one-off broker offer with odd FSC can still be modeled.
      Sample load: 48,000 lb × $0.00677 = $324.96 linehaul,
      FSC 30% = $97.49, revenue = $422.45.

   2. TIME INPUT. "Hours on clock" + a separate "longest single
      wait" input are collapsed into ONE field, "Total time on
      load (hrs)" — pickup + line-haul + delivery + any wait,
      exactly how the clock actually runs. Same variable still
      drives driver cost (hours × base rate × 1.31 loading).
      Tagged 🚚 Verizon-ready: this is the field Verizon Fleet
      auto-populates in Phase 2. The detention-pattern card on
      the dashboard stays (informational lane-pattern check);
      wait is NOT re-added as a separate time input.

   3. DAY ROLLUP — EXCEL IMPORT. Calculator tab now has two
      modes: Single load and Day rollup. Day rollup is an IMPORT
      flow, not a data-entry flow: James drops in
      "2026 FCT Dispatch Log.xlsx" (sheet "2026", ~6,445 rows),
      SheetJS parses it client-side, and the app walks the log
      top-to-bottom carrying current-date and current-D.P. as
      state — the sheet is repeating blocks of
      [orange date banner] -> [D.P. banner] -> [10-20 load rows]
      -> blank. One load record is emitted per non-banner row,
      tagged with the tracked date and delivery point. A date
      filter picks the day to price. Whole-day P&L allocates day
      fixed cost (trucks running × $468/truck/day) pro-rata by
      hours on load, with a green/amber/red verdict and savable
      day snapshots for Monday-vs-Tuesday comparison.

      The sheet carries no weight, miles or hours, so those come
      from LANE DEFAULTS (Settings): 48,000 lb, FCGE->Lathrop
      15 mi, FCGE->Ripon 12 mi, 145 mi otherwise, 3 hrs. Those
      four combos are OPERATOR GUESSES — every derived figure is
      flagged EST and an amber calibration banner runs until
      James locks them in.

      Manual add-row survives only as a one-off what-if for an
      offer that is not on the sheet yet.

   4. LIVE FUEL COST. v1.1's $0.60/mi was QBO T12M fuel divided by
      annual miles — a trailing average that lags the pump by up
      to a year. Fuel cost per mile is now derived from two
      operator-maintained fields, currentDieselPricePerGal ($4.50)

      lastFuelPriceUpdate stamp drives a 7-day staleness nudge on

      Fuel vendors confirmed from QBO AP aging 2026-07-27:

const IDB_NAME = 'fct-calc-db';
const IDB_STORE = 'kv';
/* v2.0.2 (2026-08-05, James report): the imported dispatch parse (up to
   ~9,000 rows × ~30 fields ≈ 400-700 KB serialized) is stored under its
   own IDB key, not inside the localStorage state blob. Before v2.0.2 the
   whole state — including rows — was JSON-stringified into localStorage;
   when the quota (usually 5 MB) refused the write, saveDayImport() would
   trim rows down to the day-in-view, which is what made WTD/MTD collapse
   to a single day. IDB has orders-of-magnitude more room and never trims.
   This constant is intentionally NOT under STORAGE_KEY's namespace — a
   future storage tier migration should be able to move state without also
   dragging rows along. */
const IDB_ROWS_KEY = 'fct-calc:lastImportRows';
/* v2.1.33: ADP Workforce Now Employee Daily Totals live under their own
   IDB key — pay rows are large and must never ride in the localStorage
   state blob. Re-import replaces that date range only; dispatch rows
   (IDB_ROWS_KEY) are untouched. Pay data stays on-device.

/* =============================================================
   STORAGE HARDENING (pattern lifted from Lift Log)
   Verified writes + sessionStorage fallback + IndexedDB mirror
   + persistent error banner with "Copy all data" escape.
   ============================================================= */
let __idbPromise = null;
function idb(){
  if(__idbPromise) return __idbPromise;
  __idbPromise = new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no indexedDB'));
    const rq = indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded = ()=>{ const db=rq.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  });
  return __idbPromise;
}
function idbPut(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); })); }
function idbGet(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const r=tx.objectStore(IDB_STORE).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
function idbDel(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); })); }

/* v2.0.2: build the LS-bound view of state — same object graph MINUS the
   dispatch rows. Shallow-clones the touched branches so mutations to `state`
   after this call don't leak into the serialized copy. Every field the
   normalizer expects is preserved; only lastImport.rows is emptied.
   The flag `_rowsInIDB:true` lets readers know the [] is by-design and not
   an empty parse — useful when triaging a corrupt state.               */
function compactStateForStorage(s){
  if(!s || typeof s !== 'object') return s;
  const out = Object.assign({}, s);
  if(s.dayRollup && typeof s.dayRollup === 'object'){
    out.dayRollup = Object.assign({}, s.dayRollup);
    if(s.dayRollup.lastImport && typeof s.dayRollup.lastImport === 'object'){
      out.dayRollup.lastImport = Object.assign({}, s.dayRollup.lastImport, {
        rows: [], _rowsInIDB: true
      });
    }
  }
  /* v2.1.33: ADP pay rows never serialize into LS. Metadata only. */
  if(s.adpPay && typeof s.adpPay === 'object'){
    out.adpPay = Object.assign({}, defaultAdpPay(), s.adpPay, { rows:null, _rowsInIDB:true });
  }
  /* v2.1.46: calibration + today's miles are runtime fetches. Persisting a
     1.15x snapshot then painting "unavailable" a second later is what made
     EST DAY/WTD/MTD jump thousands on a quiet open. */
  out.laneCalibration = { ok:false, lanes:{}, fleetFactor:1.0, windowDays:0, computedAt:null, error:null };
  out.verizonMilesToday = { fleetMiles:0, ok:false, error:null, fetchedAt:null, date:null };
  return out;
}

function detectStorageEnv(){
  const info = {
    origin:(location&&location.origin)||'(none)', protocol:(location&&location.protocol)||'(none)',
    href:(location&&location.href)||'(none)', warnings:[], localStorageOK:false, sessionStorageOK:false,
    indexedDBOK:!!window.indexedDB
  };
  /* 2026-07-28: removed the "opened from local file" warning per operator
     request — no point crying wolf when Drive-hosted file works fine on
     iOS/Edge. localStorage probe below still catches real failures.

     The flag itself is kept because Settings → Data reports the protocol and
     storage tier, and a genuine probe failure reads better next to it. What
     is gone is the banner: protocol alone was never evidence of anything, and
     on the landing page it sat on top of the dispatch drop zone. */
  const risky = /^(file|content|edge-external-file|edge):/i.test(info.protocol) || info.origin==='null' || /external-file/i.test(info.href);
  info.risky = risky;
  try{ localStorage.setItem('__p__','1'); info.localStorageOK = localStorage.getItem('__p__')==='1'; localStorage.removeItem('__p__'); }
  catch(e){ info.localStorageOK=false; info.localStorageError=String(e&&e.message||e); }
  try{ sessionStorage.setItem('__p__','1'); info.sessionStorageOK = sessionStorage.getItem('__p__')==='1'; sessionStorage.removeItem('__p__'); }catch(_){}
  if(!info.localStorageOK) info.warnings.push('localStorage is not working ('+(info.localStorageError||'silent no-op')+'). Writes will fall through to IndexedDB.');
  return info;
}
let STORAGE_ENV = null;

const __memoryStore = Object.create(null);
function storageWrite(key,value){
  const json = (typeof value==='string')?value:JSON.stringify(value);
  let lsErr=null;
  try{
    localStorage.setItem(key,json);
    if(localStorage.getItem(key)===json){ idbPut(key,json).catch(()=>{}); return {ok:true,tier:'localStorage'}; }
    lsErr = new Error('silent no-op: setItem accepted but getItem returned wrong value');
  }catch(e){ lsErr=e; }
  try{
    sessionStorage.setItem(key,json);
    if(sessionStorage.getItem(key)===json){ idbPut(key,json).catch(()=>{});
      return {ok:true,tier:'sessionStorage',warning:'localStorage unavailable — using sessionStorage. Data will be lost when this tab closes.',error:lsErr&&String(lsErr.message||lsErr)}; }
  }catch(_){}
  __memoryStore[key]=json;
  const idbAttempt = idbPut(key,json).then(()=>true).catch(()=>false);
  return {ok:false,tier:'memory',error:lsErr?String(lsErr.message||lsErr):'no storage tier accepted the write',idbAttempt};
}
function storageRead(key){
  try{ const v=localStorage.getItem(key); if(v!=null) return v; }catch(_){}
  try{ const v=sessionStorage.getItem(key); if(v!=null) return v; }catch(_){}
  if(key in __memoryStore) return __memoryStore[key];
  return null;
}

function ensureBannerHost(){
  let h=document.getElementById('storageErrorBanner');
  if(h) return h;
  h=document.createElement('div'); h.id='storageErrorBanner';
  h.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;padding:12px 16px;background:#3a1e1e;color:#f0c4c4;border-bottom:2px solid #c46b6b;font:600 13px/1.4 Inter,-apple-system,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5);display:none;max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch';
  document.body.insertBefore(h,document.body.firstChild);
  return h;
}
function showStorageError(title,detail,opts){
  opts=opts||{};
  const host=ensureBannerHost();
  host.style.display=''; host.innerHTML='';
  const warn = opts.severity==='warn';
  host.style.background = warn?'#3f2e1a':'#3a1e1e';
  host.style.borderBottomColor = warn?'#c9a86a':'#c46b6b';
  host.style.color = warn?'#f0d38a':'#f0c4c4';
  const t=document.createElement('div'); t.textContent=title; t.style.cssText='font-size:14px;margin-bottom:6px'; host.appendChild(t);
  if(detail){ const d=document.createElement('div'); d.textContent=detail; d.style.cssText='font-weight:400;font-size:12px;margin-bottom:8px;word-break:break-word;opacity:.9'; host.appendChild(d); }
  const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const ex=document.createElement('button'); ex.textContent='Copy all data';
  ex.style.cssText='padding:6px 12px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;font:600 12px/1 inherit;cursor:pointer';
  ex.addEventListener('click',copyAllData);
  const dis=document.createElement('button'); dis.textContent='Dismiss';
  dis.style.cssText=ex.style.cssText;
  dis.addEventListener('click',()=>{host.style.display='none';});
  row.appendChild(ex); row.appendChild(dis); host.appendChild(row);
}
function copyAllData(){
  /* Compact first so a "copy everything" dump never includes ADP pay rows. */
  const payload = { savedAt:new Date().toISOString(), appVersion:APP_VERSION, storageEnv:STORAGE_ENV,
                    state:compactStateForStorage(state) };
  const txt = JSON.stringify(payload,null,2);
  const done = ()=>toast('Copied — paste somewhere safe');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.cssText='position:fixed;top:10%;left:5%;width:90%;height:60%;z-index:100000;font:12px monospace';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(_){ alert('Select the text and copy manually.'); }
  setTimeout(()=>ta.remove(),400);
}

/* =============================================================
   FUEL SURCHARGE ENGINE (v1.2)
   -------------------------------------------------------------
   FSC is not one number — every customer bills it differently.
   Four methods are supported so a manual broker offer with a
   non-standard FSC can still be modeled, plus an explicit
   "no fuel surcharge" for customers who simply don't bill it.
   ============================================================= */
const FSC_METHODS = [
  { id:'percent_of_linehaul', label:'Percent of linehaul', unit:'%',     suffix:'% of linehaul' },
  { id:'per_ton',             label:'$ per ton',           unit:'$/ton', suffix:'/ton' },
  { id:'per_loaded_mile',     label:'$ per loaded mile',   unit:'$/mi',  suffix:'/loaded mi' },
  { id:'flat',                label:'Flat $',              unit:'$',     suffix:' flat' },
  { id:'none',                label:'No fuel surcharge',   unit:'—',     suffix:'' },
];
function fscMethodLabel(id){ const m=FSC_METHODS.find(x=>x.id===id); return m?m.label:'Percent of linehaul'; }
function fscMethodUnit(id){ const m=FSC_METHODS.find(x=>x.id===id); return m?m.unit:'%'; }

/* The rate card's shorthand -> the FSC_METHODS ids the engine computes on.
   'flat_included' maps to 'none' because the surcharge is already inside
   avgRevenue: adding a percent on top would bill it twice. That is a
   different fact from "this customer pays no fuel", so the distinction is
   kept on the record as `fscIncluded` rather than lost in the mapping. */
const FSC_METHOD_FROM_CARD = {
  percent:       'percent_of_linehaul',
  per_ton:       'per_ton',
  per_mile:      'per_loaded_mile',
  flat:          'flat',
  none:          'none',
  flat_included: 'none',
};

function defaultCustomerRates(){
  const out = {};
  Object.keys(CUSTOMER_RATE_DEFAULTS).forEach(name=>{
    const c = CUSTOMER_RATE_DEFAULTS[name];
    const method = FSC_METHOD_FROM_CARD[c.fscMethod] || 'percent_of_linehaul';
    const included = c.fscMethod === 'flat_included';
    const value = c.fscPct     != null ? Number(c.fscPct)
                : c.fscPerTon  != null ? Number(c.fscPerTon)
                : c.fscPerMile != null ? Number(c.fscPerMile)
                : c.fscFlat    != null ? Number(c.fscFlat)
                : null;
    out[name] = {
      revenuePerLoad: Number(c.avgRevenue) > 0 ? Number(c.avgRevenue) : null,
      fscMethod: method,
      fscValue:  method === 'none' ? null : value,
      fscIncluded: included,
      verified: true,
      asOf: CUSTOMER_RATES_ASOF,
      qboName: c.qboName || name,
      supersedes: c.supersedes || '',
      note: (c.notes ? c.notes + ' ' : '')
          + (included ? 'Fuel surcharge is already inside the average — not billed on top. ' : '')
          + '(' + CUSTOMER_RATES_SOURCE + ', ' + CUSTOMER_RATES_ASOF + ')',
    };
  });
  return out;
}

/* =============================================================

   -------------------------------------------------------------
   POC pricing is genuinely lane-based, not flat. Rate per pound
   varies with origin (grower distance) and destination (mill
   distance). FSC clause moved 27→30→32% over the last two months.
   This table encodes what the QBO invoice sample shows;
   pocLaneRevenue() uses it whenever a POC load has both origin
   and destination we can match. When we can't match, revenue
   falls back to CUSTOMER_RATE_DEFAULTS["Phil O'Connell Grain"]
   .avgRevenue ($425 blended).

   Keys are normalized (uppercase, punctuation stripped). Destination
   is matched by substring so "Purina - Turlock" and "PURINA TURLOCK"
   both hit the 'PURINA' key.

   Source: QBO invoices 2026-06-01 through 2026-07-31 (~40 POC
   loads sampled). Verified rates for the lanes we see running
   weekly; other POC-brokered lanes fall through to the customer
   avgRevenue.

   v2.1.29: operator-typed fills from the missing-rates card live on
   state.laneRateOverrides (localStorage via save()), not in this
   table. pocLaneRevenue() consults those overrides after this
   constant and before the blended $425 fallback. Do not bake live
   fills into the source.

/* Resolve a POC lane rate from a raw origin + destination hint.
   Origin is normalised the same way normOrigin() does, then split on
   " - " and any whitespace so "Pelican - Stockton" or "Penny Newman -
   Stockton" or "PNG MOD" all reduce to the base grower/elevator name.
   Destination is uppercased and matched by substring so "Purina -
   Turlock" and "PURINA" both hit PURINA. Returns null when no match —
   caller should fall back to the customer avgRevenue. */
function pocLaneRateFor(origin, destination, commodity){
  const raw = normOrigin(origin);
  const d = String(destination==null?'':destination).toUpperCase();
  if(!raw || !d) return null;
  // v2.1.23: commodity gate — some lanes (Perdue ORG CORN, ADM Port RICE)
  // are contract-scoped to a single commodity. If a lane declares
  // commodityMatch and the row's commodity doesn't match, skip it — the
  // caller will fall through to the customer-avg blend as before.
  const c = String(commodity==null?'':commodity);
  // Try the raw normalised origin first, then progressively shorter
  // prefixes: "PENNY NEWMAN - STOCKTON" → "PENNY NEWMAN - STOCKTON",
  // "PENNY NEWMAN", "PENNY". First match wins.
  const trials = [raw];
  const beforeDash = raw.split(' - ')[0].trim();
  if(beforeDash && beforeDash !== raw) trials.push(beforeDash);
  const twoWord = raw.split(/\s+/).slice(0,2).join(' ');
  if(twoWord && trials.indexOf(twoWord) < 0) trials.push(twoWord);
  const firstWord = raw.split(/\s+/)[0];
  if(firstWord && trials.indexOf(firstWord) < 0) trials.push(firstWord);
  for(const o of trials){
    const originMap = POC_LANE_RATES[o];
    if(!originMap) continue;
    for(const destKey in originMap){
      if(d.indexOf(destKey) >= 0){
        const rule = originMap[destKey];
        if(rule.commodityMatch && !rule.commodityMatch.test(c)) continue;
        return Object.assign({ origin:o, dest:destKey }, rule);
      }
    }
  }
  return null;
}
function applyLaneRateRule(rule, lbs){
  if(!rule) return null;
  // v1.9: some POC lanes bill a flat per-load rate regardless of weight
  // (Perdue Farms FCGE→Diestel is $500 flat; the invoiced $/lb is just
  // 500/weight backed out to hit exactly $500). When flatRate is set,
  // use it verbatim and skip the min-weight + FSC math.
  if(Number(rule.flatRate)>0){
    return { amount: Number(rule.flatRate), linehaul:Number(rule.flatRate), fsc:0, rule:rule, minWeightApplied:false };
  }
  if(!(Number(rule.ratePerLb)>0)) return null;
  const raw = Number(lbs)||0;
  const w = raw > 0 ? Math.max(raw, POC_MIN_WEIGHT) : POC_MIN_WEIGHT;  // 52,000 lb billing floor.
  const linehaul = w * rule.ratePerLb;
  const fsc = linehaul * ((rule.fscPct||0)/100);
  return { amount: linehaul+fsc, linehaul:linehaul, fsc:fsc, rule:rule,
           minWeightApplied: raw > 0 && raw < POC_MIN_WEIGHT };
}
function pocLaneRevenue(origin, destination, lbs, commodity){
  /* Compile-time matrix first; operator fills (missing-rates card)
     next; caller falls back to blended avg when both miss. */
  const rule = pocLaneRateFor(origin, destination, commodity)
            || laneRateOverrideFor(origin, destination, commodity);
  if(!rule) return null;
  return applyLaneRateRule(rule, lbs);
}

/* =============================================================
   OPERATOR LANE-RATE OVERRIDES (v2.1.29)
   -------------------------------------------------------------
   James types missing rates in the landing-page card. They persist
   on state.laneRateOverrides via save() — not in POC_LANE_RATES.
   Keyed by origin|dest|optional commodity (uppercase). Lookup is
   consulted after the compile-time matrix and before the blended
   $425 / bucket placeholder.
   ============================================================= */
function laneOverrideKey(origin, dest, commodity){
  return String(origin||'').trim().toUpperCase()
       + '|' + String(dest||'').trim().toUpperCase()
       + '|' + String(commodity||'').trim().toUpperCase();
}
function mergeLaneRateOverrides(saved){
  const out = {};
  if(!saved || typeof saved !== 'object' || Array.isArray(saved)) return out;
  Object.keys(saved).forEach(function(k){
    try{
      const v = saved[k];
      if(!v || typeof v !== 'object') return;
      const billing = v.billing === 'perLb' ? 'perLb' : 'flat';
      const flatRate = Number(v.flatRate);
      const ratePerLb = Number(v.ratePerLb);
      const fscPct = Number(v.fscPct);
      if(billing === 'flat' && !(flatRate > 0)) return;
      if(billing === 'perLb' && !(ratePerLb > 0)) return;
      const origin = String(v.origin||'');
      const dest = String(v.dest||'');
      const commodity = String(v.commodity||'');
      const key = k || laneOverrideKey(origin, dest, commodity);
      if(!key || key === '||') return;
      out[key] = {
        origin: origin, dest: dest, commodity: commodity,
        billing: billing,
        flatRate: billing === 'flat' ? flatRate : 0,
        ratePerLb: billing === 'perLb' ? ratePerLb : 0,
        fscPct: billing === 'perLb' && isFinite(fscPct) && fscPct >= 0 ? fscPct : 0,
        savedAt: String(v.savedAt||'')
      };
    }catch(_){}
  });
  return out;
}
function laneOverrideOriginTrials(origin){
  const raw = (typeof normOrigin === 'function') ? normOrigin(origin) : String(origin||'').toUpperCase().trim();
  const asIs = String(origin||'').trim().toUpperCase();
  const trials = [];
  if(asIs) trials.push(asIs);
  if(raw && trials.indexOf(raw) < 0) trials.push(raw);
  if(!raw) return trials;
  const beforeDash = raw.split(' - ')[0].trim();
  if(beforeDash && trials.indexOf(beforeDash) < 0) trials.push(beforeDash);
  const twoWord = raw.split(/\s+/).slice(0,2).join(' ');
  if(twoWord && trials.indexOf(twoWord) < 0) trials.push(twoWord);
  const firstWord = raw.split(/\s+/)[0];
  if(firstWord && trials.indexOf(firstWord) < 0) trials.push(firstWord);
  return trials;
}
function laneRateOverrideFor(origin, destination, commodity){
  const map = state && state.laneRateOverrides;
  if(!map) return null;
  const dest = destination;
  const comm = String(commodity||'');
  const keys = [];
  const push = function(o, d, c){
    const k = laneOverrideKey(o, d, c);
    if(k && keys.indexOf(k) < 0) keys.push(k);
  };
  laneOverrideOriginTrials(origin).forEach(function(o){
    push(o, dest, comm);
    if(comm) push(o, dest, '');
  });
  for(let i=0;i<keys.length;i++){
    const v = map[keys[i]];
    if(!v) continue;
    if(v.billing === 'perLb' && Number(v.ratePerLb)>0){
      return { origin:v.origin||origin, dest:v.dest||destination, commodity:v.commodity||'',
               ratePerLb:Number(v.ratePerLb), fscPct:Number(v.fscPct)||0, flatRate:0, operator:true };
    }
    if(Number(v.flatRate)>0){
      return { origin:v.origin||origin, dest:v.dest||destination, commodity:v.commodity||'',
               flatRate:Number(v.flatRate), ratePerLb:0, fscPct:0, operator:true };
    }
  }
  return null;
}
function laneRateBasisText(lane){
  const rule = (lane && lane.rule) || {};
  const src = rule.operator ? 'saved rate ' : 'POC lane ';
  const o = rule.origin || '';
  const d = rule.dest || '';
  if(Number(rule.flatRate)>0){
    return src + o + ' → ' + d + ' — $' + Number(rule.flatRate).toFixed(2) + ' flat per load';
  }
  return src + o + ' → ' + d
       + ' — $' + Number(rule.ratePerLb).toFixed(5) + '/lb'
       + (rule.fscPct ? ' + ' + rule.fscPct + '% FSC' : ' (no FSC)')
       + (lane.minWeightApplied ? ' — min-weight floor 52,000 lb applied' : '');
}

function isHighRatePngCommodity(commodity){

  // or "RIPON" — so a bare match on those (which came from the D.P. banner
  // context in parsing) is a Diamond-destination signal. Also accept explicit

  const isDpfDest = /^(LATHROP|RIPON)$/.test(d)
