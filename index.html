  if(!payload || typeof payload!=='object') throw bad('the reply was not an object');
  if(!Array.isArray(payload.rows))         throw bad('the reply carried no rows array');
  if(!payload.rows.length)                 throw bad('the reply carried zero rows — re-run the Excel script');
  const aoa = workerRowsToAoa(payload.rows);
  __wb = {
    fileName: 'worker · /latest',
    sheetNames: [WORKER_SHEET],
    sheets: { [WORKER_SHEET]: aoa },
    worker: true,
    ingestedAt: String(payload.ingestedAt||''),
  };
  return applyParse();
}

/* The one entry point for pulling the day. opts:
     quiet — no toast on success (boot uses this; the pill says it already)
     force — re-parse even when the worker has nothing newer than what is
             already stored, which is what the 🔄 button means
   Resolves to the parse result, or null when there was nothing to do or the
   fetch failed. It never rejects: every failure is a UI state, not an
   exception for a caller to handle. */
function syncFromWorker(opts){
  opts = opts || {};
  const di = state.dispatchImport;
  const url = di.workerUrl || WORKER_URL;
  if(__syncing) return Promise.resolve(null);
  __syncing = true;
  workerState = { kind:'syncing', at:'', ingestedAt:workerState.ingestedAt, rowCount:workerState.rowCount, msg:'' };
  paintWorkerPill();

  return fetch(url, {cache:'no-store', headers:{'Accept':'application/json'}})
    .then(r=>{
      /* 404 is not a failure of the pipeline, it is the pipeline saying the
         script has not run yet — a different message and a different colour. */
      if(r.status===404){ const e=new Error('no dispatch data yet'); e.kind='empty'; throw e; }
      if(!r.ok){ const e=new Error('HTTP '+r.status); e.kind='offline'; throw e; }
      /* Past this line the worker has answered, so anything that goes wrong is
         the SHAPE of the answer, not the reach of it. Tagged separately because
         "offline" would send the operator to check their signal when the thing
         to check is the Excel script. */
      return r.json().then(p=>p, ()=>{ const e=new Error('the reply was not JSON'); e.kind='bad'; throw e; });
    })
    .then(payload=>{
      const stamp = String((payload && payload.ingestedAt) || '');
      const count = (payload && payload.rowCount) || (payload && payload.rows ? payload.rows.length : 0);
      const li = state.dayRollup.lastImport;
      /* Nothing new upstream: refresh the pill and STOP. Re-parsing would
         rebuild lastImport.rows from scratch and take every per-row override
         with it — on a page the operator opens a dozen times a day that is a
         silent data loss, so an unchanged stamp is a no-op by design. */
      /* li.trimmed means the last write hit the storage ceiling and saveDayImport()
         cut the parse down to the single day in view — so what is stored is NOT
         what the worker sent, and skipping the re-parse would leave the day
         picker, WTD and MTD permanently collapsed to one day. Since v1.6 the
         full year is one fetch away, so a trimmed store re-parses every boot. */
      if(!opts.force && stamp && stamp===di.lastIngestedAt && li && li.rows && li.rows.length && !li.trimmed){
        workerState = { kind:'ok', at:new Date().toISOString(), ingestedAt:stamp,
                        rowCount:(di.lastRowCount||count), msg:'' };
        di.lastSyncAt = workerState.at;
        save();
        paintWorkerPill();
        console.log('Worker has nothing newer — '+count+' rows, ingested at '+stamp+'. Kept the parsed day.');
        return null;
      }
      const res = ingestWorkerPayload(payload);
      di.lastSyncAt      = new Date().toISOString();
      di.lastIngestedAt  = stamp;
      di.lastRowCount    = count;
      workerState = { kind:'ok', at:di.lastSyncAt, ingestedAt:stamp, rowCount:count, msg:'' };
      invalidateVerizonMatch();
      const ok = saveDayImport();
      renderDash();
      console.log('Synced '+count+' rows from worker, ingested at '+stamp
        + ' → '+res.rows.length+' loads across '+res.dates.length+' days');
      if(!opts.quiet) toast(res.rows.length+' loads · '+res.dates.length+' days · synced');
      if(!ok.ok) setDispStatus('<div class="hint" style="color:var(--red)">Storage refused the write — the sync is in memory only.</div>');
      /* v2.1.21: fresh dispatch → fresh calibration inputs. Fire-and-forget. */
      try { pushDispatchLog({days:8}).catch(()=>{}); } catch(_){}
      return res;
    })
    .catch(e=>{
      const kind = (e && (e.kind==='empty' || e.kind==='bad')) ? e.kind : 'offline';
      workerState = { kind:kind, at:new Date().toISOString(), ingestedAt:di.lastIngestedAt||'',
                      rowCount:di.lastRowCount||0, msg:String((e&&e.message)||e) };
      console.warn('Worker sync failed ('+kind+'):', e);
      /* A failed sync must not disturb rows already in hand — nothing above
         touched lastImport, so the day on screen is whatever it was. Only the
         chrome re-renders, and only when the dashboard is actually mounted. */
      if(document.querySelector(DAY_HOST)) renderDayRollup(); else paintWorkerPill();
      if(!opts.quiet){
        toast(kind==='empty' ? 'Worker has no dispatch data yet'
            : kind==='bad'   ? 'Worker replied badly — '+workerState.msg
            :                  'Worker unreachable — '+workerState.msg);
      }
      return null;
    })
    .then(v=>{ __syncing = false; return v; });
}

/* ---- The pill ----
   One line on the day header answering "how old is this?". Built off the
   payload's own ingestedAt, not our fetch time: what matters is when the
   dispatch sheet was last pushed, not when we last asked. */
function workerPillHTML(){
  if(dataSource()==='file') return '';
  const w = workerState;
  const wrap = (cls,txt,title)=> '<span class="chip '+cls+'" id="syncPill" title="'+esc(title)+'" '
    + 'style="cursor:help">'+txt+'</span>';
  if(w.kind==='syncing') return wrap('b','⏳ Syncing…','Fetching the dispatch log from the worker.');
  if(w.kind==='empty')
    return wrap('y','🟡 No dispatch data yet',
      'The worker is up but has nothing stored — click Run on the Excel script in the dispatch workbook and sync again.');
  if(w.kind==='offline')
    return wrap('r','🔴 Worker offline',
      'Could not reach '+(state.dispatchImport.workerUrl||WORKER_URL)+' ('+w.msg+'). '
      + 'The day on screen is whatever was last loaded. Drop the dispatch xlsx to import it by hand.');
  if(w.kind==='bad')
    return wrap('r','🔴 Bad worker reply',
      'The worker answered but '+w.msg+'. That is the push side, not this one — re-run the Excel script and check what it sent. '
      + 'The day on screen is whatever was last loaded.');
  if(w.kind==='file') return '';
  if(w.kind==='ok'){
    const age = agoText(w.ingestedAt || w.at);
    return wrap('g','🟢 Synced '+(age||'now'),
      w.rowCount+' rows pushed to the worker'
      + (w.ingestedAt ? ' at '+new Date(w.ingestedAt).toLocaleString() : '')
      + (w.at ? ' · this device fetched them '+agoText(w.at) : '')
      + '. Tap 🔄 to re-fetch.');
  }
  return '';
}
/* Swap the pill in place without re-rendering the page — used by the syncing
   state and by the once-a-minute tick that keeps "4m ago" honest. */
function paintWorkerPill(){
  const el = document.getElementById('syncPill');
  const html = workerPillHTML();
  if(el){
    if(!html){ el.remove(); return; }
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    el.replaceWith(tmp.firstChild);
    return;
  }
  /* No pill on screen but there should be one. This is the ordinary second
     open of the day: the header painted from stored rows while the fetch was
     still in flight, then the fetch came back with nothing newer and took the
     no-op path — which touches no rows, so nothing else would ever repaint.
     Only the loaded header has a slot for the pill, so the empty hero (no
     lastImport) is left alone rather than re-rendered once a minute. */
  if(html && state.dayRollup.lastImport && document.querySelector(DAY_HOST)) renderDayRollup();
}
/* The age in the pill is only true for a minute at a time. */
setInterval(()=>{ if(workerState.kind==='ok') paintWorkerPill(); }, 60000);

/* Where the fallback drop zone should appear. 'file' always shows it; the
   worker modes show it only once the worker has actually let us down, so a
   working pipeline never puts a file picker on screen. */
function workerFailed(){
  const k = workerState.kind;
  return k==='offline' || k==='empty' || k==='bad';
}
function showFileFallback(){
  const src = dataSource();
  if(src==='file') return true;
  /* Hybrid also offers it before the first attempt has resolved — the whole
     point of that mode is that the file is always an option. */
  if(src==='hybrid') return workerFailed() || workerState.kind==='idle';
  return workerFailed();
}

/* 2026-08-18 v2.1.0: pull the live Verizon Reveal feed (vehicles + drivers +
   per-vehicle GPS) from fct-verizon Worker. Silent on unchanged data. Feature
   flag off by default — set state.settings.useVerizonLive=true to enable.
   Auto-run: called from initAll() on boot, then every 5 min while the tab is
   open. */
/* v2.1.5: pull dispatch signals from the Worker /signals endpoint. Signals are
   transition events (truck_start, arrived_yard, arrived_location, truck_stop)
   the Worker detects by diffing consecutive vehicle snapshots. They flow into
   the Dispatch Signals panel on the Today view — JJ's morning reactive queue. */
let __signalsSyncing = false;
function syncSignals(opts){
  opts = opts || {};
  if(!state.settings || !state.settings.useVerizonLive) return Promise.resolve(null);
  if(__signalsSyncing) return Promise.resolve(null);
  __signalsSyncing = true;
  return fetch(VERIZON_SIGNALS_URL, {cache:'no-store', headers:{'Accept':'application/json'}})
    .then(r=>r.ok?r.json():null)
    .then(payload=>{
      if(!payload || !Array.isArray(payload.signals)) return null;
      if(!state.verizonLive) state.verizonLive = defaultVerizonLive();
      state.verizonLive.signals = payload.signals;
      state.verizonLive.signalsSyncedAt = new Date().toISOString();
      save();
      try { renderDash(); } catch(_){}
      return payload;
    })
    .catch(()=>null)
    .finally(()=>{ __signalsSyncing = false; });
}

function ackSignal(sigId){
  if(!state.verizonLive) state.verizonLive = defaultVerizonLive();
  if(!state.verizonLive.ackedSignals) state.verizonLive.ackedSignals = {};
  state.verizonLive.ackedSignals[String(sigId)] = Date.now();
  save();
  try { renderDash(); } catch(_){}
}
window.ackSignal = ackSignal;

let __verizonSyncing = false;
function syncFromVerizon(opts){
  opts = opts || {};
  if(!state.settings || !state.settings.useVerizonLive){
    if(opts.force) console.info('Verizon live is off — enable in Settings');
    return Promise.resolve(null);
  }
  if(__verizonSyncing) return Promise.resolve(null);
  __verizonSyncing = true;
  const url = VERIZON_WORKER_URL;
  return fetch(url, {cache:'no-store', headers:{'Accept':'application/json'}})
    .then(r=>{
      if(r.status===503){ const e=new Error('worker not ready'); e.kind='empty'; throw e; }
      if(!r.ok){ const e=new Error('HTTP '+r.status); e.kind='offline'; throw e; }
      return r.json();
    })
    .then(payload=>{
      const stamp = String((payload && payload.ingestedAt) || '');
      if(!opts.force && stamp && stamp === state.verizonLive.lastIngestedAt){
        return null;
      }
      // v2.1.14: preserve caches/overrides across syncs (were being wiped).
      const prevVL = state.verizonLive || defaultVerizonLive();
      const newVehicles = Array.isArray(payload.vehicles) ? payload.vehicles : [];
      const primaryCache = Object.assign({}, prevVL.primaryDriverCache || {});
      newVehicles.forEach(v => {
        const tid = String(v.Name || v.VehicleNumber || '');
        if(tid && v._driverName) primaryCache[tid] = String(v._driverName);
      });
      state.verizonLive = {
        vehicles: newVehicles,
        drivers:  Array.isArray(payload.drivers)  ? payload.drivers  : [],
        lastSync: new Date().toISOString(),
        lastIngestedAt: stamp,
        lastError: '',
        readyOverrides: prevVL.readyOverrides || {},
        signals: prevVL.signals || [],
        signalsSyncedAt: prevVL.signalsSyncedAt || '',
        ackedSignals: prevVL.ackedSignals || {},
        primaryDriverCache: primaryCache,
        driverOverrides: prevVL.driverOverrides || {}
      };
      save();
      try { renderDash(); } catch(_){}
      return payload;
    })
    .catch(err=>{
      state.verizonLive.lastError = String(err && err.message || err);
      try { save(); } catch(_){}
      return null;
    })
    .finally(()=>{ __verizonSyncing = false; });
}

/* v2.1.19 (2026-08-21): fleet-day mileage pull from the fct-verizon Worker.
   Independent of syncFromVerizon (which pulls live vehicle positions /
   drivers) — this gives us a fleet-day total we can lay next to the
   LANE_MILES-basis fuel calc for a real vs modelled comparison.

   v2.1.20 (2026-08-21): prefer /miles-real (Verizon Segments API — actual
   odometer distance per trip, no fudge factor). Fall back to /miles
   (Haversine × 1.20 curve correction from KV snapshots) when miles-real
   returns 0 or errors. The compare label reports which source was used so
   the operator can tell if they're looking at real odo vs GPS estimate.

   5s hard timeout via AbortController — worker is usually <500ms, but a
   slow phone connection must never block the paint. Returns a shape-stable
   object; never throws. */
async function fetchVerizonMiles(dateStr){
  const tryOne = async (url) => {
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 8000);  // /miles-real does 25 API calls, needs longer
    try {
      const r = await fetch(url, { cache:'no-store', signal:ctrl.signal,
                                    headers:{'Accept':'application/json'} });
      clearTimeout(to);
      if(r.status === 404) return { __notfound:true };
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      const m = Number(j && j.fleetMiles);
      if(!isFinite(m) || m < 0) throw new Error('bad fleetMiles in response');
      // v2.1.22: also surface per-vehicle miles + trucksReporting count so the
      // landing header strip can show "18/25 reporting" with a tooltip listing
      // the trucks that are silent. Nullable on the /miles fallback endpoint.
      return { fleetMiles: m, ok:true, error:null, date:(j && j.date)||dateStr||null,
               perVehicle: (j && j.perVehicle) || null,
               trucksReporting: (j && typeof j.trucksReporting === 'number') ? j.trucksReporting : null };
    } catch(err){
      clearTimeout(to);
      throw err;
    }
  };
  const dq = dateStr ? '?date='+encodeURIComponent(dateStr)+'&bust='+Date.now() : ('?bust='+Date.now());
  const bust = '?bust=' + Date.now();

  // --- Attempt 1: /miles-real (Verizon Segments API — real odometer) ---
  try {
    const res = await tryOne(VERIZON_MILES_REAL_URL + dq);
    if(!res.__notfound && res.ok && res.fleetMiles > 0){
      return { ...res, source: 'real' };  // "real odo" — actual per-trip distance from Verizon
    }
    // If /miles-real returned 0 fleetMiles it means either all-idle day OR
    // the endpoint errored per-vehicle. Fall through to Haversine as a
    // sanity check — if that also returns 0, we're confident it's an idle
    // day. If Haversine has non-zero, /miles-real hit an issue.
  } catch(_){
    // Fall through
  }

  // --- Attempt 2: /miles (Haversine × 1.20 curve — KV snapshot accumulator) ---
  try {
    const res = await tryOne(VERIZON_MILES_URL + dq);
    if(!res.__notfound) return { ...res, source: 'gps' };  // "GPS estimate" — Haversine between snapshots
    // 404 → aliased endpoints
    try {
      const t = await tryOne(VERIZON_MILES_URL + '-today' + bust);
      if(!t.__notfound) return { ...t, source: 'gps' };
    } catch(_){}
    try {
      const y = await tryOne(VERIZON_MILES_URL + '-yesterday' + bust);
      if(!y.__notfound) return { ...y, source: 'gps' };
    } catch(_){}
    return { fleetMiles:0, ok:false, error:'no data for date', date:dateStr||null, source:null };
  } catch(err){
    return { fleetMiles:0, ok:false, error:String(err && err.message || err), date:dateStr||null, source:null };
  }
}

/* v2.1.19: refresh state.verizonMilesToday from the /miles endpoint for the
   date currently in view (or today if none). Silent by design — the compare
   panel labels itself when data is missing; we don't need a toast for the
   background pull. */
function refreshVerizonMilesToday(){
  const dateStr = (state.dayRollup && state.dayRollup.date)
               || isoLocal(new Date());
  return fetchVerizonMiles(dateStr).then(res => {
    state.verizonMilesToday = {
      fleetMiles: res.fleetMiles || 0,
      ok: !!res.ok,
      error: res.error || null,
      fetchedAt: new Date().toISOString(),
      date: res.date || dateStr,
      source: res.source || null,  // v2.1.20: 'real' | 'gps' | null
      // v2.1.22: per-truck breakdown so the landing strip's "X/Y reporting"
      // tile can list which vehicles are silent (0 mi today).
      perVehicle: res.perVehicle || null,
      trucksReporting: (res.trucksReporting != null) ? res.trucksReporting : null
    };
    /* v2.1.23: 7-day rolling snapshot so the Fuel drill-in can chart the last
       week. Keyed by date so repeated pulls on the same day update in place,
       not duplicate. Cap 30 entries to bound localStorage size. Silent failure
       so a snapshot write can never break the primary pull path. */
    try {
      if(res.ok && res.fleetMiles > 0){
        const d = res.date || dateStr;
        const arr = Array.isArray(state.milesHistory) ? state.milesHistory : [];
        const existing = arr.findIndex(x => x.date === d);
        const entry = { date:d, fleetMiles:res.fleetMiles, source:res.source||null };
        if(existing >= 0) arr[existing] = entry; else arr.push(entry);
        arr.sort((a,b) => (a.date||'').localeCompare(b.date||''));
        state.milesHistory = arr.slice(-30);
        try { save(); } catch(_){}
      }
    } catch(_){}
    // Re-paint the surfaces that show fuel data so numbers land without a
    // manual tab switch. v2.1.22: renderDayRollup added — landing header strip.
    try { if(typeof renderDayRollup === 'function' && document.querySelector(DAY_HOST)) renderDayRollup(); } catch(_){}
    try { if(typeof renderInfo === 'function') renderInfo(); } catch(_){}
    try { if(typeof renderSet  === 'function') renderSet();  } catch(_){}
    try { markBootSettle('miles'); } catch(_){}
    return res;
  }).catch(err => {
    state.verizonMilesToday = { fleetMiles:0, ok:false,
                                error:String(err && err.message || err),
                                fetchedAt:new Date().toISOString(), date:dateStr };
    try { markBootSettle('miles'); } catch(_){}
  });
}

/* BEGIN DEVICE_DIESEL_EST */
/* v2.1.47: James — diesel is only what he types in Settings. No red bar,
   no canonical GET overwrite of currentDieselPricePerGal, no $4.50 default
   nags. EST DAY/WTD/MTD must not jump thousands while /calibration and ADP
   settle: hold the last stable EST (or "…" on first paint) until those
   inputs finish. Do not invent dollars. */
var __bootSettle = { cal:false, miles:false, adp:false, rows:false };
var __calInFlight = false;
var __stableEstPaint = null;
function markBootSettle(k){
  if(!k) return;
  const was = __bootSettle.cal && __bootSettle.miles && __bootSettle.adp && __bootSettle.rows;
  __bootSettle[k] = true;
  const now = __bootSettle.cal && __bootSettle.miles && __bootSettle.adp && __bootSettle.rows;
  if(now && !was){
    try { if(typeof renderDayRollup === 'function' && document.querySelector(DAY_HOST)) renderDayRollup(); } catch(_){}
  }
}
function estPaintPending(){
  return !(__bootSettle.cal && __bootSettle.miles && __bootSettle.adp && __bootSettle.rows) && !__stableEstPaint;
}
function estPaintUseFrozen(){
  return !!(__calInFlight && __stableEstPaint);
}
function estChipView(live){
  live = live || {};
  if(estPaintPending()) return { pending:true };
  if(estPaintUseFrozen() && __stableEstPaint)
    return Object.assign({ pending:false }, __stableEstPaint);
  const next = Object.assign({}, __stableEstPaint || {});
  Object.keys(live).forEach(k=>{ if(live[k] != null) next[k] = live[k]; });
  __stableEstPaint = next;
  return Object.assign({ pending:false }, next);
}
function keepLastGoodCalibration(prev){
  if(!prev || !prev.ok) return null;
  return {
    ok: true,
    lanes: prev.lanes || {},
    fleetFactor: Number(prev.fleetFactor) || 1.0,
    windowDays: prev.windowDays || 0,
    computedAt: prev.computedAt || null,
    flagged: prev.flagged || [],
    coverage: prev.coverage || null,
    note: prev.note || null,
    error: null
  };
}
/* END DEVICE_DIESEL_EST */

/* v2.1.21 (2026-08-21): fetch the worker's rolling per-lane calibration and
   land it into state.laneCalibration for computeDayRow to consume. Silent
   failure — an unavailable calibration just means everyone uses factor=1.0,
   which is exactly what shipped in v2.1.20.
   v2.1.46: NEVER drop a last-good snapshot. POST /dispatch-log invalidates
   the worker cache; a GET in the same second used to return empty, flip
   the tile to "unavailable", and restate modelled wages so EST jumped. */
async function refreshLaneCalibration(){
  const prevGood = (typeof keepLastGoodCalibration==='function')
    ? keepLastGoodCalibration(state.laneCalibration) : null;
  __calInFlight = true;
  try {
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 10000);
    const r = await fetch(VERIZON_CALIBRATION_URL + '?window=7&bust=' + Date.now(),
                          { cache:'no-store', signal:ctrl.signal });
    clearTimeout(to);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const lanes = (j && j.lanes && typeof j.lanes === 'object') ? j.lanes : {};
    const ff = Number((j && j.fleetFactor) || 0);
    const hasLanes = Object.keys(lanes).length > 0;
    /* A cache-bust empty payload is often {lanes:{}, fleetFactor:1}. That is
       NOT a new compute — if we already have 1.15x, keep it. */
    const looksLive = hasLanes || (isFinite(ff) && ff > 0 && Math.abs(ff - 1) > 0.001 && !(j && j.error));
    if(looksLive && isFinite(ff) && ff > 0){
      state.laneCalibration = {
        ok: true,
        lanes: lanes,
        fleetFactor: ff,
        windowDays: Number((j && j.windowDays) || 0),
        computedAt: (j && j.computedAt) || null,
        flagged: (j && j.flagged) || [],
        coverage: (j && j.coverage) || null,
        note: (j && j.note) || null,
        error: null,
      };
    } else if(prevGood){
      state.laneCalibration = Object.assign({}, prevGood, {
        stale: true,
        error: (j && j.error) || null
      });
    } else {
      state.laneCalibration = {
        ok: false,
        lanes: {},
        fleetFactor: 1.0,
        windowDays: Number((j && j.windowDays) || 0),
        computedAt: (j && j.computedAt) || null,
        flagged: (j && j.flagged) || [],
        coverage: (j && j.coverage) || null,
        note: (j && j.note) || null,
        error: (j && j.error) || 'empty',
      };
    }
    try { if(typeof refreshDay === 'function') refreshDay(); } catch(_){}
  } catch(err){
    if(prevGood){
      state.laneCalibration = Object.assign({}, prevGood, {
        error: String(err && err.message || err)
      });
    } else {
      state.laneCalibration = state.laneCalibration || { lanes:{}, fleetFactor:1.0 };
      state.laneCalibration.ok = false;
      state.laneCalibration.error = String(err && err.message || err);
    }
  } finally {
    __calInFlight = false;
    try { markBootSettle('cal'); } catch(_){}
    try { if(typeof renderDayRollup === 'function' && document.querySelector(DAY_HOST)) renderDayRollup(); } catch(_){}
  }
}

/* v2.1.26 (2026-08-24): after diesel / MPG / default driver rate is saved
   locally, POST the same numbers to /canonical-settings so HIS edit becomes
   the company copy. v2.1.47: never GET that copy back onto currentDieselPricePerGal
   and never show a Device-out-of-sync bar. v2.1.27: do NOT silent-auto-apply
   on boot. Local save already happened — this never blocks Settings. Offline
   or a dead worker just toasts; the number on THIS device still sticks. */
function pushCanonicalSettings(){
  try{
    const s = (state && state.settings) || {};
    const fuel = Number(s.currentDieselPricePerGal);
    const mpg  = Number(s.fleetAvgMPG);
    const rate = Number(s.defaultDriverRate);
    if(!(fuel>0) || !(mpg>0) || !(rate>0)) return;
    if(typeof navigator !== 'undefined' && navigator.onLine === false){
      try{ toast('Saved on this device. Other devices update when you are back online.'); }catch(_){}
      return;
    }
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 8000);
    fetch(VERIZON_CANONICAL_SETTINGS_URL, {
      method: 'POST',
      cache: 'no-store',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        fuelPricePerGal: fuel,
        fleetAvgMPG: mpg,
        defaultDriverRate: rate,
        source: 'fct-calc',
        appVersion: APP_VERSION
      })
    }).then(function(r){
      clearTimeout(to);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(j){
      if(!j || j.ok !== true) throw new Error('no write path');
      try{ toast('Saved for all devices — phone and computer will match.'); }catch(_){}
    }).catch(function(){
      clearTimeout(to);
      try{ toast('Saved on this device. Couldn\'t update the other one — try again on Wi-Fi.'); }catch(_){}
    });
  }catch(_){ /* never block Settings */ }
}

/* v2.1.21: POST the last N days of dispatch rows to the worker so it can
   compute calibration on its side (worker doesn't have Excel access). Sent
   once per boot after imports settle, plus after every successful sync.
   Silent — a network hiccup here is not worth interrupting the operator. */
async function pushDispatchLog(opts){
  opts = opts || {};
  const nDays = Math.max(1, Math.min(14, opts.days || 8));  // yesterday + prior week
  const li = state.dayRollup && state.dayRollup.lastImport;
  if(!li || !Array.isArray(li.rows) || !li.rows.length) return;
  // Group by date, keep the N most recent dates that have rows.
  const byDate = {};
  li.rows.forEach(r => {
    if(!r || !r.date) return;
    (byDate[r.date] = byDate[r.date] || []).push(r);
  });
  const dates = Object.keys(byDate).sort().slice(-nDays);
  if(!dates.length) return;
  const days = dates.map(date => ({
    date,
    rows: byDate[date].map(r => ({
      origin: r.origin || '',
      destination: r.deliveryPoint || r.destination || '',
      truck: r.truck || '',
      status: r.status || '',
    })),
  }));
  try {
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 15000);
    const r = await fetch(VERIZON_DISPATCH_LOG_URL, {
      method: 'POST',
      cache: 'no-store',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ days }),
    });
    clearTimeout(to);
    if(!r.ok) throw new Error('HTTP '+r.status);
    // POST invalidates the worker's calibration cache. Do NOT GET in the
    // same second — that used to return empty, flip the tile to
    // "unavailable", and drop EST by thousands. Wait, then refetch.
    // keepLastGoodCalibration covers a still-empty response.
    await new Promise(function(res){ setTimeout(res, 2500); });
    await refreshLaneCalibration();
  } catch(err){
    // Non-fatal — calc still works with whatever calibration was cached.
    if(state.laneCalibration){
      state.laneCalibration.lastPushError = String(err && err.message || err);
    }
  }
}

/* v2.1.19: HTML for the two-line "calc vs Verizon actual" fuel comparison
   that sits directly under the per-load Fuel row in the variable-components
   list. Labels the compare rows as fleet-day so nobody adds them to the
   per-load sum — those numbers live in a different plane than the row above.

   Calc basis prefers today's imported dispatch rows (sum of laneMilesFor per
   row), so the LANE_MILES model is applied load-by-load. If no rows are in
   view, falls back to loads/day × avgMilesPerLoad from Settings.

   Gap coloring:
     within ±5% → neutral (var(--text-faint))
     +5–15%     → yellow  (Verizon running higher than model)
     >+15%      → red + ⚠ prefix
   Negative gaps (model overshoots actual) stay neutral — that's the calc
   being conservative, not a fuel-burn problem.

   If Verizon miles aren't available (offline, worker 404, no data for the
   date), shows a single muted note instead of the compare rows. */
function verizonFuelCompareHTML(){
  const s = state.settings;
  const v = state.verizonMilesToday;
  const fpm = fuelPerMile();

  // Fleet-day miles on the LANE_MILES side.
  let calcMi = 0, calcSource = '';
  try {
    const rows = (state.dayRollup && state.dayRollup.currentRows) || [];
    const active = rows.filter(function(r){
      try { return typeof dayRowActive === 'function' ? dayRowActive(r) : true; }
      catch(_){ return true; }
    });
    if(active.length){
      active.forEach(function(r){
        var lm = 0;
        try { lm = laneMilesFor(r.origin, r.deliveryPoint || r.destination); }
        catch(_){ lm = 0; }
        calcMi += (lm > 0) ? lm : (Number(s.avgMilesPerLoad)||0);
      });
      calcSource = active.length + ' loads today × LANE_MILES';
    } else {
      const lpd = (Number(s.loadsPerYear)||0) / (operatingDays()||365);
      calcMi = (Number(s.avgMilesPerLoad)||0) * lpd;
      calcSource = 'model: ' + lpd.toFixed(1) + ' loads/day × ' + num(s.avgMilesPerLoad) + ' avg mi';
    }
  } catch(_){
    calcMi = 0; calcSource = 'calc unavailable';
  }
  const calcFuel = calcMi * fpm;

  if(!v || !v.ok){
    return '<div class="row" style="padding-top:2px">'
      + '<div class="row-l"><div class="row-s" style="padding-left:12px;color:var(--text-faint);font-style:italic">'
      + '⛽ Verizon miles unavailable — using LANE_MILES only'
      + (v && v.error ? ' (' + esc(String(v.error)) + ')' : '')
      + '</div></div><div class="row-v"></div></div>';
  }

  const actualFuel = (Number(v.fleetMiles)||0) * fpm;
  const gapPct = calcFuel > 0 ? ((actualFuel - calcFuel) / calcFuel) * 100 : 0;
  const absPct = Math.abs(gapPct);
  let color = 'var(--text-faint)', prefix = '';
  if(gapPct > 15){ color = 'var(--red)'; prefix = '⚠ '; }
  else if(gapPct > 5){ color = 'var(--yellow)'; }
  const sign = gapPct >= 0 ? '+' : '';
  const gapTxt = prefix + '[gap ' + sign + gapPct.toFixed(1) + '%]';

  const rowHTML = (title, sub, amount, valColor) =>
      '<div class="row" style="padding-top:2px"><div class="row-l">'
      + '<div class="row-t" style="padding-left:12px;color:var(--text-muted);font-size:13px;font-weight:500">'
      + title + '</div>'
      + '<div class="row-s" style="padding-left:12px">' + esc(sub) + '</div>'
      + '</div><div class="row-v" style="color:' + (valColor||'var(--text-muted)') + '">−'
      + money2(amount) + '</div></div>';

  return rowHTML(
      'Fuel (calc, LANE_MILES) <span style="color:var(--text-faint);font-weight:400;font-size:11px;margin-left:6px">fleet-day</span>',
      num(calcMi) + ' mi × ' + money2(fpm) + '/mi (' + calcSource + ')',
      calcFuel, 'var(--text-muted)')
    + rowHTML(
      /* v2.1.20: label the source so operator knows whether they're looking at
         Verizon's actual per-trip odometer (real) vs Haversine-between-snapshots
         (gps estimate — has a 1.20 curve fudge and interval-sampling loss). */
      'Fuel (actual, Verizon — ' + (v.source === 'real' ? 'real odo' : 'GPS estimate') + ') '
        + '<span style="color:' + color + ';font-weight:600;font-size:11px;margin-left:6px">'
        + gapTxt + '</span> <span style="color:var(--text-faint);font-weight:400;font-size:11px;margin-left:4px">fleet-day</span>',
      num(v.fleetMiles) + ' Verizon fleet mi × ' + money2(fpm) + '/mi'
        + (v.date ? ' · ' + esc(String(v.date)) : ''),
      actualFuel, color);
}
