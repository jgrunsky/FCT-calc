  gaps.forEach((g, i) => {
    const lane = (g.origin||'?') + ' → ' + (g.dest||'?');
    const meta = (g.commodity ? esc(g.commodity) + ' · ' : '')
               + g.count + ' load' + (g.count===1?'':'s');
    h += '<div class="mr-edit" data-mr-card="1"'
      + ' data-origin="'+esc(g.origin||'')+'"'
      + ' data-dest="'+esc(g.dest||'')+'"'
      + ' data-commodity="'+esc(g.commodity||'')+'">'
      + '<div class="mr-lane">'+esc(lane)+'</div>'
      + '<div class="mr-meta">'+meta+'</div>'
      + '<div class="mr-using">'+esc(missingUsingLabel(g))+'</div>'
      + '<div class="fld"><label for="mrFlat'+i+'">Rate per load ($)</label>'
      + '<input id="mrFlat'+i+'" type="number" inputmode="decimal" step="1" min="0"'
      + ' placeholder="e.g. 500" data-mr-flat autocomplete="off"></div>'
      + '<details class="mr-adv"><summary>Or bill by pound ($/lb + FSC%)</summary>'
      + '<div class="fld2">'
      + '<div class="fld"><label for="mrLb'+i+'">$ per lb</label>'
      + '<input id="mrLb'+i+'" type="number" inputmode="decimal" step="0.00001" min="0"'
      + ' placeholder="e.g. 0.00525" data-mr-lb autocomplete="off"></div>'
      + '<div class="fld"><label for="mrFsc'+i+'">FSC %</label>'
      + '<input id="mrFsc'+i+'" type="number" inputmode="decimal" step="1" min="0"'
      + ' placeholder="0" data-mr-fsc autocomplete="off"></div>'
      + '</div></details>'
      + '</div>';
  });
  h += '<div class="mr-save-bar"><button type="button" class="act" id="mrSaveAll">Save rates</button></div>'
    + '<div class="sub">Dollar per load is what most FCT bills look like. Saved on this phone — survives refresh. Cancel / × just closes.</div>';
  return h;

function parseMoneyInput(raw){
  const s = String(raw==null?'':raw).trim().replace(/[$,%\s]/g,'').replace(/,/g,'');
  if(!s) return { empty:true };
  const n = parseFloat(s);
  if(!isFinite(n)) return { error:true };
  return { value:n };
}

function readMissingRateCard(card){
  if(!card) return { skip:true };
  const origin = card.getAttribute('data-origin') || '';
  const dest = card.getAttribute('data-dest') || '';
  const commodity = card.getAttribute('data-commodity') || '';
  const lane = (origin||'?') + ' → ' + (dest||'?');
  const flatEl = card.querySelector('[data-mr-flat]');
  const lbEl = card.querySelector('[data-mr-lb]');
  const fscEl = card.querySelector('[data-mr-fsc]');
  const lb = parseMoneyInput(lbEl && lbEl.value);
  const flat = parseMoneyInput(flatEl && flatEl.value);
  const fsc = parseMoneyInput(fscEl && fscEl.value);
  if(lb.error) return { error: 'Check $ per lb on ' + lane };
  if(flat.error) return { error: 'Check $ per load on ' + lane };
  if(fsc.error) return { error: 'Check FSC % on ' + lane };
  if(fsc.value != null && fsc.value < 0) return { error: 'FSC % cannot be negative on ' + lane };
  if(!lb.empty && !(lb.value > 0)) return { error: 'Enter a $ per lb greater than 0 on ' + lane };
  if(!flat.empty && !(flat.value > 0)) return { error: 'Enter a $ per load greater than 0 on ' + lane };
  if(lb.empty && flat.empty) return { skip:true, origin:origin, dest:dest, commodity:commodity };
  if(!lb.empty){
    return {
      origin:origin, dest:dest, commodity:commodity,
      billing:'perLb', ratePerLb:lb.value,
      fscPct: fsc.empty ? 0 : fsc.value,
      flatRate:0
    };
  }
  return {
    origin:origin, dest:dest, commodity:commodity,
    billing:'flat', flatRate:flat.value, ratePerLb:0, fscPct:0
  };
}

function saveFilledMissingRates(){
  try{
    const modal = document.getElementById('lsModal');
    if(!modal) return;
    const cards = Array.prototype.slice.call(modal.querySelectorAll('[data-mr-card]'));
    if(!cards.length){ toast('Nothing to save'); return; }
    const filled = [];
    for(let i=0;i<cards.length;i++){
      const parsed = readMissingRateCard(cards[i]);
      if(parsed.error){ toast(parsed.error); return; }
      if(parsed.skip) continue;
      filled.push(parsed);
    }
    if(!filled.length){ toast('Type a dollar amount first'); return; }
    if(!state.laneRateOverrides || typeof state.laneRateOverrides !== 'object'){
      state.laneRateOverrides = {};
    }
    const now = new Date().toISOString();
    filled.forEach(function(v){
      const key = laneOverrideKey(v.origin, v.dest, v.commodity);
      state.laneRateOverrides[key] = {
        origin:v.origin, dest:v.dest, commodity:v.commodity,
        billing:v.billing, flatRate:v.flatRate||0,
        ratePerLb:v.ratePerLb||0, fscPct:v.fscPct||0,
        savedAt: now
      };
    });
    save();
    let left = 0;
    try { renderDayRollup(); } catch(_){}
    try { renderQueue(); } catch(_){}
    try { left = scanMissingRates().length; } catch(_){}
    const n = filled.length;
    toast(n===1 ? 'Rate saved' : n + ' rates saved');
    try {
      if(left){
        openLsModal('Add missing rates', drillMissingBody());
        wireMissingRatesEditor();
      } else {
        closeLsModal();
      }
    } catch(_){}
  }catch(e){
    toast('Could not save that rate');
  }
}

function wireMissingRatesEditor(){
  const btn = document.getElementById('mrSaveAll');
  if(btn) btn.addEventListener('click', saveFilledMissingRates);
  const modal = document.getElementById('lsModal');
  if(!modal) return;
  modal.querySelectorAll('[data-mr-flat],[data-mr-lb],[data-mr-fsc]').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); saveFilledMissingRates(); }
    });
  });
}

/* Dispatch a tile click to the right drill-in generator. */
function openTileDrill(tile){
  switch(tile){
    case 'revenue':      openLsModal("Today's revenue — by bucket", drillRevenueBody()); break;
    case 'fuel':         openLsModal('Fuel · calc vs actual', drillFuelBody()); break;
    case 'calibration':  openLsModal('Calibration', drillCalibrationBody()); break;
    case 'trucks':       openLsModal('Trucks reporting', drillTrucksBody()); break;
    case 'contribution': openLsModal("Today's contribution — top / bottom loads", drillContributionBody()); break;
    case 'missing':      openLsModal('Add missing rates', drillMissingBody()); wireMissingRatesEditor(); break;
    default: break;
  }
}

/* Scroll to the rows an alert names and flash them. Re-adding the class needs
   the reflow poke in between, or an already-flashed row will not replay the
   animation when the same alert is tapped twice. */
function flashRows(idxList){
  if(!idxList || !idxList.length) return;
  const els = idxList.map(i=>document.getElementById('drRow' + i)).filter(Boolean);
  if(!els.length) return;
  els.forEach(el=>{ el.classList.remove('row-flash'); void el.offsetWidth; el.classList.add('row-flash'); });
  els[0].scrollIntoView({behavior:'smooth', block:'center'});
}

function renderDayRollup(){
  const s = state.settings, d = state.dayRollup, di = state.dispatchImport;
  const li = d.lastImport;
  if(!document.querySelector(DAY_HOST)) return;   // dashboard not mounted yet

  /* ---- Landing chrome (cleanup pass, 2026-07-28) ----
     One primary action per screen.
       empty  -> a single drop-zone card, nothing else
       loaded -> one strip (day · WTD · MTD · refresh), then the sheet
     Filter-to-date and Trucks-running moved to Settings — they are config,
     not daily use. Day navigation stays here as the DATE ITSELF rendered as a
     select, so switching days costs no extra chrome. */
  /* v2.1.24 (2026-08-21): use LOCAL date, not UTC .toISOString(). In
     Pacific time between ~5pm and midnight the UTC date is already
     tomorrow, which meant MTD/WTD were being anchored to a "today" that
     doesn't exist yet locally — the range was empty at 6pm even though
     the day's loads had all landed. isoLocal() uses getFullYear/Month/Date
     which respect the browser's local timezone. */
  const todayISO = isoLocal(new Date());
  const shown = d.date || di.filterDate || todayISO;
  let h = '';
  /* Anything that must exist in the DOM but has no business above the load
     list gets appended here, at the very bottom of the page. */
  let tailHTML = '';

  if(!li){
    /* Empty state: one hero. In v1.4/v1.5 that was always the drop zone. In
       v1.6 it depends on the transport — under 'worker' the honest hero is the
       sync itself, because the operator's job is to wait, not to find a file.
       The drop zone is held back until the worker has actually failed, so a
       working pipeline never shows a file picker it does not need. */
    const src = dataSource();
    const fallback = showFileFallback();
    h += '<div class="card" style="text-align:center">';
    if(src!=='file'){
      const busy = workerState.kind==='syncing';
      const line = workerState.kind==='empty'
          ? 'The worker is up but has nothing stored yet — open the dispatch workbook and click <b>Run</b> on the Excel script.'
        : workerState.kind==='bad'
          ? 'The worker answered but '+esc(workerState.msg)+'. Re-run the Excel script, or drop the xlsx below in the meantime.'
        : workerState.kind==='offline'
          ? 'Could not reach the worker. The dispatch log can still come in by hand — drop the xlsx below.'
        : busy
          ? 'Fetching today\'s dispatch…'
          : 'Pulling today\'s dispatch straight from the worker — no file, no picker.';
      h += '<div style="font:700 18px/1.25 var(--display);margin-bottom:8px">'
        + (busy ? '⏳ Syncing' : workerState.kind==='offline' ? '🔴 Worker offline'
           : workerState.kind==='bad' ? '🔴 Bad worker reply'
           : workerState.kind==='empty' ? '🟡 No dispatch data yet' : '📡 Dispatch sync')+'</div>'
        + '<div style="font:400 11.5px/1.5 var(--body);color:var(--text-faint);max-width:34em;margin:0 auto 14px">'+line+'</div>'
        + '<div class="btn-row" style="justify-content:center"><button class="act" id="dispSyncBig"'
        + (busy?' disabled':'')+'>🔄 '+(busy?'Syncing…':'Sync now')+'</button></div>';
      if(fallback){
        h += '<div style="font:500 10px/1 var(--body);color:var(--text-faint);text-transform:uppercase;'
          + 'letter-spacing:.08em;margin:18px 0 10px">or import by hand</div>';
      }
    }
    if(fallback){
      h += '<div id="dispDrop" class="drop-zone" style="margin:0;padding:'+(src==='file'?'48px':'30px')+' 18px;font-size:16px">'
        + '📗 Drop dispatch xlsx or tap'
        + '<div style="font:400 11.5px/1.45 var(--body);color:var(--text-faint);margin-top:9px">'
        + 'Verizon Daily Timecard CSV for actual miles, or ADP Employee Daily Totals (xls) for closed-day driver pay</div></div>'
        + '<input type="file" id="dispFile" accept=".xlsx,.xlsm,.xls,.csv" multiple style="display:none">'
        + '<button type="button" id="adpPick" style="all:unset;cursor:pointer;display:inline-block;margin-top:13px;margin-right:14px;'
        + 'font:500 11px/1 var(--body);color:var(--text-faint);border-bottom:1px dotted var(--border-strong)">ADP pay</button>'
        + '<button type="button" id="dispOneDrive" style="all:unset;cursor:pointer;display:inline-block;margin-top:13px;'
        + 'font:500 11px/1 var(--body);color:var(--text-faint);border-bottom:1px dotted var(--border-strong)">Import from OneDrive</button>'
        + '<div id="oneDriveBox" style="display:none;margin-top:12px;text-align:left">'
        + '<input id="dispUrl" type="url" placeholder="OneDrive share URL" value="'+esc(di.lastUrl)+'">'
        + '<div class="btn-row" style="margin-top:8px"><button class="act ghost" id="dispFetch">Fetch</button></div></div>';
    }
    h += '<div id="dispStatus" style="font-size:11px;color:var(--text-faint);margin-top:10px"></div></div>';
    /* v2.1.34: P&L board still shows on the empty screen so dropping ADP
       immediately moves closed-day wages and MTD net — payroll is not
       buried in Settings. */
    h += pnlBoardHTML(shown);
    /* Single hero, full stop. With no file and no what-if rows there is
       nothing to total, so the sheet, the day totals, the column mapping and
       the what-if block are all suppressed — an empty grid of zeros is noise,
       not information. */
    if(!d.currentRows.length){
      $(DAY_HOST).innerHTML = h;
      wireDayRollup();
      renderQueue();
      return;
    }
  } else {
    /* ---- v2.1.22 landing header strip ----
       Five glanceable tiles (Revenue / Fuel actual / Calibration / Trucks /
       Contribution) with a manual refresh. Sits ABOVE the alerts strip because
       these are the answers James looks for first thing; alerts are the "what
       needs my attention" layer below the summary. Nothing here duplicates the
       existing Info/Settings surfaces — it just brings the same data forward. */
    h += landingStripHTML();
    /* v2.1.23: missing-rates alert — lanes with today's active loads that
       priced off a fallback (no lane match / placeholder). Silent if none. */
    h += missingRatesCardHTML();

    /* ---- v1.8 actionable-now strip ----
       Above the day picker, because it is the only thing on this page that
       answers "is anything wrong" without being read. Loaded state only: on
       the empty state the sync hero is deliberately the single hero, and a
       strip reporting nothing wrong with a day that has not arrived yet
       would be answering a question nobody asked. */
    h += alertsStripHTML(shown);

    /* Loaded: a single strip. The day name doubles as the day picker, and the
       whole strip is the drop target, so refreshing needs no dedicated zone. */
    const lbl = dowDateLabel;
    /* v2.0.1 (2026-08-05, James report): WTD/MTD are anchored to TODAY, not
       to the day in the picker. Before this fix the header called
       runningTotals(shown), so scrolling the day picker back to Aug 1 made
       MTD read the same $-355 as the day's P&L (Aug 1 is both week-start
       and month-start, so the range collapsed to a single day). MTD should
       always cover month-start(today) → today, regardless of which day is
       being inspected below. Same fix applied to WTD — same class of bug. */
    const rtLive = runningTotals(todayISO);
    const dTodayLive = (typeof computeDay === 'function') ? computeDay() : null;
    const boardLive = (typeof buildPnlBoard==='function') ? buildPnlBoard(shown) : null;
    const dayOpsLive = boardLive && boardLive.day
      ? ((typeof pnlChipOpsNet==='function') ? pnlChipOpsNet(boardLive.day) : Number(boardLive.day.opsNet))
      : (dTodayLive ? dTodayLive.net : null);
    const daySrcLive = boardLive && boardLive.day
      ? ((boardLive.day.adpDays && boardLive.day.estDriverDays) ? 'MIX'
          : boardLive.day.adpDays ? 'ADP' : 'EST')
      : (dTodayLive && dTodayLive.totals && dTodayLive.totals.varSource);
    const estHold = (typeof estChipView==='function')
      ? estChipView({
          dayNet: dayOpsLive,
          daySrc: daySrcLive,
          cm: dTodayLive && dTodayLive.totals ? dTodayLive.totals.cm : null,
          week: (boardLive && boardLive.wtd) || (rtLive && rtLive.week),
          month: (boardLive && boardLive.mtd) || (rtLive && rtLive.month)
        })
      : { pending:false };
    const rt = estHold.pending ? { week:null, month:null, weekStart: rtLive && rtLive.weekStart, monthStart: rtLive && rtLive.monthStart }
             : { week: estHold.week || (boardLive && boardLive.wtd) || (rtLive && rtLive.week),
                 month: estHold.month || (boardLive && boardLive.mtd) || (rtLive && rtLive.month),
                 weekStart: rtLive && rtLive.weekStart, monthStart: rtLive && rtLive.monthStart };
    const dToday = dTodayLive;
    const daySrc = estHold.pending ? 'EST'
                 : (estHold.daySrc || daySrcLive || (dToday && dToday.totals && dToday.totals.varSource));
    const dayNet = estHold.pending ? null
                 : (estHold.dayNet!=null ? estHold.dayNet : dayOpsLive);
    const dayTile = dToday ? '<span style="white-space:nowrap" title="'
      + esc(estHold.pending
          ? 'Waiting for calibration / ADP / Verizon miles so EST does not jump on open.'
          : ('DAY ops net (same as P&L Day): '+dToday.totals.loads+' booked / '+(dToday.totals.activeLoads!=null?dToday.totals.activeLoads:dToday.totals.loads)+' planned'
        + ', '+money(dToday.totals.revenue)+' books (driver + freight bill)'
        + ((dToday.totals.planLoads||0) ? ', plan '+money(dToday.totals.planRevenue)+' not in books' : '')
        + ' → '+money(dayNet)+' ops net (rev − wages − fuel − fixed). After wear is on the P&L board and is not this chip'
        + (daySrc==='ADP' ? ('. Driver wages from ADP '+money(dToday.totals.driverCost)+' / '+num(dToday.totals.hours,1)+' hr.')
                          : '. Driver wages estimated (hours × loaded $/hr).')))+'">'
      + (estHold.pending ? '<span class="chip y">EST</span> DAY <b class="num">…</b>'
        : ((daySrc==='ADP' ? '<span class="chip g">ADP</span> ' : '<span class="chip y">EST</span> ')
      + 'DAY <b class="num" style="color:'
      + (dayNet>=0?'var(--green)':'var(--red)')+'">'
      + (dayNet>=0?'+':'')+money(dayNet)+'</b>'))+'</span>' : '';
    /* v2.1.24 (2026-08-21): tooltip on the WTD/MTD tiles makes it explicit
       that these tiles are LOCKED to today and do not follow the picker.
       Prior behavior was already anchored (v2.0.1), but users scrolling
       the picker to a future date would see the numbers stay put and
       wonder if the picker was broken. The title spells out the range. */
    const todayHuman = (function(){
      try{
        const d = new Date(todayISO+'T00:00:00');
        return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      }catch(_){ return todayISO; }
    })();
    const mini = (t,x,fullName)=>{
      if(estHold && estHold.pending){
        return '<span style="white-space:nowrap" title="Waiting for calibration / ADP / Verizon miles so EST does not jump on open.">'
          + '<span class="chip y">EST</span> '+t+' <b class="num">…</b></span>';
      }
      if(!x) return '';
      const varSource = x.varSource
        || ((x.adpDays && (x.estDriverDays||x.estDays)) ? 'MIX'
            : x.adpDays ? 'ADP' : 'EST');
      const ops = (typeof pnlChipOpsNet==='function')
        ? pnlChipOpsNet(x)
        : ((x.opsNet!=null) ? Number(x.opsNet) : Number(x.net)||0);
      const mark = varSource==='ADP' ? '<span class="chip g">ADP</span> '
                 : varSource==='MIX' ? '<span class="chip a">ADP+EST</span> '
                 : '<span class="chip y">EST</span> ';
      const why = varSource==='ADP'
        ? ' Driver wages from ADP actuals on each closed day, then summed.'
        : varSource==='MIX'
          ? ' '+(x.adpDays||0)+' closed day'+((x.adpDays||0)===1?'':'s')+' on ADP; '+(x.estDriverDays||x.estDays||0)+' estimated (today stays EST until you re-drop after close).'
          : ' Driver wages still hours × loaded $/hr — drop the ADP Daily Totals file to replace closed days.';
      return '<span style="white-space:nowrap" title="'
        + esc(fullName+'-to-date ops net through today ('+todayHuman+'). Same number as P&L '+fullName+' to date ops net. After wear is fully loaded and is not this chip. Locked to today regardless of the day picker above.'+why)+'">'
        + mark + t+' <b class="num" style="color:'
        + (ops>=0?'var(--green)':'var(--red)')+'">'+(ops>=0?'+':'')+money(ops)+'</b></span>';
    };
    h += '<div class="card" id="dispDrop" style="padding:10px 14px;margin-bottom:12px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'
      + '<div style="display:flex;align-items:center;gap:7px;min-width:0">'
      + (li.dates.length>1
          ? '<select id="dayDatePick" style="width:auto;padding:3px 4px;font:700 16px/1.2 var(--display);'
            + 'background:transparent;border:0;color:var(--text)">'
            + li.dates.map(x=>'<option value="'+esc(x.date)+'"'+(x.date===shown?' selected':'')+'>'+esc(lbl(x.date))+'</option>').join('')
            + '</select>'
          : '<span style="font:700 16px/1.2 var(--display)">'+esc(lbl(shown))+'</span>')
      + (shown===todayISO?'<span class="chip g">TODAY</span>':'')
      + workerPillHTML()
      + verizonPillHTML(shown)
      + adpPillHTML(shown)
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:11px;font-size:11px;color:var(--text-muted);flex-wrap:wrap">'
      + dayTile + mini('WTD', rt&&rt.week, 'Week') + mini('MTD', rt&&rt.month, 'Month')
      /* v1.6: two refresh controls, deliberately distinct. 🔄 re-pulls the
         dispatch log from the worker — the everyday one, so it is hidden only
         in file mode. ↻ opens the file picker and stays in EVERY mode: the
         Verizon Daily Timecard still arrives as a file whatever the dispatch
         transport is, and on a phone that button is the only way to hand it
         over — drag-and-drop is not a gesture a phone has. */
      + (dataSource()!=='file'
          ? '<button type="button" id="dispSync" title="Re-fetch the dispatch log from the worker" style="all:unset;cursor:pointer;'
            + 'padding:4px 8px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text-muted);font-size:13px">🔄</button>'
          + '<button type="button" id="dispForceSync" title="Open the dispatch Excel in a background tab (which fires the push script), then re-sync. Uses the SharePoint URL you\'ve saved in Settings." style="all:unset;cursor:pointer;'
            + 'padding:4px 8px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text-muted);font-size:13px" title="Force full sync">⚡</button>'
          : '')
      + '<button type="button" id="dispPick" title="'
      + (dataSource()==='worker' ? 'Import a file — Verizon timecard CSV, dispatch xlsx, or ADP Daily Totals'
                                 : 'Import dispatch xlsx, Verizon timecard CSV, or ADP Daily Totals')
      + '" style="all:unset;cursor:pointer;'
      + 'padding:4px 8px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text-muted);font-size:13px">↻</button>'
      + '<button type="button" id="adpPick" title="Import ADP Employee Daily Totals (field-driver pay). Replaces that date range; does not wipe dispatch."'
      + ' style="all:unset;cursor:pointer;padding:4px 8px;border-radius:4px;border:1px solid var(--border-strong);'
      + 'color:var(--text-muted);font:700 10px/1 var(--body);letter-spacing:.04em">ADP</button>'
      + '</div></div>'
      + '<input type="file" id="dispFile" accept=".xlsx,.xlsm,.xls,.csv" multiple style="display:none">'
      + '<div id="dispStatus" style="font-size:10px;color:var(--text-faint)"></div></div>';
    /* ---- Backward planning (v1.4, kept + narrowed in v1.7) ----
       Spec.md's north-star item 4: tonight's afternoon has to carry
       tomorrow's pre-6am commitments. One line, directly under the day
       strip, because it is the one thing on this screen that is about a
       decision to make NOW rather than a number to read.

       v1.7 gave those same loads a section of their own further down the
       page, which makes this a SUMMARY rather than the only evidence — so
       it now says "the detail is below" instead of restating the list, and
       it is silent whenever Section 2 is empty. Both read the same rows
       through preloadSectionRows(), so the count here always matches the
       count on the banner down there. */
    const plan = tomorrowPreloadPlan(shown);
    if(plan && plan.preloads){
      const arith = plan.preloads+' × '+num(plan.perLoad,1)+' hr preload = '+num(plan.needHrs,1)+' hr needed · '
        + plan.crew+' driver'+(plan.crew===1?'':'s')+' on shift this afternoon'
        + (plan.busyDrivers ? ', '+plan.busyDrivers+' already on one of today\'s '+plan.pmLoads+' PM loads' : '')
        + ' → '+plan.freeDrivers+' free × '+num(plan.perDrv,1)+' hr = '+num(plan.spareHrs,1)+' hr spare';
      const jump = ' <a href="#preSection" style="color:inherit;text-decoration:underline dotted">'
        + 'See them in Section 2 below ↓</a>';
      h += plan.ok
        ? '<div class="banner" style="background:var(--green-bg);border:1px solid color-mix(in oklab,var(--green) 45%,transparent);'
          + 'color:#c4e0c3;margin-bottom:12px" title="'+esc(arith)+'">'
          + '<b style="color:var(--green)">✓ Tomorrow preload capacity OK</b>'
          + shortDateLabel(plan.tomorrow)+' needs '+plan.preloads+' pre-6am preload'+(plan.preloads===1?'':'s')
          + ' (~'+num(plan.needHrs,1)+' hrs). This afternoon has ~'+num(plan.spareHrs,1)+' hrs spare.'+jump+'</div>'
        : '<div class="banner" style="background:var(--yellow-bg);border:1px solid color-mix(in oklab,var(--yellow) 45%,transparent);'
          + 'color:var(--yellow);margin-bottom:12px" title="'+esc(arith)+'">'
          + '<b>⚠️ Tomorrow needs '+plan.preloads+' pre-6am preload'+(plan.preloads===1?'':'s')
          + ' → reserve ~'+num(plan.needHrs,1)+' hrs of driver capacity today</b>'
          + 'This afternoon has '+plan.freeDrivers+' of '+plan.crew+' on-shift driver'+(plan.crew===1?'':'s')
          + ' free — ~'+num(plan.spareHrs,1)+' hrs against '+num(plan.needHrs,1)
          + ' needed, short by '+num(plan.needHrs-plan.spareHrs,1)+' hrs. Those loads deliver before 6am on '
          + shortDateLabel(plan.tomorrow)+', so they have to be on a trailer before the origins close tonight.'
          + jump+'</div>';
    }

    tailHTML += '<details><summary>Import from a OneDrive link</summary><div style="margin-top:10px">'
      + '<div class="fld"><input id="dispUrl" type="url" placeholder="OneDrive share URL" value="'+esc(di.lastUrl)+'"></div>'
      + '<div class="btn-row"><button class="act ghost" id="dispFetch">Fetch</button></div></div></details>';
  }


  /* v2.1.34: P&L board is the thing James looks at — revenue, ADP driver
     wages, Verizon fuel, wear, fixed, contribution, net. Above the sheet
     so payroll is not a trophy chip or a Settings page. Day follows the
     picker; MTD/WTD stay locked to today. Empty-state already rendered
     this card above; loaded state adds it here. */
  if(li) h += pnlBoardHTML(shown);

  /* ---- 4. The dispatch sheet ----
     Laid out to mirror the 2026 FCT Dispatch Log: same column order, same
     banner grouping, loosely the same fill colours, with revenue / variable
     / contribution added on the right. Read-only by default so the day reads
     at a glance; the Edit toggle turns the money cells into inputs.

     v1.7 renders TWO sections in this one table:
       Section 1  d.currentRows — this day's banner. Owns the totals.
       Section 2  the next day's pre-6am rows, prepped this afternoon. Read
                  only, no totals, money muted, because none of it is today's.
     Section 2 lives in a module-level array rather than in state, so it costs
     no storage and cannot be confused for a day row by anything downstream —
     computeDay, the queue, the snapshots and the Verizon matcher all keep
     reading currentRows and see exactly what they saw in v1.6. */
  const S = sheetSections(d.currentRows);
  dayPreloadRows = preloadSectionRows(shown);
  // v1.8.5: reset cap + seed with already-assigned drivers (JJ's night-before
  // preloads and any hand-typed assignments) so they count against their 2-slot cap
  resetSuggestionLog();
  seedAssignedDriverSlots(d.currentRows);
  seedAssignedDriverSlots(dayPreloadRows);
  precomputeSuggestions((d.currentRows||[]).concat(dayPreloadRows||[]));
  /* v1.5: the four Actual columns appear only when a Verizon CSV covers the
     day in view. With no timecard they are not rendered empty — they are not
     rendered at all, and the sheet is the v1.4 twelve columns. */
  const vzM = verizonMatch();
  const showAct = !!(vzM && vzM.matched);
  const NCOL = showAct ? 16 : 12;
  // v1.8.20 / v2.1.30: Trailer status — In Use / Preloaded / In Yard, with
  // manual "done" toggle per pair (moves that pair to Yard). Rendered AFTER
  // the dispatch sheet and collapsed by default so the Excel layout is what
  // James scans first. Trailer math itself is unchanged.
  const trl = computeTrailerStatus(d.currentRows.concat(dayPreloadRows||[]), d.date);
  const allRows = d.currentRows.concat(dayPreloadRows||[]);
  const mkChip = (p, bg, color, mark) => {
    const comm = trailerLastCommodity(p, allRows);
    const note = TRAILER_NOTES[p];
    // v1.8.27: annotation line — prefer the operational note (RED TAG, @ CNP,
    // TORN TARP) when present, otherwise fall back to last commodity hauled.
    let annotation = null;
    let annoStyle = 'opacity:0.75';
    if(note){
      annotation = note.text;
      if(note.flag === 'red-tag')     annoStyle = 'color:#ff7676;font-weight:700;opacity:1';
      else if(note.flag === 'warn')   annoStyle = 'color:#e8c470;font-weight:600;opacity:1';
      else                            annoStyle = 'opacity:0.85;font-weight:600';
    } else if(comm){
      annotation = String(comm).slice(0,22);
    }
    const annoTxt = annotation
      ? '<div style="font:400 10px/1.2 var(--body);margin-top:2px;letter-spacing:0;'+annoStyle+'">'+esc(annotation)+'</div>'
      : '';
    return '<span style="display:inline-flex;flex-direction:column;padding:4px 6px 4px 8px;margin:2px;border-radius:4px;background:'+bg+';color:'+color+'">'
      + '<span style="display:inline-flex;align-items:center;gap:6px">'+esc(p)
      + (mark==='use' ? '<button type="button" class="trl-done" data-trl="'+esc(p)+'" title="Trailer is back — move to yard" style="all:unset;cursor:pointer;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,0.25);color:inherit;font-size:10px;font-weight:600">✓</button>' : '')
      + (mark==='yard-restore' ? '<button type="button" class="trl-undone" data-trl="'+esc(p)+'" title="Move back to In Use" style="all:unset;cursor:pointer;padding:1px 6px;border-radius:3px;background:rgba(0,0,0,0.25);color:inherit;font-size:10px;font-weight:600">↩</button>' : '')
      + '</span>'
      + annoTxt
      + '</span>';
  };
  const trlSumBits = [trl.inUse.length+' in use', trl.preloaded.length+' preloaded', trl.yard.length+' in yard'];
  if(trl.atCustomer.length) trlSumBits.push(trl.atCustomer.length+' at customer');
  if(trl.redTag.length) trlSumBits.push(trl.redTag.length+' red tag');
  const trlHTML = '<details class="card trl-fold" id="trlStatusCard"'+(trailerStatusOpen?' open':'')+'>'
    + '<summary>Trailer status '
    + '<span class="trl-sum-n">'+esc(trlSumBits.join(' · '))+' · '+trl.rosterSize+' roster</span></summary>'
    + '<div class="trl-body">'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px">'
    + '<div style="background:var(--bg-inset);border-radius:6px;padding:12px">'
      + '<div style="font:600 11px/1.2 var(--body);color:var(--amber);text-transform:uppercase;letter-spacing:.05em">🚛 In Use ('+trl.inUse.length+')</div>'
      + '<div style="margin-top:8px;font:600 12px/1.7 var(--mono)">'
      + (trl.inUse.length? trl.inUse.map(p=>mkChip(p, '#3a2a1a', 'var(--amber)', 'use')).join('') : '<span style="color:var(--text-faint);font-family:var(--body);font-weight:400">none on the road</span>')
      + '</div></div>'
    + '<div style="background:var(--bg-inset);border-radius:6px;padding:12px">'
      + '<div style="font:600 11px/1.2 var(--body);color:var(--blue);text-transform:uppercase;letter-spacing:.05em">📦 Preloaded ('+trl.preloaded.length+')</div>'
      + '<div style="margin-top:8px;font:600 12px/1.7 var(--mono)">'
      + (trl.preloaded.length? trl.preloaded.map(p=>mkChip(p, '#1a2a3a', 'var(--blue)', 'use')).join('') : '<span style="color:var(--text-faint);font-family:var(--body);font-weight:400">nothing preloaded</span>')
      + '</div></div>'
    + '<div style="background:var(--bg-inset);border-radius:6px;padding:12px">'
      + '<div style="font:600 11px/1.2 var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.05em">🏠 In Yard ('+trl.yard.length+')</div>'
      + '<div style="margin-top:8px;font:600 12px/1.7 var(--mono)">'
      + (trl.yard.length? trl.yard.map(p=>mkChip(p, '#1a3a2a', '#7cd9a0')).join('') : '<span style="color:var(--text-faint);font-family:var(--body);font-weight:400">roster fully deployed</span>')
      + '</div></div>'
    + '</div>'
    // v1.8.27: separate rows for red-tagged and at-customer trailers
    + (trl.atCustomer.length ? '<div style="margin-top:12px;background:var(--bg-inset);border-radius:6px;padding:10px 12px">'
        + '<div style="font:600 11px/1.2 var(--body);color:var(--purple);text-transform:uppercase;letter-spacing:.05em">🏢 At Customer ('+trl.atCustomer.length+')</div>'
        + '<div style="margin-top:6px;font:600 12px/1.7 var(--mono)">'
        + trl.atCustomer.map(p=>mkChip(p, '#2a1a3a', '#c8a7e8')).join('')
        + '</div></div>' : '')
    + (trl.redTag.length ? '<div style="margin-top:12px;background:var(--bg-inset);border-radius:6px;padding:10px 12px">'
        + '<div style="font:600 11px/1.2 var(--body);color:#ff7676;text-transform:uppercase;letter-spacing:.05em">🚫 Red Tag / Out of Service ('+trl.redTag.length+')</div>'
        + '<div style="margin-top:6px;font:600 12px/1.7 var(--mono)">'
        + trl.redTag.map(p=>mkChip(p, '#3a1a1a', '#ff9d9d')).join('')
        + '</div></div>' : '')
    + (trl.done.length ? '<div style="margin-top:12px;font-size:11px;color:var(--text-muted)">Manually marked done: '+trl.done.map(p=>mkChip(p, '#252d38', 'var(--text-muted)', 'yard-restore')).join('')+'</div>' : '')
    + (trl.unknown.length ? '<div style="margin-top:10px;font-size:11px;color:var(--amber)">⚠ Unrecognized pair'+(trl.unknown.length>1?'s':'')+' on today\'s sheet: '+trl.unknown.map(esc).join(', ')+'. New equipment or typo — not counted against yard availability.</div>' : '')
    + '<div style="margin-top:10px;font-size:11px;color:var(--text-faint)">Tap ✓ done when a trailer\'s physically back at yard. Roster '+trl.rosterSize+' = In Use '+trl.inUse.length+' + Preloaded '+trl.preloaded.length+' + Yard '+trl.yard.length+' + At Customer '+trl.atCustomer.length+' + Red Tag '+trl.redTag.length+'.</div>'
    + '</div></details>';
  h += '<div class="card sheet-card"><h2>Dispatch sheet'
    + '<button type="button" id="daySheetEdit" style="float:right;all:unset;cursor:pointer;font:600 10px/1 var(--body);'
    + 'letter-spacing:.06em;padding:5px 9px;border-radius:4px;background:'+(dayEditMode?'var(--accent)':'var(--bg-inset)')
    + ';color:'+(dayEditMode?'var(--accent-fg)':'var(--text-muted)')+'">'+(dayEditMode?'✓ EDITING':'✎ EDIT')+'</button>'
    // v1.8.6: Diamond-only filter toggle (Steve dispatches POC, James dispatches Diamond)
    + '<button type="button" id="dayDiamondFilter" style="float:right;all:unset;cursor:pointer;font:600 10px/1 var(--body);'
    + 'letter-spacing:.06em;padding:5px 9px;margin-right:6px;border-radius:4px;background:'
    + (dayDiamondOnly?'var(--accent)':'var(--bg-inset)')
    + ';color:'+(dayDiamondOnly?'var(--accent-fg)':'var(--text-muted)')+'" title="Hide POC-brokered loads (Steve\'s scope)">'
    + (dayDiamondOnly?'💎 DIAMOND ONLY':'⚡ ALL LOADS')+'</button>'
    + '</h2>';
  // v1.8.6: notice showing hidden count when filter is on
  if(dayDiamondOnly && S.hiddenPoc > 0){
    h += '<div style="font-size:11px;color:var(--yellow);margin:-6px 0 10px;padding:6px 10px;background:var(--yellow-bg);border-radius:4px">'
      + '👁 '+S.hiddenPoc+' POC-brokered load'+(S.hiddenPoc===1?'':'s')+' hidden (Steve\'s scope). Toggle "ALL LOADS" to see them.</div>';
  }

  if(!d.currentRows.length){
    h += '<div class="empty">No loads for this day.<br>Import the dispatch log above and pick a date — or open <b>One-off what-if load</b> below to price a single offer that is not on the sheet.</div>';
  } else {
    const bannerRow = (cls, text, n)=>
      '<tr class="bnr '+cls+'"><td colspan="'+NCOL+'">'+esc(text)
      + (n!=null?'<span class="bnr-n">'+n+' load'+(n===1?'':'s')+'</span>':'')+'</td></tr>';

    /* `mode` is 'sec2' for a tomorrow's-preload row and undefined otherwise.
       A Section-2 row is drawn from the SAME builder so the two sections stay
       column-identical, but three things change: it never gets edit controls
       (its index addresses li.rows, not currentRows, so an index-based handler
       would write to the wrong record), its money is muted, and its data-i is
       string-keyed 'p<n>' so refreshDay's numeric Section-1 selectors cannot
       collide with it. Editing a preload row is done on tomorrow's view, where
       it is a first-class day row. */
    const loadRow = (rec, mode)=>{
      const r = rec.r, i = rec.i;
      const pre = mode==='sec2';
      const key = pre ? 'p'+i : String(i);
      const editable = dayEditMode && !pre;
      const stCls = statusClass(r.status);
      const delivered = /DELIVER/i.test(String(r.status||''));
      const bucket = r.bucket||'diamond';
      const bTitle = (r.bucketWhy? bucketMeta(bucket).label+' — '+r.bucketWhy : bucketMeta(bucket).label);
      const drvWarn = (r.driverRaw && !r.driver)
        ? ' title="Sheet says &quot;'+esc(r.driverRaw)+'&quot; — no roster match, using the default rate"' : '';
      // v1.8.16 / v2.1.30: Driver cell mirrors the dispatch Excel — PRIMARY /
      // SECONDARY pairing, blank/— until James actually assigns someone.
      /* v1.8: a stable per-row DOM id so an alert chip can scroll to and flash
         the exact rows it counted. Section 2 gets its own prefix — its index
         addresses dayPreloadRows, not currentRows, and a collision would flash
         the wrong load. */
      let row = '<tr id="'+(pre?'drPreRow':'drRow')+i+'" class="sheet-load bk-'+bucket+(delivered?' row-del':'')+(pre?' pre-row':'')+'">'
        + '<td class="c-time" title="'+esc(bTitle)+'">'
        + (editable ? '<button type="button" class="del" data-del="'+i+'" style="padding:3px 6px;font-size:11px" title="Remove">✕</button> ' : '')
        + esc(r.time || r.timeRaw || '—')
        + ruleChipsHTML(r, mode)+'</td>'
        + '<td class="c-po">'+esc(r.po||'—')+'</td>'
        + '<td class="c-drv"'+drvWarn+'>'+driverSheetHTML(r)
        + ((r.driverRaw&&!r.driver)?' <span style="color:var(--amber)">⚠</span>':'')
        + sheetMetaHTML(r)+'</td>'
        + '<td class="c-orig">'+esc(r.origin||'—')+'</td>'
        + '<td class="c-fb">'+esc(r.fb||'—')+'</td>'
        + '<td class="c-comm">'+esc(String(r.commodity||'—').slice(0,26))
        + (editable
            ? '<br><select class="cell" data-dr="bucket" data-i="'+i+'" style="margin-top:4px">'
              + LOAD_BUCKETS.map(b=>'<option value="'+b.k+'"'+(b.k===bucket?' selected':'')+'>'+esc(b.label)+'</option>').join('')
              + '</select>'
            : (r.custLabel?'<br><span style="font-size:10px;color:'+bucketMeta(bucket).color+'">'+esc(r.custLabel)+'</span>':''))
        + '</td>'
        + '<td class="c-truck">'+esc(r.truck||'—')+'</td>'
        + '<td class="c-st'+(stCls?' '+stCls:'')+'">'+esc(r.status||'')+'</td>'
        /* The Send-dispatch stub rides in the Suggested-driver cell because it
           texts that suggestion. Section 2 is excluded: those trailers are
           being built tonight by the PM crew off tomorrow's list, so a
           "who takes this load" text against today's roster would be wrong. */
        + '<td class="c-sug">'+suggestCellHTML(r)+(pre?'':smsButtonHTML(r))+'</td>';
      if(editable){
        row += '<td class="c-rev"><input class="cell" type="number" inputmode="decimal" step="10" data-dr="revenueOverride" data-i="'+i+'" '
             + 'value="'+esc(r.revenueOverride)+'" placeholder="auto"></td>'
             + '<td class="c-var"><input class="cell" type="number" inputmode="decimal" step="10" data-dr="varCostOverride" data-i="'+i+'" '
             + 'value="'+esc(r.varCostOverride)+'" placeholder="auto"></td>';
      } else {
        const t = pre ? ' title="'+esc('Booked to '+(r.date||'the delivery day')+', not today. Shown for the crew doing the prep.')+'"' : '';
        row += '<td class="money c-rev dr-rev" data-i="'+key+'"'+t+'>—</td>'
             + '<td class="money c-var dr-var" data-i="'+key+'"'+t+'>—</td>';
      }
      row += '<td class="money c-cm dr-cm" data-i="'+key+'">—</td>';
      /* v1.5 actuals. A matched row gets four measured cells; an unmatched one
         gets a single "?" spanning them, so the reason it has no actuals is
         visible on the row rather than left as four blanks to interpret.
         A Section-2 row can never match: the timecard in hand covers the day in
         view, and this load runs tomorrow. Say that rather than reusing the
         Section-1 reasons, none of which apply. */
      if(showAct){
        if(pre){
          row += '<td colspan="4" class="vz-none" title="'+esc('This load delivers on '+(r.date||'the next day')
            + '. The timecard loaded here covers '+(d.date||'the day in view')+', so there is nothing measured to match it to yet.')
            + '">—</td>';
        } else {
          const vz = verizonFor(r);
          if(vz){
            row += '<td class="money dr-ahr" data-i="'+key+'">—</td>'
                 + '<td class="money dr-ami" data-i="'+key+'">—</td>'
                 + '<td class="money dr-avar" data-i="'+key+'">—</td>'
                 + '<td class="money dr-acm" data-i="'+key+'">—</td>';
          } else {
            row += '<td colspan="4" class="vz-none" title="'+esc(vzNoMatchWhy(r))+'">?</td>';
          }
        }
      }
      row += '</tr>';
      return row;
    };
    const sec2Row = rec=>loadRow(rec, 'sec2');

    /* v2.0.8: explicit <colgroup> to lock column widths across days. Widths come from
       the live probe of the auto-layout table (Thu Aug 6) with ~5% padding so a day
       with slightly longer content in a column doesn't clip. Actual-hrs columns are
       only emitted when showAct is on, matching the header row exactly. */
    h += '<div class="sheet-wrap"><table class="sheet'+(dayEditMode?' editing':'')+'">'
      + '<colgroup>'
      + '<col style="width:260px"><col style="width:110px"><col style="width:190px">'
      + '<col style="width:165px"><col style="width:105px"><col style="width:220px">'
      + '<col style="width:145px"><col style="width:185px"><col style="width:160px">'
      + '<col style="width:120px"><col style="width:100px"><col style="width:130px">'
      + (showAct
          ? '<col style="width:90px"><col style="width:90px"><col style="width:115px"><col style="width:130px">'
          : '')
      + '</colgroup>'
      + '<thead><tr>'
      + '<th class="c-time">Time</th><th class="c-po">PO / Rel #</th><th class="c-drv">Driver</th><th class="c-orig">Origin</th><th class="c-fb">FB #</th>'
      + '<th class="c-comm">Commodity</th><th class="c-truck">Truck</th><th class="c-st">Status</th><th class="c-sug">Suggested driver</th>'
      + '<th class="n c-rev">Est. Revenue</th><th class="n c-var">Variable</th><th class="n c-cm">Contribution</th>'
      + (showAct
          ? '<th class="n vz-h">Actual Hrs</th><th class="n vz-h">Actual Mi</th>'
            + '<th class="n vz-h">Actual Variable</th><th class="n vz-h">Actual Contribution</th>'
          : '')
      + '</tr></thead><tbody>';

    /* A banner with an explanatory second line. The plain bannerRow above is
       enough for "D.P. RIPON"; the two v1.7 blocks are the only ones on this
       sheet whose relationship to the date banner needs stating. */
    const bannerRow2 = (cls, text, sub, n, id)=>
      '<tr class="bnr '+cls+'"'+(id?' id="'+id+'"':'')+'><td colspan="'+NCOL+'">'+esc(text)
      + (n!=null?'<span class="bnr-n">'+n+' load'+(n===1?'':'s')+'</span>':'')
      + '<span class="bnr-sub">'+sub+'</span></td></tr>';

    /* Date banner, then the sheet's own section order. */
    const dt = dateFromISO(d.date);
    const dateLabel = dt
      ? DOW_LONG[dt.getDay()].toUpperCase()+'  '+MONTH_NAMES[dt.getMonth()].toUpperCase()+' '+dt.getDate()+', '+dt.getFullYear()
      : (d.date||'NO DATE');
    h += bannerRow('bnr-date sticky-date', dateLabel, d.currentRows.length);

    /* ---- Section 1 ----
       The pre-6am block first. These deliver today but were built on a trailer
       yesterday afternoon, so they are today's revenue and NOT today's
       capacity — showing them among the loads still in play would overstate
       what the morning has left to give. */
    if(S.preloaded.length){
      const prepped = shortDateLabel(prevDayISO(d.date));
      h += bannerRow2('bnr-lock', '🔒 PRELOADED — prepped '+(prepped||'the afternoon before')+' PM',
            'Delivering 12:00am–'+fmtMins(PRELOAD_LOCK_END_MIN)+', so they were committed by that afternoon\'s list '
            + 'before the origins closed. Full revenue on this day — they deliver today — but they are not capacity '
            + 'this morning can re-plan.', S.preloaded.length)
        + S.preloaded.map(rec=>loadRow(rec)).join('');
    }
    if(S.above.length){
      h += S.above.map(rec=>loadRow(rec)).join('');
    }
    if(S.lathrop.length){
      h += bannerRow('bnr-lath','D.P. LATHROP', S.lathrop.length) + S.lathrop.map(rec=>loadRow(rec)).join('');
    }
    if(S.ripon.length){
      h += bannerRow('bnr-ripo','D.P. RIPON', S.ripon.length) + S.ripon.map(rec=>loadRow(rec)).join('');
    }
    if(S.other.length){
      h += bannerRow('bnr-other','OTHER DELIVERY POINTS', S.other.length) + S.other.map(rec=>loadRow(rec)).join('');
    }
    if(S.manual.length){
      h += bannerRow('bnr-other','WHAT-IF (not on the sheet)', S.manual.length) + S.manual.map(rec=>loadRow(rec)).join('');
    }
    /* v1.7: the totals block moves from <tfoot> to a <tbody> of its own. It has
       to sit ABOVE Section 2 — those totals are Section 1's, and a Section 2
       drawn above them would read as being inside them — and HTML only allows
       one tfoot, at the end. Three tbodies in document order says exactly what
       is meant. Nothing styled tfoot; the row classes carry all of it. */
    h += '</tbody><tbody id="sheetFoot"></tbody>';

    /* ---- Section 2 ----
       Its own tbody, last, under a banner that names the day these actually
       deliver. Every figure in it is greyed and excluded from the totals
       immediately above. */
    if(dayPreloadRows.length){
      const tom = nextDayISO(d.date);
      const preHrs = dayPreloadRows.length * (Number(s.preloadHrsPerLoad)>0 ? Number(s.preloadHrsPerLoad) : 2.5);
      h += '<tbody>'
        + bannerRow2('bnr-pre', '📦 TOMORROW\'S PRELOADS — prep today PM',
            'These carry the <b>'+esc(dowDateLabel(tom))+'</b> date banner and deliver before 6am, so they have to be on '
            + 'a trailer before the origins close this afternoon. <b>They are this afternoon\'s work — about '
            + num(preHrs,1)+' driver-hrs — but not this day\'s money.</b> Their revenue books on '
            + esc(shortDateLabel(tom))+', which is the day they deliver, so the figures below are shown greyed and are '
            + 'excluded from every total on this page.', dayPreloadRows.length, 'preSection')
        + dayPreloadRows.map((r,ix)=>sec2Row({r:r, i:ix})).join('')
        + '</tbody>';
    }
    h += '</table></div>';
  }
  h += '<div class="legend">Laid out to match the dispatch log — date banner, the non-Diamond loads that sit above the '
    + 'delivery-point banners, then D.P. Lathrop and D.P. Ripon. The coloured stripe on the left of each row is its '
    + 'category: <span style="color:var(--amber)">■</span> Diamond · <span style="color:var(--accent)">■</span> steady · '
    + '<span style="color:var(--purple)">■</span> seasonal · <span style="color:var(--blue)">■</span> spot.<br><br>'
    + '<b>Pricing:</b> Diamond loads book at '+money(revenuePerLoad())+', other categories at their rate from '
    + 'Settings → Load categories. A <b>~</b> next to a revenue figure means it is still a placeholder rate. '
    + 'Variable is '+money(variableCostPerLoad())+'/load. Tap <b>✎ Edit</b> to override a row or move it to another category.<br><br>'
    + '<b>Dispatch rules (v1.4):</b> <span class="rchip r">⚠️ past origin cutoff</span> the appointment is more than '
    + CUTOFF_NEAR_MIN+' min after the origin closes — PNG '+fmtMins(ORIGIN_CUTOFFS.PNG)+' · ARA '+fmtMins(ORIGIN_CUTOFFS.ARA)
    + ' · FCG '+fmtMins(ORIGIN_CUTOFFS.FCG)+' — so it cannot be live-loaded. '
    + '<span class="rchip a">⏰ near cutoff</span> within '+CUTOFF_NEAR_MIN+' min either side of it. '
    + '<span class="rchip y">⬢ #106</span> super-hopper commodity — there is only one of that trailer. '
    + 'Rows with no clock time in the Time column (“Afternoon”, “ASAP”) draw no chip at all.<br><br>'
    + '<b>The two sections (v1.7):</b> the sheet shows the day twice over, because the day is two jobs. '
    + '<b>Section 1</b> is what delivers today, and it owns every total on this page. Its 12:00am–6:00am rows are hoisted '
    + 'to the top under <span class="rchip b">🔒 PRELOADED</span> — they deliver today, so today books their revenue, but '
    + 'they were built on a trailer the afternoon before and are not capacity this morning can move. '
    + '<b>Section 2</b> at the bottom is the reverse case: <span class="rchip b">🔜 Preload for …</span> rows carry '
    + '<i>tomorrow\'s</i> date banner and deliver before 6am, so this afternoon has to load them before the origins shut. '
    + 'They consume today\'s driver-hours and none of today\'s money — revenue always follows the date banner, up to the '
    + 'midnight boundary, so 11:59pm books today and 12:00am books tomorrow. Their figures are shown greyed for context '
    + 'and are excluded from the totals; switch the day picker to tomorrow to edit them, where they are ordinary day rows.<br><br>'
    + '<b>Suggested driver</b> is computed offline from '+Object.keys(DRIVER_ORIGIN_HISTORY).length
    + ' drivers’ origin history in the 2026 log plus their shift pattern. Tap one for the top three and the reasoning. '
    + 'A <b>?</b> means no history at that origin — a roster fallback, not a pairing.'
    + (showAct
        ? '<br><br><b>Actual columns (v1.5):</b> measured from the Verizon Daily Timecard for this date. '
          + 'Trip legs are grouped per driver and cut at the yard, so one “trip” is a yard-to-yard round trip. '
          + 'A load claims the trip off its own origin closest to its appointment time, and a trip can only be claimed once. '
          + 'Actual variable = real miles × fuel and wear + real hours × <i>that driver\'s</i> loaded rate. '
          + 'Revenue is untouched — only the cost side is measured, so Actual Contribution moves purely on cost. '
          + '<span class="rchip r">⏱ detention</span> is over '+(Number(s.detentionThresholdMin)||60)+' min inside a Diamond fence; '
          + '<span class="rchip b">🔒 preload (GPS)</span> is a trip that went to an origin and back to the yard without ever '
          + 'entering Diamond. A <b>?</b> in those columns means the row could not be matched — hover it for the reason.'
        : '')
    + '</div></div>';
  /* v2.1.30: trailer wall sits UNDER the sheet so the Excel date +
     LATHROP / RIPON blocks are what you see first after the day strip. */
  h += trlHTML;

  /* ---- 4b. Driver-hours (v1.7) ----
     The one card that reads BOTH sections, because driver-hours are the one
     thing that genuinely crosses the midnight boundary. Placed directly under
     the sheet, where the two sections it is adding up have just been read. */
  if(li && d.currentRows.length) h += driverHoursCardHTML(shown);

  /* ---- 5. Verdict + totals ---- */
  h += '<div id="dayVerdictWrap"></div>'
    + '<div class="card"><h2>Day totals</h2><div id="dayGauge"></div><div id="dayTotals"></div></div>'
    + '<div class="btn-row"><button class="act" id="daySave">Save day snapshot</button>'
    + '<button class="act ghost" id="dayClear">Clear the day</button></div>';

  /* ---- 6. Column mapping (collapsed — hard-coded default already fits) ---- */
  const sample = li && li.rows.length ? li.rows[0] : null;
  h += '<details><summary>Column mapping'+(di.mapConfirmed?' ✓':'')+'</summary><div style="margin-top:10px">'
    + '<div class="hint" style="margin-bottom:12px">Pre-set for the 2026 dispatch layout — Time / PO / Driver / Grower / FB# / Commodity / Truck / Status. '
    + 'Only touch this if the workbook layout changes. Date and delivery point come from the banner rows, not from columns.</div>';
  if(__wb){
    const cols = Math.max.apply(null,(__wb.sheets[di.sheetName]||[[]]).slice(0,60).map(r=>r.length).concat([9]));
    const opts = (sel)=>{
      let o='<option value="">— not in the sheet —</option>';
      for(let c=0;c<cols;c++) o+='<option value="'+c+'"'+(sel===c?' selected':'')+'>'+colLetter(c)+'</option>';
      return o;
    };
    if(__wb.sheetNames.length>1){
      h += '<div class="fld"><label for="dispSheet">Sheet</label><select id="dispSheet">'
        + __wb.sheetNames.map(n=>'<option'+(n===di.sheetName?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>';
    }
    MAP_FIELDS.forEach(f=>{
      h += '<div class="fld"><label for="mp_'+f.k+'">'+esc(f.label)+'</label>'
        + '<select id="mp_'+f.k+'" data-map="'+f.k+'">'+opts(di.columnMap[f.k])+'</select>'
        + (f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
    });
    h += '<div class="btn-row"><button class="act ghost" id="mapApply">Re-parse with this mapping</button></div>';
  } else {
    h += '<div class="hint">'+(li? 'The parsed rows are saved, but the workbook itself is not — re-import the file to change the mapping.' : 'Import a file first.')+'</div>';
    h += '<div style="margin-top:10px">'+MAP_FIELDS.map(f=>'<div class="row"><div class="row-l"><div class="row-t">'+esc(f.label)+'</div></div>'
      + '<div class="row-v">'+colLetter(di.columnMap[f.k])+'</div></div>').join('')+'</div>';
  }
  h += '</div></details>';

  /* ---- 7. Manual fallback — one-off what-if only ---- */
  h += '<details><summary>One-off what-if load</summary><div style="margin-top:10px">'
    + '<div class="hint">For pricing an offer that is not on the dispatch sheet yet. Adds a blank row to the day above; '
    + 'it survives date switches so it will not vanish while you compare days. For a full single-offer verdict with a counter-rate, use <b>Single load</b> mode.</div>'
    + '<div class="btn-row" style="margin-top:10px"><button class="act ghost" id="dayAdd">+ Add what-if row</button></div></div></details>';

  /* Trucks running and the explicit date filter now live in Settings → Day
     rollup. Neither is daily-use: the day auto-selects, and trucks running is
     context recorded on the snapshot, not a P&L input. */

  $(DAY_HOST).innerHTML = h + tailHTML;
  wireDayRollup();
  refreshDay();
  /* The queue is a view onto the same rows, so it re-renders whenever the day
     does — that also keeps the tab badge honest from any tab. */
  renderQueue();
}

function wireDayRollup(){
  const di = state.dispatchImport;

  /* --- row edits (write through to lastImport so date switches keep them) --- */
  document.querySelectorAll(DAY_HOST+' [data-dr]').forEach(el=>{
    const i = +el.dataset.i, f = el.dataset.dr;
    const put = (persist)=>{
      const row = state.dayRollup.currentRows[i];
      if(!row) return;
      row[f] = el.value;
      // A hand-typed value is an override: it loses the EST flag and is never
      // clobbered when lane defaults are recalibrated.
      if(f==='lbs')  { row.estLbs=false;   row.ovLbs=true; }
      if(f==='miles'){ row.estMiles=false; row.ovMiles=true; }
      if(f==='hours'){ row.estHours=false; row.ovHours=true; }
      // A hand-picked bucket is an override — reclassification must not undo it.
      if(f==='bucket'){ row.ovBucket=true; row.bucketWhy='set by hand'; }
      const li = state.dayRollup.lastImport;
      if(row.source==='import' && li){
        const src = li.rows.find(x=>x.id===row.id);
        if(src) Object.assign(src, {
          [f]:el.value, estLbs:row.estLbs, estMiles:row.estMiles, estHours:row.estHours,
          ovLbs:row.ovLbs, ovMiles:row.ovMiles, ovHours:row.ovHours,
          ovBucket:row.ovBucket, bucketWhy:row.bucketWhy });
      }
      if(persist) saveDayImport();
      refreshDay();
    };
    el.addEventListener('input',()=>put(false));
    el.addEventListener('change',()=>put(true));
  });
  document.querySelectorAll(DAY_HOST+' [data-del]').forEach(b=>b.addEventListener('click',()=>{
    state.dayRollup.currentRows.splice(+b.dataset.del,1);
    saveDayImport(); renderDayRollup();
  }));

  /* --- v1.8.16 suggested-driver click = assign directly ---
     Prior behavior opened a popover with alternatives; James wants a
     single click on the suggestion to just ASSIGN it and fill the Driver
     cell (matches the dispatch Excel workflow). Hold Shift on desktop
     to open the alternatives popover instead. */
  document.querySelectorAll(DAY_HOST+' [data-sug]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(e.shiftKey){
      openSugPop(b, b.dataset.sug);
      const p = document.getElementById('sugPop'); if(p) p.dataset.for = b.dataset.sug;
      return;
    }
    const r = findRowById(b.dataset.sug);
    if(!r) return;
    const top = suggestDrivers(r, 1, {respectCap:true});
    if(!top.length){ toast('No eligible driver right now'); return; }
    assignDriver(b.dataset.sug, top[0].name, true);
  }));

  // v1.8.20: trailer done / undone toggles
  document.querySelectorAll(DAY_HOST+' .trl-done, '+DAY_HOST+' .trl-undone').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const pair = b.dataset.trl;
    const dateISO = state.dayRollup && state.dayRollup.date;
    if(!pair || !dateISO) return;
    toggleTrailerDone(dateISO, pair);
    renderDayRollup();
  }));
  const trlFold = document.getElementById('trlStatusCard');
  if(trlFold){
    trlFold.addEventListener('toggle',()=>{ trailerStatusOpen = !!trlFold.open; });
  }

  /* --- v1.8 actionable-now strip ---
     Tapping a chip expands its detail AND jumps to the rows in one gesture,
     because on a phone the detail is usually not why you tapped it. The
     explicit jump button in the detail panel is for tapping it again after
     scrolling away. */
  document.querySelectorAll(DAY_HOST+' [data-alert]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k = b.dataset.alert;
    const a = dayAlertList.find(x=>x.k===k);
    alertOpen = (alertOpen===k) ? '' : k;
    renderDayRollup();
    if(alertOpen && a){
      if(a.rows && a.rows.length) flashRows(a.rows);
      else if(a.jump){
        const t = document.querySelector(a.jump);
        if(t) t.scrollIntoView({behavior:'smooth', block:'center'});
      }
    }
  }));
  document.querySelectorAll(DAY_HOST+' [data-aljump]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const a = dayAlertList.find(x=>x.k===b.dataset.aljump);
    if(!a) return;
    if(a.rows && a.rows.length) flashRows(a.rows);
    else if(a.jump){
      const t = document.querySelector(a.jump);
      if(t) t.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }));
  document.querySelectorAll(DAY_HOST+' [data-altab]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); switchTab(b.dataset.altab);
  }));
  document.querySelectorAll(DAY_HOST+' [data-alack]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    state.companyInfo.arAck = { amount:Number(b.dataset.alack)||0, at:isoLocal(new Date()) };
    alertOpen = '';
    save(); renderDayRollup();
    toast('AR alert acknowledged — it returns if the balance moves');
  }));

  /* --- v1.8 SMS dispatch stub ---
     Composes and shows. Does not send. The console line is the deliberate
     part: Phase 3.2 replaces exactly this call site with the Twilio POST, so
     what gets logged now is what will get sent then. */
  document.querySelectorAll(DAY_HOST+' [data-sms]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    if(b.disabled) return;
    const row = (state.dayRollup.currentRows||[]).find(x=>x.id===b.dataset.sms);
    if(!row) return;
    const top = suggestDrivers(row, 1);
    const target = top.length ? top[0] : null;
    const msg = smsTemplateFor(row);
    const to  = target ? driverPhone(target.name) : '';
    console.log('[FCT SMS stub — not sent] to=' + (to||'(no number)')
      + ' driver=' + (target?target.name:'(none)')
      + ' from=' + (state.sms.fromNumber||'(unset)') + '\n' + msg);
    toast('Would send: ' + msg);
  }));

  /* --- sheet edit toggle (not a modal: the cells turn into inputs in place) --- */
  const editBtn = document.getElementById('daySheetEdit');
  if(editBtn) editBtn.addEventListener('click',()=>{ dayEditMode = !dayEditMode; renderDayRollup(); });
  // v1.8.6: Diamond-only filter toggle
  const filterBtn = document.getElementById('dayDiamondFilter');
  if(filterBtn) filterBtn.addEventListener('click',()=>{ dayDiamondOnly = !dayDiamondOnly; renderDayRollup(); });

  /* --- day navigation ---
     dayDate / dayTrucks live in Settings now, so both are optional here. */
  const dateEl = document.getElementById('dayDate');
  if(dateEl) dateEl.addEventListener('change',()=>applyImportDate(dateEl.value));
  const pick = document.getElementById('dayDatePick');
  if(pick) pick.addEventListener('change',()=>{ if(pick.value) applyImportDate(pick.value); });
  const trucksEl = document.getElementById('dayTrucks');
  if(trucksEl){
    trucksEl.addEventListener('input',()=>{ state.dayRollup.trucksRunning = trucksEl.value; refreshDay(); });
    trucksEl.addEventListener('change',()=>{ state.dayRollup.trucksRunning = trucksEl.value; saveDayImport(); refreshDay(); });
  }

  /* --- import: file picker + drag-drop --- */
  const fileEl = document.getElementById('dispFile');
  if(fileEl){
    // Empty state has no separate pick button — the drop zone is the button.
    const pickBtn = document.getElementById('dispPick');
    if(pickBtn) pickBtn.addEventListener('click',()=>fileEl.click());
    const adpBtn = document.getElementById('adpPick');
    if(adpBtn) adpBtn.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); fileEl.click(); });
    // v1.5: every file, not just the first — the picker is multiple now.
    fileEl.addEventListener('change',()=>{ handleDroppedFiles(fileEl.files); });
    const drop = document.getElementById('dispDrop');
    if(drop){
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.add('over'); }));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); }));
      drop.addEventListener('drop',e=>{
        // Both files can arrive in a single drop; take all of them.
        if(e.dataTransfer && e.dataTransfer.files) handleDroppedFiles(e.dataTransfer.files);
      });
      // In the loaded state the whole header strip is the drop target, so a
      // click there must not open the file dialog — only the ↻ button does.
      if(drop.classList.contains('drop-zone')) drop.addEventListener('click',()=>fileEl.click());
    }
  }
  // Tiny "Import from OneDrive" link on the empty state — reveals the field
  // inline. Not a modal, not a section header.
  const odBtn = document.getElementById('dispOneDrive'), odBox = document.getElementById('oneDriveBox');
  if(odBtn && odBox) odBtn.addEventListener('click',()=>{
    odBox.style.display = odBox.style.display==='none' ? 'block' : 'none';
  });
  /* --- v2.1.22 landing header strip: manual refresh + trucks-list popover --- */
  const lsRefreshBtn = document.getElementById('lsRefresh');
  if(lsRefreshBtn) lsRefreshBtn.addEventListener('click', () => {
    if(lsRefreshBtn.disabled) return;
    lsRefreshBtn.disabled = true;
    const origLabel = lsRefreshBtn.textContent;
    lsRefreshBtn.textContent = '↻ Refreshing…';
    const tasks = [];
    try { tasks.push(refreshVerizonMilesToday()); } catch(_){}
    try { tasks.push(refreshLaneCalibration()); } catch(_){}
    // /latest — live driver + GPS. Gated on useVerizonLive because syncFromVerizon
    // itself no-ops silently when the flag is off, and we don't want a false-positive
    // "refreshed" stamp on a fleet feed that isn't running.
    try {
      if(state.settings && state.settings.useVerizonLive) tasks.push(syncFromVerizon({force:true}));
    } catch(_){}
    Promise.allSettled(tasks).then(() => {
      // renderDayRollup gets called by refreshVerizonMilesToday's re-paint hook,
      // but rebind here just in case both refreshes silent-failed so the button
      // still snaps back.
      const btn = document.getElementById('lsRefresh');
      if(btn){ btn.disabled = false; btn.textContent = origLabel; }
    });
  });
  /* v2.1.23: every tile with data-tile now opens its drill-in modal via the
     shared openTileDrill() dispatcher. Replaces the old trucks-only popover
     which lived as an absolute-positioned side panel. Refresh button is
     explicitly ignored (has its own handler above). */
  document.querySelectorAll('#landStrip .ls-tile[data-tile]').forEach(el => {
    if(el.dataset.clickable === '0') return;
    el.addEventListener('click', (e) => {
      // Ignore clicks that bubbled up from a link/button inside the tile
      // (there aren't any today, but the guard keeps future ones safe).
      if(e.target.closest('button,a')) return;
      openTileDrill(el.dataset.tile);
    });
  });
  /* Missing-rates alert card — same click → drill dispatcher. */
  const mrCard = document.getElementById('missingRatesCard');
  if(mrCard){
    mrCard.addEventListener('click', () => openTileDrill(mrCard.dataset.tile || 'missing'));
  }

  /* --- v1.6 worker sync --- */
  /* Two buttons, one behaviour: the compact 🔄 on the loaded header strip and
     the full-size one on the empty hero. Both force a re-parse — a human
     pressing sync means "get it again", not "get it if it changed". */
  ['dispSync','dispSyncBig'].forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.addEventListener('click',()=>{
      syncFromWorker({force:true});
      /* v2.1.19: piggyback on the manual sync so a "refresh" also pulls
         the fleet-day miles for the fuel compare. */
      try { refreshVerizonMilesToday(); } catch(_){}
    });
  });

  // v1.8.24: Force sync via Excel Online. Opens the SharePoint URL in a
  // background tab which fires the push-to-worker Office Script, then waits
  // ~15 sec and pulls fresh data from the worker. Works around personal
  // OneDrive not supporting Power Automate "Run script" action.
  const forceSyncBtn = document.getElementById('dispForceSync');
  if(forceSyncBtn) forceSyncBtn.addEventListener('click',()=>{
    let url = (state.dispatchImport && state.dispatchImport.excelWebUrl) || '';
    if(!url){
      url = prompt('Paste the SharePoint URL to the dispatch Excel (the link that opens it in Excel for the Web). Saved for future use.');
      if(!url) return;
      state.dispatchImport = state.dispatchImport || {};
      state.dispatchImport.excelWebUrl = url.trim();
      save();
    }
    toast('Opening Excel in background — will re-sync in 15 sec…');
    const w = window.open(url, '_blank');
    if(!w){ toast('Popup blocked — allow popups for this site and retry'); return; }
    setTimeout(()=>{
      syncFromWorker({force:true}).then(()=>{
        toast('Synced — you can close the Excel tab');
      });
    }, 15000);
  });

  const fetchBtn = document.getElementById('dispFetch');
  if(fetchBtn) fetchBtn.addEventListener('click',()=>{
    const uEl = document.getElementById('dispUrl');
    const u = ((uEl&&uEl.value)||'').trim();
    if(!u){ toast('Paste the OneDrive link first'); return; }
    di.lastUrl = u; save(); fetchDispatchUrl(u);
  });

  /* --- calibration shortcut --- */
  const cal = document.getElementById('dispCalib');
  if(cal) cal.addEventListener('click',()=>{
    switchTab('set');
    setTimeout(()=>{ const c=document.getElementById('laneDefaultsCard'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); },60);
  });

  /* --- mapping --- */
  const sheetSel = document.getElementById('dispSheet');
  if(sheetSel) sheetSel.addEventListener('change',()=>{
    di.sheetName = sheetSel.value;
    if(!di.mapConfirmed){ const a=autoMap(__wb.sheets[di.sheetName]||[]); di.columnMap=a.map; di.headerRow=a.headerRow; }
    try{ applyParse(); renderDayRollup(); toast('Re-parsed '+di.sheetName); }
    catch(e){ toast(String(e.message||e)); }
  });
  const mapApply = document.getElementById('mapApply');
  if(mapApply) mapApply.addEventListener('click',()=>{
    document.querySelectorAll(DAY_HOST+' [data-map]').forEach(el=>{
      di.columnMap[el.dataset.map] = el.value===''? null : +el.value;
    });
    di.mapConfirmed = true;
    try{
      const res = applyParse(); renderDayRollup();
      toast('Re-parsed — '+res.rows.length+' loads');
    }catch(e){ toast(String(e.message||e)); }
  });

  /* --- day actions --- */
  /* Absent in the empty state, which renders the hero and nothing else. */
  const addBtn = document.getElementById('dayAdd');
  if(addBtn) addBtn.addEventListener('click',()=>{
    state.dayRollup.currentRows.push(blankDayRow()); saveDayImport(); renderDayRollup();
  });
  const saveBtn = document.getElementById('daySave');
  if(saveBtn) saveBtn.addEventListener('click',saveDaySnapshot);
  const clearBtn = document.getElementById('dayClear');
  if(clearBtn) clearBtn.addEventListener('click',()=>{
    if(!confirm('Clear the loads in view? The imported file and saved snapshots are kept.')) return;
    state.dayRollup.currentRows=[]; saveDayImport(); renderDayRollup(); toast('Day cleared');
  });
}

function setDispStatus(html){
  const el = document.getElementById('dispStatus');
  if(el) el.innerHTML = html;
}
/* v1.5 — one entry point for every dropped file. The drop zone takes the
   dispatch xlsx and the Verizon CSV, in one drop or two, in either order.
   Routing is by CONTENT, not extension: a .csv gets sniffed for the timecard
   header, so the dispatch log exported as CSV still lands in the right parser. */
function handleDroppedFiles(list){
  const files = Array.prototype.slice.call(list||[]).filter(Boolean);
  if(!files.length) return;
  files.forEach(f=>{
    if(/\.csv$/i.test(f.name)){
      const fr = new FileReader();
      fr.onerror = ()=> setDispStatus('<div class="hint" style="color:var(--red)">Could not read '+esc(f.name)+'.</div>');
      fr.onload = ()=>{
        const txt = String(fr.result||'');
        if(looksLikeVerizon(txt)) handleVerizonText(txt, f.name);
        else {
          const aoa = (typeof parseCsv==='function') ? parseCsv(txt) : [];
          if(aoa.length && looksLikeAdpAoa(aoa)){
            try{
              const parsed = parseAdpDailyTotals(aoa);
              const res = ingestAdpParse(parsed, f.name);
              renderDash();
              toast('ADP '+res.dateMin+'–'+res.dateMax+' · field '+money((res.summary||{}).fieldDollars));
              setDispStatus(adpImportStatusHTML(res));
            }catch(e){
              setDispStatus('<div class="hint" style="color:var(--red)">'+esc(String(e&&e.message||e))+'</div>');
            }
          } else handleDispatchFile(f);
        }
      };
      fr.readAsText(f);
    } else handleDispatchFile(f);
  });
}

function adpImportStatusHTML(res){
  const s = (res && res.summary) || summarizeAdpRows(__adpRows);
  const a = state.adpPay || defaultAdpPay();
  const range = (res && res.dateMin && res.dateMax) ? (res.dateMin+' → '+res.dateMax)
              : (a.dateMin && a.dateMax ? (a.dateMin+' → '+a.dateMax) : '');
  let msg = '<div class="hint">💵 <b>ADP pay</b> — '+esc(a.fileName||'Employee Daily Totals')
    + (range ? ' · '+esc(range) : '')
    + ' · field drivers '+money(s.fieldDollars)+' / '+num(s.fieldHours,1)+' hr'
    + ' · office '+money(s.officeDollars)+' (not in load cost)';
  if(s.unmatchedPeople){
    msg += '<br><span style="color:var(--amber)">'+s.unmatchedPeople+' name'
      +(s.unmatchedPeople===1?'':'s')+' not on the roster'
      + (s.unmatchedNames && s.unmatchedNames.length
          ? ': '+s.unmatchedNames.slice(0,4).map(esc).join(', ')+(s.unmatchedNames.length>4?'…':'')
          : '')
      + ' — those dollars were left out of driver actuals.</span>';
  }
  msg += '. Closed days use ADP; today stays estimated until you re-drop after close.'
    + ' Stored on this phone (IndexedDB), not in the dispatch file.</div>';
  return msg;
}

function handleDispatchFile(file){
  const mb = file.size/1048576;
  setDispStatus('<div class="hint">Reading <b>'+esc(file.name)+'</b> ('+mb.toFixed(1)+' MB)…'
    + (mb>1 ? ' A full year of dispatch takes a few seconds — leave this open.' : '')+'</div>');
  const fr = new FileReader();
  fr.onerror = ()=> setDispStatus('<div class="hint" style="color:var(--red)">Could not read that file.</div>');
  fr.onload = ()=>{
    ingestWorkbook(fr.result, file.name).then(res=>{
      if(res && res.kind==='adp'){
        renderDash();
        const s = res.summary || {};
        toast('ADP '+res.dateMin+'–'+res.dateMax+' · field '+money(s.fieldDollars));
        setDispStatus(adpImportStatusHTML(res));
        return;
      }
      // Whole landing page — a new import moves the sheet AND the glance widgets.
      invalidateVerizonMatch();
      /* v1.6: a hand import makes the file the source of truth for what is on
         screen, so the worker pill stands down rather than claiming credit for
         rows it did not supply. The stored ingestedAt is cleared with it, so
         the next sync is a real fetch and not a no-op against a stale stamp. */
      workerState = { kind:'file', at:new Date().toISOString(), ingestedAt:'', rowCount:0, msg:'' };
      state.dispatchImport.lastIngestedAt = '';
      renderDash();
      toast(res.rows.length+' loads · '+res.dates.length+' days');
      if(res.noDate) setDispStatus(importStatusHTML()
        + '<div class="hint" style="color:var(--amber)">'+res.noDate+' load row(s) appeared before any date banner and were left undated.</div>');
    }).catch(e=>{
      setDispStatus('<div class="hint" style="color:var(--red)">'+esc(String(e&&e.message||e))+'</div>');
    });
  };
  fr.readAsArrayBuffer(file);
}

/* Parse a timecard, cluster it, and file the result under its own date — which
   comes from the CSV, not from the day in view. Dropping Thursday's timecard
   while looking at Wednesday stores Thursday and says so, rather than quietly
   attaching the wrong day's trips to the day on screen. */
function handleVerizonText(text, fileName){
  let res;
  try{ res = parseVerizonCsv(text); }
  catch(e){ setDispStatus('<div class="hint" style="color:var(--red)">'+esc(String(e&&e.message||e))+'</div>'); return; }

  const clusters = verizonClusters(res.legs);
  const dates = Object.keys(res.dates).sort();
  const unresolvedSet = {};
  res.legs.forEach(l=>{ if(!l.driver && !/^\(unassigned\)/i.test(l.vName)) unresolvedSet[l.vName]=1; });
  const unresolved = Object.keys(unresolvedSet);

  dates.forEach(dt=>{
    const dayClusters = clusters.filter(c=>c.date===dt);
    const drivers = {};
    dayClusters.forEach(c=>{ if(c.driver) drivers[c.driver]=1; });
    state.verizon.days[dt] = {
      fileName: fileName||'timecard.csv', importedAt: new Date().toISOString(),
      legCount: res.legs.filter(l=>l.date===dt).length,
      driverCount: Object.keys(drivers).length,
      unresolved: unresolved,
      clusters: dayClusters,
    };
  });
  invalidateVerizonMatch();
  const ok = saveDayImport();

  const cur = state.dayRollup.date;
  const hit = dates.indexOf(cur)>=0;
  const m = hit ? verizonMatch() : null;
  renderDash();
  toast(res.legs.length+' trip legs → '+clusters.length+' trips · '+dates.join(', '));

  let msg = '<div class="hint">📡 <b>'+esc(fileName||'timecard.csv')+'</b> — '+res.legs.length+' legs, '
    + clusters.length+' round trips, '+dates.map(d=>esc(d)).join(' + ')+'.';
  if(!hit){
    msg += ' <span style="color:var(--amber)">The day in view is '+esc(cur||'not set')
      + ', so nothing on screen changed — switch to '+esc(dates[0])+' to see the actuals.</span>';
  } else if(m){
    msg += ' Matched <b>'+m.matched+' of '+m.total+'</b> loads on '+esc(cur)+'.';
    if(m.matched < m.total) msg += ' <span style="color:var(--text-faint)">Hover a “?” in the Actual columns for why a row missed.</span>';
  }
  if(unresolved.length){
    msg += '<br><span style="color:var(--amber)">'+unresolved.length+' Verizon name'+(unresolved.length===1?'':'s')
      + ' not on the roster: '+unresolved.slice(0,4).map(esc).join(', ')+(unresolved.length>4?'…':'')
      + ' — map them in Settings → Verizon actuals.</span>';
  }
  if(!ok.ok) msg += '<br><span style="color:var(--red)">Storage refused the write — the timecard is in memory only.</span>';
  setDispStatus(msg+'</div>');
}
/* =============================================================
   WORKER FEED (v1.6)
   -------------------------------------------------------------
   An Office Script in the dispatch workbook POSTs the whole sheet
   to a Cloudflare Worker; this end GETs it back. The payload is
   the sheet in object form:

     { rows:[ {time,po,driver,origin,fb,commodity,truck,status,extra}, … ],
       ingestedAt:'2026-07-27T20:34:47.562Z', rowCount:8428 }

   Note what the rows are NOT: they are not loads. They are the
   raw sheet, banners and blanks included — a date banner is a row
   whose origin field holds an Excel serial, a delivery-point
   banner is one whose origin reads "D.P. LATHROP". So the rows go
   back to an array-of-arrays and through parseDispatchRows(), the
   same walker the xlsx path uses, which carries current-date and
   current-D.P. down the file as state. Two transports, one set of
   parsing rules — a fix to the walker fixes both at once.
   ============================================================= */

/* Where the last sync got to. Deliberately NOT persisted: it describes this
   page view, and a stale "synced 2 minutes ago" restored from localStorage
   after two days shut would be a lie. The durable facts (lastSyncAt,
   lastIngestedAt) live in state.dispatchImport. */
let workerState = { kind:'idle', at:'', ingestedAt:'', rowCount:0, msg:'' };
let __syncing = false;

/* Which transport is in play. Guarded because 'worker' is a v1.6 default
   landing on saves that predate it, and a hand-edited state should not be able
   to put the app in a mode it has no code for. */
function dataSource(){
  const v = state.settings.dispatchDataSource;
  return (v==='file' || v==='hybrid' || v==='worker') ? v : 'worker';
}

/* "just now" / "4m ago" / "3h ago" / "2d ago". Returns '' for anything
   unparseable, so a caller can concatenate it without checking. */
function agoText(iso){
  if(!iso) return '';
  const t = new Date(iso).getTime();
  if(isNaN(t)) return '';
  const secs = Math.max(0, (Date.now()-t)/1000);
  if(secs < 90) return 'just now';
  const mins = Math.round(secs/60);
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 36) return hrs+'h ago';
  return Math.round(hrs/24)+'d ago';
}

/* Rows -> the array-of-arrays the walker expects. Values are left as the
   worker sent them: parseCellDate() reads a text Excel serial directly and
   fmtSheetTime() reads a text day-fraction, so coercing here would only add a
   second place for the two to disagree. An array row is passed through, which
   is what a future worker that ships raw AoA would send. */
function workerRowsToAoa(rows){
  return rows.map(r=>{
    if(Array.isArray(r)) return r.slice();
    if(!r || typeof r!=='object') return [];
    return WORKER_FIELDS.map(k=> r[k]==null ? '' : r[k]);
  });
}

/* Parse a payload into __wb and run it through the shared applyParse(). */
function ingestWorkerPayload(payload){
  const bad = m=>{ const e=new Error(m); e.kind='bad'; return e; };
